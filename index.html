window._abrirNovoPontoFunc=()=>{
  showModal('Novo funcionário',
    '<div class="form-group"><label>Nome</label><input id="pf-nome" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Cargo (opcional)</label><input id="pf-cargo" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarPontoFunc()">Salvar</button>',true);
};

window._salvarPontoFunc=async()=>{
  const nome=document.getElementById('pf-nome')?.value.trim();
  if(!nome){showToast('Informe o nome.');return;}
  const cargo=document.getElementById('pf-cargo')?.value.trim()||'';
  await addDoc(collection(db,'ponto_funcionarios'),{nome,cargo,criadoEm:new Date().toISOString()});
  closeModal();showToast('Funcionário adicionado!');
};

window._abrirEditPonto=(funcId,data)=>{
  const func=pontoFuncionarios.find(f=>f.id===funcId);
  if(!func) return;
  const reg=pontoRegistros.find(r=>r.funcId===funcId&&r.data===data)||{};
  const STATUS_LIST=[
    {k:'P',  v:'Presente',       cor:'#059669', bg:'#f0fdf4'},
    {k:'F',  v:'Falta',          cor:'#dc2626', bg:'#fef2f2'},
    {k:'FJ', v:'Falta Just.',    cor:'#d97706', bg:'#fefce8'},
    {k:'M',  v:'Meio Período',   cor:'#3b82f6', bg:'#eff6ff'},
    {k:'FO', v:'Folga',          cor:'#8b5cf6', bg:'#f5f3ff'},
  ];
  const statusAtual=reg.status||'P';
  const d=new Date(data+'T12:00:00');
  const nomeDia=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]+' '+data.split('-').reverse().join('/');
  const botoesStatus=STATUS_LIST.map(s=>{
    const ativo=statusAtual===s.k;
    return '<button id="peb-'+s.k+'" onclick="window._selecionarStatusPonto(this,this.dataset.k)" data-k="'+s.k+'"'
      +' style="flex:1;padding:8px 4px;border-radius:8px;border:2px solid '+(ativo?s.cor:'#e2e8f0')+';background:'+(ativo?s.bg:'#fff')+';color:'+(ativo?s.cor:'#64748b')+';font-size:11px;font-weight:700;cursor:pointer;transition:all .15s">'
      +'<div>'+s.k+'</div><div style="font-size:9px;font-weight:400">'+s.v+'</div></button>';
  }).join('');
  showModal(func.nome+' — '+nomeDia,
    '<div class="form-group"><label>Status</label>'
    +'<input type="hidden" id="pe-status" value="'+statusAtual+'">'
    +'<div style="display:flex;gap:6px;margin-top:4px">'+botoesStatus+'</div>'
    +'</div>'
    +'<div class="form-row" style="margin-top:12px">'
    +'<div class="form-group"><label>Horas extras</label><input id="pe-hextra" type="number" min="0" step="0.5" value="'+(reg.horasExtra||0)+'" onfocus="this.select()" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Observação</label><input id="pe-obs" value="'+(reg.obs||'')+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +(reg.id?'<button class="btn btn-danger btn-sm" onclick="window._excluirPonto(\''+reg.id+'\')">Excluir</button>':'')
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarPonto(\''+funcId+'\',\''+data+'\','+(reg.id?'\''+reg.id+'\'':'null')+')">Salvar</button>',true);
};

window._selecionarStatusPonto=function(btn,k){
  document.getElementById('pe-status').value=k;
  const STATUS_LIST=[
    {k:'P',cor:'#059669',bg:'#f0fdf4'},
    {k:'F',cor:'#dc2626',bg:'#fef2f2'},
    {k:'FJ',cor:'#d97706',bg:'#fefce8'},
    {k:'M',cor:'#3b82f6',bg:'#eff6ff'},
    {k:'FO',cor:'#8b5cf6',bg:'#f5f3ff'},
  ];
  STATUS_LIST.forEach(s=>{
    const b=document.getElementById('peb-'+s.k);
    if(!b) return;
    const ativo=s.k===k;
    b.style.border='2px solid '+(ativo?s.cor:'#e2e8f0');
    b.style.background=ativo?s.bg:'#fff';
    b.style.color=ativo?s.cor:'#64748b';
  });
};

window._salvarPonto=async(funcId,data,regId)=>{
  const status=document.getElementById('pe-status')?.value;
  const horasExtra=parseFloat(document.getElementById('pe-hextra')?.value)||0;
  const obs=document.getElementById('pe-obs')?.value||'';
  const dados={funcId,data,status,horasExtra,obs,atualizadoPor:currentUserData?.nome||''};
  if(regId){await updateDoc(doc(db,'ponto_registros',regId),dados);}
  else{await addDoc(collection(db,'ponto_registros'),dados);}
  closeModal();showToast('Ponto salvo!');
};

window._excluirPonto=async(regId)=>{
  await deleteDoc(doc(db,'ponto_registros',regId));
  closeModal();showToast('Registro excluído.');
};

window._abrirRegistroPonto=()=>{
  const optsFunc=pontoFuncionarios.map(f=>'<option value="'+f.id+'">'+f.nome+'</option>').join('');
  const STATUS={P:'Presente',F:'Falta',FJ:'Falta Just.',M:'Meio Período',FO:'Folga'};
  const optsStatus=Object.entries(STATUS).map(([k,v])=>'<option value="'+k+'">'+k+' — '+v+'</option>').join('');
  showModal('Registrar dia completo',
    '<div class="form-group"><label>Data</label><input id="pr-data" type="date" value="'+today()+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Status para todos</label><select id="pr-status" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">'+optsStatus+'</select></div>'
    +'<div style="font-size:12px;color:#475569;margin-top:8px">Desmarque quem não aplicar:</div>'
    +'<div style="max-height:180px;overflow-y:auto;margin-top:8px">'
    +pontoFuncionarios.map(f=>'<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px"><input type="checkbox" id="pr-func-'+f.id+'" checked> '+f.nome+'</label>').join('')
    +'</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarPontoLote()">Salvar</button>',true);
};

window._salvarPontoLote=async()=>{
  const data=document.getElementById('pr-data')?.value;
  const status=document.getElementById('pr-status')?.value;
  if(!data||!status){showToast('Preencha data e status.');return;}
  let count=0;
  for(const func of pontoFuncionarios){
    const cb=document.getElementById('pr-func-'+func.id);
    if(!cb?.checked) continue;
    const existing=pontoRegistros.find(r=>r.funcId===func.id&&r.data===data);
    const dados={funcId:func.id,data,status,horasExtra:0,obs:'',atualizadoPor:currentUserData?.nome||''};
    if(existing){await updateDoc(doc(db,'ponto_registros',existing.id),dados);}
    else{await addDoc(collection(db,'ponto_registros'),dados);}
    count++;
  }
  closeModal();showToast(count+' registros salvos!');
};

function camPodeEditar(){
  return ['admin','escritorio'].includes(currentUserData?.perfil);
}

function renderTabCaminhoes(tab){
  try{
    if(tab==='cam_rotas')         return renderCamRotas();
    if(tab==='cam_abastecimento') return renderCamAbastecimento();
    if(tab==='cam_manutencao')    return renderCamManutencao();
    if(tab==='cam_veiculos')      return renderCamVeiculos();

}

// ── Rotas ─────────────────────────────────────────────────────────
function renderCamRotas(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  if(!window._camRotaMes) window._camRotaMes=today().slice(0,7);
  const mes=window._camRotaMes;
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;

  const rotasMes=camRotas.filter(r=>(r.data||'').slice(0,7)===mes);
  const totalKm=rotasMes.reduce((s,r)=>s+(parseFloat(r.kmFinal||0)-parseFloat(r.kmInicial||0)),0);
  const totalGasto=rotasMes.reduce((s,r)=>s+rotaTotalCombustivel(r),0);

  function rotaTotalCombustivel(r){
    return (r.abastecimentos||[]).reduce((s,a)=>s+(parseFloat(a.totalPago)||0),0);
  }

  // Navegação de mês
  const mesAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mesProx=new Date(parseInt(ano),parseInt(m),1);
  const mesAntStr=mesAnt.getFullYear()+'-'+String(mesAnt.getMonth()+1).padStart(2,'0');
  const mesProxStr=mesProx.getFullYear()+'-'+String(mesProx.getMonth()+1).padStart(2,'0');

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-ghost btn-sm" onclick="window._camRotaMes='${mesAntStr}';reloadTab()">←</button>
      <div style="font-size:16px;font-weight:700">${mesNome}</div>
      <button class="btn btn-ghost btn-sm" onclick="window._camRotaMes='${mesProxStr}';reloadTab()">→</button>
    </div>
    ${camPodeEditar()?'<button class="btn btn-primary" onclick="window._abrirNovaRota()">+ Nova rota</button>':''}
  </div>`;

  // Stat cards
  html+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
    <div class="stat-card" style="background:linear-gradient(135deg,#1e3a5f,#2563eb)">
      <div><div class="stat-label">Viagens no mês</div><div class="stat-value">${rotasMes.length}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)">
      <div><div class="stat-label">Km rodados</div><div class="stat-value">${totalKm.toLocaleString('pt-BR',{maximumFractionDigits:0})}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)">
      <div><div class="stat-label">Gasto combustível</div><div class="stat-value" style="font-size:16px">${fmtMoeda(totalGasto)}</div></div>
    </div>
  </div>`;

  if(!rotasMes.length){
    return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma rota registrada em '+mesNome+'.</div></div>';
  }

  // Tabela responsiva
  html+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    +'<table style="width:100%;border-collapse:collapse;min-width:700px;font-size:12px">'
    +'<thead><tr style="background:#1e3a5f;color:#fff">'
    +'<th style="padding:8px 10px;text-align:left">Data</th>'

    true
  );

  window._camRotaEditando=rota||null;
};

window._camCalcTotal=function(i){
  const val=parseFloat(document.getElementById('abs-valunit-'+i)?.value)||0;
  const lit=parseFloat(document.getElementById('abs-litros-'+i)?.value)||0;
  if(val&&lit){
    const el=document.getElementById('abs-total-'+i);
    if(el) el.value=(val*lit).toFixed(2);
  }
};

window._adicionarAbsRow=function(){
  const i=window._absCount++;
  const tbody=document.getElementById('abs-tbody');
  if(!tbody) return;
  const tr=document.createElement('tr');
  tr.id='abs-row-'+i;
  tr.innerHTML=window._camRowTemplate({},i).replace(/<tr[^>]*>|<\/tr>/g,'');
  tbody.appendChild(tr);
};

window._removerAbsRow=function(i){
  const row=document.getElementById('abs-row-'+i);
  if(row) row.remove();
};

window._salvarRota=async function(rotaId){
  const veiculoId=document.getElementById('rota-veiculo')?.value;
  const motoristId=document.getElementById('rota-motorista')?.value;
  const data=document.getElementById('rota-data')?.value;
  const origem=document.getElementById('rota-origem')?.value;
  const destino=document.getElementById('rota-destino')?.value;
  const kmInicial=parseFloat(document.getElementById('rota-kmini')?.value)||0;
  const kmFinal=parseFloat(document.getElementById('rota-kmfin')?.value)||0;
  const obs=document.getElementById('rota-obs')?.value||'';

  if(!data||!veiculoId){showToast('Informe data e veículo.');return;}

  // Coletar abastecimentos
  const abastecimentos=[];
  for(let i=0;i<window._absCount;i++){
    const row=document.getElementById('abs-row-'+i);
    if(!row) continue;
    const posto=document.getElementById('abs-posto-'+i)?.value||'';
    const combustivel=document.getElementById('abs-comb-'+i)?.value||'Diesel';
    const valUnit=parseFloat(document.getElementById('abs-valunit-'+i)?.value)||0;
    const litros=parseFloat(document.getElementById('abs-litros-'+i)?.value)||0;
    const totalPago=parseFloat(document.getElementById('abs-total-'+i)?.value)||0;
    const gastoMot=parseFloat(document.getElementById('abs-gastoMot-'+i)?.value)||0;
    if(posto||litros||totalPago) abastecimentos.push({posto,combustivel,valUnit,litros,totalPago,gastoMot});
  }

  const dados={veiculoId,motoristId,data,origem,destino,kmInicial,kmFinal,obs,abastecimentos,
    registradoPor:currentUserData?.nome||'',criadoEm:new Date().toISOString()};

  if(rotaId){await updateDoc(doc(db,'cam_rotas',rotaId),dados);}
  else{await addDoc(collection(db,'cam_rotas'),dados);}
  closeModal();showToast('Rota salva!');
};

window._editarRota=function(id){
  const rota=camRotas.find(r=>r.id===id);
  if(rota) window._abrirNovaRota(rota);
};

window._excluirRota=async function(id,fromModal){
  if(!confirm('Excluir esta rota?')) return;
  if(fromModal) closeModal();
  await deleteDoc(doc(db,'cam_rotas',id));
  showToast('Rota excluída.');
};

function renderCamAbastecimento(){
  if(!window._camAbMes) window._camAbMes=today().slice(0,7);
  const mes=window._camAbMes;
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;
  const mesAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mesProx=new Date(parseInt(ano),parseInt(m),1);

  // Consolidar abastecimentos de todas as rotas do mês
  const abs=[];
  camRotas.filter(r=>(r.data||'').slice(0,7)===mes).forEach(r=>{
    (r.abastecimentos||[]).forEach(a=>{
      abs.push({...a, data:r.data, veiculo:camGetVeiculo(r.veiculoId), motorista:camGetMotorista(r.motoristId), rotaId:r.id});
    });
  });

  const totalLitros=abs.reduce((s,a)=>s+(parseFloat(a.litros)||0),0);
  const totalGasto=abs.reduce((s,a)=>s+(parseFloat(a.totalPago)||0),0);
  const totalGastoMot=abs.reduce((s,a)=>s+(parseFloat(a.gastoMot)||0),0);

  // Agrupado por posto
  const porPosto={};
  abs.forEach(a=>{

    </div>

    </div>

      <div><div class="stat-label">Gasto total</div><div class="stat-value" style="font-size:16px">${fmtMoeda(totalGasto)}</div></div>

function renderCamRelatorio(){
  if(!window._camRelAno) window._camRelAno=today().slice(0,4);
  const ano=window._camRelAno;
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const anos=[...new Set(camRotas.map(r=>(r.data||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  if(!anos.includes(today().slice(0,4)))anos.unshift(today().slice(0,4));
  const anoOpts=anos.map(a=>'<option value="'+a+'"'+(a===ano?' selected':'')+'">'+a+'</option>').join('');

  // Resumo anual por mês
  const dadosMes=MESES.map((_,mi)=>{
    const mesStr=ano+'-'+String(mi+1).padStart(2,'0');
    const rotas=camRotas.filter(r=>(r.data||'').slice(0,7)===mesStr);
    const kmTotal=rotas.reduce((s,r)=>s+(parseFloat(r.kmFinal||0)-parseFloat(r.kmInicial||0)),0);
    const combTotal=rotas.reduce((s,r)=>s+(r.abastecimentos||[]).reduce((ss,a)=>ss+(parseFloat(a.totalPago)||0),0),0);
    const manTotal=camManutencoes.filter(m=>(m.data||'').slice(0,7)===mesStr).reduce((s,m)=>s+(parseFloat(m.valor)||0),0);
    return {mes:MESES[mi],kmTotal,combTotal,manTotal,viagens:rotas.length};
  });

  const totalAnual={km:dadosMes.reduce((s,m)=>s+m.kmTotal,0),comb:dadosMes.reduce((s,m)=>s+m.combTotal,0),man:dadosMes.reduce((s,m)=>s+m.manTotal,0),viagens:dadosMes.reduce((s,m)=>s+m.viagens,0)};

  // Por veículo
  const porVeiculo=camVeiculos.map(v=>{
    const rotasV=camRotas.filter(r=>r.veiculoId===v.id&&(r.data||'').slice(0,4)===ano);

window._salvarMetas=async()=>{
  const metas={};
  PECAS_METAL.forEach(p=>{metas[p.id]=parseInt(document.getElementById(`meta-${p.id}`)?.value)||0;});
  const cur=configMetal||{};
  await setDoc(doc(db,'config_metal','geral'),{...cur,metas});
  showToast('Metas salvas!');
};
window._salvarValoresMetal=async(prefixId)=>{
  const vals={};
  PECAS_METAL.forEach(p=>{vals[p.id]=parseFloat(document.getElementById(prefixId+'-'+p.id)?.value)||0;});
  const campo=prefixId==='prod'?'valoresProd':prefixId==='fichado'?'valoresMeta':'valoresRef';
  const cur=configMetal||{metas:{}};
  await setDoc(doc(db,'config_metal','geral'),{...cur,[campo]:vals});
  const labels={'prod':'Preços por Produção','meta':'Preços na Meta','ref':'Preços de Reforma'};
  showToast((labels[prefixId]||'Valores')+' salvos!');
};

        +'<td style="padding:7px 10px;font-size:12px;text-align:right;color:#059669;font-weight:600">'+fmtR(val*qtd)+'</td>'

      +'</div>'

        +'<th style="padding:7px 10px;font-size:10px;font-weight:600;color:#64748b;text-align:left">Peça</th>'
        +'<th style="padding:7px 10px;font-size:10px;font-weight:600;color:#64748b;text-align:center">Qtd.</th>'
        +'<th style="padding:7px 10px;font-size:10px;font-weight:600;color:#64748b;text-align:center">Meta</th>'

        +'</tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'<tfoot><tr style="border-top:2px solid #f1f5f9">'
        +'<td style="padding:8px 10px;font-weight:700">Total</td>'
        +'<td style="padding:8px 10px;font-weight:800;text-align:center">'+total+'</td>'
        +'<td></td>'

function renderMeuDesempenho(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const uid=currentUser?.uid||'';
  const idUsuario=currentUserData?.id||'';
  const sol=soldadores.find(s=>s.usuarioUid===uid||s.usuarioUid===idUsuario);
  if(!sol) return '<div class="card"><div style="color:#64748b;text-align:center;padding:20px">Seu usuário não está vinculado a nenhum soldador.</div></div>';

  const c=avatarColor(soldadores.findIndex(s=>s.id===sol.id));
  const hoje_=today();
  const mesAtual=hoje_.slice(0,7);

  // ── Acumulado total
  const totalAcum=PECAS_METAL_FULL.reduce((s,p)=>s+totalPecaPeriodo(sol.id,p.id,'mes')*0,0)
    +apontSoldador(sol.id).reduce((s,a)=>s+Object.values(a.pecas||{}).reduce((x,v)=>x+(parseInt(v)||0),0),0);

  // ── Recorde semanal (total de peças em uma semana)
  // Agrupar apontamentos por semana (segunda a domingo)
  function getInicioSemana(dataStr){
    const d=new Date(dataStr+'T00:00:00');
    const dia=d.getDay(); // 0=dom
    const diff=dia===0?6:dia-1; // segunda=0
    const seg=new Date(d); seg.setDate(d.getDate()-diff);
    return seg.toISOString().slice(0,10);
  }

  const semanas={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const seg=getInicioSemana(a.data);
    if(!semanas[seg])semanas[seg]=0;
    Object.values(a.pecas||{}).forEach(v=>semanas[seg]+=(parseInt(v)||0));
  });
  const semanaAtual=getInicioSemana(hoje_);
  const totalSemanaAtual=semanas[semanaAtual]||0;
  const recordeSemanal=Math.max(0,...Object.values(semanas));
  const semanaAnterior=new Date(semanaAtual+'T00:00:00');
  semanaAnterior.setDate(semanaAnterior.getDate()-7);
  const totalSemanaAnterior=semanas[semanaAnterior.toISOString().slice(0,10)]||0;
  const diffSemana=totalSemanaAtual-totalSemanaAnterior;

  // ── Peças produzidas esta semana com suas metas individuais
  const pecasSemana=PECAS_METAL.map(p=>{
    const qtd=totalPecaPeriodo(sol.id,p.id,'semana');
    const meta=parseInt((configMetal.metas||{})[p.id])||0;
    const metaSab=Math.round(meta/2);
    const diaSemana=new Date(hoje_+'T00:00:00').getDay();
    const ehSabado=diaSemana===6;
    const metaSemanal=Math.round(meta*5.5);
    return {p,qtd,meta,metaSemanal,ehSabado};
  }).filter(x=>x.qtd>0);
  const totalSemanalMeta=pecasSemana.reduce((s,x)=>s+x.metaSemanal,0);

  // ── Streak (dias consecutivos com apontamento)
  const diasComApoint=new Set(apontSoldador(sol.id).map(a=>a.data));
  let streak=0;
  let d=new Date(hoje_+'T00:00:00');
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(diasComApoint.has(ds)){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }

  // ── Resumo mensal
  const mesesMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const m=a.data.slice(0,7);
    if(!mesesMap[m])mesesMap[m]=0;
    Object.values(a.pecas||{}).forEach(v=>mesesMap[m]+=(parseInt(v)||0));
  });
  const mesesList=Object.entries(mesesMap).sort((a,b)=>b[0]>a[0]?1:-1).slice(0,6);
  const maxMes=Math.max(1,...mesesList.map(m=>m[1]));

  // ── Melhor quinzena
  const quinzenasMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const q=getQuinzena(a.data);
    if(!quinzenasMap[q])quinzenasMap[q]=0;
    Object.values(a.pecas||{}).forEach(v=>quinzenasMap[q]+=(parseInt(v)||0));
  });
  const qAtual=getQuinzenaAtual();
  const totalQAtual=quinzenasMap[qAtual]||0;
  const recordeQuinzena=Math.max(0,...Object.values(quinzenasMap));
  const isRecordeQ=totalQAtual>0&&totalQAtual>=recordeQuinzena;

  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="width:52px;height:52px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800">${initials(sol.nome)}</div>
      <div>
        <div style="font-size:18px;font-weight:800">${sol.nome}</div>
        <div style="font-size:12px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;width:100%">
    <div class="metric" style="border-left:4px solid ${c}">
      <div class="metric-label">Total acumulado</div>
      <div class="metric-value" style="font-size:28px;color:${c}">${totalAcum}</div>
      <div style="font-size:11px;color:#94a3b8">peças soldadas</div>
    </div>
    <div class="metric" style="border-left:4px solid #f59e0b">
      <div class="metric-label">🔥 Sequência atual</div>
      <div class="metric-value" style="font-size:28px;color:#f59e0b">${streak}</div>
      <div style="font-size:11px;color:#94a3b8">dia${streak!==1?'s':''} seguido${streak!==1?'s':''}</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px;border-left:4px solid #3b82f6">
    <div style="font-size:13px;font-weight:700;color:#1e40af;margin-bottom:10px">📅 Esta semana</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:36px;font-weight:800;color:#1e40af">${totalSemanaAtual}</div>
        <div style="font-size:11px;color:#64748b">peças esta semana</div>
      </div>
      <div style="text-align:right">
        ${totalSemanaAtual>=recordeSemanal&&totalSemanaAtual>0
          ?'<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">🏆 Novo recorde!</div>'
          :`<div style="font-size:11px;color:#64748b">Recorde</div>
           <div style="font-size:20px;font-weight:700;color:#475569">${recordeSemanal}</div>`}
        <div style="font-size:11px;color:${diffSemana>=0?'#059669':'#dc2626'};margin-top:4px">
          ${diffSemana>=0?'↑':'↓'} ${Math.abs(diffSemana)} vs semana anterior
        </div>
      </div>
    </div>
    ${pecasSemana.length>0?`<div style="margin-top:10px">
      <div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:8px">Progresso por peça</div>
      ${pecasSemana.map(({p,qtd,metaSemanal})=>{
        const pct=metaSemanal>0?Math.min(100,Math.round(qtd/metaSemanal*100)):100;
        const cor=pct>=100?'#059669':pct>=70?'#f59e0b':'#3b82f6';

  <div class="card" style="margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Resumo mensal</div>

        </div>
        <div style="height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${bar}%;background:${isMesAtual?'#3b82f6':c};border-radius:99px"></div>

function renderRankingMetal(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  if(!window._rankMetalPeriodo) window._rankMetalPeriodo='quinzena';
  const per=window._rankMetalPeriodo;
  const qAtual=getQuinzenaAtual();
  const hoje_=today();
  const mesAtual=hoje_.slice(0,7);

  function perLabel(){
    if(per==='quinzena') return quinzenaLabel(qAtual);
    const m=parseInt(mesAtual.slice(5,7))-1;
    return MESES[m]+' '+mesAtual.slice(0,4);
  }

  function btnPer(v,l){
    const ativo=per===v;
    return '<button class="btn btn-sm '+(ativo?'btn-primary':'btn-ghost')+'"'
      +' onclick="window._setRankMetalPeriodo(&quot;'+v+'&quot;)">'+l+'</button>';
  }
  const filtroPerHtml='<div style="display:flex;gap:8px;margin-bottom:16px">'
    +btnPer('quinzena','Quinzena')
    +btnPer('mes','Mensal')
    +'</div>';

  function qtdSoldador(soldadorId, pecaId){
    return totalPecaPeriodo(soldadorId, pecaId, per==='quinzena'?qAtual:mesAtual);
  }

  // Só peças com produção no período
  const pecasComProd=PECAS_METAL.filter(p=>
    soldadores.some(s=>qtdSoldador(s.id,p.id)>0)
  );

  if(!pecasComProd.length){
    return `<div style="background:#1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px;width:100%">
      <div style="font-size:16px;font-weight:800;color:#fff">⚙️ Ranking Metalúrgica</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px">${perLabel()}</div>
    </div>`+filtroPerHtml+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma produção registrada no período.</div></div>';
  }

  const cardsPecas=pecasComProd.map(p=>{
    const ranking=soldadores.map(s=>({s,qtd:qtdSoldador(s.id,p.id)}))
      .filter(x=>x.qtd>0)
      .sort((a,b)=>b.qtd-a.qtd);
    if(!ranking.length) return '';
    const maxQtd=ranking[0].qtd;
    const medalhas=['🥇','🥈','🥉'];
    const rows=ranking.map(({s,qtd},i)=>{
      const ci=soldadores.findIndex(x=>x.id===s.id);
      const cor=avatarColor(ci);
      const pct=Math.round(qtd/maxQtd*100);
      const barCor=i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#cd7f32':'#3b82f6';
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">'
        +'<span style="font-size:16px;width:24px;text-align:center">'+(i<3?medalhas[i]:'<span style="font-size:12px;color:#64748b">'+(i+1)+'</span>')+'</span>'
        +'<div style="width:36px;height:36px;border-radius:50%;background:'+cor+'22;color:'+cor+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+initials(s.nome)+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:700">'+s.nome+'</div>'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px;margin-top:4px;overflow:hidden">'
        +'<div style="height:100%;width:'+pct+'%;background:'+barCor+';border-radius:99px"></div>'
        +'</div></div>'
        +'<div style="font-size:20px;font-weight:800;color:'+barCor+'">'+qtd+'</div>'
        +'</div>';
    }).join('');
    return '<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
      +'<div style="font-size:14px;font-weight:700;color:#1e293b">'+p.label+'</div>'
      +'<div style="font-size:11px;color:#64748b">'+perLabel()+'</div>'
      +'</div>'
      +rows+'</div>';
  }).join('');

  return `<div style="background:#1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px;width:100%">
    <div style="font-size:16px;font-weight:800;color:#fff">⚙️ Ranking Metalúrgica</div>
    <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px">${perLabel()}</div>
  </div>`+filtroPerHtml+cardsPecas;
}


function renderFichasMetal(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const qAtual=getQuinzenaAtual();
  const isAdmin=['admin','encarregado_cad','apontador_metal'].includes(currentUserData?.perfil);

  // Agrupar fichas por quinzena
  const quinzenas=[...new Set([
    qAtual,
    ...[...fichasMetal].map(f=>f.quinzena)
  ])].sort((a,b)=>b>a?1:-1);

  let html='';

  quinzenas.forEach(q=>{
    const label=quinzenaLabel(q);
    const isAtual=q===qAtual;

    html+=`<div style="font-size:13px;font-weight:700;color:${isAtual?'#1e40af':'#475569'};margin:16px 0 8px;display:flex;align-items:center;gap:8px">
      ${label} ${isAtual?'<span style="font-size:10px;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:99px;font-weight:600">atual</span>':''}
    </div>`;

    soldadores.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach((sol,i)=>{
      const ficha=getFichaMetal(sol.id,q);
      const totalPecas=totalPecasFicha(sol.id,q);
      const ganho=calcGanhoSoldador(sol.id,q);
      const c=avatarColor(soldadores.findIndex(s=>s.id===sol.id));
      const status=ficha?.status||'aberta';
      const pago=ficha?.pago||false;

      // Detalhamento por peça
      const pecasQ=PECAS_METAL_FULL.filter(p=>totalPecaPeriodo(sol.id,p.id,q)>0);
      const detalhe=pecasQ.map(p=>{
        const qtd=totalPecaPeriodo(sol.id,p.id,q);
        return `<span style="font-size:10px;background:${p.reforma?'#ede9fe':'#f1f5f9'};color:${p.reforma?'#7c3aed':'#475569'};padding:2px 7px;border-radius:99px;margin:1px;display:inline-block">${p.label}: ${qtd}</span>`;
      }).join('');

      const badgeStatus=status==='fechada'
        ?(pago?'<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:99px;font-weight:700">✓ Pago</span>'
            :'<span style="font-size:10px;background:#ede9fe;color:#4c1d95;padding:3px 10px;border-radius:99px;font-weight:700">Fechada</span>')
        :'<span style="font-size:10px;background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:99px;font-weight:700">Em aberto</span>';

      const btnFechar=isAdmin&&status==='aberta'&&totalPecas>0
        ?`<button class="btn btn-sm btn-success" onclick="window._fecharFichaMetal('${sol.id}','${q}')">Fechar ficha</button>`:'';
      const btnPagar=isAdmin&&status==='fechada'&&!pago&&['admin','financeiro'].includes(currentUserData?.perfil)
        ?`<button class="btn btn-sm btn-primary" onclick="window._pagarFichaMetal('${ficha?.id}')">Marcar pago</button>`:'';

      html+=`<div class="card" style="margin-bottom:8px${status==='fechada'?';border-left:4px solid '+(pago?'#10b981':'#8b5cf6'):';border-left:4px solid #3b82f6'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${detalhe?'10px':'0'}">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:42px;height:42px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">${initials(sol.nome)}</div>
            <div>
              <div style="font-size:14px;font-weight:700">${sol.nome}</div>
              <div style="font-size:11px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'} · ${totalPecas} peças</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
            ${badgeStatus}
            <div style="text-align:right">
              <div style="font-size:10px;color:#64748b">a receber</div>
              <div style="font-size:18px;font-weight:800;color:${pago?'#059669':'#d97706'}">${fmtR(ganho)}</div>
            </div>
            ${btnFechar}${btnPagar}
          </div>
        </div>
        ${detalhe?`<div style="display:flex;flex-wrap:wrap;gap:2px">${detalhe}</div>`:''}
      </div>`;
    });
  });

  return html||'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma ficha ainda.</div></div>';
}

window._fecharFichaMetal=async(soldadorId,quinzena)=>{
  const sol=soldadores.find(s=>s.id===soldadorId);
  showModal('Fechar ficha — '+sol?.nome,
    `<div style="font-size:13px;color:#444;line-height:1.6">Fechar a ficha de <strong>${sol?.nome}</strong> referente a <strong>${quinzenaLabel(quinzena)}</strong>?<br><br>Após fechar, o financeiro será notificado para efetuar o pagamento.</div>`,
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-success btn-sm" onclick="window._confirmarFecharFichaMetal(&quot;'+soldadorId+'&quot;,&quot;'+quinzena+'&quot;)">Fechar ficha</button>');
};

window._confirmarFecharFichaMetal=async(soldadorId,quinzena)=>{
  closeModal();
  const sol=soldadores.find(s=>s.id===soldadorId);
  const ganho=calcGanhoSoldador(soldadorId,quinzena);
  // Cria ou atualiza ficha
  const existing=getFichaMetal(soldadorId,quinzena);
  if(existing){
    await updateDoc(doc(db,'fichas_metal',existing.id),{status:'fechada',dataFechamento:today(),ganho});
  } else {
    await addDoc(collection(db,'fichas_metal'),{soldadorId,quinzena,status:'fechada',pago:false,dataFechamento:today(),ganho});
  }
  // Notificar financeiro
  await addDoc(collection(db,'notificacoes'),{
    tipo:'ficha_metal_fechada',
    soldadorNome:sol?.nome||'',
    quinzena,quinzenaLabel:quinzenaLabel(quinzena),
    ganho,data:today(),lida:false,criadaEm:new Date().toISOString(),
  });
  showToast('Ficha fechada! Financeiro notificado.');
};

window._pagarFichaMetal=async(fichaId)=>{
  showModal('Confirmar pagamento',
    '<div style="font-size:13px;color:#444">Confirmar o pagamento desta ficha?</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._confirmarPagarFichaMetal(&quot;'+fichaId+'&quot;)">Confirmar pagamento</button>');
};
window._confirmarPagarFichaMetal=async id=>{
  closeModal();
  await updateDoc(doc(db,'fichas_metal',id),{pago:true,dataPagamento:today()});
  showToast('Pagamento registrado!');
};

function renderTabAlmox(tab){
  try {
    if(tab==='alm_painel')    return renderAlmPainel();
    if(tab==='alm_entrada')   return renderAlmMovimento('entrada');
    if(tab==='alm_saida')     return renderAlmMovimento('saida');
    if(tab==='alm_itens')     return renderAlmItens();
    if(tab==='alm_relatorio') return renderAlmRelatorio();
    if(tab==='alm_config')    return renderAlmConfig();
    return renderAlmPainel();
  } catch(e) {
    console.error('Erro em renderTabAlmox('+tab+'):', e.message, e.stack);
    return '<div class="card" style="color:#dc2626;padding:20px"><strong>Erro ao carregar aba:</strong><br>' + e.message + '<br><small>' + e.stack + '</small></div>';
  }
}

function almHistoricoDia(tipo){
  const movs=almMovimentos.filter(m=>m.tipo===tipo&&m.data===today())
    .sort((a,b)=>b.criadoEm>a.criadoEm?1:-1);
  if(!movs.length) return '';
  const isEnt=tipo==='entrada';
  const cor=isEnt?'#059669':'#d97706';
  const rows=movs.map(m=>{
    const item=almItens.find(i=>i.id===m.itemId);
    const desc=item?item.descricao:(m.itemDesc||'Item');
    const und=item?item.unidade:'';
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9">'
      +'<div>'
      +'<div style="font-size:12px;font-weight:700">'+desc+'</div>'
      +'<div style="font-size:10px;color:#64748b">'+m.tipoMov+' · '+m.pessoa+' · '+m.setor+'</div>'
      +'</div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:15px;font-weight:800;color:'+cor+'">'+(isEnt?'+':'-')+m.quantidade+' '+und+'</div>'
      +(m.custoTotal?'<div style="font-size:10px;color:#92400e">R$ '+parseFloat(m.custoTotal).toFixed(2)+'</div>':'')
      +'</div>'
      +'</div>';
  }).join('');
  return '<div class="card" style="margin-top:14px;border-left:4px solid '+cor+'">'
    +'<div style="font-size:12px;font-weight:700;color:'+cor+';margin-bottom:10px">'
    +(isEnt?'⬇️':'⬆️')+' Movimentações de hoje ('+movs.length+')</div>'
    +rows+'</div>';
}

window._almGerarOpts=function(q){
  const lower=(q||'').toLowerCase();
  const itens=(almItens.length?almItens:ALM_ITENS_BASE.map(function(it,i){return Object.assign({},it,{id:'base-'+i});}))
    .filter(function(i){return !lower||(i.descricao||'').toLowerCase().startsWith(lower);})
    .sort(function(a,b){return (a.descricao||'').localeCompare(b.descricao||'','pt-BR');});
  return itens.map(function(i){
    const estoque=almEstoqueItem(i.id);
    const cor=estoque<=0?'#dc2626':estoque<=(parseInt(i.estoqueMin)||0)?'#d97706':'#059669';
    const badge='<span style="font-size:10px;font-weight:700;color:'+cor+';background:'+cor+'18;padding:1px 7px;border-radius:99px;margin-left:8px">'+estoque+' '+i.unidade+'</span>';
    return '<div class="alm-item-opt" data-id="'+i.id+'" data-desc="'+i.descricao+'"'
      +' onclick="window._selecionarAlmItem(this)"'
      +' style="padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between">'      +'<span>'+i.descricao+'</span>'+badge+'</div>';
  }).join('');
};

window._selecionarAlmItem=function(el){
  document.getElementById('alm-item').value=el.dataset.id;
  document.getElementById('alm-busca-item').value=el.dataset.desc;
  document.getElementById('alm-busca-item').setAttribute('readonly','true');
  document.getElementById('alm-item-lista').style.display='none';
  // Mostrar custo atual do item
  const item=almItens.find(i=>i.id===el.dataset.id);
  if(item&&item.custoUnitario){
    const custoEl=document.getElementById('alm-custo');
    if(custoEl&&!custoEl.value) custoEl.value=parseFloat(item.custoUnitario).toFixed(2);
    window._almAtualizarTotal();
  }
};

window._filtrarAlmItem=function(q){
  const lista=document.getElementById('alm-item-lista');
  if(lista){
    lista.innerHTML=window._almGerarOpts(q);
    lista.style.display='block';
  }
};

window._almAtualizarTotal=function(){
  const qtd=parseInt(document.getElementById('alm-qtd')?.value)||0;
  const custo=parseFloat(document.getElementById('alm-custo')?.value)||0;
  const totalEl=document.getElementById('alm-total');
  if(totalEl){
    if(qtd>0&&custo>0){
      totalEl.value='R$ '+(qtd*custo).toFixed(2).replace('.',',');
    } else {
      totalEl.value='—';
    }
  }
};

document.addEventListener('click',function(e){
  if(!e.target.closest('#alm-item-lista')&&!e.target.closest('#alm-busca-item')){
    const lista=document.getElementById('alm-item-lista');
    if(lista) lista.style.display='none';
  }
});

window._almAutoSetor=function(){
  const pessoa=document.getElementById('alm-pessoa')?.value;
  const setor=almConfig.pessoaSetor?.[pessoa];
  if(setor){
    const sel=document.getElementById('alm-setor');
    if(sel) sel.value=setor;
  }
};

window._registrarAlmMov=async(tipo)=>{
  const itemId=document.getElementById('alm-item')?.value;
  const tipoMov=document.getElementById('alm-tipo-mov')?.value;
  const qtd=parseInt(document.getElementById('alm-qtd')?.value)||0;
  const data=document.getElementById('alm-data')?.value||today();
  const pessoa=document.getElementById('alm-pessoa')?.value;
  const setor=document.getElementById('alm-setor')?.value;
  const obs=document.getElementById('alm-obs')?.value||'';
  const custoUnitario=tipo==='entrada'?(parseFloat(document.getElementById('alm-custo')?.value)||0):0;
  if(!itemId||qtd<=0){showToast('Informe o item e a quantidade.');return;}
  const item=almItens.find(i=>i.id===itemId)||ALM_ITENS_BASE.find((_,idx)=>'base-'+idx===itemId);
  // Validar estoque para saída
  if(tipo==='saida'){
    const estoqueAtual=almEstoqueItem(itemId);
    if(estoqueAtual<=0){
      showToast('❌ Estoque zerado! Não é possível registrar saída.');return;
    }
    if(qtd>estoqueAtual){
      showToast('❌ Estoque insuficiente! Disponível: '+estoqueAtual+' '+( item?.unidade||''));return;
    }
  }
  const mov={
    itemId,itemDesc:item?.descricao||'',itemCod:item?.codigo||'',
    tipo,tipoMov,quantidade:qtd,data,pessoa,setor,obs,
    registradoPor:currentUserData?.nome||'',
    criadoEm:new Date().toISOString(),
  };
  if(tipo==='entrada'&&custoUnitario>0){
    mov.custoUnitario=custoUnitario;
    mov.custoTotal=parseFloat((custoUnitario*qtd).toFixed(2));
  }
  if(tipo==='entrada'&&custoUnitario>0&&item&&almItens.find(i=>i.id===itemId)){
    // Custo médio ponderado: (estoque_atual * custo_atual + qtd_nova * custo_novo) / (estoque_atual + qtd_nova)
    const estoqueAtual=almEstoqueItem(itemId);
    const custoAtual=parseFloat(item.custoUnitario)||0;
    let novoCustoMedio;
    if(custoAtual>0&&estoqueAtual>0){
      novoCustoMedio=parseFloat(((custoAtual*estoqueAtual+custoUnitario*qtd)/(estoqueAtual+qtd)).toFixed(4));
    } else {
      novoCustoMedio=custoUnitario;
    }
    await updateDoc(doc(db,'alm_itens',itemId),{custoUnitario:novoCustoMedio});
  }
  await addDoc(collection(db,'alm_movimentos'),mov);
  showToast((tipo==='entrada'?'✅ Entrada':'✅ Saída')+' registrada com sucesso!');
  document.getElementById('alm-qtd').value='';
  document.getElementById('alm-obs').value='';
  const custoEl=document.getElementById('alm-custo');if(custoEl)custoEl.value='';
  if(custoEl) custoEl.value='';
};

// Previsão de duração do estoque (dias)
function almDuracaoEstoque(itemId){
  const hoje = new Date(today()+'T00:00:00');
  const limite = new Date(hoje); limite.setDate(hoje.getDate()-30);
  const limiteStr = limite.toISOString().slice(0,10);
  const saidas30 = almMovimentos.filter(m=>
    m.itemId===itemId && m.tipo==='saida' && m.data>=limiteStr
  );
  if(!saidas30.length) return null;
  const totalSaidas = saidas30.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
  const mediaDiaria = totalSaidas / 30;
  if(mediaDiaria<=0) return null;
  const estoque = almEstoqueItem(itemId);
  if(estoque<=0) return 0;
  return Math.floor(estoque / mediaDiaria);
}

function almDuracaoLabel(dias){
  if(dias===null) return {label:'Sem movimentação recente', cor:'#94a3b8', bg:'#f1f5f9'};
  if(dias===0) return {label:'Esgotado', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=7)  return {label:dias+'d restantes', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=15) return {label:dias+'d restantes', cor:'#d97706', bg:'#fef3c7'};
  if(dias<=30) return {label:dias+'d restantes', cor:'#2563eb', bg:'#dbeafe'};
  return {label:dias+'d restantes', cor:'#059669', bg:'#d1fae5'};
}

// ── Relatório ─────────────────────────────────────────────────────
function renderAlmRelatorio(){
  if(!window._almRelAno) window._almRelAno=today().slice(0,4);
  const anoSel=window._almRelAno;
  const MESES_ABREV=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const MESES_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((i,idx)=>({...i,id:'base-'+idx}));

  function getItem(id){return itens.find(i=>i.id===id)||{};}

  // ── Últimos 7 dias ──────────────────────────────────────────
  const dias7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today()+'T00:00:00');
    d.setDate(d.getDate()-i);
    dias7.push(d.toISOString().slice(0,10));
  }

  const resumo7=dias7.map(data=>{
    const movs=almMovimentos.filter(m=>m.data===data);
    const entQtd=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const saiQtd=movs.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const entCusto=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseFloat(m.custoTotal)||0),0);
    return {data,entQtd,saiQtd,entCusto};
  });
  const totalCusto7=resumo7.reduce((s,r)=>s+r.entCusto,0);
  const totalEnt7=resumo7.reduce((s,r)=>s+r.entQtd,0);
  const totalSai7=resumo7.reduce((s,r)=>s+r.saiQtd,0);

  // Gráfico linha 7 dias
  const G7W=320; const G7H=110; const pts7=dias7.length;
  const maxQ7=Math.max(...resumo7.map(r=>Math.max(r.entQtd,r.saiQtd)),1);
  const xPad=18;
  function px7(i,v){return {x:xPad+i*(G7W-xPad*2)/(pts7-1),y:G7H-10-Math.round(v/maxQ7*(G7H-20))};}
  const ptEnt=resumo7.map((r,i)=>px7(i,r.entQtd));
  const ptSai=resumo7.map((r,i)=>px7(i,r.saiQtd));
  const lineEnt='M'+ptEnt.map(p=>p.x+','+p.y).join('L');
  const lineSai='M'+ptSai.map(p=>p.x+','+p.y).join('L');
  const dias7Labels=resumo7.map((r,i)=>{
    const d=new Date(r.data+'T00:00:00');
    // Linha 1: dia da semana abreviado, Linha 2: dd/mm
    const diaNm=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
    const diaDt=d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0');
    const isHoje=r.data===today();
    return `<text x="${ptEnt[i].x}" y="${G7H+13}" text-anchor="middle" font-size="8" fill="${isHoje?'#1e40af':'#64748b'}" font-weight="${isHoje?700:400}">${diaNm}</text>
    <text x="${ptEnt[i].x}" y="${G7H+22}" text-anchor="middle" font-size="7" fill="${isHoje?'#3b82f6':'#94a3b8'}">${diaDt}</text>`;
  }).join('');
  const valEnt=resumo7.map((r,i)=>r.entQtd?`<text x="${ptEnt[i].x}" y="${ptEnt[i].y-5}" text-anchor="middle" font-size="8" fill="#059669">${r.entQtd}</text>`:'').join('');
  const valSai=resumo7.map((r,i)=>r.saiQtd?`<text x="${ptSai[i].x}" y="${ptSai[i].y-5}" text-anchor="middle" font-size="8" fill="#dc2626">${r.saiQtd}</text>`:'').join('');
  const dotEnt=resumo7.map((r,i)=>`<circle cx="${ptEnt[i].x}" cy="${ptEnt[i].y}" r="3" fill="#059669"/>`).join('');
  const dotSai=resumo7.map((r,i)=>`<circle cx="${ptSai[i].x}" cy="${ptSai[i].y}" r="3" fill="#dc2626"/>`).join('');

  const grafico7=`<svg viewBox="0 0 ${G7W} ${G7H+28}" style="width:100%;display:block">
    <path d="${lineEnt}" fill="none" stroke="#059669" stroke-width="2"/>
    <path d="${lineSai}" fill="none" stroke="#dc2626" stroke-width="2"/>
    ${dotEnt}${dotSai}${valEnt}${valSai}${dias7Labels}
  </svg>`;

  // Tabela custo 7 dias
  const tabela7=resumo7.map(r=>{
    const d=new Date(r.data+'T00:00:00');
    const nome=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()]+' - '+r.data.split('-').reverse().join('/');
    const isHoje=r.data===today();
    return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f5f9;'+(isHoje?'font-weight:700':'')+'">'
      +'<span style="font-size:12px;color:#475569">'+nome+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:'+(r.entCusto>0?'#059669':'#94a3b8')+'">'+fmtMoeda(r.entCusto)+'</span>'
      +'</div>';
  }).join('');

  // ── Análise mensal ──────────────────────────────────────────
  const mesesAno=MESES_ABREV.map((_,mi)=>{
    const mesStr=anoSel+'-'+String(mi+1).padStart(2,'0');
    const movs=almMovimentos.filter(m=>(m.data||'').slice(0,7)===mesStr);
    const entQtd=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const saiQtd=movs.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const entCusto=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseFloat(m.custoTotal)||0),0);
    return {mes:mesStr,entQtd,saiQtd,entCusto};
  });
  const totalCustoAno=mesesAno.reduce((s,m)=>s+m.entCusto,0);
  const totalEntAno=mesesAno.reduce((s,m)=>s+m.entQtd,0);
  const totalSaiAno=mesesAno.reduce((s,m)=>s+m.saiQtd,0);

  // Gráfico barras mensal
  const GBH=120;
  const bW=16; const bGap=8; const bPad=10;
  const GBW=bPad*2+12*(bW*2+2+bGap);  // largura real para 12 meses
  const maxMes=Math.max(...mesesAno.map(m=>Math.max(m.entQtd,m.saiQtd)),1);
  const barsMes=mesesAno.map((m,i)=>{
    const x=bPad+i*(bW*2+2+bGap);
    const hE=Math.round(m.entQtd/maxMes*GBH);
    const hS=Math.round(m.saiQtd/maxMes*GBH);
    const mesAtual=today().slice(0,7)===m.mes;
    return `<g>
      <rect x="${x}" y="${GBH-hE}" width="${bW}" height="${hE}" rx="2" fill="#059669" opacity="${m.entQtd?1:0.15}"/>
      <rect x="${x+bW+2}" y="${GBH-hS}" width="${bW}" height="${hS}" rx="2" fill="#dc2626" opacity="${m.saiQtd?1:0.15}"/>
      ${m.entQtd?`<text x="${x+bW/2}" y="${GBH-hE-3}" text-anchor="middle" font-size="8" fill="#059669">${m.entQtd}</text>`:''}
      ${m.saiQtd?`<text x="${x+bW+2+bW/2}" y="${GBH-hS-3}" text-anchor="middle" font-size="8" fill="#dc2626">${m.saiQtd}</text>`:''}
      <text x="${x+bW}" y="${GBH+13}" text-anchor="middle" font-size="9" fill="${mesAtual?'#1e40af':'#64748b'}" font-weight="${mesAtual?700:400}">${MESES_ABREV[i]}</text>
      ${m.entCusto?`<text x="${x+bW}" y="${GBH+24}" text-anchor="middle" font-size="8" fill="#92400e">${(m.entCusto/1000).toFixed(1)}k</text>`:''}
    </g>`;
  }).join('');

  const graficoMes=`<div id="alm-grafico-mes" style="overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%">
    <svg viewBox="0 0 ${GBW} ${GBH+30}" preserveAspectRatio="none" style="width:100%;min-width:${GBW}px;height:${GBH+30}px;display:block">${barsMes}</svg>
  </div>`;

  // Seletor de ano
  const anos=[...new Set(almMovimentos.map(m=>(m.data||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  if(!anos.includes(today().slice(0,4))) anos.unshift(today().slice(0,4));
  const anoOpts=anos.map(a=>`<option value="${a}" ${a===anoSel?'selected':''}>${a}</option>`).join('');

  // Total geral -- donut SVG simples
  const totalGeral=totalEntAno+totalSaiAno||1;
  const pctEnt=Math.round(totalEntAno/totalGeral*100);
  const r=40; const circ=2*Math.PI*r;
  const dashEnt=circ*pctEnt/100;
  const donut=`<svg viewBox="0 0 100 100" style="width:90px;height:90px">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="14"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#059669" stroke-width="14"
      stroke-dasharray="${dashEnt} ${circ-dashEnt}" stroke-dashoffset="${circ/4}" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#dc2626" stroke-width="14"
      stroke-dasharray="${circ-dashEnt} ${dashEnt}" stroke-dashoffset="${circ/4-dashEnt}" transform="rotate(-90 50 50)" opacity="0.7"/>
    <text x="50" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">${pctEnt}%</text>
  </svg>`;

  return `
  <div class="section-label">ANÁLISE DOS ÚLTIMOS 7 DIAS</div>
  <div class="card" style="margin-bottom:14px">
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:14px">
      <div>
        <div style="font-size:10px;font-weight:700;color:#475569;margin-bottom:8px;text-transform:uppercase">Custos com entradas nos últ. 7 dias</div>
        ${tabela7}
        <div style="display:flex;justify-content:space-between;padding:6px 0;margin-top:4px;border-top:2px solid #e2e8f0">
          <span style="font-size:12px;font-weight:700">Custo total (semana)</span>
          <span style="font-size:13px;font-weight:800;color:#dc2626">${fmtMoeda(totalCusto7)}</span>
        </div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase">Evolução de entradas e saídas (qtd)</div>
        <div style="display:flex;gap:10px;margin-bottom:4px">
          <span style="font-size:10px;color:#059669;display:flex;align-items:center;gap:3px">● Entradas</span>
          <span style="font-size:10px;color:#dc2626;display:flex;align-items:center;gap:3px">● Saídas</span>
        </div>
        ${grafico7}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px">
      <div style="background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#059669;margin-bottom:2px">Entradas (semana)</div>
        <div style="font-size:20px;font-weight:800;color:#059669">${totalEnt7}</div>
      </div>
      <div style="background:#fef2f2;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#dc2626;margin-bottom:2px">Saídas (semana)</div>
        <div style="font-size:20px;font-weight:800;color:#dc2626">${totalSai7}</div>
      </div>
      <div style="background:#fefce8;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#92400e;margin-bottom:2px">Custo total</div>
        <div style="font-size:16px;font-weight:800;color:#92400e">${fmtMoeda(totalCusto7)}</div>
      </div>
    </div>
  </div>

  <div class="section-label" style="display:flex;align-items:center;gap:10px">
    ANÁLISE MENSAL
    <select onchange="window._almRelAno=this.value;reloadTab()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:6px;padding:3px 8px">${anoOpts}</select>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;margin-bottom:8px">
      <span style="font-size:10px;color:#059669;display:flex;align-items:center;gap:3px">■ Entrada</span>
      <span style="font-size:10px;color:#dc2626;display:flex;align-items:center;gap:3px">■ Saída</span>
      <span style="font-size:10px;color:#92400e;display:flex;align-items:center;gap:3px">— Custo (k)</span>
    </div>
    ${graficoMes}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">
      <div style="background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#059669;margin-bottom:2px">Total entradas ${anoSel}</div>
        <div style="font-size:20px;font-weight:800;color:#059669">${totalEntAno}</div>
      </div>
      <div style="background:#fef2f2;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#dc2626;margin-bottom:2px">Total saídas ${anoSel}</div>
        <div style="font-size:20px;font-weight:800;color:#dc2626">${totalSaiAno}</div>
      </div>
      <div style="background:#fefce8;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#92400e;margin-bottom:2px">Custo total ${anoSel}</div>
        <div style="font-size:16px;font-weight:800;color:#92400e">${fmtMoeda(totalCustoAno)}</div>
      </div>
    </div>
  </div>

  <div class="section-label">TOTAL GERAL</div>
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px">
      ${donut}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:12px;height:12px;background:#059669;border-radius:2px;flex-shrink:0;display:inline-block"></span>
          <span style="font-size:13px;font-weight:700;color:#059669">Entradas: ${totalEntAno}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:12px;height:12px;background:#dc2626;border-radius:2px;flex-shrink:0;display:inline-block"></span>
          <span style="font-size:13px;font-weight:700;color:#dc2626">Saídas: ${totalSaiAno}</span>
        </div>
        <div style="font-size:12px;color:#92400e;font-weight:600">Custo total entradas: ${fmtMoeda(totalCustoAno)}</div>
      </div>
    </div>
    ${['admin','financeiro','proprietario'].includes(currentUserData?.perfil)?`
    <div style="border-top:2px solid #f1f5f9;padding-top:12px">
      <div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px">💰 Valor total em estoque</div>
      <div style="font-size:28px;font-weight:800;color:#1e40af">${fmtMoeda(itens.reduce((s,i)=>{const est=almEstoqueItem(i.id);const custo=parseFloat(i.custoUnitario)||0;return s+(est>0?est*custo:0);},0))}</div>
      <div style="font-size:11px;color:#64748b;margin-top:4px">Baseado no custo médio ponderado de ${itens.filter(i=>i.custoUnitario>0).length} itens com custo cadastrado</div>
    </div>`:''}
  </div>`;
}


// ── Configurações ─────────────────────────────────────────────────
function renderAlmConfig(){
  function renderLista(titulo, chave, lista, cor){
    const items=lista||[];
    return '<div class="card" style="margin-bottom:12px;border-left:4px solid '+cor+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
      +'<div style="font-size:13px;font-weight:700;color:'+cor+'">'+titulo+'</div>'
      +'<span style="font-size:11px;color:#64748b">'+items.length+' itens</span>'
      +'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'
      +items.map((item,i)=>'<span style="display:inline-flex;align-items:center;gap:4px;background:'+cor+'18;color:'+cor+';padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600">'
        +item
        +'<button onclick="window._removeAlmLista(\''+chave+'\','+i+')" style="background:none;border:none;cursor:pointer;color:'+cor+';font-size:14px;padding:0;line-height:1;margin-left:2px">×</button>'
        +'</span>').join('')
      +'</div>'
      +'<div style="display:flex;gap:6px">'
      +'<input type="text" id="alm-novo-'+chave+'" placeholder="Novo item..." '
      +'style="flex:1;font-size:12px;border:1.5px solid #e2e8f0;border-radius:8px;padding:5px 9px">'
      +'<button class="btn btn-sm btn-primary" onclick="window._addAlmLista(\''+chave+'\')">Adicionar</button>'
      +'</div>'
      +'</div>';
  }

  return '<div class="section-label">Gerenciar listas</div>'
    +renderLista('👤 Pessoas','pessoas',almConfig.pessoas,'#1e40af')
    +renderLista('🏭 Setores','setores',almConfig.setores,'#065f46')
    +renderLista('📐 Unidades','unidades',almConfig.unidades,'#92400e')
    +renderLista('🏷️ Classificações','classificacoes',almConfig.classificacoes,'#4c1d95')
    +renderLista('⬇️ Tipos de entrada','tiposEntrada',almConfig.tiposEntrada,'#0369a1')
    +renderLista('⬆️ Tipos de saída','tiposSaida',almConfig.tiposSaida,'#dc2626')
    +'<div class="section-label">👤 Setor padrão por pessoa</div>'
    +'<div class="card" style="margin-bottom:12px">'
    +'<div style="font-size:12px;color:#475569;margin-bottom:12px">Ao selecionar a pessoa na entrada ou saída, o setor é preenchido automaticamente.</div>'
    +almPessoas().map(p=>{
      const setorAtual=almConfig.pessoaSetor?.[p]||'';
      const optsS='<option value="">— Nenhum —</option>'+almSetores().map(s=>'<option value="'+s+'"'+(setorAtual===s?' selected':'')+'>'+s+'</option>').join('');
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
        +'<span style="font-size:13px;font-weight:600;min-width:120px;flex-shrink:0">'+p+'</span>'
        +'<select onchange="window._setAlmPessoaSetor(this.dataset.p,this.value)" data-p="'+p+'" style="flex:1;font-size:12px;border:1.5px solid #e2e8f0;border-radius:8px;padding:5px 8px">'+optsS+'</select>'
        +'</div>';
    }).join('')
    +'</div>'
    +'<div class="section-label">Dados base</div>'
    +'<div class="card">'
    +'<div style="font-size:12px;color:#475569;margin-bottom:10px">Importe os '+ALM_ITENS_BASE.length+' itens da planilha original. Só faça isso uma vez.</div>'
    +'<button class="btn btn-primary" onclick="window._importarAlmBase()">Importar itens base</button>'
    +' <button class="btn btn-warn" style="margin-left:8px" onclick="window._limparDuplicatasAlm()">Remover duplicatas</button>'
    +'</div>';
}

window._setAlmPessoaSetor=async(pessoa,setor)=>{
  const ps={...(almConfig.pessoaSetor||{})};
  if(setor) ps[pessoa]=setor;
  else delete ps[pessoa];
  almConfig={...almConfig,pessoaSetor:ps};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
};

window._addAlmLista=async(chave)=>{
  const el=document.getElementById('alm-novo-'+chave);
  const val=(el?.value||'').trim();
  if(!val){showToast('Digite um valor.');return;}
  const lista=[...(almConfig[chave]||[])];
  if(lista.includes(val)){showToast('Já existe na lista.');return;}
  lista.push(val);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Adicionado!');
  el.value='';
};

window._removeAlmLista=async(chave,idx)=>{
  const lista=[...(almConfig[chave]||[])];
  lista.splice(idx,1);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Removido!');
};


// ── Roteador de tabs da metalúrgica ──────────────────────────────
function renderTabMetal(tab){
  if(tab==='painel_metal')     return renderPainelMetal();
  if(tab==='apontar')          return renderApontar();
  if(tab==='fichas_metal')     return renderFichasMetal();
  if(tab==='soldadores_metal') return renderSoldadoresMetal();
  if(tab==='ponto_metal'){
    try{return renderPontoMetal();}
    catch(e){return '<div class="card" style="color:red;padding:20px">Erro: '+e.message+'<br><small>'+e.stack+'</small></div>';}
  }
  if(tab==='config_metal')     return renderConfigMetal();
  if(tab==='minha_prod')       return renderMinhaProd();
  if(tab==='meu_desempenho')   return renderMeuDesempenho();
  if(tab==='ranking_metal')    return renderRankingMetal();
  if(tab==='usuarios')         return renderUsuarios();
  return renderPainelMetal();
}

// ── Sinalização de peças prontas ────────────────────────────────
window._abrirSinalizacao=fichaId=>{
  const f=getFicha(fichaId);
  if(!f)return;
  const tiposInputs=TIPOS.map(t=>{
    const prontos=(f.prontos||{})[t.id]||0;
    return `<div class="num-group"><label>${t.label}${t.principal?' ★':''}</label><input type="number" id="sig-${t.id}" min="0" step="1" value="${prontos}" placeholder="0"></div>`;
  }).join('');
  showModal('Sinalizar peças prontas',
    `<div class="info-box" style="margin-bottom:12px">Informe quantas peças já estão enroladas e prontas para recolhimento.</div>
    <div class="num-inputs">${tiposInputs}</div>`,
    `<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-primary btn-sm" onclick="window._salvarSinalizacao('${fichaId}')">Sinalizar</button>`);
};

window._salvarSinalizacao=async fichaId=>{
  const prontos={};
  TIPOS.forEach(t=>{prontos[t.id]=parseInt(document.getElementById(`sig-${t.id}`)?.value)||0;});
  const total=Object.values(prontos).reduce((a,v)=>a+v,0);
  await updateDoc(doc(db,'fichas',fichaId),{prontos,prontoSinalizado:total>0,prontoAtualizadoEm:new Date().toISOString()});
  closeModal();
  showToast(total>0?'Peças sinalizadas!':'Sinalização removida.');
};

function renderBadgeProntos(f){
  if(!f.prontoSinalizado)return'';
  const prontos=f.prontos||{};
  const total=Object.values(prontos).reduce((a,v)=>a+v,0);
  if(total===0)return'';
  const itens=TIPOS.filter(t=>prontos[t.id]>0).map(t=>`${t.label}: ${prontos[t.id]}`).join(' · ');
  return `<div style="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">🔔</span>
    <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#92400e">Peças prontas para recolher!</div>
    <div style="font-size:11px;color:#b45309;margin-top:2px">${itens}</div></div>
    <div style="font-size:18px;font-weight:800;color:#d97706">${total}</div>
  </div>`;
}


// ── Retirada administrativa ──────────────────────────────────────
window._abrirRetiradaAdmin=fichaId=>{
  const f=getFicha(fichaId);
  if(!f)return;
  const enr=getEnr(f.enroladorId);
  // Mostrar apenas peças que ainda estão pendentes
  const pecasPend=TIPOS.filter(t=>pendentes_tipo(f,t.id)>0);
  const gridPecas=pecasPend.map(t=>{
    const pend=pendentes_tipo(f,t.id);
    return '<div class="num-group">'
      +'<label style="font-size:10px">'+t.label+' <span style="color:#94a3b8">(pend: '+pend+')</span></label>'
      +'<input type="number" id="ret-'+t.id+'" min="0" max="'+pend+'" step="1" placeholder="0" onfocus="this.select()"'
      +' style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 8px;text-align:center;font-family:Nunito,sans-serif">'
      +'</div>';
  }).join('');

  showModal('↩ Retirada Administrativa — '+enr?.nome,
    '<div class="info-box" style="margin-bottom:12px;background:#fee2e2;border-color:#fca5a5;color:#991b1b">Esta operação retira cadeiras da casa <strong>sem gerar pagamento</strong>. A ficha será fechada com status <strong>Cancelada</strong>.</div>'
    +'<div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Peças sendo retiradas</div>'
    +'<div class="num-inputs" style="margin-bottom:14px">'+gridPecas+'</div>'
    +'<div class="form-row" style="margin-bottom:12px">'
    +'<div class="form-group"><label>Fita retornando (rolos)</label><input type="number" id="ret-fita" min="0" step="1" placeholder="0" onfocus="this.select()" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px"></div>'
    +'<div class="form-group"><label>Fio retornando (rolos)</label><input type="number" id="ret-fio" min="0" step="1" placeholder="0" onfocus="this.select()" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px"></div>'
    +'</div>'
    +'<div class="form-group"><label>Justificativa</label><textarea id="ret-justificativa" rows="3" placeholder="Descreva o motivo da retirada..." style="width:100%;font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 10px;font-family:Nunito,sans-serif;resize:vertical"></textarea></div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-sm" style="background:#dc2626;color:#fff" onclick="window._confirmarRetiradaAdmin(&quot;'+fichaId+'&quot;)">Confirmar retirada</button>',
    true);
};

window._confirmarRetiradaAdmin=async fichaId=>{
  const f=getFicha(fichaId);if(!f)return;
  const pecasPend=TIPOS.filter(t=>pendentes_tipo(f,t.id)>0);
  const pecasRetiradas={};
  let totalRetirado=0;
  pecasPend.forEach(t=>{
    const v=parseInt(document.getElementById('ret-'+t.id)?.value)||0;
    if(v>0){pecasRetiradas[t.id]=v;totalRetirado+=v;}
  });
  const fitaRet=parseInt(document.getElementById('ret-fita')?.value)||0;
  const fioRet=parseInt(document.getElementById('ret-fio')?.value)||0;
  const justificativa=document.getElementById('ret-justificativa')?.value.trim()||'';

  // Adicionar recolhimento administrativo
  const recolhimentos=[...(f.recolhimentos||[]),{
    data:today(),
    entregador:currentUserData?.nome||'Admin',
    tipos:pecasRetiradas,
    fitaSobrando:fitaRet,
    fioSobrando:fioRet,
    administrativo:true,
    justificativa,
  }];

  closeModal();
  await updateDoc(doc(db,'fichas',fichaId),{
    recolhimentos,
    status:'cancelada',
    dataCancelamento:today(),
    canceladoPor:currentUserData?.nome||'',
    justificativaCancelamento:justificativa,
  });
  showToast('Retirada registrada. Ficha cancelada.');
};

// Helper para pendentes por tipo
function pendentes_tipo(f,tipoId){
  return Math.max(0,somaEntr(f,tipoId)-somaRecol(f,tipoId));
}

// ── Firebase listeners em tempo real ────────────────────────────
function iniciarListeners(){
  if(unsubEnroladores)unsubEnroladores();
  if(unsubFichas)unsubFichas();
  if(unsubUsuarios)unsubUsuarios();

  unsubEnroladores=onSnapshot(collection(db,'enroladores'),snap=>{
    enroladores=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData)reloadTab();
  });

  unsubFichas=onSnapshot(collection(db,'fichas'),snap=>{
    fichas=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData){
      // Se estiver na aba entrega ou recolhimento, atualiza apenas os selects de ficha
      if(currentTab==='entregar'){
        window._atualizarFichasEntrega&&window._atualizarFichasEntrega();
      }else if(currentTab==='recolher'){
        window._atualizarSelectRecolhimento&&window._atualizarSelectRecolhimento();
      }else{
        reloadTab();
      }
    }
  });

  unsubUsuarios=onSnapshot(collection(db,'usuarios'),snap=>{
    usuarios=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentTab==='usuarios')reloadTab();
  });

  // Listener de valores unitários
  onSnapshot(doc(db,'configuracoes','valores_apontador1'),snap=>{
    if(snap.exists()){valoresPecas.apontador1={..._valoresDefault,...snap.data()};if(currentUserData)reloadTab();}
  });
  onSnapshot(doc(db,'configuracoes','valores_apontador2'),snap=>{
    if(snap.exists()){valoresPecas.apontador2={..._valoresDefault,...snap.data()};if(currentUserData)reloadTab();}
  });
  ['cam_veiculos','cam_motoristas','cam_rotas','cam_abastecimentos','cam_manutencoes','cam_postos'].forEach(col=>{
    onSnapshot(collection(db,col),snap=>{
      const data=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(col==='cam_veiculos') camVeiculos=data.sort((a,b)=>a.modelo.localeCompare(b.modelo,'pt-BR'));
      else if(col==='cam_motoristas') camMotoristas=data.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
      else if(col==='cam_rotas') camRotas=data.sort((a,b)=>b.data>a.data?1:-1);
      else if(col==='cam_abastecimentos') camAbastecimentos=data;
      else if(col==='cam_manutencoes') camManutencoes=data;
      else if(col==='cam_postos') camPostos=data.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
      if(currentUserData&&currentSetor==='caminhoes')reloadTab();
    });
  });

  // Almoxarifado config
  onSnapshot(doc(db,'alm_config','geral'),snap=>{
    if(snap.exists()) almConfig={...almConfig,...snap.data()};
    if(currentUserData&&currentSetor==='almoxarifado')reloadTab();
  });
  // Almoxarifado
  onSnapshot(collection(db,'alm_itens'),snap=>{
    almItens=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='almoxarifado')reloadTab();
  });
  onSnapshot(collection(db,'alm_movimentos'),snap=>{
    almMovimentos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='almoxarifado')reloadTab();
  });

  // Ponto metalúrgica
  onSnapshot(collection(db,'ponto_funcionarios'),snap=>{
    pontoFuncionarios=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });
  onSnapshot(collection(db,'ponto_registros'),snap=>{
    pontoRegistros=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });

  // Metalúrgica — carrega sempre (necessário para restauração de sessão no mobile)
  onSnapshot(collection(db,'soldadores'),snap=>{
    soldadores=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });
  onSnapshot(collection(db,'apontamentos_metal'),snap=>{
    apontamentosMetal=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });
  onSnapshot(doc(db,'config_metal','geral'),snap=>{
    if(snap.exists()) configMetal={metas:{},valoresProd:{},valoresMeta:{},valoresRef:{},...snap.data()};
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });
  onSnapshot(collection(db,'fichas_metal'),snap=>{
    fichasMetal=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentSetor==='metalurgica')reloadTab();
  });

  // Config bônus
  onSnapshot(doc(db,'configuracoes','bonus_volume'),snap=>{
    if(snap.exists()) configBonus={meta:300,valorBonus:1.00,ativo:true,...snap.data()};
    if(currentUserData)reloadTab();
  });
  // Bônus pagos
  onSnapshot(collection(db,'bonus_pagos'),snap=>{
    bonusPagos={};
    snap.docs.forEach(d=>{bonusPagos[d.id]=d.data();});
    if(currentUserData)reloadTab();
  });

  // Notificações — só carrega para perfis que precisam
  if(['financeiro','admin','proprietario'].includes(currentUserData?.perfil)){
    onSnapshot(
      query(collection(db,'notificacoes'),where('lida','==',false)),
      snap=>{
        notificacoes=snap.docs.map(d=>({id:d.id,...d.data()}));
        atualizarBadgeNotif();
        if(currentUserData)reloadTab();
      }
    );
  }
}

function pararListeners(){
  if(unsubEnroladores)unsubEnroladores();
  if(unsubFichas)unsubFichas();
  if(unsubUsuarios)unsubUsuarios();
  unsubEnroladores=unsubFichas=unsubUsuarios=null;
}

// ── Auth state ───────────────────────────────────────────────────
document.getElementById('root').innerHTML=`<div class="loading"><div class="spinner"></div><div>Carregando...</div></div>`;

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    // Busca perfil do usuário no Firestore
    const snap=await getDocs(collection(db,'usuarios'));
    const uDoc=snap.docs.find(d=>d.data().uid===user.uid||d.data().email===user.email);
    if(uDoc){
      currentUserData={id:uDoc.id,...uDoc.data()};
    }else{
      // Primeiro acesso do admin: cria registro automaticamente
      currentUserData={id:'admin-temp',nome:user.email,perfil:'admin',email:user.email,uid:user.uid};
    }
    // Tela inicial por perfil
    const perfInicial=currentUserData?.perfil;
    if(perfInicial==='financeiro'){
      currentTab='relatorio';
    }else if(can('verPainel')){
      currentTab='painel';
    }else{
      currentTab='fichas';
    }
    // Tentar restaurar fábrica/setor da sessão anterior
    const sessaoFabrica=sessionStorage.getItem('jm_fabrica');
    const sessaoSetor=sessionStorage.getItem('jm_setor');
    // Se sessão tem almoxarifado, respeitar isso antes do setor automático
    if(sessaoFabrica==='caminhoes'){
    currentFabrica='caminhoes';
    currentSetor='caminhoes';
    currentTab='cam_rotas';
  } else if(sessaoFabrica==='almoxarifado'){
      currentFabrica='almoxarifado';
      currentSetor='almoxarifado';
      currentTab='alm_painel';
    } else {
      const autoOk=aplicarSetorAutomatico();
      if(!autoOk && sessaoFabrica){
        currentFabrica=sessaoFabrica;
        if(sessaoSetor) currentSetor=sessaoSetor;
      }
    }
    // Reaplicar tab inicial por perfil após restaurar sessão
    if(currentSetor){
      const pf=currentUserData?.perfil;
      if(pf==='financeiro') currentTab='relatorio';
      else if(can('verPainel')) currentTab='painel';
      else currentTab='fichas';
    }
    iniciarListeners();
    render();
  }else{
    currentUser=null;currentUserData=null;
    pararListeners();
    enroladores=[];fichas=[];usuarios=[];
    render();
  }
});
