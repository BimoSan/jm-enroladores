<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JM — Controle Terceirizado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}

  /* ── Layout ── */
  .shell{display:flex;min-height:100vh;width:100%}
  .sidebar{width:220px;background:#1e40af;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid #2563eb}
  .sidebar-logo-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.5px}
  .sidebar-logo-sub{font-size:11px;color:#93c5fd;margin-top:2px}
  .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;font-weight:500;color:#bfdbfe;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
  .nav-item:hover{background:#2563eb33;color:#fff}
  .nav-item.active{background:#2563eb;color:#fff;border-left-color:#60a5fa}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .sidebar-footer{padding:14px 18px;border-top:1px solid #2563eb}
  .user-info{display:flex;align-items:center;gap:10px}
  .user-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#3b82f6;color:#fff;flex-shrink:0}
  .user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:10px;color:#93c5fd}
  .btn-logout{margin-top:10px;width:100%;padding:7px;background:#1e3a8a;border:1px solid #2563eb;border-radius:8px;color:#93c5fd;font-size:12px;font-family:'Nunito',sans-serif;cursor:pointer;font-weight:600}
  .btn-logout:hover{background:#2563eb;color:#fff}

  /* ── Topbar ── */
  .main{margin-left:220px;display:flex;flex-direction:column;min-height:100vh;width:calc(100% - 220px)}
  .topbar{background:#1e40af;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-title{font-size:16px;font-weight:700;color:#fff}
  .topbar-sub{font-size:11px;color:#93c5fd}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .perfil-badge{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;background:#3b82f6;color:#fff}

  /* ── Page ── */
  .page{padding:22px 24px;flex:1;width:100%}
  .page-title{font-size:18px;font-weight:800;color:#1e293b;margin-bottom:16px}

  /* ── Cards ── */
  .card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%}
  .card-sm{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

  /* ── Stat cards coloridos ── */
  .stat-card{border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .stat-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat-icon svg{width:26px;height:26px;color:#fff}
  .stat-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:4px}
  .stat-value{font-size:26px;font-weight:700;color:#fff;line-height:1}
  .stat-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;width:100%}

  /* ── Métricas secundárias ── */
  .metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
  .metric{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .metric-label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
  .metric-value{font-size:18px;font-weight:700;color:#1e293b}

  /* ── Fichas ── */
  .ficha-card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid #e2e8f0;width:100%}
  .ficha-card.aberta{border-left-color:#3b82f6}
  .ficha-card.retornando{border-left-color:#f59e0b}
  .ficha-card.pronto{border-left-color:#10b981}
  .ficha-card.fechada{border-left-color:#6366f1}

  /* ── Badges ── */
  .badge{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
  .badge-open{background:#fef3c7;color:#92400e}
  .badge-partial{background:#dbeafe;color:#1e40af}
  .badge-closed{background:#d1fae5;color:#065f46}
  .badge-fechada{background:#ede9fe;color:#4c1d95}
  .pago-badge{font-size:10px;padding:3px 10px;border-radius:99px;background:#d1fae5;color:#065f46;font-weight:700}

  /* ── Botões ── */
  .btn{padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;border:none;transition:all .15s}
  .btn-primary{background:#1e40af;color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-success{background:#d1fae5;color:#065f46}
  .btn-success:hover{background:#a7f3d0}
  .btn-danger{background:#fee2e2;color:#991b1b}
  .btn-danger:hover{background:#fca5a5}
  .btn-warn{background:#fef3c7;color:#92400e}
  .btn-warn:hover{background:#fde68a}
  .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-sm{padding:4px 10px;font-size:11px}

  /* ── Forms ── */
  .form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .form-group label{font-size:12px;font-weight:600;color:#475569}
  .form-group input,.form-group select{font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 11px;background:#fff;color:#1e293b;font-family:'Nunito',sans-serif;transition:border .15s}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px #dbeafe}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .divider{border:none;border-top:1.5px solid #f1f5f9;margin:12px 0}
  .section-label{font-size:11px;font-weight:600;color:#64748b;letter-spacing:.3px;margin-bottom:10px}
  .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:9px 12px;font-size:12px;color:#1e40af;margin-bottom:12px}

  /* ── Tabelas ── */
  .data-table{width:100%;border-collapse:collapse;font-size:12px}
  .data-table th{text-align:left;color:#64748b;font-weight:600;padding:8px 10px;background:#f8fafc;font-size:11px}
  .data-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;font-size:12px}
  .data-table tr:last-child td{border-bottom:none}
  .tipos-table{width:100%;border-collapse:collapse;font-size:12px}
  .tipos-table th{font-size:11px;font-weight:600;color:#64748b;text-align:left;padding:7px 8px;background:#f8fafc}
  .tipos-table td{padding:7px 8px;border-bottom:1px solid #f1f5f9;font-size:12px}
  .tipos-table tr:last-child td{border-bottom:none}
  .pend-pos{color:#d97706;font-weight:700}
  .pend-zero{color:#059669;font-weight:700}

  /* ── Misc ── */
  .tag-tipo{font-size:10px;padding:2px 7px;border-radius:99px;background:#f1f5f9;color:#475569;display:inline-block;margin:1px;font-weight:600}
  .mat-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:#475569;margin:2px;font-weight:600}
  .cor-pill{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:99px;margin:2px;font-weight:700}
  .num-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}
  .num-group{display:flex;flex-direction:column;gap:3px}
  .num-group label{font-size:11px;font-weight:600;color:#475569}
  .num-group input{font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 8px;background:#fff;color:#1e293b;text-align:center;font-family:'Nunito',sans-serif}

  /* ── Login ── */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#2563eb 100%);padding:16px}
  .login-box{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .login-logo{font-size:28px;font-weight:800;color:#1e40af;letter-spacing:-1px}
  .login-sub{font-size:13px;color:#64748b;margin-bottom:28px;margin-top:4px}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(2px)}
  .modal-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal-title{font-size:15px;font-weight:800;color:#1e293b;margin-bottom:14px}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:opacity .3s;white-space:nowrap}
  .toast.show{opacity:1}

  /* ── Loading ── */
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#64748b;flex-direction:column;gap:14px;background:#f0f4f8}
  .spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#1e40af;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Sidebar mobile ── */
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:4px}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}
  @media(max-width:768px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;width:100%}
    .menu-btn{display:block}
    .sidebar-overlay.show{display:block}
    .topbar{padding:0 14px}
    .page{padding:14px}
  }
  details{width:100%}
  details summary{cursor:pointer;color:#64748b;font-size:12px;font-weight:600;list-style:none}
  details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="root"></div>
<div id="modal-root"></div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ── Firebase config ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBP5VqlhSyP4EohIlnBGe3Ldr6R46YOGZM",
  authDomain: "jm-enroladores.firebaseapp.com",
  projectId: "jm-enroladores",
  storageBucket: "jm-enroladores.firebasestorage.app",
  messagingSenderId: "1081241136144",
  appId: "1:1081241136144:web:796a8c776783bec0372e95"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ── Constantes ───────────────────────────────────────────────────
const TIPOS=[
  {id:'varanda_sofia',label:'Varanda Sofia',principal:true},
  {id:'centro_luxo',label:'Centro Luxo',principal:true},
  {id:'varanda_luxo',label:'Varanda Luxo'},
  {id:'varanda_nova',label:'Varanda Nova'},
  {id:'centro_novo',label:'Centro Novo'},
  {id:'banqueta',label:'Banqueta'},
  {id:'mesa_bistro',label:'Mesa Bistrô'},
  {id:'cadeira_mesa',label:'Cad. de Mesa'},
  {id:'namoradeira',label:'Namoradeira'},
  {id:'centro_sofia',label:'Centro Sofia'},
];

// Cores fixas por tipo de peça
const TIPO_CORES={
  varanda_sofia: {bg:'#e8f0fb', border:'#c5d8f5', color:'#3266ad'},
  centro_luxo:   {bg:'#e8f5ef', border:'#b2dfce', color:'#1D9E75'},
  varanda_nova:  {bg:'#fff3e0', border:'#ffe0b2', color:'#e65100'},
  centro_novo:   {bg:'#f3e8fb', border:'#d9b8f5', color:'#7b1fa2'},
  varanda_luxo:  {bg:'#fce8ef', border:'#f5b8cc', color:'#c2185b'},
  banqueta:      {bg:'#e8f5e9', border:'#a5d6a7', color:'#2e7d32'},
  mesa_bistro:   {bg:'#fff8e1', border:'#ffe082', color:'#f57f17'},
  cadeira_mesa:  {bg:'#e8eaf6', border:'#9fa8da', color:'#283593'},
  namoradeira:   {bg:'#fbe9e7', border:'#ffab91', color:'#bf360c'},
  centro_sofia:  {bg:'#e0f7fa', border:'#80deea', color:'#00838f'},
};

// Valores unitários por peça (editáveis pelo admin no Firestore)
let valoresPecas = {
  varanda_sofia: 0,
  centro_luxo: 0,
  varanda_luxo: 0,
  varanda_nova: 0,
  centro_novo: 0,
  banqueta: 0,
  mesa_bistro: 0,
  cadeira_mesa: 0,
  namoradeira: 0,
  centro_sofia: 0,
};

const CORES=['Bege','Mogno','Marrom','Preto','Bicolor'];
const COR_STYLE={'Bege':{bg:'#f5e6c8',color:'#7a5c1e'},'Mogno':{bg:'#6b2a1a',color:'#f5d5c8'},'Marrom':{bg:'#4a2c0a',color:'#e8d0b0'},'Preto':{bg:'#222',color:'#eee'},'Bicolor':{bg:'#444',color:'#eee'}};
const COLORS=['#3266ad','#1D9E75','#D85A30','#D4537E','#BA7517','#639922','#7F77DD','#993C1D'];
const PERFIS={admin:{label:'Administrador',color:'#3266ad',bg:'#e8f0fb'},apontador:{label:'Apontador',color:'#1D9E75',bg:'#e8f5ef'},entregador:{label:'Entregador',color:'#BA7517',bg:'#fef3e2'},financeiro:{label:'Financeiro',color:'#D4537E',bg:'#fce8ef'},proprietario:{label:'Proprietário',color:'#534AB7',bg:'#eeecfb'},geral:{label:'Geral',color:'#555',bg:'#f0f0f0'}};

// ── Estado local ─────────────────────────────────────────────────
let currentUser=null;
let currentUserData=null;
let currentTab='painel';
let enroladores=[];
let fichas=[];
let usuarios=[];
let unsubFichas=null;
let unsubEnroladores=null;
let unsubUsuarios=null;

// ── Helpers ──────────────────────────────────────────────────────
const avatarColor=i=>COLORS[i%COLORS.length];
const initials=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const today=()=>new Date().toISOString().split('T')[0];
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
const corPill=cor=>{if(!cor)return'';const st=COR_STYLE[cor]||{bg:'#eee',color:'#333'};return`<span class="cor-pill" style="background:${st.bg};color:${st.color}">${cor}</span>`};
const getEnr=id=>enroladores.find(e=>e.id===id);
const getFicha=id=>fichas.find(f=>f.id===id);

function somaEntr(f,k){if(k==='fita'||k==='fio')return(f.entregas||[]).reduce((a,e)=>a+(parseInt(e[k])||0),0);return(f.entregas||[]).reduce((a,e)=>a+(parseInt((e.tipos||{})[k])||0),0)}
function somaRecol(f,k){if(k==='fitaSobrando'||k==='fioSobrando')return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt(r[k])||0),0);return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt((r.tipos||{})[k])||0),0)}
function totalEnv(f){return TIPOS.reduce((a,t)=>a+somaEntr(f,t.id),0)}
function totalRec(f){return TIPOS.reduce((a,t)=>a+somaRecol(f,t.id),0)}
function pendentes(f){return totalEnv(f)-totalRec(f)}

function can(p){
  if(!currentUserData)return false;
  const rules={verPainel:['admin','apontador','proprietario','geral','financeiro','entregador'],verFichas:['admin','apontador','financeiro','proprietario','geral'],verFichasEntregador:['entregador'],registrar:['admin','apontador'],fecharFicha:['admin','apontador'],marcarPago:['admin','financeiro'],cadastrarEnrolador:['admin'],gerenciarUsuarios:['admin'],verRelatorio:['admin','proprietario','financeiro'],verRanking:['admin','apontador','proprietario','financeiro','entregador','geral'],verValores:['admin','proprietario','financeiro'],editar:['admin']};
  return(rules[p]||[]).includes(currentUserData.perfil);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── Modal ────────────────────────────────────────────────────────
function showModal(title,html,btns){
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-box"><div class="modal-title">${title}</div><div id="modal-body">${html}</div><div class="modal-btns">${btns}</div></div></div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function showConfirm(title,msg,confirmLabel,cls,onConfirm){
  showModal(title,`<div style="font-size:13px;color:#444;line-height:1.6">${msg}</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button><button class="btn btn-sm ${cls}" onclick="window._closeModal();(${onConfirm.toString()})();">${confirmLabel}</button>`);
}
window._closeModal=closeModal;

// ── Render principal ─────────────────────────────────────────────
function render(){
  document.getElementById('root').innerHTML=currentUserData?renderApp():renderLogin();
}
function reloadTab(){
  const el=document.getElementById('tab-content');
  if(el)el.innerHTML=renderTab(currentTab);
}

// ── Login ────────────────────────────────────────────────────────
function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
    <div class="login-logo">JM</div>
    <div class="login-sub">Controle de Enroladores · Fibra Sintética</div>
    <div class="form-group"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
    <div class="form-group" style="margin-bottom:18px"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')window._doLogin()"></div>
    <div id="login-err" style="font-size:12px;color:#dc2626;margin-bottom:10px;display:none;background:#fee2e2;padding:8px 12px;border-radius:8px">E-mail ou senha incorretos.</div>
    <button class="btn btn-primary" style="width:100%;padding:11px;font-size:14px" onclick="window._doLogin()">Entrar</button>
  </div></div>`;
}

window._doLogin=async function(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value.trim();
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    document.getElementById('login-err').style.display='block';
  }
};

// ── Resumo de movimento do painel ────────────────────────────────
function gerarResumoMovimento(){
  const hoje = today();
  const anoMes = hoje.slice(0,7);
  const mesNome = new Date().toLocaleDateString('pt-BR',{month:'long'});

  function calcMovimento(tipoId){
    let envHoje=0, envMes=0, recHoje=0, recMes=0;
    fichas.forEach(f=>{
      (f.entregas||[]).forEach(e=>{
        const v = parseInt((e.tipos||{})[tipoId])||0;
        if(e.data===hoje) envHoje+=v;
        if((e.data||'').slice(0,7)===anoMes) envMes+=v;
      });
      (f.recolhimentos||[]).forEach(r=>{
        const v = parseInt((r.tipos||{})[tipoId])||0;
        if(r.data===hoje) recHoje+=v;
        if((r.data||'').slice(0,7)===anoMes) recMes+=v;
      });
    });
    return {envHoje, envMes, recHoje, recMes};
  }

  const tiposAtivos = TIPOS.filter(t=>{
    const m = calcMovimento(t.id);
    return m.envHoje>0 || m.envMes>0 || m.recHoje>0 || m.recMes>0;
  });

  if(tiposAtivos.length===0){
    return `<div style="background:#fff;border-radius:14px;padding:24px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;margin-bottom:20px;text-align:center;color:#64748b">
      <div style="font-size:32px;margin-bottom:10px">📦</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Nenhuma movimentação este mês</div>
      <div style="font-size:12px">Nenhuma entrega ou recolhimento registrado em ${mesNome}.</div>
    </div>`;
  }

  let html = `<div style="width:100%;margin-bottom:20px">`;

  tiposAtivos.forEach(t=>{
    const m = calcMovimento(t.id);
    const tc = TIPO_CORES[t.id] || {bg:'#f5f5f5', border:'#ddd', color:'#555'};

    // Card entrega
    let entregaHTML = '';
    if(m.envHoje === 0){
      entregaHTML = `<div style="font-size:11px;color:#94a3b8;font-style:italic;margin-bottom:8px">Nenhuma entrega hoje</div>
        <div style="font-size:10px;color:${tc.color}99">${mesNome}: <strong style="font-size:14px;color:${tc.color}">${m.envMes}</strong></div>`;
    } else {
      entregaHTML = `<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">
          <span style="font-size:28px;font-weight:800;color:${tc.color}">${m.envHoje}</span>
          <span style="font-size:11px;color:${tc.color}99">hoje</span>
        </div>
        <div style="font-size:11px;color:${tc.color}99">${mesNome}: <strong>${m.envMes}</strong></div>`;
    }

    // Card recolhimento
    let recolhHTML = '';
    if(m.recHoje === 0){
      recolhHTML = `<div style="font-size:11px;color:#94a3b8;font-style:italic;margin-bottom:8px">Nenhum recolhimento hoje</div>
        <div style="font-size:10px;color:${tc.color}99">${mesNome}: <strong style="font-size:14px;color:${tc.color}">${m.recMes}</strong></div>`;
    } else {
      recolhHTML = `<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">
          <span style="font-size:28px;font-weight:800;color:${tc.color}">${m.recHoje}</span>
          <span style="font-size:11px;color:${tc.color}99">hoje</span>
        </div>
        <div style="font-size:11px;color:${tc.color}99">${mesNome}: <strong>${m.recMes}</strong></div>`;
    }

    html += `<div style="background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;margin-bottom:10px;border-left:4px solid ${tc.color}">
      <div style="font-size:13px;font-weight:700;color:${tc.color};margin-bottom:10px">${t.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%">
        <div style="background:${tc.bg};border:1px solid ${tc.border};border-radius:10px;padding:10px 14px">
          <div style="font-size:10px;font-weight:700;color:${tc.color};text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Entregas</div>
          ${entregaHTML}
        </div>
        <div style="background:${tc.bg};border:1px solid ${tc.border};border-radius:10px;padding:10px 14px">
          <div style="font-size:10px;font-weight:700;color:${tc.color};text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Recolhimentos</div>
          ${recolhHTML}
        </div>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

// ── Painel ───────────────────────────────────────────────────────
function renderPainel(){
  const abertas=fichas.filter(f=>f.status==='aberta');
  const fechadas=fichas.filter(f=>f.status==='fechada');
  const tEnv=fichas.reduce((a,f)=>a+totalEnv(f),0);
  const tRec=fichas.reduce((a,f)=>a+totalRec(f),0);
  const vFora=abertas.reduce((a,f)=>a+somaEntr(f,'varanda_sofia')-somaRecol(f,'varanda_sofia'),0);
  const cFora=abertas.reduce((a,f)=>a+somaEntr(f,'centro_luxo')-somaRecol(f,'centro_luxo'),0);
  const vNovaFora=abertas.reduce((a,f)=>a+somaEntr(f,'varanda_nova')-somaRecol(f,'varanda_nova'),0);
  const cNovoFora=abertas.reduce((a,f)=>a+somaEntr(f,'centro_novo')-somaRecol(f,'centro_novo'),0);
  let html=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;width:100%">
      <div class="stat-card" style="background:linear-gradient(135deg,#1e40af,#3b82f6)">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div><div class="stat-label">Varanda Sofia</div><div class="stat-value">${vFora}</div><div class="stat-sub">nas casas</div></div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <div><div class="stat-label">Centro Luxo</div><div class="stat-value">${cFora}</div><div class="stat-sub">nas casas</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;width:100%">
      <div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
        <div><div class="stat-label">Varanda Nova</div><div class="stat-value">${vNovaFora}</div><div class="stat-sub">nas casas</div></div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6)">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <div><div class="stat-label">Centro Novo</div><div class="stat-value">${cNovoFora}</div><div class="stat-sub">nas casas</div></div>
      </div>
    </div>
    ${gerarResumoMovimento()}
    <div class="section-label">fichas em andamento</div>`;
  if(!abertas.length)return html+'<div class="card"><div style="color:#666;font-size:13px;text-align:center;padding:20px">Nenhuma ficha aberta.</div></div>';
  html+=abertas.sort((a,b)=>{const na=getEnr(a.enroladorId)?.nome||'';const nb=getEnr(b.enroladorId)?.nome||'';return na.localeCompare(nb,'pt-BR');}).map(f=>{
    const enr=getEnr(f.enroladorId);if(!enr)return'';
    const ci=enroladores.findIndex(e=>e.id===f.enroladorId),c=avatarColor(ci);
    const env=totalEnv(f),rec=totalRec(f),pend=env-rec,pct=env?Math.round(rec/env*100):0;
    const fitaEnv=somaEntr(f,'fita'),fioEnv=somaEntr(f,'fio'),fitaSob=somaRecol(f,'fitaSobrando'),fioSob=somaRecol(f,'fioSobrando');
    const coresUsadas=[...new Set((f.entregas||[]).filter(e=>e.cor).map(e=>e.cor))];
    const rows=TIPOS.filter(t=>somaEntr(f,t.id)>0).map(t=>{
      const e=somaEntr(f,t.id),r=somaRecol(f,t.id),p=e-r,bw=e?Math.round(r/e*100):0;
      return `<tr ${t.principal?'style="background:#f8f8f8"':''}><td style="padding:4px 6px;font-size:11px;font-weight:${t.principal?600:400}">${t.label}</td><td style="padding:4px 6px;font-size:11px;text-align:center">${e}</td><td style="padding:4px 6px;font-size:11px;text-align:center">${r}</td><td style="padding:4px 6px;font-size:11px;text-align:center" class="${p>0?'pend-pos':'pend-zero'}">${p}</td><td style="padding:4px 6px;width:60px"><div style="height:4px;background:#e5e5e5;border-radius:99px;overflow:hidden"><div style="height:100%;width:${bw}%;background:${t.principal?'#3266ad':c};border-radius:99px"></div></div></td></tr>`;
    }).join('');
    // Mini-cards: mostra apenas os tipos que têm peças pendentes nesta ficha
    const tiposPendentes=TIPOS.filter(t=>somaEntr(f,t.id)-somaRecol(f,t.id)>0);
    const miniCards=tiposPendentes.length>0
      ? tiposPendentes.map(t=>{

        }).join('')
      : `<div style="background:#f0faf0;border:1px solid #b2dfce;border-radius:8px;padding:8px 10px;grid-column:1/-1;text-align:center;font-size:12px;color:#2e7d32;font-weight:600">✓ Todas as peças recolhidas</div>`;
    const gridCols=tiposPendentes.length===1?'1fr':tiposPendentes.length===2?'1fr 1fr':tiposPendentes.length===3?'1fr 1fr 1fr':'1fr 1fr';
    const podeFechar=can('fecharFicha')&&pend===0;
    const sl=pend===0?'badge-closed':rec>0?'badge-partial':'badge-open';
    const st=pend===0?'pronto p/ fechar':rec>0?'retornando':'aguardando';
    const borderClass=pend===0?'pronto':rec>0?'retornando':'aberta';
    return `<div class="ficha-card ${borderClass}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(enr.nome)}</div>
          <div><div style="font-size:14px;font-weight:700">${enr.nome}</div><div style="font-size:11px;color:#64748b">desde ${fmtDate(f.dataAbertura)}</div></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="badge ${sl}">${st}</span>
          ${podeFechar?`<button class="btn btn-sm btn-success" onclick="window._fecharFicha('${f.id}')">Fechar</button>`:''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:${gridCols};gap:8px;margin-bottom:10px;width:100%">
        ${miniCards}
      </div>
      <table class="tipos-table"><thead><tr><th>Tipo</th><th style="text-align:center">Env.</th><th style="text-align:center">Recol.</th><th style="text-align:center">Pend.</th><th></th></tr></thead><tbody>${rows}</tbody>
        <tfoot><tr style="border-top:2px solid #f1f5f9"><td style="padding:7px 8px;font-size:12px;font-weight:700">Total</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700">${env}</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700">${rec}</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700" class="${pend>0?'pend-pos':'pend-zero'}">${pend}</td><td style="padding:7px 8px;font-size:12px;text-align:right;color:#64748b;font-weight:600">${pct}%</td></tr></tfoot>
      </table>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
        <span class="mat-pill">Fita: ${fitaEnv} rolos${fitaSob>0?' · '+fitaSob+' sobrando':''}</span>
        ${coresUsadas.map(cor=>corPill(cor)).join('')}
        <span class="mat-pill">Fio: ${fioEnv} rolos${fioSob>0?' · '+fioSob+' sobrando':''}</span>
      </div>
    </div>`;
  }).join('');
  return html;
}

function renderFichas(){

  if(isEntregador)html+=`<div class="info-box">Você está visualizando as fichas abertas. Dados financeiros não exibidos.</div>`;

    html+=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <select id="f-status" onchange="window._refreshFichas()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:8px;padding:5px 8px;background:#fff">
        <option value="all">Todos os status</option><option value="aberta">Em andamento</option><option value="fechada">Fechada</option>
      </select>
      <select id="f-enr" onchange="window._refreshFichas()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:8px;padding:5px 8px;background:#fff">
        <option value="all">Todos enroladores</option>${[...enroladores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}
      </select>
    </div>`;
  }
  const lista=isEntregador?fichas.filter(f=>f.status==='aberta'):[...fichas];
  html+=`<div id="fichas-inner">${fichasInner(lista,isEntregador)}</div>`;
  return html;
}
window._refreshFichas=()=>{
  const st=document.getElementById('f-status')?.value||'all';
  const en=document.getElementById('f-enr')?.value||'all';
  let lista=[...fichas];
  if(st!=='all')lista=lista.filter(f=>f.status===st);
  if(en!=='all')lista=lista.filter(f=>f.enroladorId===en);
  document.getElementById('fichas-inner').innerHTML=fichasInner(lista,false);
};
function fichasInner(lista,isEntregador){
  if(!lista.length)return'<div class="card"><div style="color:#666;font-size:13px;text-align:center;padding:20px">Nenhuma ficha encontrada.</div></div>';
  return lista.map(f=>{
    const enr=getEnr(f.enroladorId);if(!enr)return'';
    const ci=enroladores.findIndex(e=>e.id===f.enroladorId),c=avatarColor(ci);
    const env=totalEnv(f),rec=totalRec(f),pend=env-rec,pct=env?Math.round(rec/env*100):0;
    const fitaEnv=somaEntr(f,'fita'),fioEnv=somaEntr(f,'fio'),fitaSob=somaRecol(f,'fitaSobrando'),fioSob=somaRecol(f,'fioSobrando');
    const closable=pend===0&&f.status==='aberta'&&can('fecharFicha');
    const podePagar=can('marcarPago')&&f.status==='fechada'&&!f.pago;
    const isAdmin=can('editar');
    const entradasRows=(f.entregas||[]).map((e,ei)=>{
      const pecas=TIPOS.filter(t=>e.tipos&&e.tipos[t.id]>0).map(t=>`<span class="tag-tipo">${t.label}: ${e.tipos[t.id]}</span>`).join('');
      return `<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:8px 10px;white-space:nowrap">${fmtDate(e.data)}</td><td style="padding:8px 10px">${e.entregador||'—'}</td><td style="padding:8px 10px;white-space:nowrap">${e.fita||0}r ${e.cor?corPill(e.cor):''}</td><td style="padding:8px 10px;white-space:nowrap">${e.fio||0}r</td><td style="padding:8px 10px">${pecas||'—'}</td>${isAdmin?`<td style="padding:8px 10px;white-space:nowrap"><button class="btn btn-sm btn-warn" style="font-size:10px" onclick="window._editarEntrega('${f.id}',${ei})">Editar</button> <button class="btn btn-sm btn-danger" style="font-size:10px;margin-left:4px" onclick="window._excluirEntrada('${f.id}',${ei})">Excluir</button></td>`:''}</tr>`;
    }).join('');
    const recolhRows=(f.recolhimentos||[]).length?(f.recolhimentos||[]).map((r,ri)=>{
      const pecas=TIPOS.filter(t=>r.tipos&&r.tipos[t.id]>0).map(t=>`<span class="tag-tipo">${t.label}: ${r.tipos[t.id]}</span>`).join('');
      const sob=[];if(r.fitaSobrando>0)sob.push(`${r.fitaSobrando} fita`);if(r.fioSobrando>0)sob.push(`${r.fioSobrando} fio`);
      return `<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:8px 10px;white-space:nowrap">${fmtDate(r.data)}</td><td style="padding:8px 10px">${r.entregador||'—'}</td><td style="padding:8px 10px">${sob.length?sob.join(', '):'—'}</td><td style="padding:8px 10px">${pecas||'—'}</td>${isAdmin?`<td style="padding:8px 10px;white-space:nowrap"><button class="btn btn-sm btn-warn" style="font-size:10px" onclick="window._editarRecolhimento('${f.id}',${ri})">Editar</button> <button class="btn btn-sm btn-danger" style="font-size:10px;margin-left:4px" onclick="window._excluirRecolhimento('${f.id}',${ri})">Excluir</button></td>`:''}</tr>`;
    }).join(''):`<tr><td colspan="${isAdmin?5:4}" style="color:#666">Nenhum recolhimento.</td></tr>`;
    const sl=f.status==='fechada'?'badge-fechada':pend===0?'badge-closed':rec>0?'badge-partial':'badge-open';
    const st2=f.status==='fechada'?'fechada':pend===0?'pronto':rec>0?'retornando':'aguardando';
    const borderCls2=f.status==='fechada'?'fechada':pend===0?'pronto':rec>0?'retornando':'aberta';
    return `<div class="ficha-card ${borderCls2}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(enr.nome)}</div>
          <div><div style="font-size:14px;font-weight:700">${enr.nome}</div><div style="font-size:11px;color:#64748b">Aberta em ${fmtDate(f.dataAbertura)}</div></div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          ${f.pago?'<span class="pago-badge">✓ Pago</span>':''}
          ${closable?`<button class="btn btn-sm btn-success" onclick="window._fecharFicha('${f.id}')">Fechar ficha</button>`:''}
          ${podePagar?`<button class="btn btn-sm btn-primary" onclick="window._confirmarPago('${f.id}')">Marcar como pago</button>`:''}
          ${isAdmin?`<button class="btn btn-sm btn-danger" onclick="window._excluirFicha('${f.id}')">Excluir ficha</button>`:''}
          <span class="badge ${sl}">${st2}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;width:100%">
        <div class="metric"><div class="metric-label">Enviadas</div><div class="metric-value" style="font-size:18px;font-weight:700">${env}</div></div>
        <div class="metric"><div class="metric-label">Recolhidas</div><div class="metric-value" style="font-size:18px;font-weight:700">${rec}</div></div>
        <div class="metric"><div class="metric-label">Pendentes</div><div class="metric-value" style="font-size:17px;color:${pend>0?'#e65100':'#2e7d32'}">${pend}</div></div>
        <div class="metric"><div class="metric-label">Retorno</div><div class="metric-value" style="font-size:18px;font-weight:700">${pct}%</div></div>
      </div>
      ${!isEntregador?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;width:100%">
        <div class="metric"><div class="metric-label">fita env./sob.</div><div class="metric-value" style="font-size:13px">${fitaEnv} rolos${fitaSob>0?' / '+fitaSob+' sobrou':''}</div></div>
        <div class="metric"><div class="metric-label">fio env./sob.</div><div class="metric-value" style="font-size:13px">${fioEnv} rolos${fioSob>0?' / '+fioSob+' sobrou':''}</div></div>
      </div>`:''}
      <div style="width:100%;margin-top:4px;border-top:1px solid #f1f5f9;padding-top:10px">
        <div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:10px">Entregas e recolhimentos</div>
        <div class="section-label" style="margin-bottom:6px">entregas</div>
        <div style="width:100%;overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr style="background:#f8fafc">
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Data</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Entregador</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Fita</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Fio</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px">Peças</th>
              ${isAdmin?'<th style="padding:8px 10px;width:120px"></th>':''}
            </tr></thead>
            <tbody>${entradasRows}</tbody>
          </table>
        </div>
        <div class="section-label" style="margin-top:14px;margin-bottom:6px">recolhimentos</div>
        <div style="width:100%;overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr style="background:#f8fafc">
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Data</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Entregador</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px;white-space:nowrap">Sobras</th>
              <th style="padding:8px 10px;text-align:left;color:#64748b;font-weight:600;font-size:11px">Peças</th>
              ${isAdmin?'<th style="padding:8px 10px;width:120px"></th>':''}
            </tr></thead>
            <tbody>${recolhRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}

window._editarEntrega=(fichaId,idx)=>{
  const f=getFicha(fichaId);const e=(f.entregas||[])[idx];if(!e)return;
  const tiposInputs=TIPOS.map(t=>`<div class="num-group"><label>${t.label}${t.principal?' ★':''}</label><input type="number" id="ee-${t.id}" min="0" step="1" value="${(e.tipos||{})[t.id]||0}"></div>`).join('');
  showModal('Editar entrega',`
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group"><label>Data</label><input type="date" id="ee-data" value="${e.data}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>
      <div class="form-group"><label>Entregador</label><input type="text" id="ee-entregador" value="${e.entregador||''}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>
    </div>
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group"><label>Cor da fita</label><select id="ee-cor" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"><option value="">—</option>${CORES.map(c=>`<option value="${c}"${e.cor===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Fita</label><input type="number" id="ee-fita" min="0" value="${e.fita||0}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>
        <div class="form-group"><label>Fio</label><input type="number" id="ee-fio" min="0" value="${e.fio||0}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>
      </div>
    </div>
    <div class="section-label">peças</div><div class="num-inputs">${tiposInputs}</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="window._salvarEntrega('${fichaId}',${idx})">Salvar</button>`);
};
window._salvarEntrega=async(fichaId,idx)=>{
  const f=getFicha(fichaId);
  const entregas=[...(f.entregas||[])];
  entregas[idx]={
    ...entregas[idx],
    data:document.getElementById('ee-data').value,
    entregador:document.getElementById('ee-entregador').value.trim(),
    cor:document.getElementById('ee-cor').value,
    fita:parseInt(document.getElementById('ee-fita').value)||0,
    fio:parseInt(document.getElementById('ee-fio').value)||0,
    tipos:Object.fromEntries(TIPOS.map(t=>[t.id,parseInt(document.getElementById(`ee-${t.id}`)?.value)||0]))
  };
  await updateDoc(doc(db,'fichas',fichaId),{entregas});
  closeModal();showToast('Entrega atualizada!');
};
window._excluirEntrada=(fichaId,idx)=>{
  window._pendingExcluirEntrega={fichaId,idx};
  showModal('Excluir entrega',
    '<div style="font-size:13px;color:#444">Tem certeza que deseja excluir este registro de entrega?</div>',
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-danger" onclick="window._confirmarExcluirEntrada()">Excluir</button>`);
};
window._confirmarExcluirEntrada=async()=>{
  const {fichaId,idx}=window._pendingExcluirEntrega||{};
  if(!fichaId)return;
  closeModal();
  const f=getFicha(fichaId);
  const entregas=[...(f.entregas||[])];

  await updateDoc(doc(db,'fichas',fichaId),{entregas});
  showToast('Entrega excluída.');
};

// ── Relatório ────────────────────────────────────────────────────
function renderRelatorio(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const fechadas=fichas.filter(f=>f.status==='fechada');
  const pagas=fechadas.filter(f=>f.pago);
  const pendentes_pag=fechadas.filter(f=>!f.pago);
  const totalPecas=fechadas.reduce((a,f)=>a+totalEnv(f),0);
  const totalPagoVal=pagas.reduce((a,f)=>a+calcularPagamento(f),0);
  const totalPendenteVal=pendentes_pag.reduce((a,f)=>a+calcularPagamento(f),0);

  let html=`
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px">
    <div class="stat-card" style="background:linear-gradient(135deg,#1e40af,#3b82f6)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div>
      <div><div class="stat-label">Fichas fechadas</div><div class="stat-value" style="font-size:24px">${fechadas.length}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div><div class="stat-label">Pagas</div><div class="stat-value" style="font-size:24px">${pagas.length}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div><div class="stat-label">Aguard. pagamento</div><div class="stat-value" style="font-size:24px">${pendentes_pag.length}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/></svg></div>
      <div><div class="stat-label">Peças processadas</div><div class="stat-value" style="font-size:24px">${totalPecas}</div></div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
    <div class="stat-card" style="background:linear-gradient(135deg,#065f46,#059669)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div><div class="stat-label">Total já pago</div><div class="stat-value" style="font-size:20px">${fmtMoeda(totalPagoVal)}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#92400e,#d97706)">
      <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div><div class="stat-label">Total a pagar</div><div class="stat-value" style="font-size:20px">${fmtMoeda(totalPendenteVal)}</div></div>
    </div>
  </div>`;

  // ── Resumo mensal ──
  // Agrupa fichas pagas por mês de fechamento (usa dataAbertura como referência)
  const mapMensal={};
  pagas.forEach(f=>{
    if(!f.dataAbertura)return;
    const [y,m]=f.dataAbertura.split('-');
    const chave=`${y}-${m.padStart(2,'0')}`;
    if(!mapMensal[chave])mapMensal[chave]={ano:parseInt(y),mes:parseInt(m),totalPago:0,fichas:0,pecas:0};
    mapMensal[chave].totalPago+=calcularPagamento(f);
    mapMensal[chave].fichas+=1;
    mapMensal[chave].pecas+=totalEnv(f);
  });
  const meses=Object.values(mapMensal).sort((a,b)=>b.ano!==a.ano?b.ano-a.ano:b.mes-a.mes);

  if(meses.length){
    const maxVal=Math.max(...meses.map(m=>m.totalPago))||1;
    html+=`<div class="section-label">resumo mensal de mão de obra</div>
    <div class="card" style="margin-bottom:16px">
      ${meses.map(m=>{
        const bar=Math.round(m.totalPago/maxVal*100);
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0">
          <div style="width:110px;font-size:12px;font-weight:600;color:#444;flex-shrink:0">${MESES[m.mes-1]} ${m.ano}</div>
          <div style="flex:1">
            <div style="height:8px;background:#f0f0f0;border-radius:99px;overflow:hidden">
              <div style="height:100%;width:${bar}%;background:#3266ad;border-radius:99px"></div>
            </div>
            <div style="font-size:10px;color:#666;margin-top:3px">${m.fichas} ficha${m.fichas>1?'s':''} · ${m.pecas} peças</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:14px;font-weight:700;color:#2e7d32">${fmtMoeda(m.totalPago)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

// ── Valores e pagamento ──────────────────────────────────────
function calcularPagamento(f){
  return TIPOS.reduce((total,t)=>{
    const qtd=somaRecol(f,t.id);
    const valor=parseFloat(valoresPecas[t.id])||0;
    return total+(qtd*valor);
  },0);
}

function fmtMoeda(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

// ── Ranking ──────────────────────────────────────────────────
function renderRanking(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Agrupa recolhimentos por mês/ano para um enrolador
  function resumoMensal(fichasEnr){
    const map={};
    fichasEnr.forEach(f=>{
      (f.recolhimentos||[]).forEach(r=>{
        if(!r.data)return;
        const [y,m]=r.data.split('-');
        const chave=`${y}-${m}`;
        if(!map[chave])map[chave]={ano:parseInt(y),mes:parseInt(m),total:0,varandas:0,centros:0};
        TIPOS.forEach(t=>{map[chave].total+=(parseInt((r.tipos||{})[t.id])||0);});
        map[chave].varandas+=(parseInt((r.tipos||{}).varanda_sofia)||0);
        map[chave].centros+=(parseInt((r.tipos||{}).centro_luxo)||0);
      });
    });
    // Ordena do mais recente para o mais antigo
    return Object.values(map).sort((a,b)=>b.ano!==a.ano?b.ano-a.ano:b.mes-a.mes);
  }

  const dados = enroladores.map(enr=>{
    const fichasEnr = fichas.filter(f=>f.enroladorId===enr.id);
    const totalEnrolado = fichasEnr.reduce((a,f)=>a+totalRec(f),0);
    const totalEnviado  = fichasEnr.reduce((a,f)=>a+totalEnv(f),0);
    const totalPendente = fichasEnr.reduce((a,f)=>a+Math.max(0,pendentes(f)),0);
    const varandas      = fichasEnr.reduce((a,f)=>a+somaRecol(f,'varanda_sofia'),0);
    const centros       = fichasEnr.reduce((a,f)=>a+somaRecol(f,'centro_luxo'),0);
    const txRetorno     = totalEnviado>0?Math.round(totalEnrolado/totalEnviado*100):0;
    const mensal        = resumoMensal(fichasEnr);
    return {enr, totalEnrolado, totalEnviado, totalPendente, varandas, centros, txRetorno, mensal};
  }).filter(d=>d.totalEnviado>0)
    .sort((a,b)=>b.totalEnrolado-a.totalEnrolado);

  if(!dados.length) return '<div class="card"><div style="color:#666;font-size:13px;text-align:center;padding:24px">Nenhum dado disponível ainda.</div></div>';

  const maximo = dados[0].totalEnrolado||1;
  const medalhas = ['🥇','🥈','🥉'];

  let html = `<div style="font-size:12px;color:#666;margin-bottom:12px">Ordenado pelo total de peças já enroladas e devolvidas à fábrica.</div>`;

  html += dados.map((d,i)=>{
    const ci = enroladores.findIndex(e=>e.id===d.enr.id);
    const c  = avatarColor(ci);
    const bar = Math.round(d.totalEnrolado/maximo*100);
    const destaque = i===0 ? 'border:2px solid #f5c842;' : '';

    // Tabela mensal
    const mensalRows = d.mensal.length ? d.mensal.map(m=>{
      const nomeMes=`${MESES[m.mes-1]} ${m.ano}`;
      const barMes=Math.round(m.total/maximo*100);
      return `<tr>
        <td style="padding:5px 6px;font-size:11px;white-space:nowrap;color:#444">${nomeMes}</td>
        <td style="padding:5px 6px;font-size:11px;text-align:center;font-weight:600">${m.total}</td>
        <td style="padding:5px 6px;font-size:11px;text-align:center;color:#3266ad">${m.varandas}</td>
        <td style="padding:5px 6px;font-size:11px;text-align:center;color:#1D9E75">${m.centros}</td>
        <td style="padding:5px 6px;width:80px">
          <div style="height:4px;background:#f0f0f0;border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${barMes}%;background:${c};border-radius:99px"></div>
          </div>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="5" style="padding:8px 6px;font-size:11px;color:#999">Nenhum recolhimento registrado ainda.</td></tr>`;

    return `<div class="card" style="margin-bottom:10px;${destaque}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="font-size:22px;width:32px;text-align:center">${medalhas[i]||'#'+(i+1)}</div>
        <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(d.enr.nome)}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:700">${d.enr.nome}</div>
          <div style="font-size:11px;color:#666">${d.enr.endereco||'—'}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:28px;font-weight:700;color:${c};line-height:1">${d.totalEnrolado}</div>
          <div style="font-size:10px;color:#666">peças enroladas</div>
        </div>
      </div>
      <div style="height:8px;background:#f0f0f0;border-radius:99px;overflow:hidden;margin-bottom:10px">
        <div style="height:100%;width:${bar}%;background:${c};border-radius:99px;transition:width .5s"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
        <div class="metric"><div class="metric-label">Varanda Sofia</div><div class="metric-value" style="font-size:16px;color:#3266ad">${d.varandas}</div></div>
        <div class="metric"><div class="metric-label">Centro Luxo</div><div class="metric-value" style="font-size:16px;color:#1D9E75">${d.centros}</div></div>
        <div class="metric"><div class="metric-label">Taxa retorno</div><div class="metric-value" style="font-size:16px;color:${d.txRetorno>=80?'#2e7d32':d.txRetorno>=50?'#e65100':'#c62828'}">${d.txRetorno}%</div></div>
        <div class="metric"><div class="metric-label">Pendentes</div><div class="metric-value" style="font-size:16px;color:${d.totalPendente>0?'#e65100':'#2e7d32'}">${d.totalPendente}</div></div>
      </div>
      <details>
        <summary style="font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;margin-bottom:0">
          <span>▶</span> Resumo por mês
        </summary>
        <div style="margin-top:10px">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr style="background:#f5f5f7">
                <th style="padding:5px 6px;font-size:10px;font-weight:600;color:#666;text-align:left">Mês</th>
                <th style="padding:5px 6px;font-size:10px;font-weight:600;color:#666;text-align:center">Total</th>
                <th style="padding:5px 6px;font-size:10px;font-weight:600;color:#3266ad;text-align:center">V.Sofia</th>
                <th style="padding:5px 6px;font-size:10px;font-weight:600;color:#1D9E75;text-align:center">C.Luxo</th>
                <th style="padding:5px 6px;width:80px"></th>
              </tr>
            </thead>
            <tbody>${mensalRows}</tbody>
          </table>
        </div>
      </details>
    </div>`;
  }).join('');

  return html;
}

window._atualizarSelectRecolhimento=()=>{
  const sel=document.getElementById('r-ficha');
  if(!sel)return;
  const valorAtual=sel.value;
  const abertas=fichas.filter(f=>f.status==='aberta');
  const enrolsComFichas=[...new Set(abertas.map(f=>f.enroladorId))]
    .sort((a,b)=>{const na=getEnr(a)?.nome||'';const nb=getEnr(b)?.nome||'';return na.localeCompare(nb,'pt-BR');});
  const optsHtml=enrolsComFichas.map(enrId=>{
    const fichasEnr=abertas.filter(f=>f.enroladorId===enrId).sort((a,b)=>a.dataAbertura>b.dataAbertura?1:-1);
    const enr=getEnr(enrId);
    if(fichasEnr.length===1){
      const f=fichasEnr[0];
      return `<option value="${f.id}">${enr?.nome||'?'} — ficha de ${fmtDate(f.dataAbertura)} (${pendentes(f)} pend.)</option>`;

  }).join('');
  sel.innerHTML=`<option value="">Selecione a ficha...</option>${optsHtml}`;
  if(valorAtual) sel.value=valorAtual;
};

window._registrarEntrega=async()=>{
  const enrId=document.getElementById('e-enr').value;
  const data=document.getElementById('e-data').value;
  const entregador=document.getElementById('e-entregador').value.trim();
  const cor=document.getElementById('e-cor').value;
  const fita=parseInt(document.getElementById('e-fita').value)||0;
  const fio=parseInt(document.getElementById('e-fio').value)||0;
  const tipos=getTiposValues('e-tipos');
  if(!enrId||!data){showToast('Selecione o enrolador e a data.');return;}
  if(!fita&&!fio&&!Object.values(tipos).reduce((a,v)=>a+v,0)){showToast('Registre pelo menos fita, fio ou alguma peça.');return;}
  const novaEntrega={data,entregador,cor,fita,fio,tipos};
  const destEl=document.getElementById('e-ficha-dest');
  const dest=destEl?destEl.value:'nova';
  if(dest&&dest!=='nova'){
    // Adiciona à ficha existente
    const ficha=getFicha(dest);
    const entregas=[...(ficha.entregas||[]),novaEntrega];
    await updateDoc(doc(db,'fichas',dest),{entregas});
    showToast('Entrega adicionada à ficha existente!');
  }else{
    // Cria nova ficha
    await addDoc(collection(db,'fichas'),{enroladorId:enrId,dataAbertura:data,status:'aberta',pago:false,entregas:[novaEntrega],recolhimentos:[]});
    showToast('Nova ficha criada com a entrega!');
  }
  // Limpa apenas os campos sem reconstruir o form inteiro
  document.getElementById('e-data').value=today();
  document.getElementById('e-cor').value='';
  document.getElementById('e-fita').value='';
  document.getElementById('e-fio').value='';
  document.getElementById('e-entregador').value='';
  buildTiposInputs('e-tipos');
  // Atualiza as opções de ficha para o enrolador atual
  window._atualizarFichasEntrega();
};

window._registrarRecolhimento=async()=>{
  const fichaId=document.getElementById('r-ficha').value;
  const data=document.getElementById('r-data').value;
  const entregador=document.getElementById('r-entregador').value.trim();
  const fitaSobrando=parseInt(document.getElementById('r-fita').value)||0;
  const fioSobrando=parseInt(document.getElementById('r-fio').value)||0;
  const tipos=getTiposValues('r-tipos');
  if(!fichaId||!data){showToast('Selecione a ficha e a data.');return;}
  const totalPecasRec=Object.values(tipos).reduce((a,v)=>a+v,0);
  if(!totalPecasRec&&!fitaSobrando&&!fioSobrando){showToast('Registre pelo menos alguma peça recolhida.');return;}
  const f=getFicha(fichaId);

  // Validação: não permite recolher mais do que foi enviado por tipo
  for(const t of TIPOS){
    const jaRecol=somaRecol(f,t.id);
    const enviado=somaEntr(f,t.id);
    const tentando=tipos[t.id]||0;
    if(jaRecol+tentando>enviado){
      showToast(`Quantidade inválida: ${t.label} — enviadas: ${enviado}, já recolhidas: ${jaRecol}, máximo a recolher agora: ${enviado-jaRecol}.`);
      return;
    }
  }

  const recolhimentos=[...(f.recolhimentos||[]),{data,entregador,fitaSobrando,fioSobrando,tipos}];
  await updateDoc(doc(db,'fichas',fichaId),{recolhimentos});
  const fAtual={...f,recolhimentos};
  if(pendentes(fAtual)<=0){
    showModal('Todas as peças retornaram!',
      `<div style="font-size:13px;color:#444;line-height:1.6">As peças foram todas recolhidas. Deseja fechar a ficha de <strong>${getEnr(f.enroladorId)?.nome}</strong>?</div>`,
      `<button class="btn btn-sm" onclick="window._closeModal()">Agora não</button>
       <button class="btn btn-sm btn-success" onclick="window._fecharFichaDirecto('${fichaId}')">Fechar ficha</button>`);
  }else{
    showToast('Recolhimento registrado!');
  }
  // Limpa campos sem reconstruir o form — o listener do Firebase atualiza as fichas automaticamente
  document.getElementById('r-ficha').value='';
  document.getElementById('r-data').value=today();
  document.getElementById('r-entregador').value='';
  document.getElementById('r-fita').value='';
  document.getElementById('r-fio').value='';
  buildTiposInputs('r-tipos');
};

window._fecharFichaDirecto=async id=>{
  closeModal();
  await updateDoc(doc(db,'fichas',id),{status:'fechada'});
  showToast('Ficha fechada!');
};

// ── Enroladores ──────────────────────────────────────────────────
function renderEnroladores(){
  let html=`<div class="card" style="margin-bottom:10px">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Cadastrar enrolador</div>
    <div class="form-row"><div class="form-group"><label>Nome</label><input type="text" id="en-nome" placeholder="Nome completo"></div>
    <div class="form-group"><label>Endereço / Bairro</label><input type="text" id="en-end" placeholder="Rua, nº - Bairro"></div></div>
    <div class="form-group"><label>Telefone</label><input type="text" id="en-tel" placeholder="(88) 99999-0000"></div>
    <button class="btn btn-primary" onclick="window._cadastrarEnr()">Cadastrar</button>
  </div>`;
  html+=[...enroladores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map((e,i)=>{
    const fList=fichas.filter(f=>f.enroladorId===e.id);
    const env=fList.reduce((a,f)=>a+totalEnv(f),0),rec=fList.reduce((a,f)=>a+totalRec(f),0);
    const c=avatarColor(i);
    return `<div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(e.nome)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">${e.nome}</div><div style="font-size:11px;color:#64748b">${e.endereco||'—'}</div><div style="font-size:11px;color:#64748b">${e.telefone||'—'}</div></div>
      <div style="text-align:right;margin-right:8px;flex-shrink:0"><div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Env./Recol.</div><div style="font-size:16px;font-weight:800;color:#1e293b">${env} / ${rec}</div></div>
      <button class="btn btn-sm btn-warn" onclick="window._editarEnrolador('${e.id}')">Editar</button>
      <button class="btn btn-sm btn-danger" onclick="window._excluirEnrolador('${e.id}')">Excluir</button>

  return html;
}
window._cadastrarEnr=async()=>{
  const nome=document.getElementById('en-nome').value.trim();
  const end=document.getElementById('en-end').value.trim();
  const tel=document.getElementById('en-tel').value.trim();
  if(!nome){showToast('Informe o nome do enrolador.');return;}
  await addDoc(collection(db,'enroladores'),{nome,endereco:end,telefone:tel});
  showToast('Enrolador cadastrado!');reloadTab();
};
window._editarEnrolador=id=>{
  const e=enroladores.find(x=>x.id===id);if(!e)return;
  const inp=(eid,label,val)=>`<div class="form-group"><label>${label}</label><input id="${eid}" type="text" value="${val||''}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>`;
  showModal('Editar enrolador',inp('ee-enr-nome','Nome completo',e.nome)+inp('ee-enr-end','Endereço / Bairro',e.endereco)+inp('ee-enr-tel','Telefone',e.telefone),
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="window._salvarEnrolador('${id}')">Salvar</button>`);
};
window._salvarEnrolador=async id=>{
  const nome=document.getElementById('ee-enr-nome').value.trim();
  if(!nome){showToast('Informe o nome.');return;}
  await updateDoc(doc(db,'enroladores',id),{nome,endereco:document.getElementById('ee-enr-end').value.trim(),telefone:document.getElementById('ee-enr-tel').value.trim()});
  closeModal();showToast('Enrolador atualizado!');
};

// ── Usuários ─────────────────────────────────────────────────────

  return `<div class="card" style="margin-bottom:10px">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Cadastrar novo usuário</div>

window._cadastrarUsuario=async()=>{
  const nome=document.getElementById('nu-nome').value.trim();
  const perfil=document.getElementById('nu-perfil').value;
  const email=document.getElementById('nu-email').value.trim();
  const senha=document.getElementById('nu-senha').value.trim();
  if(!nome||!email||!senha){showToast('Preencha nome, e-mail e senha.');return;}
  if(senha.length<6){showToast('A senha precisa ter pelo menos 6 caracteres.');return;}
  try{
    // Cria usuário no Auth via Admin SDK não está disponível no client.
    // Salvamos no Firestore e orientamos o admin a criar no console do Firebase.
    await addDoc(collection(db,'usuarios'),{nome,perfil,email,uid:''});
    showToast('Usuário salvo! Crie o login dele no Firebase Console → Authentication → Add user.');
    reloadTab();
  }catch(e){showToast('Erro ao cadastrar: '+e.message);}
};

window._editarUsuario=id=>{
  const u=usuarios.find(x=>x.id===id);if(!u)return;
  const inp=(eid,label,val,type='text')=>`<div class="form-group"><label>${label}</label><input id="${eid}" type="${type}" value="${val||''}" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>`;
  showModal(`Editar — ${u.nome}`,
    inp('eu-nome','Nome completo',u.nome)+
    `<div class="form-group"><label>Perfil</label><select id="eu-perfil" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}"${u.perfil===k?' selected':''}>${v.label}</option>`).join('')}</select></div>`+
    inp('eu-email','E-mail',u.email,'email'),
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="window._salvarUsuario('${id}')">Salvar</button>`);
};
window._salvarUsuario=async id=>{
  const nome=document.getElementById('eu-nome').value.trim();
  const perfil=document.getElementById('eu-perfil').value;
  const email=document.getElementById('eu-email').value.trim();
  if(!nome||!email){showToast('Nome e e-mail são obrigatórios.');return;}
  await updateDoc(doc(db,'usuarios',id),{nome,perfil,email});
  closeModal();showToast('Usuário atualizado!');
};
window._excluirUsuario=id=>{
  const u=usuarios.find(x=>x.id===id);if(!u)return;
  window._pendingExcluirUsuarioId=id;
  showModal('Excluir usuário',
    `<div style="font-size:13px;color:#444;line-height:1.6">Excluir <strong>${u.nome}</strong> do sistema? Esta ação não pode ser desfeita.</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-danger" onclick="window._confirmarExcluirUsuario()">Excluir</button>`);
};
window._confirmarExcluirUsuario=async()=>{
  const id=window._pendingExcluirUsuarioId;
  if(!id)return;
  closeModal();
  await deleteDoc(doc(db,'usuarios',id));
  window._pendingExcluirUsuarioId=null;
  showToast('Usuário removido. Remova também no Firebase Console → Authentication.');
};

// ── Excluir ficha e enrolador ────────────────────────────────────
window._excluirFicha=id=>{
  const enr=getEnr(getFicha(id)?.enroladorId);
  window._pendingExcluirFichaId=id;
  showModal('Excluir ficha',
    `<div style="font-size:13px;color:#444;line-height:1.6">Excluir permanentemente a ficha de <strong>${enr?.nome}</strong>? Todos os registros de entrega e recolhimento serão apagados. Esta ação não pode ser desfeita.</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-danger" onclick="window._confirmarExcluirFicha()">Excluir ficha</button>`);
};
window._confirmarExcluirFicha=async()=>{
  const id=window._pendingExcluirFichaId;if(!id)return;
  closeModal();
  await deleteDoc(doc(db,'fichas',id));
  window._pendingExcluirFichaId=null;
  showToast('Ficha excluída.');
};

window._excluirEnrolador=id=>{
  const enr=enroladores.find(e=>e.id===id);if(!enr)return;
  const temFichas=fichas.some(f=>f.enroladorId===id);
  window._pendingExcluirEnrId=id;
  const aviso=temFichas?'<div style="margin-top:8px;font-size:12px;background:#ffebee;color:#c62828;padding:8px 10px;border-radius:8px">⚠️ Este enrolador possui fichas cadastradas. Exclua as fichas primeiro antes de excluir o enrolador.</div>':'';
  showModal('Excluir enrolador',
    `<div style="font-size:13px;color:#444;line-height:1.6">Excluir permanentemente o enrolador <strong>${enr.nome}</strong>?${aviso}</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     ${!temFichas?`<button class="btn btn-sm btn-danger" onclick="window._confirmarExcluirEnr()">Excluir</button>`:''}`);
};
window._confirmarExcluirEnr=async()=>{
  const id=window._pendingExcluirEnrId;if(!id)return;
  closeModal();
  await deleteDoc(doc(db,'enroladores',id));
  window._pendingExcluirEnrId=null;
  showToast('Enrolador excluído.');
};

// ── Ações fichas ─────────────────────────────────────────────────
window._fecharFicha=id=>{
  const enr=getEnr(getFicha(id)?.enroladorId);
  window._pendingFichaId=id;
  showModal('Fechar ficha',

     <button class="btn btn-sm btn-success" onclick="window._confirmarFecharFicha()">Fechar ficha</button>`);

  const id=window._pendingFichaId;if(!id)return;
  closeModal();
  await updateDoc(doc(db,'fichas',id),{status:'fechada'});
  window._pendingFichaId=null;
  showToast('Ficha fechada!');
};
window._confirmarPago=id=>{
  const enr=getEnr(getFicha(id)?.enroladorId);
  window._pendingPagoId=id;
  showModal('Confirmar pagamento',
    `<div style="font-size:13px;color:#444;line-height:1.6">Confirma o pagamento da ficha de <strong>${enr?.nome}</strong>?</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-primary" onclick="window._confirmarPagoAction()">Confirmar</button>`);
};
window._confirmarPagoAction=async()=>{
  const id=window._pendingPagoId;if(!id)return;
  closeModal();
  await updateDoc(doc(db,'fichas',id),{pago:true});
  window._pendingPagoId=null;
  showToast('Pagamento registrado!');
};

// ── Firebase listeners em tempo real ────────────────────────────
function iniciarListeners(){
  if(unsubEnroladores)unsubEnroladores();
  if(unsubFichas)unsubFichas();
  if(unsubUsuarios)unsubUsuarios();

  unsubEnroladores=onSnapshot(collection(db,'enroladores'),snap=>{
    enroladores=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData)reloadTab();
  });

  unsubFichas=onSnapshot(collection(db,'fichas'),snap=>{
    fichas=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData){
      // Se estiver na aba entrega ou recolhimento, atualiza apenas os selects de ficha
      if(currentTab==='entregar'){
        window._atualizarFichasEntrega&&window._atualizarFichasEntrega();
      }else if(currentTab==='recolher'){
        window._atualizarSelectRecolhimento&&window._atualizarSelectRecolhimento();
      }else{
        reloadTab();
      }
    }
  });

  unsubUsuarios=onSnapshot(collection(db,'usuarios'),snap=>{
    usuarios=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentUserData&&currentTab==='usuarios')reloadTab();
  });

  // Listener de valores unitários
  onSnapshot(doc(db,'configuracoes','valores'),snap=>{
    if(snap.exists()){
      valoresPecas={...valoresPecas,...snap.data()};
      if(currentUserData)reloadTab();
    }
  });
}

function pararListeners(){
  if(unsubEnroladores)unsubEnroladores();
  if(unsubFichas)unsubFichas();
  if(unsubUsuarios)unsubUsuarios();
  unsubEnroladores=unsubFichas=unsubUsuarios=null;
}

// ── Auth state ───────────────────────────────────────────────────
document.getElementById('root').innerHTML=`<div class="loading"><div class="spinner"></div><div>Carregando...</div></div>`;

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    // Busca perfil do usuário no Firestore
    const snap=await getDocs(collection(db,'usuarios'));
    const uDoc=snap.docs.find(d=>d.data().uid===user.uid||d.data().email===user.email);
    if(uDoc){
      currentUserData={id:uDoc.id,...uDoc.data()};
    }else{
      // Primeiro acesso do admin: cria registro automaticamente
      currentUserData={id:'admin-temp',nome:user.email,perfil:'admin',email:user.email,uid:user.uid};
    }
    currentTab=can('verPainel')?'painel':'fichas';
    iniciarListeners();
    render();
  }else{
    currentUser=null;currentUserData=null;
    pararListeners();
    enroladores=[];fichas=[];usuarios=[];
    render();
  }
});
