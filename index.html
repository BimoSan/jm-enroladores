// ── Sistema Metalúrgica ──────────────────────────────────────────

function getQuinzena(dataStr){
  const d = dataStr || today();
  const dia = parseInt(d.slice(8,10));
  const anoMes = d.slice(0,7);
  return dia <= 15 ? `${anoMes}-Q1` : `${anoMes}-Q2`;
}

function getQuinzenaAtual(){ return getQuinzena(today()); }

function quinzenaLabel(q){
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [ano,mes,q12]=q.split('-');
  const mNome=MESES[parseInt(mes)-1];
  return q12==='Q1'?`1–15 ${mNome} ${ano}`:`16–fim ${mNome} ${ano}`;
}

function isSemana(dataStr){
  const hoje=new Date(today()+'T00:00:00');
  const d=new Date(dataStr+'T00:00:00');
  const diff=(hoje-d)/(1000*60*60*24);
  const diaSemana=hoje.getDay(); // 0=dom
  const inicioSemana=new Date(hoje); inicioSemana.setDate(hoje.getDate()-diaSemana);
  return d>=inicioSemana;
}

function apontSoldador(soldadorId){
  return apontamentosMetal.filter(a=>a.soldadorId===soldadorId);
}

function totalPecaPeriodo(soldadorId, pecaId, periodo){
  // periodo: 'hoje', 'semana', 'quinzena', 'mes', ou anoMes-Q1/Q2
  const hoje_=today();
  const qAtual=getQuinzenaAtual();
  const mesAtual=hoje_.slice(0,7);
  return apontSoldador(soldadorId).reduce((sum,a)=>{
    const data=a.data||'';
    const match = periodo==='hoje'      ? data===hoje_
                : periodo==='semana'    ? isSemana(data)
                : periodo==='quinzena'  ? getQuinzena(data)===qAtual
                : periodo==='mes'       ? data.slice(0,7)===mesAtual
                : getQuinzena(data)===periodo;
    return sum + (match ? (parseInt((a.pecas||{})[pecaId])||0) : 0);
  }, 0);
}

function totalGeralPeriodo(soldadorId, periodo){
  return PECAS_METAL_FULL.reduce((s,p)=>s+totalPecaPeriodo(soldadorId,p.id,periodo),0);
}

function calcGanhoSoldador(soldadorId, periodo){
  const s=soldadores.find(x=>x.id===soldadorId);
  if(!s) return 0;
  const vProd=configMetal.valoresProd||{};
  const vMeta=configMetal.valoresMeta||{};
  const vRef=configMetal.valoresRef||{};
  const metas=configMetal.metas||{};
  const hoje_=today();
  const qAtual=getQuinzenaAtual();

  if(s.contrato==='producao'){
    // Ganha por tudo que produzir: peças normais usam vProd, reformas usam vRef
    return PECAS_METAL_FULL.reduce((sum,p)=>{
      const qtd=totalPecaPeriodo(soldadorId,p.id,periodo);
      const val=p.reforma ? (parseFloat(vRef[p.id.replace('ref_','')])||0) : (parseFloat(vProd[p.id])||0);
      return sum+(qtd*val);
    },0);
  } else {
    // Fichado: excedente usa vMeta para peças, vRef para reformas
    const diasPeriodo=new Set(
      apontSoldador(soldadorId)
        .filter(a=>{
          const data=a.data||'';
          return periodo==='hoje'     ? data===hoje_
               : periodo==='semana'   ? isSemana(data)
               : periodo==='quinzena' ? getQuinzena(data)===qAtual
               : periodo==='mes'      ? data.slice(0,7)===hoje_.slice(0,7)
               : /^\d{4}-\d{2}-\d{2}$/.test(periodo) ? data===periodo
               : getQuinzena(data)===periodo;
        })
        .map(a=>a.data)
    );
    let totalGanho=0;
    diasPeriodo.forEach(dia=>{
      const apDia=apontSoldador(soldadorId).filter(a=>a.data===dia);

      // Reformas: sempre pagar tudo
      PECAS_METAL_FULL.filter(p=>p.reforma).forEach(p=>{
        const qtd=apDia.reduce((s,a)=>s+(parseInt((a.pecas||{})[p.id])||0),0);
        if(!qtd) return;
        const val=parseFloat(vRef[p.id.replace('ref_','')])||0;
        totalGanho+=qtd*val;
      });

      // Peças normais do dia com produção
      const ehSabadoDia=new Date(dia+'T12:00:00').getDay()===6;
      const pecaBaseDefinida=apDia.map(a=>a.pecaBase).find(pb=>pb&&pb!=='');
      const modoCalculo=apDia.find(a=>a.modoCalculo)?.modoCalculo||'normal';

      const pecasDia=PECAS_METAL_FULL.filter(p=>!p.reforma).map(p=>({
        id:p.id,
        qtd:apDia.reduce((s,a)=>s+(parseInt((a.pecas||{})[p.id])||0),0),
        meta:ehSabadoDia?Math.round((parseInt(metas[p.id])||0)/2):(parseInt(metas[p.id])||0),
        val:parseFloat(vMeta[p.id])||parseFloat(vProd[p.id])||0,
      })).filter(p=>p.qtd>0);

      if(!pecasDia.length) return;

      // ── Feriado: tudo como produção ──────────────────────────────
      if(modoCalculo==='feriado'||modoCalculo==='prod'){
        pecasDia.forEach(p=>{ totalGanho+=p.qtd*p.val; });
        return;
      }

      // ── Normal (1 peça) ou Conjunta ──────────────────────────────
      const conjunta=modoCalculo==='conjunta';
      const comMeta=pecasDia.filter(p=>p.meta>0);

      if(!comMeta.length){
        // Sem metas definidas: paga tudo
        pecasDia.forEach(p=>{ totalGanho+=p.qtd*p.val; });
        return;
      }

      if(!conjunta||pecasDia.length===1){
        // Normal: verifica se bateu meta
        const bateu=pecasDia.some(p=>p.meta>0&&p.qtd>=p.meta);
        if(bateu){
          pecasDia.forEach(p=>{
            const exc=p.meta>0&&p.qtd>=p.meta?p.qtd-p.meta:p.qtd;
            totalGanho+=exc*p.val;
          });
        }
        // Se não bateu: não ganha nada
        return;
      }

      // ── Conjunta: 2 peças ────────────────────────────────────────
      if(comMeta.length===2){
        const [p1,p2]=comMeta;
        const meta1Atingida=p1.qtd>=p1.meta;
        const meta2Atingida=p2.qtd>=p2.meta;
        const meiaM1=p1.qtd>=(p1.meta/2);
        const meiaM2=p2.qtd>=(p2.meta/2);

        let diaLiberado=false;
        if(meta1Atingida||meta2Atingida){
          diaLiberado=true;
        } else if(meiaM1&&meiaM2){
          diaLiberado=true;
        }

        if(diaLiberado){
          pecasDia.forEach(p=>{
            const metaP=comMeta.find(c=>c.id===p.id);
            if(!metaP){totalGanho+=p.qtd*p.val;return;}
            // Se bateu meta completa: excedente da meta
            // Se só bateu meia meta: excedente da meia meta
            const limiar=metaP.qtd>=metaP.meta?metaP.meta:Math.ceil(metaP.meta/2);
            const exc=Math.max(0,p.qtd-limiar);
            totalGanho+=exc*p.val;
          });
        }
        // Se não liberado: não ganha nada
        return;
      }

      // ── Conjunta: 3+ peças ──────────────────────────────────────
      const bateuAlguma=comMeta.some(p=>p.qtd>=p.meta);
      const atingiramMeiaM=comMeta.filter(p=>p.qtd>=(p.meta/2));

      if(bateuAlguma){
        // Pelo menos uma bateu meta completa → excedente da meta em produção
        pecasDia.forEach(p=>{
          const metaP=comMeta.find(c=>c.id===p.id);
          const exc=metaP&&metaP.qtd>=metaP.meta?Math.max(0,p.qtd-metaP.meta):p.qtd;
          totalGanho+=exc*p.val;
        });
        return;
      }

      if(atingiramMeiaM.length>=2){
        // Pelo menos 2 atingiram meia meta → excedente da meia meta em produção
        pecasDia.forEach(p=>{
          const metaP=comMeta.find(c=>c.id===p.id);
          const meiaMetaP=metaP?Math.ceil(metaP.meta/2):0;
          const exc=Math.max(0,p.qtd-meiaMetaP);
          totalGanho+=exc*p.val;
        });
        return;
      }

      // Menos de 2 atingiram meia meta → equivalência com peça base
      let principal=pecaBaseDefinida?comMeta.find(p=>p.id===pecaBaseDefinida):null;
      if(!principal){
        const ordenadas=[...comMeta].sort((a,b)=>((a.meta-a.qtd)/a.meta)-((b.meta-b.qtd)/b.meta));
        principal=ordenadas[0];
      }
      let valorFaltando=(principal.meta-principal.qtd)*principal.val;
      const secundarias=comMeta.filter(p=>p.id!==principal.id);
      const pagavel={};
      pecasDia.forEach(p=>{ pagavel[p.id]=0; });
      for(const sec of secundarias){
        if(valorFaltando<=0) break;
        if(!sec.val) continue;
        const qtdDescontar=Math.min(sec.qtd,Math.ceil(valorFaltando/sec.val));
        valorFaltando-=qtdDescontar*sec.val;
        pagavel[sec.id]=Math.max(0,sec.qtd-qtdDescontar);
      }
      if(valorFaltando<=0.001){
        secundarias.forEach(sec=>{ totalGanho+=pagavel[sec.id]*sec.val; });
      }
    });
    return totalGanho;
  }
}

// ── Alerta de casas sem retorno ──────────────────────────────────
function diasSemRetorno(enroladorId){
  // Pega fichas abertas com peças pendentes
  const fichasEnr=fichas.filter(f=>f.enroladorId===enroladorId&&f.status==='aberta'&&pendentes(f)>0);
  if(!fichasEnr.length) return null;

  // Referência: último recolhimento ou, se nunca houve recolhimento, a primeira entrega
  let dataRef=null;
  fichasEnr.forEach(f=>{
    // Verificar último recolhimento
    (f.recolhimentos||[]).forEach(r=>{
      if(r.data&&(!dataRef||r.data>dataRef)) dataRef=r.data;
    });
    // Se não há recolhimento, usar a data da primeira entrega
    if(!(f.recolhimentos||[]).length){
      (f.entregas||[]).forEach(e=>{
        if(e.data&&(!dataRef||e.data<dataRef)) dataRef=e.data;
      });
    }
  });

  if(!dataRef) return null;
  const diff=Math.floor((new Date(today()+'T00:00:00')-new Date(dataRef+'T00:00:00'))/(1000*60*60*24));
  return diff>=0?diff:null;
}

          <div style="display:flex;align-items:center;gap:6px">

            ${p.reforma?'<span style="font-size:9px;background:#ede9fe;color:#7c3aed;padding:1px 5px;border-radius:99px;font-weight:600">reforma</span>':''}
          </div>
          <div style="text-align:right">
            <span style="font-size:14px;font-weight:800;color:${cor}">${qtd}</span>
            ${meta>0?`<span style="font-size:10px;color:#94a3b8"> / ${meta}</span>`:''}

          <div style="height:100%;width:${pct}%;background:${cor};border-radius:99px"></div>
        </div>
      </div>`;
    }).join('');

    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${pecasHoje.length?'12px':'0'}">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">${initials(sol.nome)}</div>
          <div>
            <div style="font-size:14px;font-weight:700">${sol.nome}</div>
            <div style="font-size:11px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'} · ${totalSol} peças hoje</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:#64748b">ganho hoje</div>
          <div style="font-size:18px;font-weight:800;color:#059669">${fmtR(ganhoHoje)}</div>
        </div>
      </div>
      ${pecasHoje.length?`<div>${barras}</div>`:'<div style="font-size:12px;color:#94a3b8;text-align:center;padding:8px 0">Nenhum apontamento hoje</div>'}
    </div>`;
  }).join('');

  return html;
}

// ── Apontamento metalúrgica ───────────────────────────────────────
function renderApontar(){
  if(!window._apSolSel) window._apSolSel='';
  const solSel=window._apSolSel;
  const sol=soldadores.find(s=>s.id===solSel);
  const isFichado=sol?.contrato==='fichado';

  // ── Step 1: Selecionar soldador ──────────────────────────────────
  const solOrdenados=[...soldadores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  let html='<div class="card" style="margin-bottom:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">👷 Soldador</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  solOrdenados.forEach(s=>{
    const sel=s.id===solSel;
    const ci=soldadores.findIndex(x=>x.id===s.id);
    const c=avatarColor(ci);
    html+='<button onclick="window._apSelSol(\''+s.id+'\')" style="padding:12px 8px;border-radius:12px;border:2px solid '+(sel?c:'#e2e8f0')+';background:'+(sel?c+'22':'#fff')+';cursor:pointer;text-align:center">'
      +'<div style="font-size:22px;font-weight:800;color:'+c+';margin-bottom:2px">'+initials(s.nome)+'</div>'
      +'<div style="font-size:12px;font-weight:700;color:'+(sel?c:'#374151')+'">'+s.nome+'</div>'
      +'<div style="font-size:10px;color:#94a3b8">'+( s.contrato==='producao'?'Produção':'Fichado')+'</div>'
      +'</button>';
  });
  html+='</div></div>';

  if(!solSel) return html+'<div style="text-align:center;color:#94a3b8;padding:16px;font-size:13px">Selecione um soldador para registrar.</div>'
    +'<div class="section-label" style="margin-top:16px">Histórico de hoje</div>'+_renderHistoricoMetal();

  // ── Step 2: Data ─────────────────────────────────────────────────
  html+='<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#475569;flex-shrink:0">📅 Data</div>'
    +'<input type="date" id="ap-data" value="'+today()+'" style="flex:1;font-size:14px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 10px">'
    +'</div>';

  // ── Step 3: Peças (grupos) ───────────────────────────────────────
  const pecasNormais=PECAS_METAL_FULL.filter(p=>!p.reforma);
  const pecasReforma=PECAS_METAL_FULL.filter(p=>p.reforma);

  const renderGrupoPecas=(pecas,cor)=>{
    return pecas.map(p=>{
      return '<div style="background:#f8fafc;border-radius:10px;padding:8px">'
        +'<div style="font-size:10px;color:'+cor+';font-weight:700;margin-bottom:6px;line-height:1.3">'+p.label+'</div>'
        +'<div style="display:flex;align-items:center;gap:4px">'
        +'<button onclick="window._apDec(\''+p.id+'\')" style="width:30px;height:30px;border-radius:50%;background:#e2e8f0;border:none;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1">−</button>'
        +'<input type="number" id="ap-'+p.id+'" min="0" placeholder="0" onfocus="this.select()" style="flex:1;text-align:center;font-size:16px;font-weight:800;border:2px solid #e2e8f0;border-radius:8px;padding:4px 2px;min-width:0;width:100%">'
        +'<button onclick="window._apInc(\''+p.id+'\')" style="width:30px;height:30px;border-radius:50%;background:'+cor+';border:none;font-size:16px;font-weight:700;cursor:pointer;color:#fff;flex-shrink:0;line-height:1">+</button>'
        +'</div>'
        +'</div>';
    }).join('');
  };

  html+='<div class="card" style="margin-bottom:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">🔧 Peças normais</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px">'+renderGrupoPecas(pecasNormais,'#1e40af')+'</div>'
    +'</div>';

  html+='<div class="card" style="margin-bottom:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#7c3aed;margin-bottom:10px">🔄 Reformas</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px">'+renderGrupoPecas(pecasReforma,'#7c3aed')+'</div>'
    +'</div>';

  // ── Step 4: Opções (fichado) ─────────────────────────────────────
  if(isFichado){
    const modoAtual=window._apontModo||'normal';
    const btnModo=(v,icon,label,cor,bg,bord)=>{
      const ativo=modoAtual===v;
      return '<button onclick="window._setApontModo(\''+v+'\')" style="flex:1;padding:10px;border-radius:10px;border:2px solid '+(ativo?bord:'#e2e8f0')+';background:'+(ativo?bg:'#fff')+';color:'+(ativo?cor:'#64748b')+';font-size:12px;font-weight:700;cursor:pointer">'+icon+' '+label+'</button>';
    };
    html+='<div class="card" style="margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">⚙️ Tipo de produção</div>'
      +'<div style="display:flex;gap:6px;margin-bottom:10px">'
      +btnModo('normal','⚒️','Normal','#065f46','#f0fdf4','#059669')
      +btnModo('feriado','🏖️','Feriado','#92400e','#fef3c7','#f59e0b')
      +'</div>'
      +(modoAtual==='feriado'
        ?'<div style="background:#fef3c7;border-radius:10px;padding:8px 12px;font-size:11px;color:#92400e">Tudo pago como produção, sem meta.</div>'
        :'<div style="background:#f0fdf4;border-radius:10px;padding:8px 12px;font-size:11px;color:#065f46">Normal ou conjunta detectado automaticamente pelo nº de peças. Sábado: meta pela metade.</div>')
      +'</div>';
  }

  // ── Botão salvar ─────────────────────────────────────────────────
  html+='<button onclick="window._registrarApontMetal()" style="width:100%;padding:18px;background:#1e40af;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:16px">✓ Registrar produção</button>';

  // ── Histórico ────────────────────────────────────────────────────
  html+='<div class="section-label">Histórico de hoje</div>'+_renderHistoricoMetal();

  return html;
}

function _renderHistoricoMetal(){
  const historico=[...apontamentosMetal].sort((a,b)=>b.criadoEm>a.criadoEm?1:-1).slice(0,30);
  if(!historico.length) return '<div class="card"><div style="color:#94a3b8;text-align:center;padding:16px;font-size:13px">Nenhum apontamento registrado ainda.</div></div>';
  return historico.map(a=>{
    const sol=soldadores.find(s=>s.id===a.soldadorId);
    const totalPecas=Object.values(a.pecas||{}).reduce((s,v)=>s+(parseInt(v)||0),0);
    const resumo=PECAS_METAL_FULL.filter(p=>(a.pecas||{})[p.id]>0)
      .map(p=>'<span style="font-size:10px;background:'+(p.reforma?'#ede9fe':'#f1f5f9')+';color:'+(p.reforma?'#7c3aed':'#475569')+';padding:2px 7px;border-radius:99px;display:inline-block;margin:1px">'+p.label+': '+a.pecas[p.id]+'</span>')
      .join('');
    const ci=soldadores.findIndex(s=>s.id===a.soldadorId);
    const c=avatarColor(ci);
    const baseLabel=a.pecaBase?(PECAS_METAL_FULL.find(p=>p.id===a.pecaBase)?.label||''):'';
    const modoLabel=a.modoCalculo==='conjunta'?'🔗 Conjunta':a.modoCalculo==='feriado'?'🏖️ Feriado':'⚒️ Normal';

    // Status do dia
    const metas_=configMetal.metas||{};
    const vMeta_=configMetal.valoresMeta||{};
    const vProd_=configMetal.valoresProd||{};
    const ehSab=new Date((a.data||today())+'T12:00:00').getDay()===6;
    const pecasAp=PECAS_METAL_FULL.filter(p=>!p.reforma&&(a.pecas||{})[p.id]>0).map(p=>({
      id:p.id,qtd:parseInt((a.pecas||{})[p.id])||0,
      meta:ehSab?Math.round((parseInt(metas_[p.id])||0)/2):(parseInt(metas_[p.id])||0),
    }));
    let statusMsg='';
    if(a.modoCalculo==='feriado'||a.modoCalculo==='prod'){
      statusMsg='<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:99px;font-weight:700">🏖️ Feriado — produção liberada</span>';
    } else if(a.modoCalculo==='conjunta'&&pecasAp.length===2){
      const [pa,pb]=pecasAp;
      const m1=pa.meta,m2=pb.meta;
      if(pa.qtd>=m1||pb.qtd>=m2){
        statusMsg='<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✅ Meta atingida — produção liberada</span>';
      } else if(pa.qtd>=(m1/2)&&pb.qtd>=(m2/2)){
        statusMsg='<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✅ Meia meta atingida — produção liberada</span>';
      } else {
        statusMsg='<span style="font-size:10px;background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:99px;font-weight:700">❌ Meta não atingida</span>';
      }
    } else if(a.modoCalculo==='conjunta'&&pecasAp.length>=3){
      const comMetaAp=pecasAp.filter(p=>p.meta>0);
      const bateu=comMetaAp.some(p=>p.qtd>=p.meta);
      const meiaCount=comMetaAp.filter(p=>p.qtd>=(p.meta/2)).length;
      if(bateu){
        statusMsg='<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✅ Meta atingida — produção liberada</span>';
      } else if(meiaCount>=2){
        statusMsg='<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✅ Meia meta (2+ peças) — produção liberada</span>';
      } else {
        statusMsg='<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:99px;font-weight:700">⚖️ Equivalência aplicada</span>';
      }
    } else if(a.modoCalculo!=='conjunta'){
      const bateu=pecasAp.some(p=>p.meta>0&&p.qtd>=p.meta);
      if(pecasAp.some(p=>p.meta>0)){
        statusMsg=bateu
          ?'<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✅ Meta atingida</span>'
          :'<span style="font-size:10px;background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:99px;font-weight:700">❌ Meta não atingida</span>';
      }
    }
    return '<div class="card" style="margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div style="width:38px;height:38px;border-radius:50%;background:'+c+'22;color:'+c+';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">'+initials(sol?.nome||'?')+'</div>'
      +'<div>'
      +'<div style="font-size:13px;font-weight:700">'+(sol?.nome||'Desconhecido')+'</div>'
      +'<div style="font-size:11px;color:#64748b">'+fmtDate(a.data)+' · '+totalPecas+' peças · '+modoLabel+(baseLabel?' · Base: <strong>'+baseLabel+'</strong>':'')+'</div>'+(statusMsg?'<div style="margin-top:3px">'+statusMsg+'</div>':'')
      +'</div></div>'
      +'<div style="display:flex;gap:6px">'
      +'<button class="btn btn-sm btn-warn" onclick="window._editarApontMetal(\''+a.id+'\')">Editar</button>'
      +'<button class="btn btn-sm btn-danger" onclick="window._excluirApontMetal(\''+a.id+'\')">Excluir</button>'
      +'</div></div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:2px">'+( resumo||'<span style="font-size:11px;color:#94a3b8">Nenhuma peça</span>')+'</div>'
      +'</div>';
  }).join('');
}


window._apSelSol=function(id){
  window._apSolSel=id;
  window._apontModo='meta';
  reloadTab();
};
window._apInc=function(id){
  const el=document.getElementById('ap-'+id);
  if(el) el.value=Math.max(0,(parseInt(el.value)||0)+1);
};
window._apDec=function(id){
  const el=document.getElementById('ap-'+id);
  if(el) el.value=Math.max(0,(parseInt(el.value)||0)-1);
};
window._registrarApontMetal=async()=>{
  const soldadorId=window._apSolSel;
  const data=document.getElementById('ap-data')?.value;
  if(!soldadorId||!data){showToast('Selecione o soldador e a data.');return;}
  const pecas={};
  let totalPecas=0;
  PECAS_METAL_FULL.forEach(p=>{
    const v=parseInt(document.getElementById('ap-'+p.id)?.value)||0;
    if(v>0){pecas[p.id]=v;totalPecas+=v;}
  });
  if(!totalPecas){showToast('Informe pelo menos uma peça.');return;}
  const sol=soldadores.find(s=>s.id===soldadorId);
  const pecasNormaisCount=PECAS_METAL_FULL.filter(p=>!p.reforma&&(parseInt(document.getElementById('ap-'+p.id)?.value)||0)>0).length;
  const modoBase=window._apontModo||'normal';
  const modoCalculo=modoBase==='feriado'?'feriado':(pecasNormaisCount>1?'conjunta':'normal');
  const pecaBase=(modoCalculo==='conjunta')?(document.getElementById('ap-peca-base')?.value||''):'';
  await addDoc(collection(db,'apontamentos_metal'),{soldadorId,data,pecas,modoCalculo,pecaBase,criadoEm:new Date().toISOString()});
  showToast('Produção registrada!');
  PECAS_METAL_FULL.forEach(p=>{const el=document.getElementById('ap-'+p.id);if(el)el.value='';});
  const pbEl=document.getElementById('ap-peca-base');if(pbEl)pbEl.value='';
  window._setApontModo('meta');
};
window._limparApontMetal=()=>{
  PECAS_METAL_FULL.forEach(p=>{const el=document.getElementById('ap-'+p.id);if(el)el.value='';});
  window._setApontModo('meta');
};

window._apontModo='normal';

window._setApontModo=function(modo){
  window._apontModo=modo;
  reloadTab();
};

window._apontSoldadorChange=function(){
  const id=document.getElementById('ap-soldador')?.value;
  const s=soldadores.find(x=>x.id===id);
  const container=document.getElementById('ap-modo-container');
  if(container) container.style.display=(s&&s.contrato==='fichado')?'block':'none';
  const pbContainer=document.getElementById('ap-peca-base-container');
  if(pbContainer) pbContainer.style.display=(s&&s.contrato==='fichado')?'block':'none';
  window._setApontModo('meta');
};

window._excluirFicha=async function(id){
  if(!confirm('Excluir esta ficha permanentemente? Esta ação não pode ser desfeita.')) return;
  await deleteDoc(doc(db,'fichas',id));
  showToast('Ficha excluída.');
};

window._excluirApontMetal=id=>{
  showModal('Excluir apontamento',
    '<div style="font-size:13px;color:#444">Excluir este registro de produção? Esta ação não pode ser desfeita.</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-danger btn-sm" onclick="window._confirmarExcluirApoint(&quot;'+id+'&quot;)">Excluir</button>');
};
window._confirmarExcluirApoint=async id=>{
  closeModal();
  await deleteDoc(doc(db,'apontamentos_metal',id));
  showToast('Apontamento excluído.');
};

window._editarApontMetal=id=>{

    .map(s=>'<option value="'+s.id+'"'+(s.id===a.soldadorId?' selected':'')+'>'+s.nome+'</option>').join('');
  const grid=PECAS_METAL_FULL.map(p=>{
    const val=(a.pecas||{})[p.id]||0;
    return '<div class="num-group">'
      +'<label style="font-size:10px;'+(p.reforma?'color:#7c3aed':'')+'">'+(p.label)+'</label>'
      +'<input type="number" id="ea-'+p.id+'" min="0" step="1" value="'+val+'"'
      +' style="font-size:12px;border:1px solid #e2e8f0;border-radius:8px;padding:5px 6px;text-align:center;font-family:Nunito,sans-serif;width:100%">'
      +'</div>';

    +'<div class="form-group"><label>Data</label><input type="date" id="ea-data" value="'+a.data+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'</div>'
    +(sol&&sol.contrato==='fichado'?(()=>{
      const mc=a.modoCalculo||'normal';
      const btnEa=(v,icon,label,cor,bg,bord)=>{
        const ativo=mc===v;
        return '<button id="ea-modo-'+v+'" onclick="window._setEaModo(\''+v+'\')" style="flex:1;padding:8px;border-radius:8px;border:2px solid '+(ativo?bord:'#e2e8f0')+';background:'+(ativo?bg:'#fff')+';color:'+(ativo?cor:'#64748b')+';font-size:11px;font-weight:700;cursor:pointer">'+icon+' '+label+'</button>';
      };
      return '<div style="margin-bottom:12px">'
        +'<div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:6px">Tipo de produção</div>'
        +'<div style="display:flex;gap:6px;margin-bottom:10px">'
        +btnEa('normal','⚒️','Normal','#065f46','#f0fdf4','#059669')
        +btnEa('feriado','🏖️','Feriado','#92400e','#fef3c7','#f59e0b')
        +'</div>'
        +'<div id="ea-peca-base-container" style="display:'+(mc==='conjunta'?'block':'none')+'">'
        +'<div style="font-size:11px;color:#64748b;margin-bottom:6px">Peça base (para 3+ peças)</div>'
        +'<select id="ea-peca-base" style="width:100%;font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 10px">'
        +'<option value="">— Automático —</option>'
        +PECAS_METAL_FULL.filter(p=>!p.reforma).map(p=>'<option value="'+p.id+'"'+(a.pecaBase===p.id?' selected':'')+'>'+p.label+'</option>').join('')
        +'</select></div>'
        +'</div>';
    })():'')
    +'<div style="font-size:10px;font-weight:600;color:#64748b;margin-bottom:8px">PEÇAS PRODUZIDAS</div>'
    +'<div class="num-inputs">'+grid+'</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarEdicaoApoint(&quot;'+id+'&quot;)">Salvar</button>',
    true);
};

window._setEaModo=function(modo){
  window._eaModo=modo;
  ['normal','conjunta','feriado'].forEach(m=>{
    const el=document.getElementById('ea-modo-'+m);
    if(!el) return;
    const ativo=m===modo;
    const cols={normal:['#065f46','#f0fdf4','#059669'],conjunta:['#1e40af','#eff6ff','#1d4ed8'],feriado:['#92400e','#fef3c7','#f59e0b']};
    const [cor,bg,bord]=cols[m];
    el.style.border='2px solid '+(ativo?bord:'#e2e8f0');
    el.style.background=ativo?bg:'#fff';

// ── Configurações metalúrgica ─────────────────────────────────────
function renderPontoMetal(){
  if(!window._pontoMes) window._pontoMes=today().slice(0,7);
  const podeEditar=['admin','encarregado_cad','apontador_metal'].includes(currentUserData?.perfil);
  const mes=window._pontoMes;
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;
  const diasNoMes=new Date(parseInt(ano),parseInt(m),0).getDate();
  const STATUS={P:'Presente',F:'Falta',FJ:'Falta Just.',M:'Meio Período',FO:'Folga'};
  const COR_STATUS={P:'#059669',F:'#dc2626',FJ:'#d97706',M:'#3b82f6',FO:'#8b5cf6'};
  const BG_STATUS={P:'#f0fdf4',F:'#fef2f2',FJ:'#fefce8',M:'#eff6ff',FO:'#f5f3ff'};

  // Funções helpers
  function getRegistro(funcId, data){
    return pontoRegistros.find(r=>r.funcId===funcId&&r.data===data)||null;
  }

  // Meses disponíveis (navegação)
  const mesAnterior=new Date(parseInt(ano),parseInt(m)-2,1).toISOString().slice(0,7);
  const mesSeguinte=new Date(parseInt(ano),parseInt(m),1).toISOString().slice(0,7);
  const hoje_=today();

  // Header
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-ghost btn-sm" onclick="window._pontoMes='${mesAnterior}';reloadTab()">←</button>
      <div style="font-size:16px;font-weight:700">${mesNome}</div>
      <button class="btn btn-ghost btn-sm" onclick="window._pontoMes='${mesSeguinte}';reloadTab()">→</button>
    </div>
    <div style="display:flex;gap:8px">
      ${podeEditar?'<button class="btn btn-primary btn-sm" onclick="window._abrirNovoPontoFunc()">+ Funcionário</button>':''}
    </div>
  </div>`;

  if(!pontoFuncionarios.length){
    return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhum funcionário cadastrado. Clique em "+ Funcionário" para adicionar.</div></div>';
  }

  // Legenda
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">'
    +[...Object.entries(STATUS),['FNR','Domingo Perdido']].map(([k,v])=>'<span style="font-size:11px;background:'+(k==='FNR'?'#fecaca':BG_STATUS[k])+';color:'+(k==='FNR'?'#dc2626':COR_STATUS[k])+';padding:3px 10px;border-radius:99px;font-weight:600">'+k+' = '+v+'</span>').join('')
    +'</div>';

  // Tabela
  const dias=[];
  for(let d=1;d<=diasNoMes;d++){
    const dt=ano+'-'+m.padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dow=new Date(dt+'T12:00:00').getDay();
    dias.push({d,dt,dow,isDom:dow===0,isSab:dow===6,isFds:dow===0,isHoje:dt===hoje_});
  }

  html+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    +'<table class="ponto-tabela" style="width:100%;border-collapse:collapse;min-width:600px;font-size:12px">'
    +'<thead><tr style="background:#1e293b;color:#fff">'
    +'<th style="padding:8px 12px;text-align:left;position:sticky;left:0;background:#1e293b;min-width:120px">Funcionário</th>'
    +dias.map(({d,dt,dow,isDom,isSab,isFds,isHoje})=>{
      const nm=['D','S','T','Q','Q','S','S'][dow];
      return '<th style="padding:6px 4px;text-align:center;min-width:32px;'+(isHoje?'background:#3b82f6;':isDom?'background:#374151;':isSab?'background:#475569;':'')+'">'+
        '<div style="font-size:9px;opacity:.7">'+nm+'</div>'+
        '<div>'+d+'</div></th>';
    }).join('')
    +'<th style="padding:8px 6px;text-align:center;min-width:50px">Faltas</th>'
    +'<th style="padding:8px 6px;text-align:center;min-width:50px">H.Extra</th>'
    +'</tr></thead><tbody>'
    +pontoFuncionarios.map((func,fi)=>{
      let totalFaltas=0; let totalHExtra=0;
      const cells=dias.map(({d,dt,dow,isDom,isSab,isFds})=>{
        const reg=getRegistro(func.id,dt);
        let status=reg?.status||(isDom?'FO':'');
        const hExtra=reg?.horasExtra||0;
        if(status==='F'||status==='FJ'||status==='M') totalFaltas+=(status==='M'?0.5:1);
        totalHExtra+=hExtra;
        // Verificar se é domingo perdido
        let domPerdido=false;
        if(dow===0&&!reg?.status){
          for(let i=1;i<=6;i++){
            const prev=new Date(dt+'T12:00:00');prev.setDate(prev.getDate()-i);
            const prevDt=prev.toISOString().slice(0,10);
            if(prevDt.slice(0,7)!==mes) continue;
            const pr=getRegistro(func.id,prevDt);
            if(pr?.status==='F'){domPerdido=true;break;} // FJ não perde o domingo
          }
          if(domPerdido) status='FNR';
        }
        const COR_EXT={...COR_STATUS,FNR:'#dc2626'};
        const BG_EXT={...BG_STATUS,FNR:'#fecaca'};
        const cor=COR_EXT[status]||'#94a3b8';
        const bg=BG_EXT[status]||(isSab?'#f8f9fa':'transparent');
        return '<td style="padding:3px 2px;text-align:center;background:'+bg+';cursor:pointer" onclick="window._abrirEditPonto(\''+func.id+'\',\''+dt+'\')" title="'+func.nome+' - '+dt+(hExtra?' | '+hExtra+'h extra':'')+'">'
          +'<div style="font-size:11px;font-weight:700;color:'+cor+'">'+(status||'·')+'</div>'
          +(hExtra?'<div style="font-size:8px;color:#3b82f6">+'+hExtra+'h</div>':'')
          +'</td>';
      }).join('');
      return '<tr style="'+(fi%2?'background:#f8fafc;':'background:#fff;')+'">'
        +'<td class="ponto-nome" style="padding:8px 12px;font-weight:600;position:sticky;left:0;background:'+(fi%2?'#f8fafc':'#fff')+';border-right:1px solid #e2e8f0">'
        +'<div>'+func.nome+'</div>'
        +(func.cargo?'<div style="font-size:10px;color:#64748b">'+func.cargo+'</div>':'')
        +'</td>'
        +cells
        +'<td style="padding:6px;text-align:center;font-weight:700;color:'+(totalFaltas>0?'#dc2626':'#059669')+'">'+totalFaltas+'</td>'
        +'<td style="padding:6px;text-align:center;font-weight:700;color:'+(totalHExtra>0?'#3b82f6':'#94a3b8')+'">'+totalHExtra+'h</td>'
        +'</tr>';
    }).join('')
    +'</tbody></table></div>';

  // Calcular domingos perdidos por funcionário
  // Regra: se tiver F ou FJ em qualquer dia da semana (seg-sab), perde o domingo daquela semana
  function domingosPerdidos(funcId){
    const domingos=[];
    for(let d=1;d<=diasNoMes;d++){
      const dt=ano+'-'+m.padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(new Date(dt+'T12:00:00').getDay()!==0) continue;
      // Verificar seg-sab da semana (os 6 dias anteriores)
      let temFalta=false;
      for(let i=1;i<=6;i++){
        const prev=new Date(dt+'T12:00:00');
        prev.setDate(prev.getDate()-i);
        const prevDt=prev.toISOString().slice(0,10);
        // só conta dias do mesmo mês
        if(prevDt.slice(0,7)!==mes) continue;
        const reg=getRegistro(funcId,prevDt);
        if(reg?.status==='F'){temFalta=true;break;} // FJ não perde o domingo
      }
      if(temFalta) domingos.push(dt);
    }
    return domingos;
  }

  // Resumo
  html+='<div class="section-label" style="margin-top:16px">Resumo do mês</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">'
    +pontoFuncionarios.map(func=>{
      let faltas=0; let hExtra=0; let presencas=0;
      for(let d=1;d<=diasNoMes;d++){
        const dt=ano+'-'+m.padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const dow=new Date(dt+'T12:00:00').getDay();
        if(dow===0||dow===6) continue;
        const reg=getRegistro(func.id,dt);
        const s=reg?.status;
        if(s==='F'||s==='FJ') faltas++;
        else if(s==='M') faltas+=0.5;
        else if(s==='P') presencas++;
        hExtra+=reg?.horasExtra||0;
      }
      const domPerds=domingosPerdidos(func.id);
      return '<div class="card" style="padding:12px">'
        +'<div style="font-size:13px;font-weight:700;margin-bottom:8px">'+func.nome+'</div>'
        +(func.cargo?'<div style="font-size:10px;color:#64748b;margin-bottom:8px">'+func.cargo+'</div>':'')
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">'
        +'<span style="color:#64748b">Presenças</span><span style="font-weight:700;color:#059669">'+presencas+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">'
        +'<span style="color:#64748b">Faltas</span><span style="font-weight:700;color:'+(faltas>0?'#dc2626':'#94a3b8')+'">'+faltas+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">'
        +'<span style="color:#64748b">Horas extra</span><span style="font-weight:700;color:'+(hExtra>0?'#3b82f6':'#94a3b8')+'">'+hExtra+'h</span></div>'
        +(domPerds.length?'<div style="margin-top:8px;background:#fef2f2;border-radius:8px;padding:8px">'
          +'<div style="font-size:11px;font-weight:700;color:#dc2626;margin-bottom:4px">⚠️ Domingos perdidos ('+domPerds.length+')</div>'
          +domPerds.map(dt=>{
            const d=new Date(dt+'T12:00:00');
            return '<div style="font-size:11px;color:#dc2626">'+d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')+'</div>';
          }).join('')
          +'</div>':'')
        +'</div>';
    }).join('')
    +'</div>';

  return html;
}

window._abrirEditPonto=(funcId,data)=>{
  const func=pontoFuncionarios.find(f=>f.id===funcId);
  if(!func) return;
  const reg=pontoRegistros.find(r=>r.funcId===funcId&&r.data===data)||{};
  const STATUS_LIST=[
    {k:'P',  v:'Presente',       cor:'#059669', bg:'#f0fdf4'},
    {k:'F',  v:'Falta',          cor:'#dc2626', bg:'#fef2f2'},
    {k:'FJ', v:'Falta Just.',    cor:'#d97706', bg:'#fefce8'},
    {k:'M',  v:'Meio Período',   cor:'#3b82f6', bg:'#eff6ff'},
    {k:'FO', v:'Folga',          cor:'#8b5cf6', bg:'#f5f3ff'},
  ];
  const statusAtual=reg.status||'P';
  const d=new Date(data+'T12:00:00');
  const nomeDia=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]+' '+data.split('-').reverse().join('/');
  const botoesStatus=STATUS_LIST.map(s=>{
    const ativo=statusAtual===s.k;
    return '<button id="peb-'+s.k+'" onclick="window._selecionarStatusPonto(this,this.dataset.k)" data-k="'+s.k+'"'
      +' style="flex:1;padding:8px 4px;border-radius:8px;border:2px solid '+(ativo?s.cor:'#e2e8f0')+';background:'+(ativo?s.bg:'#fff')+';color:'+(ativo?s.cor:'#64748b')+';font-size:11px;font-weight:700;cursor:pointer;transition:all .15s">'
      +'<div>'+s.k+'</div><div style="font-size:9px;font-weight:400">'+s.v+'</div></button>';
  }).join('');
  showModal(func.nome+' — '+nomeDia,
    '<div class="form-group"><label>Status</label>'
    +'<input type="hidden" id="pe-status" value="'+statusAtual+'">'
    +'<div style="display:flex;gap:6px;margin-top:4px">'+botoesStatus+'</div>'
    +'</div>'
    +'<div class="form-row" style="margin-top:12px">'
    +'<div class="form-group"><label>Horas extras</label><input id="pe-hextra" type="number" min="0" step="0.5" value="'+(reg.horasExtra||0)+'" onfocus="this.select()" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Observação</label><input id="pe-obs" value="'+(reg.obs||'')+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'

    +'<button class="btn btn-primary btn-sm" onclick="window._salvarPonto(\''+funcId+'\',\''+data+'\','+(reg.id?'\''+reg.id+'\'':'null')+')">Salvar</button>',true);
};

window._selecionarStatusPonto=function(btn,k){
  document.getElementById('pe-status').value=k;
  const STATUS_LIST=[
    {k:'P',cor:'#059669',bg:'#f0fdf4'},
    {k:'F',cor:'#dc2626',bg:'#fef2f2'},
    {k:'FJ',cor:'#d97706',bg:'#fefce8'},
    {k:'M',cor:'#3b82f6',bg:'#eff6ff'},
    {k:'FO',cor:'#8b5cf6',bg:'#f5f3ff'},
  ];
  STATUS_LIST.forEach(s=>{
    const b=document.getElementById('peb-'+s.k);
    if(!b) return;
    const ativo=s.k===k;
    b.style.border='2px solid '+(ativo?s.cor:'#e2e8f0');
    b.style.background=ativo?s.bg:'#fff';
    b.style.color=ativo?s.cor:'#64748b';
  });
};

window._salvarPonto=async(funcId,data,regId)=>{
  const status=document.getElementById('pe-status')?.value;
  const horasExtra=parseFloat(document.getElementById('pe-hextra')?.value)||0;
  const obs=document.getElementById('pe-obs')?.value||'';
  const dados={funcId,data,status,horasExtra,obs,atualizadoPor:currentUserData?.nome||''};
  if(regId){await updateDoc(doc(db,'ponto_registros',regId),dados);}
  else{await addDoc(collection(db,'ponto_registros'),dados);}
  closeModal();showToast('Ponto salvo!');

window._excluirPonto=async(regId)=>{

window._abrirRegistroPonto=()=>{
  const optsFunc=pontoFuncionarios.map(f=>'<option value="'+f.id+'">'+f.nome+'</option>').join('');
  const STATUS={P:'Presente',F:'Falta',FJ:'Falta Just.',M:'Meio Período',FO:'Folga'};
  const optsStatus=Object.entries(STATUS).map(([k,v])=>'<option value="'+k+'">'+k+' — '+v+'</option>').join('');

    +'<div class="form-group"><label>Status para todos</label><select id="pr-status" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">'+optsStatus+'</select></div>'
    +'<div style="font-size:12px;color:#475569;margin-top:8px">Desmarque quem não aplicar:</div>'
    +'<div style="max-height:180px;overflow-y:auto;margin-top:8px">'
    +pontoFuncionarios.map(f=>'<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px"><input type="checkbox" id="pr-func-'+f.id+'" checked> '+f.nome+'</label>').join('')
    +'</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarPontoLote()">Salvar</button>',true);
};

window._salvarPontoLote=async()=>{
  const data=document.getElementById('pr-data')?.value;
  const status=document.getElementById('pr-status')?.value;
  if(!data||!status){showToast('Preencha data e status.');return;}
  let count=0;
  for(const func of pontoFuncionarios){
    const cb=document.getElementById('pr-func-'+func.id);
    if(!cb?.checked) continue;
    const existing=pontoRegistros.find(r=>r.funcId===func.id&&r.data===data);
    const dados={funcId:func.id,data,status,horasExtra:0,obs:'',atualizadoPor:currentUserData?.nome||''};
    if(existing){await updateDoc(doc(db,'ponto_registros',existing.id),dados);}
    else{await addDoc(collection(db,'ponto_registros'),dados);}
    count++;
  }
  closeModal();showToast(count+' registros salvos!');
};

window._imprimirFicha=function(id, tipo){
  let titulo='', pessoa='', setor='', referencia='', valor=0, status='', dataPag='', linhas=[], obs='';

  if(tipo==='ficha'||tipo==='bonus'){
    // Busca na lista de pagamentos
    const todos=finPagamentosTodos();
    const p=todos.find(x=>x.id===id);
    if(!p) return;

    pessoa=p.pessoa;
    setor=p.setor;
    valor=p.valor;
    status=p.pago?'PAGO':'AGUARDANDO PAGAMENTO';
    dataPag=p.dataPagamento?p.dataPagamento.split('-').reverse().join('/'):'—';

    if(tipo==='bonus'){
      referencia='Bônus de produção — '+p.dataRef;
      linhas=[{desc:'Bônus por meta atingida ('+p.dataRef+')',valor:p.valor}];
    } else {
      const f=p.fichaObj;
      referencia='Ficha — Ref: '+(p.dataRef?p.dataRef.split('-').reverse().join('/'):'—');
      if(f){
        const isCancelada=f.status==='cancelada';
        const vals=getValoresPorFicha(f);
        TIPOS.forEach(t=>{
          const qtd=isCancelada?somaRecolPago(f,t.id):somaRecol(f,t.id);
          const val=parseFloat(vals[t.id])||0;
          if(qtd>0) linhas.push({desc:t.label,qtd,val,sub:qtd*val});
        });
        if(isCancelada) obs='Ficha cancelada por retirada em '+(f.dataCancelamento||'')+'.<br>Pagamento apenas pelas peças já enroladas.';
      }

  } else if(tipo==='quinzena'){

    pessoa=p.pessoa;
    setor=p.setor;
    valor=p.valor;
    status=p.pago?'PAGO':'AGUARDANDO PAGAMENTO';
    dataPag=p.dataPagamento?p.dataPagamento.split('-').reverse().join('/'):'—';
    referencia='Quinzena: '+p.dataRef;
    const f=p.fichaObj;
    if(f){
      const vProd=(configMetal||{}).valoresProd||{};

// ── Rotas ─────────────────────────────────────────────────────────
function renderCamRotas(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  if(!window._camRotaMes) window._camRotaMes=today().slice(0,7);
  const mes=window._camRotaMes;
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;

  const rotasMes=camRotas.filter(r=>(r.data||'').slice(0,7)===mes);
  const totalKm=rotasMes.reduce((s,r)=>s+(parseFloat(r.kmFinal||0)-parseFloat(r.kmInicial||0)),0);
  const totalGasto=rotasMes.reduce((s,r)=>s+rotaTotalCombustivel(r),0);

  function rotaTotalCombustivel(r){
    return (r.abastecimentos||[]).reduce((s,a)=>s+(parseFloat(a.totalPago)||0),0);
  }

  // Navegação de mês
  const mesAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mesProx=new Date(parseInt(ano),parseInt(m),1);
  const mesAntStr=mesAnt.getFullYear()+'-'+String(mesAnt.getMonth()+1).padStart(2,'0');
  const mesProxStr=mesProx.getFullYear()+'-'+String(mesProx.getMonth()+1).padStart(2,'0');

  let html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<button class="btn btn-ghost btn-sm" onclick="window._camNavMes(\'cam_rotas\',this.dataset.m)" data-m="'+mesAntStr+'">←</button>'
    +'<div style="font-size:16px;font-weight:700">'+mesNome+'</div>'
    +'<button class="btn btn-ghost btn-sm" onclick="window._camNavMes(\'cam_rotas\',this.dataset.m)" data-m="'+mesProxStr+'">→</button>'
    +'</div>'
    +(camPodeEditar()?'<button class="btn btn-primary" onclick="window._abrirNovaRota()">+ Nova rota</button>':'')
    +'</div>';

  // Stat cards
  const totalGastoMot=rotasMes.reduce((s,r)=>(r.abastecimentos||[]).reduce((ss,a)=>ss+(parseFloat(a.gastoMot)||0),s),0);
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#1e3a5f,#2563eb)"><div><div class="stat-label">Viagens no mês</div><div class="stat-value">'+rotasMes.length+'</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)"><div><div class="stat-label">Km rodados</div><div class="stat-value">'+totalKm.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)"><div><div class="stat-label">Gasto combustível</div><div class="stat-value" style="font-size:16px">'+fmtMoeda(totalGasto)+'</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#1e3a5f,#6366f1)"><div><div class="stat-label">Gasto motoristas</div><div class="stat-value" style="font-size:16px">'+fmtMoeda(totalGastoMot)+'</div></div></div>'
    +'</div>';

  if(!rotasMes.length){

        +'<td style="padding:7px 10px;text-align:right;font-weight:700;color:#2563eb">'+(kmRod>0?kmRod.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—')+'</td>'

        +(()=>{const gMot=(r.abastecimentos||[]).reduce((s,a)=>s+(parseFloat(a.gastoMot)||0),0);return '<td style="padding:7px 10px;text-align:right;color:#6366f1">'+(gMot>0?fmtMoeda(gMot):'—')+'</td>';})()

          const media=totalLitros>0&&kmRod2>0?(kmRod2/totalLitros):0;
          const meta=camGetVeiculo(r.veiculoId).metaKmL||0;
          const cor=!media?'#94a3b8':meta&&media<meta?'#dc2626':'#059669';
          const bg=!media?'#f1f5f9':meta&&media<meta?'#fef2f2':'#f0fdf4';
          return '<td style="padding:7px 10px;text-align:center">'+(media?'<span style="background:'+bg+';color:'+cor+';padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+media.toFixed(2)+' km/L</span>':'<span style="color:#94a3b8;font-size:11px">—</span>')+'</td>';
        })()
        +'<td style="padding:7px 10px;text-align:center"><span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+nPostos+'x</span></td>'
        +(camPodeEditar()?'<td style="padding:7px 10px;text-align:center;white-space:nowrap">'
        +'<button class="btn btn-sm btn-ghost" onclick="window._editarRota(this.dataset.id)" data-id="'+r.id+'" style="margin-right:4px">✏️</button>'

    +'<td colspan="2"></td>'
    +'</tr>'
    +'</tbody></table></div>';

  return html;
}

      +'<td style="padding:4px"><input id="abs-total-'+i+'" type="number" step="0.01" placeholder="Total R$" value="'+(a.totalPago||'')+'" onfocus="this.select()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:6px;padding:4px;width:100%"></td>'
      +'<td style="padding:4px"><input id="abs-gastoMot-'+i+'" type="number" step="0.01" placeholder="Gasto mot." value="'+(a.gastoMot||'')+'" onfocus="this.select()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:6px;padding:4px;width:100%"></td>'

    +'<div class="form-group"><label>Veículo</label><select id="rota-veiculo" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"><option value="">— Veículo —</option>'+optsV+'</select></div>'

    +'<th style="padding:6px 8px">R$/L</th>'
    +'<th style="padding:6px 8px">Litros</th>'
    +'<th style="padding:6px 8px">Total R$</th>'
    +'<th style="padding:6px 8px">Gasto mot.</th>'
    +'<th style="padding:6px 8px"></th>'
    +'</tr></thead>'
    +'<tbody id="abs-tbody">'+abs.map((a,i)=>rowAbs(a,i)).join('')+'</tbody>'
    +'</table></div>'
    +'<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="window._adicionarAbsRow()">+ Adicionar posto</button>';

    +(edit?'<button class="btn btn-danger btn-sm" onclick="window._excluirRota(\''+r.id+'\',true)">Excluir</button>':'')
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarRota(\''+(r.id||'')+'\')">Salvar</button>',
    true
  );
  window._camRowTemplate=rowAbs;
  window._camRotaEditando=rota||null;
};

window._camCalcTotal=function(i){
  const val=parseFloat(document.getElementById('abs-valunit-'+i)?.value)||0;
  const lit=parseFloat(document.getElementById('abs-litros-'+i)?.value)||0;
  if(val&&lit){
    const el=document.getElementById('abs-total-'+i);
    if(el) el.value=(val*lit).toFixed(2);
  }
};

window._adicionarAbsRow=function(){
  const i=window._absCount++;
  const tbody=document.getElementById('abs-tbody');
  if(!tbody) return;
  const tr=document.createElement('tr');
  tr.id='abs-row-'+i;
  tr.innerHTML=window._camRowTemplate({},i).replace(/<tr[^>]*>|<\/tr>/g,'');
  tbody.appendChild(tr);
};

window._removerAbsRow=function(i){
  const row=document.getElementById('abs-row-'+i);
  if(row) row.remove();
};

window._salvarRota=async function(rotaId){
  const veiculoId=document.getElementById('rota-veiculo')?.value;
  const motoristId=document.getElementById('rota-motorista')?.value;
  const data=document.getElementById('rota-data')?.value;
  const origem=document.getElementById('rota-origem')?.value;
  const destino=document.getElementById('rota-destino')?.value;
  const kmInicial=parseFloat(document.getElementById('rota-kmini')?.value)||0;
  const kmFinal=parseFloat(document.getElementById('rota-kmfin')?.value)||0;
  const obs=document.getElementById('rota-obs')?.value||'';

  if(!data||!veiculoId){showToast('Informe data e veículo.');return;}

  // Coletar abastecimentos
  const abastecimentos=[];
  for(let i=0;i<window._absCount;i++){
    const row=document.getElementById('abs-row-'+i);
    if(!row) continue;
    const posto=document.getElementById('abs-posto-'+i)?.value||'';
    const combustivel=document.getElementById('abs-comb-'+i)?.value||'Diesel';
    const valUnit=parseFloat(document.getElementById('abs-valunit-'+i)?.value)||0;
    const litros=parseFloat(document.getElementById('abs-litros-'+i)?.value)||0;
    const totalPago=parseFloat(document.getElementById('abs-total-'+i)?.value)||0;
    const gastoMot=parseFloat(document.getElementById('abs-gastoMot-'+i)?.value)||0;
    if(posto||litros||totalPago) abastecimentos.push({posto,combustivel,valUnit,litros,totalPago,gastoMot});
  }

  const dados={veiculoId,motoristId,data,origem,destino,kmInicial,kmFinal,obs,abastecimentos,
    registradoPor:currentUserData?.nome||'',criadoEm:new Date().toISOString()};

  try{
    if(rotaId){await updateDoc(doc(db,'cam_rotas',rotaId),dados);}
    else{await addDoc(collection(db,'cam_rotas'),dados);}
    closeModal();showToast('Rota salva!');
  }catch(e){
    showToast('Erro ao salvar: '+e.message);
    console.error(e);
  }
};

window._editarRota=function(id){
  const rota=camRotas.find(r=>r.id===id);
  if(rota) window._abrirNovaRota(rota);
};

window._excluirRota=async function(id,fromModal){
  if(!confirm('Excluir esta rota?')) return;
  if(fromModal) closeModal();
  await deleteDoc(doc(db,'cam_rotas',id));
  showToast('Rota excluída.');
};

// ── Abastecimento (histórico) ──────────────────────────────────────
function renderCamAbastecimento(){
  if(!window._camAbMes) window._camAbMes=today().slice(0,7);
  const mes=window._camAbMes;
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;
  const mesAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mesProx=new Date(parseInt(ano),parseInt(m),1);

  // Consolidar abastecimentos de todas as rotas do mês
  const abs=[];
  camRotas.filter(r=>(r.data||'').slice(0,7)===mes).forEach(r=>{
    (r.abastecimentos||[]).forEach(a=>{
      abs.push({...a, data:r.data, veiculo:camGetVeiculo(r.veiculoId), motorista:camGetMotorista(r.motoristId), rotaId:r.id});
    });
  });

  const totalLitros=abs.reduce((s,a)=>s+(parseFloat(a.litros)||0),0);
  const totalGasto=abs.reduce((s,a)=>s+(parseFloat(a.totalPago)||0),0);
  const totalGastoMot=abs.reduce((s,a)=>s+(parseFloat(a.gastoMot)||0),0);

  // Agrupado por posto
  const porPosto={};
  abs.forEach(a=>{
    const p=a.posto||'Não informado';
    if(!porPosto[p])porPosto[p]={litros:0,total:0,count:0};
    porPosto[p].litros+=parseFloat(a.litros)||0;
    porPosto[p].total+=parseFloat(a.totalPago)||0;

    +'<button class="btn btn-ghost btn-sm" onclick="window._camNavMes(\'cam_ab\',this.dataset.m)" data-m="'+mesProxStr+'">→</button>'

    </div>

function renderCamManutencao(){
  if(!window._camManMes) window._camManMes=today().slice(0,7);
  const mes=window._camManMes;
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;
  const mesAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mesProx=new Date(parseInt(ano),parseInt(m),1);
  const mesAntStr=mesAnt.getFullYear()+'-'+String(mesAnt.getMonth()+1).padStart(2,'0');
  const mesProxStr=mesProx.getFullYear()+'-'+String(mesProx.getMonth()+1).padStart(2,'0');

  const mansMes=camManutencoes.filter(r=>(r.data||'').slice(0,7)===mes);
  const totalGasto=mansMes.reduce((s,r)=>s+(parseFloat(r.valor)||0),0);

  let html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<button class="btn btn-ghost btn-sm" onclick="window._camNavMes(\'cam_man\',this.dataset.m)" data-m="'+mesAntStr+'">←</button>'
    +'<div style="font-size:16px;font-weight:700">'+mesNome+'</div>'
    +'<button class="btn btn-ghost btn-sm" onclick="window._camNavMes(\'cam_man\',this.dataset.m)" data-m="'+mesProxStr+'">→</button>'
    +'</div>'
    +(camPodeEditar()?'<button class="btn btn-primary" onclick="window._abrirNovaManutencao()">+ Nova manutenção</button>':'')
    +'</div>';

  html+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
    <div class="stat-card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6)">
      <div><div class="stat-label">Manutenções no mês</div><div class="stat-value">${mansMes.length}</div></div>
    </div>
    <div class="stat-card" style="background:linear-gradient(135deg,#dc2626,#ef4444)">
      <div><div class="stat-label">Gasto total</div><div class="stat-value" style="font-size:18px">${fmtMoeda(totalGasto)}</div></div>
    </div>
  </div>`;

  if(!mansMes.length) return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma manutenção em '+mesNome+'.</div></div>';

  html+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    +'<table style="width:100%;border-collapse:collapse;min-width:600px;font-size:12px">'
    +'<thead><tr style="background:#4c1d95;color:#fff">'
    +'<th style="padding:8px 10px;text-align:left">Data</th>'
    +'<th style="padding:8px 10px;text-align:left">Veículo</th>'
    +'<th style="padding:8px 10px;text-align:left">Tipo</th>'
    +'<th style="padding:8px 10px;text-align:left">Serviço</th>'
    +'<th style="padding:8px 10px;text-align:left">Causa</th>'
    +'<th style="padding:8px 10px;text-align:right">Valor</th>'
    +(camPodeEditar()?'<th style="padding:8px 10px;text-align:center">Ações</th>':'')
    +'</tr></thead><tbody>'
    +mansMes.map((r,i)=>{
      const v=camGetVeiculo(r.veiculoId);
      const d=r.data?r.data.split('-').reverse().join('/'):'-';
      return '<tr style="'+(i%2?'background:#f8fafc;':'')+'">'
        +'<td style="padding:7px 10px">'+d+'</td>'
        +'<td style="padding:7px 10px;font-weight:600">'+(v.modelo||'—')+' <span style="font-size:10px;color:#64748b">'+(v.placa||'')+'</span></td>'
        +'<td style="padding:7px 10px"><span style="background:'+(r.tipo==='Preventiva'?'#f0fdf4':'#fef2f2')+';color:'+(r.tipo==='Preventiva'?'#059669':'#dc2626')+';padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">'+(r.tipo||'—')+'</span></td>'
        +'<td style="padding:7px 10px">'+(r.servico||'—')+'</td>'
        +'<td style="padding:7px 10px;color:#64748b">'+(r.causa||'—')+'</td>'
        +'<td style="padding:7px 10px;text-align:right;font-weight:700;color:#dc2626">'+fmtMoeda(parseFloat(r.valor)||0)+'</td>'
        +(camPodeEditar()?'<td style="padding:7px 10px;text-align:center;white-space:nowrap">'
        +'<button class="btn btn-sm btn-ghost" onclick="window._editarManutencao(this.dataset.id)" data-id="'+r.id+'" style="margin-right:4px">✏️</button>'
        +'<button class="btn btn-sm btn-ghost" onclick="window._excluirManutencao(this.dataset.id)" data-id="'+r.id+'">🗑️</button>'
        +'</td>':'<td></td>')
        +'</tr>';
    }).join('')
    +'<tr style="background:#f5f3ff;font-weight:700">'
    +'<td colspan="5" style="padding:8px 10px;text-align:right">TOTAL</td>'
    +'<td style="padding:8px 10px;text-align:right;color:#dc2626">'+fmtMoeda(totalGasto)+'</td>'
    +'<td></td></tr>'
    +'</tbody></table></div>';

  return html;
}

    +'<div class="form-row"><div class="form-group"><label>Causa</label><input id="man-causa" value="'+(r.causa||'')+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Valor R$</label><input id="man-valor" type="number" step="0.01" value="'+(r.valor||'')+'" onfocus="this.select()" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div></div>'

window._salvarManutencao=async function(manId){
  const veiculoId=document.getElementById('man-veiculo')?.value;
  const data=document.getElementById('man-data')?.value;
  const tipo=document.getElementById('man-tipo')?.value;
  const servico=document.getElementById('man-servico')?.value;
  const causa=document.getElementById('man-causa')?.value;
  const valor=parseFloat(document.getElementById('man-valor')?.value)||0;
  const obs=document.getElementById('man-obs')?.value||'';
  if(!data||!veiculoId){showToast('Informe data e veículo.');return;}
  const dados={veiculoId,data,tipo,servico,causa,valor,obs,registradoPor:currentUserData?.nome||'',criadoEm:new Date().toISOString()};
  if(manId){await updateDoc(doc(db,'cam_manutencoes',manId),dados);}
  else{await addDoc(collection(db,'cam_manutencoes'),dados);}
  closeModal();showToast('Manutenção salva!');
};

window._editarManutencao=function(id){
  const m=camManutencoes.find(x=>x.id===id);
  if(m) window._abrirNovaManutencao(m);
};

window._excluirManutencao=async function(id,fromModal){
  if(!confirm('Excluir esta manutenção?')) return;
  if(fromModal) closeModal();
  await deleteDoc(doc(db,'cam_manutencoes',id));

};

window._salvarMotorista=async function(id){
  const nome=document.getElementById('mot-nome')?.value.trim();
  if(!nome){showToast('Informe o nome.');return;}
  const dados={nome,telefone:document.getElementById('mot-tel')?.value||'',habilitacao:document.getElementById('mot-hab')?.value||''};
  if(id){await updateDoc(doc(db,'cam_motoristas',id),dados);}
  else{await addDoc(collection(db,'cam_motoristas'),dados);}
  closeModal();showToast('Motorista salvo!');
};
window._editarMotorista=function(id){const m=camMotoristas.find(x=>x.id===id);if(m)window._abrirNovoMotorista(m);};
window._excluirMotorista=async function(id,fromModal){
  if(!confirm('Excluir motorista?'))return;
  if(fromModal)closeModal();
  await deleteDoc(doc(db,'cam_motoristas',id));showToast('Motorista excluído.');
};

// ── Relatório ──────────────────────────────────────────────────────
function renderCamRelatorio(){
  if(!window._camRelAno) window._camRelAno=today().slice(0,4);
  const ano=window._camRelAno;
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const anos=[...new Set(camRotas.map(r=>(r.data||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  if(!anos.includes(today().slice(0,4)))anos.unshift(today().slice(0,4));
  const anoOpts=anos.map(a=>'<option value="'+a+'"'+(a===ano?' selected':'')+'">'+a+'</option>').join('');

  // Resumo anual por mês
  const dadosMes=MESES.map((_,mi)=>{
    const mesStr=ano+'-'+String(mi+1).padStart(2,'0');
    const rotas=camRotas.filter(r=>(r.data||'').slice(0,7)===mesStr);
    const kmTotal=rotas.reduce((s,r)=>s+(parseFloat(r.kmFinal||0)-parseFloat(r.kmInicial||0)),0);
    const combTotal=rotas.reduce((s,r)=>s+(r.abastecimentos||[]).reduce((ss,a)=>ss+(parseFloat(a.totalPago)||0),0),0);
    const manTotal=camManutencoes.filter(m=>(m.data||'').slice(0,7)===mesStr).reduce((s,m)=>s+(parseFloat(m.valor)||0),0);
    const motTotal=rotas.reduce((s,r)=>(r.abastecimentos||[]).reduce((ss,a)=>ss+(parseFloat(a.gastoMot)||0),s),0);
    return {mes:MESES[mi],kmTotal,combTotal,manTotal,motTotal,viagens:rotas.length};
  });

  const totalAnual={km:dadosMes.reduce((s,m)=>s+m.kmTotal,0),comb:dadosMes.reduce((s,m)=>s+m.combTotal,0),man:dadosMes.reduce((s,m)=>s+m.manTotal,0),mot:dadosMes.reduce((s,m)=>s+(m.motTotal||0),0),viagens:dadosMes.reduce((s,m)=>s+m.viagens,0)};

  // Por veículo
  const porVeiculo=camVeiculos.map(v=>{
    const rotasV=camRotas.filter(r=>r.veiculoId===v.id&&(r.data||'').slice(0,4)===ano);
    const km=rotasV.reduce((s,r)=>s+(parseFloat(r.kmFinal||0)-parseFloat(r.kmInicial||0)),0);
    const comb=rotasV.reduce((s,r)=>s+(r.abastecimentos||[]).reduce((ss,a)=>ss+(parseFloat(a.totalPago)||0),0),0);
    const man=camManutencoes.filter(m=>m.veiculoId===v.id&&(m.data||'').slice(0,4)===ano).reduce((s,m)=>s+(parseFloat(m.valor)||0),0);
    return {v,km,comb,man,viagens:rotasV.length,total:comb+man};

function getValorGrad(id){
  if(configGrad.valores?.[id]!==undefined) return parseFloat(configGrad.valores[id]);
  const padrao=PECAS_GRAD.find(p=>p.id===id);
  if(padrao) return padrao.vlrDef;
  const custom=(configGrad.pecasCustom||[]).find(p=>p.id===id);
  return custom?.vlrDef||0;
}
function getQuinzenaGrad(dataStr){
  const d=dataStr||today();
  const dia=parseInt(d.slice(8,10));
  const anoMes=d.slice(0,7);
  return dia<=15?`${anoMes}-Q1`:`${anoMes}-Q2`;
}
function getQuinzenaAtualGrad(){ return getQuinzenaGrad(today()); }
function quinzenaLabelGrad(q){
  if(!q) return '';
  const [ano,mes,parte]=q.split('-');
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mNome=MESES[parseInt(mes)-1];
  return parte==='Q1'?`1–15 ${mNome} ${ano}`:`16–fim ${mNome} ${ano}`;
}
function fichaGradAtiva(gradId,q){
  return fichasGrad.find(f=>f.gradId===gradId&&f.quinzena===q&&f.status==='aberta');
}
function getPecasGradAtivas(){
  const excluidas=configGrad.pecasExcluidas||[];
  const custom=configGrad.pecasCustom||[];
  return [...PECAS_GRAD.filter(p=>!excluidas.includes(p.id)),...custom];
}
function calcGanhoGrad(fichaOuAponts){
  const aponts=Array.isArray(fichaOuAponts)?fichaOuAponts:(fichaOuAponts?.apontamentos||[]);
  return aponts.reduce((s,a)=>{
    getPecasGradAtivas().forEach(p=>{ s+=(parseInt((a.pecas||{})[p.id])||0)*getValorGrad(p.id); });
    return s;
  },0);
}
function totalPecasGrad(aponts){
  return aponts.reduce((s,a)=>s+getPecasGradAtivas().reduce((ss,p)=>ss+(parseInt((a.pecas||{})[p.id])||0),0),0);
}

function renderTabGrades(tab){
  try{
    if(tab==='grad_painel')    return renderGradPainel();
    if(tab==='grad_apontar')   return renderGradApontar();
    if(tab==='grad_fichas')    return renderGradFichas();
    if(tab==='grad_gradistas') return renderGradGradistas();
    if(tab==='grad_config')    return renderGradConfig();
    return renderGradPainel();
  }catch(e){
    console.error('Erro renderTabGrades:',e);
    return '<div class="card" style="color:#dc2626;padding:16px">Erro: '+e.message+'</div>';
  }
}

// ── Painel ───────────────────────────────────────────────────────
function renderGradPainel(){
  const q=getQuinzenaAtualGrad();
  const hoje=today();

  // Totais gerais hoje e mês
  let totalHoje=0, totalMes=0, ganhoMes=0;
  const porGradHoje={};
  fichasGrad.forEach(f=>{
    (f.apontamentos||[]).forEach(a=>{
      const t=getPecasGradAtivas().reduce((s,p)=>s+(parseInt((a.pecas||{})[p.id])||0),0);
      if(a.data===hoje){ totalHoje+=t; porGradHoje[f.gradId]=(porGradHoje[f.gradId]||0)+t; }

    });

    <div class="stat-card" style="background:linear-gradient(135deg,#1d4ed8,#3b82f6)"><div>
      <div class="stat-label">Peças hoje</div>
      <div class="stat-value">${totalHoje}</div>
    </div></div>
    <div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)"><div>
      <div class="stat-label">Peças no mês</div>
      <div class="stat-value">${totalMes}</div>
    </div></div>
    <div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)"><div>
      <div class="stat-label">A pagar no mês</div>
      <div class="stat-value" style="font-size:18px">${fmtMoeda(ganhoMes)}</div>
    </div></div>
  </div>`;

  // Cards de produção por tipo (todos os gradistas)

    let phoje=0, pmes=0;

        const v=parseInt((a.pecas||{})[p.id])||0;
        if(v>0){
          if(a.data===hoje) phoje+=v;
          if((a.data||'').startsWith(mesAtualGrad)) pmes+=v;
