function getValoresPorPerfil(perfil){
  if(perfil==='apontador2') return valoresPecas.apontador2;
  return valoresPecas.apontador1;
}

const COR_STYLE={'Bege':{bg:'#f5e6c8',color:'#7a5c1e'},'Mogno':{bg:'#6b2a1a',color:'#f5d5c8'},'Marrom':{bg:'#4a2c0a',color:'#e8d0b0'},'Preto':{bg:'#222',color:'#eee'},'Bicolor':{bg:'#444',color:'#eee'}};

const getEnr=id=>enroladores.find(e=>e.id===id);

function somaEntr(f,k){if(k==='fita'||k==='fio')return(f.entregas||[]).reduce((a,e)=>a+(parseInt(e[k])||0),0);return(f.entregas||[]).reduce((a,e)=>a+(parseInt((e.tipos||{})[k])||0),0)}
function somaRecol(f,k){if(k==='fitaSobrando'||k==='fioSobrando')return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt(r[k])||0),0);return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt((r.tipos||{})[k])||0),0)}
function somaRecolPago(f,k){return(f.recolhimentos||[]).filter(r=>!r.administrativo).reduce((a,r)=>a+(parseInt((r.tipos||{})[k])||0),0)}
function totalEnv(f){return TIPOS.reduce((a,t)=>a+somaEntr(f,t.id),0)}
function totalRec(f){return TIPOS.reduce((a,t)=>a+somaRecol(f,t.id),0)}
function pendentes(f){return totalEnv(f)-totalRec(f)}

// Retorna o apontador vinculado ao usuário atual (para filtrar fichas)
function getMeuApontadorId(){
  const perfil=currentUserData?.perfil;
  if(perfil==='apontador1'||perfil==='apontador2') return currentUserData.uid||currentUserData.id;
  return null;
}

// Verifica se a ficha pertence ao apontador atual
function fichaDoMeuApontador(ficha){
  const perfil=currentUserData?.perfil;
  if(perfil==='apontador1'||perfil==='apontador2'){
    // Verifica pelo enrolador da ficha — enrolador tem apontadorId
    const enr=getEnr(ficha.enroladorId);
    return enr&&enr.apontadorPerfil===perfil;
  }
  return true; // outros perfis veem tudo
}

// Cor da borda da ficha baseada no apontador do enrolador
function corFicha(ficha){
  const enr=getEnr(ficha.enroladorId);
  if(!enr) return '#e2e8f0';
  if(enr.apontadorPerfil==='apontador1') return '#0f766e';
  if(enr.apontadorPerfil==='apontador2') return '#b45309';
  return '#e2e8f0';
}

function renderSelecionarFabrica(){
  const p=PERFIS[currentUserData.perfil]||PERFIS.apontador;
  const fabricasDisponiveis=(p.fabricas)||['cadeiras'];

  const fabricas=[
    {id:'cadeiras',     nome:'Fábrica de Cadeiras', icon:'🪑', cor:'#1e40af', bg:'linear-gradient(135deg,#1e40af,#3b82f6)', desc:'Metalúrgica, Enrolamento, Fitas e mais'},
    {id:'estofados',    nome:'Fábrica de Estofados', icon:'🛋️', cor:'#7c3aed', bg:'linear-gradient(135deg,#7c3aed,#a78bfa)', desc:'Costura, Grades, Tapeçamento e Espuma'},
    {id:'almoxarifado', nome:'Almoxarifado',          icon:'📦', cor:'#92400e', bg:'linear-gradient(135deg,#92400e,#f59e0b)', desc:'Controle de estoque e materiais'},
    {id:'caminhoes',    nome:'Caminhões',              icon:'🚚', cor:'#1e3a5f', bg:'linear-gradient(135deg,#1e3a5f,#2563eb)', desc:'Frotas, rotas e manutenção'},
    {id:'financeiro',   nome:'Financeiro',             icon:'💰', cor:'#065f46', bg:'linear-gradient(135deg,#065f46,#10b981)', desc:'Pagamentos, compras e relatórios financeiros'},
    {id:'manutencao',   nome:'Manutenção',             icon:'🔧', cor:'#374151', bg:'linear-gradient(135deg,#374151,#6b7280)', desc:'Máquinas, manutenções e status'},
  ].filter(f=>{
    if(f.id==='almoxarifado') return ['admin','proprietario','financeiro','escritorio','apontador1','mecanico'].includes(currentUserData?.perfil);
    if(f.id==='caminhoes') return ['admin','proprietario','financeiro','escritorio'].includes(currentUserData?.perfil);
    if(f.id==='financeiro') return ['admin','proprietario','financeiro'].includes(currentUserData?.perfil);
    if(f.id==='manutencao') return ['admin','proprietario','apontador_metal','mecanico','encarregado_cad','encarregado_est','financeiro','escritorio'].includes(currentUserData?.perfil);
    return fabricasDisponiveis.includes(f.id);
  });

  const cards=fabricas.map(f=>`
    <div class="fab-card" style="background:${f.bg};color:#fff" onclick="window._selecionarFabrica('${f.id}')">
      <div class="fab-icon">${f.icon}</div>
      <div class="fab-name">${f.nome}</div>
      <div class="fab-desc">${f.desc}</div>
    </div>`).join('');

  const podeGerenciarUsuarios=currentUserData?.perfil==='admin';
  const btnUsuarios=podeGerenciarUsuarios?`
    <div style="margin-top:20px;border-top:1px solid #f1f5f9;padding-top:16px">
      <button class="btn btn-ghost" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px" onclick="window._abrirUsuariosGlobais()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Usuários Globais
      </button>
    </div>`:'';

  return `<div class="sel-wrap"><div class="sel-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="sel-title">JM — Sistema de Gestão</div>
      <button class="btn btn-ghost btn-sm" onclick="window._doLogout()">Sair</button>
    </div>
    <div class="sel-sub">Olá, <strong>${currentUserData.nome}</strong>! Selecione a fábrica para continuar.</div>
    <div class="fab-grid">${cards}</div>
    ${btnUsuarios}
  </div></div>`;
}


window._selecionarFabrica=id=>{
  currentFabrica=id;
  sessionStorage.setItem('jm_fabrica',id);
  if(id==='caminhoes'){
    currentSetor='caminhoes';
    sessionStorage.setItem('jm_setor','caminhoes');
    currentTab='cam_rotas';
  } else if(id==='almoxarifado'){
    currentSetor='almoxarifado';
    sessionStorage.setItem('jm_setor','almoxarifado');
    currentTab='alm_painel';
  } else if(id==='financeiro'){
    currentSetor='financeiro_geral';
    sessionStorage.setItem('jm_setor','financeiro_geral');
    currentTab='fin_dashboard';
  } else if(id==='manutencao'){
    currentSetor='manutencao';
    sessionStorage.setItem('jm_setor','manutencao');
    currentTab='man_painel';
  } else {
    currentSetor=null;
    sessionStorage.removeItem('jm_setor');
  }
  render();
};

window._selecionarSetor=id=>{
  currentSetor=id;
  sessionStorage.setItem('jm_setor',id);

  const pf=currentUserData?.perfil;

};

// Ao entrar no app, verifica se perfil tem setor fixo e pula seleção
function aplicarSetorAutomatico(){
  const p=PERFIS[currentUserData?.perfil];
  if(!p) return false;
  // Perfil com fábrica única e setor fixo → entra direto
  if(p.fabricas&&p.fabricas.length===1&&p.setor){
    currentFabrica=p.fabricas[0];
    currentSetor=p.setor;
    return true;
  }
  // Perfil com fábrica única mas sem setor fixo → mostra setores
  if(p.fabricas&&p.fabricas.length===1&&!p.setor){
    currentFabrica=p.fabricas[0];
    return false;
  }
  return false;
}
window._voltarFabrica=()=>{
  currentFabrica=null;
  currentSetor=null;
  sessionStorage.removeItem('jm_fabrica');
  sessionStorage.removeItem('jm_setor');
  render();
};
window._voltarSetores=()=>{
  // Se vier de uma fábrica que vai direto (sem setor), voltar para seleção de fábricas
  if(currentFabrica==='almoxarifado'||currentFabrica==='caminhoes'||currentFabrica==='financeiro'||currentFabrica==='manutencao'){
    currentFabrica=null;
    currentSetor=null;
    sessionStorage.removeItem('jm_fabrica');
    sessionStorage.removeItem('jm_setor');
  } else {
    currentSetor=null;
    sessionStorage.removeItem('jm_setor');
  }
  render();
};

window._switchTab=tab=>{
  currentTab=tab;
  // Atualiza nav items ativos
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.getAttribute('onclick')===`window._switchTab('${tab}')`);
  });
  // Atualiza título no topbar
  const tb=document.querySelector('.topbar-title');
  if(tb)tb.textContent=TAB_LABELS[tab]||tab;
  // Fecha sidebar no mobile
  window._closeSidebar();
  // Renderiza conteúdo
  const el=document.getElementById('tab-content');
  if(el)el.innerHTML=renderTab(tab);
};
function renderTab(tab){
  if(currentSetor==='financeiro_geral') return renderTabFinanceiro(tab);
  if(currentSetor==='manutencao') return renderTabManutencao(tab);
  if(currentSetor==='espuma') return renderTabEspuma(tab);
  if(currentSetor==='grades') return renderTabGrades(tab);
  if(currentSetor==='enrolamento_int') return renderTabInt(tab);
  if(currentSetor==='fitas') return renderTabFitas(tab);
  if(currentSetor==='caminhoes') return renderTabCaminhoes(tab);
  if(currentSetor==='almoxarifado') return renderTabAlmox(tab);
  // Metalúrgica tem seu próprio sistema de tabs
  if(currentSetor==='metalurgica') return renderTabMetal(tab);
  if(tab==='painel'){try{return renderPainel();}catch(e){console.error('Painel ERRO:',e.message,e.stack);return '<div class="card" style="color:red;padding:20px">Erro: '+e.message+'<br><small>'+e.stack+'</small></div>';}}
  if(tab==='fichas')return renderFichas();
  if(tab==='entregar')return renderEntrega();
  if(tab==='recolher')return renderRecolhimento();
  if(tab==='historico')return renderHistoricoSemanal();
  if(tab==='relatorio'){try{return renderRelatorio();}catch(e){console.error('renderRelatorio ERRO:',e.message,e.stack);return '<div class="card" style="color:red;padding:20px">Erro: '+e.message+'</div>';}}
  if(tab==='ranking')return renderRanking();
  if(tab==='enroladores')return renderEnroladores();
  if(tab==='usuarios')return renderUsuarios();
  return '';
}

// ── Resumo de movimento do painel ────────────────────────────────
function gerarResumoMovimento(){
  if(!window._painelApt) window._painelApt='apontador1';
  const apt=window._painelApt;
  const hoje=today();
  const anoMes=hoje.slice(0,7);
  const mesNome=new Date().toLocaleDateString('pt-BR',{month:'long'});

  function calcMov(tipoId, aptFiltro){
    let envHoje=0,envMes=0,recHoje=0,recMes=0;
    fichas.forEach(f=>{
      const enr=getEnr(f.enroladorId);
      if(!enr||enr.apontadorPerfil!==aptFiltro) return;
      (f.entregas||[]).forEach(e=>{
        const v=parseInt((e.tipos||{})[tipoId])||0;
        if(e.data===hoje) envHoje+=v;
        if((e.data||'').slice(0,7)===anoMes) envMes+=v;
      });
      (f.recolhimentos||[]).forEach(r=>{
        if(r.administrativo) return;
        const v=parseInt((r.tipos||{})[tipoId])||0;
        if(r.data===hoje) recHoje+=v;
        if((r.data||'').slice(0,7)===anoMes) recMes+=v;
      });
    });
    return {envHoje,envMes,recHoje,recMes};
  }

  // Botões de seleção
  const cor1='#0f766e'; const cor2='#b45309';
  function btn(v,l,cor){
    const ativo=apt===v;
    return '<button class="btn btn-sm '+(ativo?'btn-primary':'btn-ghost')+'"'
      +' style="'+(ativo?'':'border:1.5px solid '+cor+';color:'+cor)+'"'
      +' onclick="window._setPainelApt(this.dataset.v)" data-v="'+v+'">'+l+'</button>';
  }

  const filtroHtml='<div style="display:flex;gap:8px;margin-bottom:14px">'
    +btn('apontador1','Inácio',cor1)
    +btn('apontador2','Mirandinha',cor2)
    +'</div>';

  const cor=apt==='apontador1'?cor1:cor2;
  const tiposPainel=TIPOS.filter(t=>t.principal||['varanda_nova','centro_novo','varanda_luxo','banqueta','mesa_bistro','cadeira_mesa','namoradeira','centro_sofia'].includes(t.id));

  let cards='';
  tiposPainel.forEach(t=>{
    const m=calcMov(t.id,apt);
    if(!m.envMes&&!m.recMes) return;
    cards+='<div class="card" style="margin-bottom:10px;border-left:4px solid '+cor+'">'
      +'<div style="font-size:13px;font-weight:700;color:'+cor+';margin-bottom:10px">'+t.label+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<div style="background:'+(apt==='apontador1'?'#f0fdf4':'#fff7ed')+';border-radius:10px;padding:10px">'
      +'<div style="font-size:9px;color:#64748b;text-transform:uppercase;margin-bottom:2px">Entregas</div>'
      +'<div style="font-size:22px;font-weight:800;color:'+cor+'">'+(m.envHoje||'—')+'</div>'
      +'<div style="font-size:10px;color:#94a3b8">'+mesNome+': '+m.envMes+'</div>'
      +'</div>'
      +'<div style="background:'+(apt==='apontador1'?'#f0fdf4':'#fff7ed')+';border-radius:10px;padding:10px">'
      +'<div style="font-size:9px;color:#64748b;text-transform:uppercase;margin-bottom:2px">Recolhidos</div>'
      +'<div style="font-size:22px;font-weight:800;color:'+cor+'">'+(m.recHoje||'—')+'</div>'
      +'<div style="font-size:10px;color:#94a3b8">'+mesNome+': '+m.recMes+'</div>'
      +'</div>'
      +'</div></div>';
  });

  return filtroHtml+(cards||'<div class="card"><div style="color:#94a3b8;text-align:center;padding:16px">Nenhuma movimentação registrada neste mês.</div></div>');
}


function gerarResumoAlertas(){
  if(currentUserData?.perfil==='enrolador') return '';
  const apt=window._painelApt||'apontador1';
  const alertas=enroladores.filter(e=>{
    if(e.apontadorPerfil!==apt) return false;
    const d=diasSemRetorno(e.id);
    return d!==null&&d>=30;
  }).map(e=>({e,dias:diasSemRetorno(e.id)}))
    .sort((a,b)=>b.dias-a.dias);
  if(!alertas.length) return '';
  const rows=alertas.map(({e,dias})=>
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #fecaca">'
    +'<span style="font-size:12px;color:#dc2626;font-weight:600">'+e.nome+'</span>'
    +'<span style="font-size:13px;font-weight:800;color:#dc2626">'+dias+' dias sem retorno</span>'
    +'</div>'
  ).join('');
  return '<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:14px;padding:14px 18px;margin-bottom:16px;width:100%">'
    +'<div style="font-size:13px;font-weight:700;color:#dc2626;margin-bottom:10px">⚠️ '+alertas.length+' casa'+(alertas.length>1?'s':'')+' sem retorno há mais de 30 dias</div>'
    +rows+'</div>';
}

// ── Relatório de bônus mensal ─────────────────────────────────────
let bonusPagos={};

function renderRelatorioBonusMensal(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesesComDados=new Set();
  fichas.forEach(f=>{
    (f.recolhimentos||[]).forEach(r=>{
      if(r.data) mesesComDados.add(r.data.slice(0,7));
    });
  });
  const mesesList=[...mesesComDados].sort((a,b)=>b>a?1:-1).slice(0,6);
  let html='<div class="section-label">Histórico de bônus por mês</div>';
  mesesList.forEach(mes=>{
    const bonus=getBonusDoMes(mes);
    if(!bonus.length) return;
    const [ano,m]=mes.split('-');
    const mesNome=MESES[parseInt(m)-1]+' '+ano;
    const totalBonus=bonus.reduce((s,b)=>s+b.totalBonus,0);
    html+='<div class="card" style="margin-bottom:10px;border-left:4px solid #fde047">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      +'<div style="font-size:13px;font-weight:700;color:#92400e">🌟 '+mesNome+'</div>'
      +'<div style="font-size:16px;font-weight:800;color:#92400e">'+fmtMoeda(totalBonus)+'</div>'
      +'</div>'
      +bonus.map(function(b){
        const pago=bonusPagos[b.enroladorId+'-'+b.anoMes];
        const btnPagar=['admin','financeiro'].includes(currentUserData?.perfil)&&!pago
          ?'<button class="btn btn-sm btn-primary" onclick="window._pagarBonus(&quot;'+b.enroladorId+'&quot;,&quot;'+b.anoMes+'&quot;)">Marcar pago</button>'
          :'';
        const badge=pago
          ?'<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:99px;font-weight:700">✓ Pago</span>'
          :'<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;font-weight:700">Pendente</span>';
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #fef9c3">'
          +'<div><div style="font-size:13px;font-weight:600">'+b.enrNome+'</div>'
          +'<div style="font-size:11px;color:#b45309">'+b.totalVSofia+' V.Sofia · bônus: '+fmtMoeda(b.totalBonus)+'</div></div>'
          +'<div style="display:flex;align-items:center;gap:8px">'+badge+btnPagar+'</div>'
          +'</div>';
      }).join('')
      +'</div>';
  });
  return html||'';
}

function calcVSofiaNoMes(enroladorId, anoMes){
  return fichas.filter(f=>f.enroladorId===enroladorId)
    .reduce((sum,f)=>{
      return sum+(f.recolhimentos||[]).reduce((s,r)=>{
        if((r.data||'').slice(0,7)!==anoMes) return s;
        return s+(parseInt((r.tipos||{}).varanda_sofia)||0);
      },0);
    },0);
}

function calcBonusEnrolador(enroladorId, anoMes){
  const enr=getEnr(enroladorId);
  if(!enr||enr.apontadorPerfil!=='apontador1') return null;
  if(!configBonus.ativo) return null;
  const total=calcVSofiaNoMes(enroladorId, anoMes);
  if(total<configBonus.meta) return null;
  return {
    enroladorId, enrNome:enr.nome, anoMes,
    totalVSofia:total, meta:configBonus.meta,
    valorBonus:configBonus.valorBonus,
    totalBonus:parseFloat((total*configBonus.valorBonus).toFixed(2)),
  };
}

function getBonusDoMes(anoMes){
  return enroladores.filter(e=>e.apontadorPerfil==='apontador1')
    .map(e=>calcBonusEnrolador(e.id, anoMes))
    .filter(b=>b!==null);
}

    const rows=TIPOS.filter(t=>somaEntr(f,t.id)>0).map(t=>{
      const e=somaEntr(f,t.id),r=somaRecol(f,t.id),p=e-r,bw=e?Math.round(r/e*100):0;
      return `<tr ${t.principal?'style="background:#f8f8f8"':''}><td style="padding:4px 6px;font-size:11px;font-weight:${t.principal?600:400}">${t.label}</td><td style="padding:4px 6px;font-size:11px;text-align:center">${e}</td><td style="padding:4px 6px;font-size:11px;text-align:center">${r}</td><td style="padding:4px 6px;font-size:11px;text-align:center" class="${p>0?'pend-pos':'pend-zero'}">${p}</td><td style="padding:4px 6px;width:60px"><div style="height:4px;background:#e5e5e5;border-radius:99px;overflow:hidden"><div style="height:100%;width:${bw}%;background:${t.principal?'#3266ad':c};border-radius:99px"></div></div></td></tr>`;
    }).join('');
    // Mini-cards: mostra apenas os tipos que têm peças pendentes nesta ficha
    const tiposPendentes=TIPOS.filter(t=>somaEntr(f,t.id)-somaRecol(f,t.id)>0);
    const miniCards=tiposPendentes.length>0
      ? tiposPendentes.map(t=>{
          const tc=TIPO_CORES[t.id]||{bg:'#f5f5f5',border:'#ddd',color:'#555'};
          const pFora=somaEntr(f,t.id)-somaRecol(f,t.id);
          return `<div style="background:${tc.bg};border:1px solid ${tc.border};border-radius:8px;padding:8px 10px"><div style="font-size:10px;color:${tc.color};margin-bottom:2px">${t.label} pendentes</div><div style="font-size:22px;font-weight:700;color:${tc.color}">${pFora}</div></div>`;
        }).join('')
      : `<div style="background:#f0faf0;border:1px solid #b2dfce;border-radius:8px;padding:8px 10px;grid-column:1/-1;text-align:center;font-size:12px;color:#2e7d32;font-weight:600">✓ Todas as peças recolhidas</div>`;
    const gridCols=tiposPendentes.length===1?'1fr':tiposPendentes.length===2?'1fr 1fr':tiposPendentes.length===3?'1fr 1fr 1fr':'1fr 1fr';
    const podeFechar=can('fecharFicha')&&pend===0;
    const sl=pend===0?'badge-closed':rec>0?'badge-partial':'badge-open';
    const st=pend===0?'pronto p/ fechar':rec>0?'retornando':'aguardando';
    const borderClass=pend===0?'pronto':rec>0?'retornando':'aberta';
    return `<div class="ficha-card ${borderClass}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:44px;height:44px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${initials(enr.nome)}</div>
          <div><div style="font-size:14px;font-weight:700">${enr.nome}</div><div style="font-size:11px;color:#64748b">desde ${fmtDate(f.dataAbertura)}</div></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="badge ${sl}">${st}</span>
          ${podeFechar?`<button class="btn btn-sm btn-success" onclick="window._fecharFicha('${f.id}')">Fechar</button>`:''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:${gridCols};gap:8px;margin-bottom:10px;width:100%">
        ${miniCards}
      </div>
      <table class="tipos-table"><thead><tr><th>Tipo</th><th style="text-align:center">Env.</th><th style="text-align:center">Recol.</th><th style="text-align:center">Pend.</th><th></th></tr></thead><tbody>${rows}</tbody>
        <tfoot><tr style="border-top:2px solid #f1f5f9"><td style="padding:7px 8px;font-size:12px;font-weight:700">Total</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700">${env}</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700">${rec}</td><td style="padding:7px 8px;font-size:12px;text-align:center;font-weight:700" class="${pend>0?'pend-pos':'pend-zero'}">${pend}</td><td style="padding:7px 8px;font-size:12px;text-align:right;color:#64748b;font-weight:600">${pct}%</td></tr></tfoot>
      </table>
      ${renderAlertaSemRetorno(f.enroladorId,true)}
      ${can('verSinalizacoes')?renderBadgeProntos(f):''}
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
        <span class="mat-pill">Fita: ${fitaEnv} rolos${fitaSob>0?' · '+fitaSob+' sobrando':''}</span>
        ${coresUsadas.map(cor=>corPill(cor)).join('')}
        <span class="mat-pill">Fio: ${fioEnv} rolos${fioSob>0?' · '+fioSob+' sobrando':''}</span>
      </div>
    </div>`;
  }).join('');
  return html;
}
