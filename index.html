        const bg=isReforma?'#f5f3ff':'#f8fafc';
        const border=isReforma?'#ddd6fe':'#e2e8f0';
        const shortLabel=p.label.replace('Grade Cabeceira ','Cab. ').replace('Grade Poltrona ','Poltrona ').replace('Grade Sofá ','Sofá ').replace('Grade Cama ','Cama ').replace('Grade Puf','Puf').replace('Encosto ','Enc. ').replace('Grade ','').replace(' — Normal',' N.').replace(' — Reforma',' R.').replace(' — Pedaço',' P.');
        return '<div style="background:'+bg+';border:1px solid '+border+';border-radius:10px;padding:8px 10px">'
          +'<div style="font-size:10px;color:#64748b;margin-bottom:2px">'+shortLabel+(isReforma?' <span style="color:#7c3aed">(ref.)</span>':'')+'</div>'
          +'<div style="font-size:20px;font-weight:800;color:'+cor+'">'+ph+'</div>'
          +'<div style="font-size:10px;color:#94a3b8">mês: '+mes+'</div>'
          +'</div>';
      }).join('')
      +'</div></div>';
  }

  html+='<div class="section-label" style="margin-bottom:10px">produção de hoje</div>';
  if(!gradistas.length){
    html+='<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px;font-size:13px">Nenhum gradista cadastrado.</div></div>';
  } else {
    gradistas.filter(g=>g.ativo!==false).forEach(g=>{
      const ci=gradistas.filter(x=>x.ativo!==false).findIndex(x=>x.id===g.id);
      const c=avatarColor(ci);
      const mesAtualGrad=hoje.slice(0,7);

      // Apontamentos de hoje e da quinzena
      const totHoje={}, totQ={};
      const ficha=fichasGrad.find(f=>f.gradId===g.id&&f.quinzena===q);
      (ficha?.apontamentos||[]).forEach(a=>{
        getPecasGradAtivas().forEach(p=>{
          const v=parseInt((a.pecas||{})[p.id])||0;
          if(v>0){
            if(a.data===hoje) totHoje[p.id]=(totHoje[p.id]||0)+v;
            totQ[p.id]=(totQ[p.id]||0)+v;
          }
        });
      });

      const ganho=calcGanhoGrad(ficha?.apontamentos||[]);
      const ganhoHoje=calcGanhoGrad((ficha?.apontamentos||[]).filter(a=>a.data===hoje));
      const totalHojeG=Object.values(totHoje).reduce((s,v)=>s+v,0);
      const totalQG=Object.values(totQ).reduce((s,v)=>s+v,0);

      const pecasComDados=getPecasGradAtivas().filter(p=>(totHoje[p.id]||0)>0||(totQ[p.id]||0)>0);
      const shortLabel=p=>p.label.replace('Grade Cabeceira ','Cab. ').replace('Grade Poltrona ','Poltrona ').replace('Grade Sofá ','Sofá ').replace('Grade Cama ','Cama ').replace('Grade Puf','Puf').replace('Encosto ','Enc. ').replace('Grade ','').replace(' — Normal',' N.').replace(' — Reforma',' R.').replace(' — Pedaço',' P.');

      const barras=pecasComDados.map(p=>{
        const qH=totHoje[p.id]||0;
        const qM=totQ[p.id]||0;
        const isReforma=p.id.includes('reforma')||p.id.includes('ref');
        const cor=isReforma?'#7c3aed':'#1d4ed8';
        const bgCor=isReforma?'#ede9fe':'#dbeafe';
        return '<div style="margin-bottom:7px">'
          +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'
          +'<span style="font-size:11px;color:'+(isReforma?'#7c3aed':'#475569')+'">'+shortLabel(p)+'</span>'
          +'<div>'
          +'<span style="font-size:14px;font-weight:800;color:'+cor+'">'+qH+'</span>'
          +'<span style="font-size:10px;color:#94a3b8"> hj · </span>'
          +'<span style="font-size:12px;font-weight:700;color:#065f46">'+qM+'</span>'
          +'<span style="font-size:10px;color:#94a3b8"> Q</span>'
          +'</div></div>'
          +'<div style="height:5px;background:'+bgCor+';border-radius:99px;overflow:hidden">'
          +'<div style="height:100%;width:'+(qM>0?Math.min(100,Math.round(qH/qM*100)):0)+'%;background:'+cor+';border-radius:99px"></div>'
          +'</div></div>';
      }).join('');

      html+='<div class="card" style="margin-bottom:10px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:'+(pecasComDados.length?'12px':'0')+'">'
        +'<div style="display:flex;align-items:center;gap:12px">'
        +'<div style="width:44px;height:44px;border-radius:50%;background:'+c+'22;color:'+c+';display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">'+initials(g.nome)+'</div>'
        +'<div>'
        +'<div style="font-size:14px;font-weight:700">'+g.nome+'</div>'
        +'<div style="font-size:11px;color:#64748b">'+totalHojeG+' peças hoje · '+totalQG+' na quinzena</div>'
        +'</div></div>'
        +'<div style="text-align:right">'
        +'<div style="font-size:11px;color:#64748b">ganho hoje</div>'
        +'<div style="font-size:18px;font-weight:800;color:#059669">'+fmtMoeda(ganhoHoje)+'</div>'
        +'</div></div>'
        +(pecasComDados.length?'<div>'+barras+'</div>':'<div style="font-size:12px;color:#94a3b8;text-align:center;padding:8px 0">Nenhum apontamento hoje</div>')
        +'</div>';
    });
  }
  return html;
}

// ── Apontamento ──────────────────────────────────────────────────
function renderGradApontar(){
  const q=getQuinzenaAtualGrad();
  if(!window._gradApontSel) window._gradApontSel='';

  const optsGrad=gradistas.filter(g=>g.ativo!==false)
    .map(g=>`<option value="${g.id}"${g.id===window._gradApontSel?' selected':''}>${g.nome}</option>`).join('');

  let html=`<div class="card" style="margin-bottom:14px">
    <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">Selecionar gradista</div>
    <select onchange="window._gradSelGradista(this.value)" style="width:100%;font-size:15px;padding:12px;border-radius:12px;border:2px solid #e2e8f0;background:#fff">
      <option value="">— Selecione —</option>${optsGrad}
    </select>
  </div>`;

  if(!window._gradApontSel){ return html; }

  const grad=gradistas.find(g=>g.id===window._gradApontSel);
  if(!grad) return html;

  const hoje=today();
  const ficha=fichasGrad.find(f=>f.gradId===grad.id&&f.quinzena===q);
  const apontHoje=(ficha?.apontamentos||[]).filter(a=>a.data===hoje);
  const totalHoje=totalPecasGrad(apontHoje);
  const ganhoHoje=calcGanhoGrad(apontHoje);

  // Group pieces for easier mobile display
  const grupos=[
    {label:'Camas', pecas:getPecasGradAtivas().filter(p=>p.id.startsWith('cama'))},
    {label:'Encostos', pecas:getPecasGradAtivas().filter(p=>p.id.startsWith('enc'))},
    {label:'Cabeceiras', pecas:getPecasGradAtivas().filter(p=>p.id.startsWith('cab'))},
    {label:'Poltronas', pecas:getPecasGradAtivas().filter(p=>p.id.startsWith('poltrona'))},
    {label:'Sofás', pecas:getPecasGradAtivas().filter(p=>p.id.startsWith('sofa'))},
    {label:'Outros', pecas:getPecasGradAtivas().filter(p=>!p.id.startsWith('cama')&&!p.id.startsWith('enc')&&!p.id.startsWith('cab')&&!p.id.startsWith('poltrona')&&!p.id.startsWith('sofa'))},
  ];

  html+=`<div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;text-align:center;padding:16px">
    <div style="font-size:13px;font-weight:700;opacity:.8">${grad.nome} — Hoje</div>
    <div style="font-size:36px;font-weight:900;margin:4px 0">${totalHoje}</div>
    <div style="font-size:12px;opacity:.8">peças · ${fmtMoeda(ganhoHoje)}</div>
  </div>`;

  // Form
  html+=`<div class="card" style="margin-bottom:14px">
    <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:14px">Lançar produção de hoje</div>`;

  grupos.forEach(g=>{
    if(!g.pecas.length) return;
    html+=`<div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:8px">${g.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
    g.pecas.forEach(p=>{
      const shortLabel=p.label.replace('Grade Cabeceira ','').replace('Grade Poltrona ','').replace('Grade Sofá ','').replace('Grade Cama ','Cama ').replace('Encosto ','').replace('Grade ','');
      html+=`<div style="background:#f8fafc;border-radius:12px;padding:10px">
        <div style="font-size:11px;color:#475569;font-weight:600;margin-bottom:6px">${shortLabel}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <button onclick="window._gradDecPeca('${p.id}')" style="width:32px;height:32px;border-radius:50%;background:#e2e8f0;border:none;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center">−</button>
          <input type="number" id="grad-peca-${p.id}" min="0" placeholder="0" style="flex:1;text-align:center;font-size:18px;font-weight:800;border:2px solid #e2e8f0;border-radius:8px;padding:4px;width:100%">
          <button onclick="window._gradIncPeca('${p.id}')" style="width:32px;height:32px;border-radius:50%;background:#1d4ed8;border:none;font-size:18px;font-weight:700;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button>
        </div>
        <div style="font-size:10px;color:#94a3b8;margin-top:4px;text-align:center">${fmtMoeda(getValorGrad(p.id))} cada</div>
      </div>`;
    });
    html+=`</div></div>`;
  });

  html+=`<button onclick="window._gradSalvarApontamento()" style="width:100%;padding:16px;background:#1d4ed8;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px">
    ✓ Salvar apontamento
  </button></div>`;

  // Histórico hoje
  if(apontHoje.length){
    html+=`<div class="card"><div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">Lançamentos de hoje</div>`;
    apontHoje.forEach((a,i)=>{
      const pecas=getPecasGradAtivas().filter(p=>parseInt((a.pecas||{})[p.id])>0);
      const tot=totalPecasGrad([a]);
      const detPecas=pecas.map(p=>(parseInt((a.pecas||{})[p.id])||0)+'× '+p.label.split('—')[0].trim()).join(' · ');
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;${i>0?'border-top:1px solid #f1f5f9':''}">
        <div>
          <div style="font-size:12px;font-weight:700">${tot} peças · ${fmtMoeda(calcGanhoGrad([a]))}</div>
          <div style="font-size:10px;color:#64748b">${detPecas}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-danger" style="font-size:11px" onclick="window._gradExcluirApont('${ficha?.id}','${a.id}')">Excluir</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  return html;
}

// ── Fichas ───────────────────────────────────────────────────────
function renderGradFichas(){
  if(!window._gradFichaFiltro) window._gradFichaFiltro='abertas';
  const filtro=window._gradFichaFiltro;
  const q=getQuinzenaAtualGrad();
  const podeFechar=['admin','proprietario','encarregado_est','apontador_gra'].includes(currentUserData?.perfil);

  const btnF=v=>`<button onclick="window._gradSetFichaFiltro('${v}')" style="padding:7px 18px;border-radius:99px;font-size:13px;font-weight:700;border:2px solid ${filtro===v?'#1d4ed8':'#e2e8f0'};background:${filtro===v?'#1d4ed8':'#fff'};color:${filtro===v?'#fff':'#64748b'};cursor:pointer">${v==='abertas'?'Abertas':'Fechadas'}</button>`;
  let html=`<div style="display:flex;gap:8px;margin-bottom:14px">${btnF('abertas')}${btnF('fechadas')}</div>`;

  // Quinzenas disponíveis
  const quinzenas=filtro==='abertas'?[q]:[...new Set(fichasGrad.filter(f=>f.status==='fechada').map(f=>f.quinzena))].sort().reverse();

  quinzenas.forEach(qk=>{
    const fichasQ=fichasGrad.filter(f=>f.quinzena===qk&&(filtro==='abertas'?f.status==='aberta':f.status==='fechada'));
    if(!fichasQ.length) return;

    html+=`<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin:10px 0 6px">${quinzenaLabelGrad(qk)}</div>`;
    fichasQ.forEach(f=>{
      const grad=gradistas.find(g=>g.id===f.gradId);
      const ganho=calcGanhoGrad(f.apontamentos||[]);
      const total=totalPecasGrad(f.apontamentos||[]);

      // Histórico por dia
      const diasMap={};
      (f.apontamentos||[]).forEach(a=>{
        if(!a.data) return;
        if(!diasMap[a.data]) diasMap[a.data]={};
        getPecasGradAtivas().forEach(p=>{ diasMap[a.data][p.id]=(diasMap[a.data][p.id]||0)+(parseInt((a.pecas||{})[p.id])||0); });
      });
      const dias=Object.keys(diasMap).sort().reverse();

      const histHtml=dias.length?`<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:8px">
        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:6px">Produção por dia</div>
        <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="background:#f8fafc">
            <th style="padding:5px 8px;text-align:left;color:#94a3b8">Data</th>
            <th style="padding:5px 8px;text-align:center;color:#94a3b8">Total</th>
            <th style="padding:5px 8px;text-align:right;color:#94a3b8">Ganho</th>
          </tr></thead><tbody>
          ${dias.map((dia,i)=>{
            const tots=diasMap[dia];
            const tDia=Object.values(tots).reduce((s,v)=>s+v,0);
            const gDia=getPecasGradAtivas().reduce((s,p)=>s+(tots[p.id]||0)*getValorGrad(p.id),0);
            const [y,m,d]=dia.split('-');
            const rowBg=i%2?'background:#f8fafc':'';
            return '<tr style="'+rowBg+'">'
              +'<td style="padding:5px 8px;font-weight:600">'+d+'/'+m+'/'+y+'</td>'
              +'<td style="padding:5px 8px;text-align:center;font-weight:800;color:#1d4ed8">'+tDia+'</td>'
              +'<td style="padding:5px 8px;text-align:right;color:#059669;font-weight:700">'+fmtMoeda(gDia)+'</td>'
              +'</tr>';
          }).join('')}
          <tr style="background:#dbeafe;font-weight:800">
            <td style="padding:5px 8px;color:#1d4ed8">Total</td>
            <td style="padding:5px 8px;text-align:center;color:#1d4ed8">${total}</td>
            <td style="padding:5px 8px;text-align:right;color:#059669">${fmtMoeda(ganho)}</td>
          </tr>
          </tbody></table></div></div>`:'';

      const corBorda=f.status==='aberta'?'#1d4ed8':'#10b981';
      const corValor=f.pago?'#059669':'#d97706';
      const bgStatus=f.status==='aberta'?'#dbeafe':'#d1fae5';
      const corStatus=f.status==='aberta'?'#1d4ed8':'#065f46';
      const labelStatus=f.status==='aberta'?'Aberta':f.pago?'✓ Pago':'Fechada';
      const btnFechar=podeFechar&&f.status==='aberta'
        ?'<button class="btn btn-sm btn-warn" onclick="window._gradFecharFicha(\''+f.id+'\')">Fechar</button>':'';
      const btnExcluirFicha=podeFechar
        ?'<button class="btn btn-sm btn-danger" onclick="window._gradExcluirFicha(\''+f.id+'\')">Excluir ficha</button>':'';

      // Histórico expandido com botões editar/excluir por lançamento
      const histExpandido=dias.length?'<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:8px">'
        +'<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:6px">Lançamentos por dia</div>'
        +dias.map((dia,i)=>{
          const tots=diasMap[dia];
          const tDia=Object.values(tots).reduce((s,v)=>s+v,0);
          const gDia=getPecasGradAtivas().reduce((s,p)=>s+(tots[p.id]||0)*getValorGrad(p.id),0);
          const [y,m,d]=dia.split('-');
          // Find all apontamentos for this day
          const apontsDia=(f.apontamentos||[]).filter(a=>a.data===dia);
          const det=getPecasGradAtivas().filter(p=>tots[p.id]>0).map(p=>'<span style="font-size:10px;background:#f1f5f9;padding:1px 6px;border-radius:99px">'+p.label.split('—')[0].trim().replace('Grade ','').replace('Encosto ','Enc. ')+': '+tots[p.id]+'</span>').join(' ');
          return '<div style="padding:8px 0;'+(i>0?'border-top:1px solid #f8fafc':'')+'">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
            +'<div>'
            +'<span style="font-size:12px;font-weight:700">'+d+'/'+m+'/'+y+'</span>'
            +'<span style="font-size:11px;color:#1d4ed8;font-weight:800;margin-left:8px">'+tDia+' peças</span>'
            +'<span style="font-size:11px;color:#059669;font-weight:700;margin-left:6px">'+fmtMoeda(gDia)+'</span>'
            +'</div>'
            +'<div style="display:flex;gap:4px">'
            +apontsDia.map(a=>'<button class="btn btn-sm btn-warn" style="font-size:10px;padding:2px 8px" onclick="window._gradEditarApont(\''+f.id+'\',\''+a.id+'\')">Editar</button>'
              +'<button class="btn btn-sm btn-danger" style="font-size:10px;padding:2px 8px" onclick="window._gradExcluirApont(\''+f.id+'\',\''+a.id+'\')">Excluir</button>').join('')
            +'</div></div>'
            +'<div style="display:flex;flex-wrap:wrap;gap:3px">'+det+'</div>'
            +'</div>';
        }).join('')
        +'</div>':'';

      html+='<div class="card" style="margin-bottom:10px;border-left:4px solid '+corBorda+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div>'
        +'<div style="font-size:14px;font-weight:700">'+(grad?.nome||'—')+'</div>'
        +'<div style="font-size:11px;color:#64748b">'+quinzenaLabelGrad(qk)+' · '+total+' peças</div>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">'
        +'<div style="text-align:right">'
        +'<div style="font-size:18px;font-weight:800;color:'+corValor+'">'+fmtMoeda(ganho)+'</div>'
        +'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:'+bgStatus+';color:'+corStatus+'">'+labelStatus+'</span>'
        +'</div>'
        +btnFechar+btnExcluirFicha
        +'</div></div>'
        +histExpandido
        +'</div>';
    });
  });

  if(!html.includes('card')) html+='<div class="card" style="text-align:center;color:#94a3b8;padding:20px">Nenhuma ficha encontrada.</div>';
  return html;
}

// ── Configurações ────────────────────────────────────────────────
function renderGradConfig(){
  // Peças customizadas salvas no Firebase (além das padrão)
  const pecasCustom=configGrad.pecasCustom||[];
  const pecasExcluidas=configGrad.pecasExcluidas||[];
  const todasPecas=[
    ...PECAS_GRAD.filter(p=>!pecasExcluidas.includes(p.id)),
    ...pecasCustom,
  ];

  let html='<div class="card" style="margin-bottom:14px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700;color:#475569">💰 Valores por peça</div>'
    +'<button onclick="window._gradNovaPeca()" class="btn btn-sm btn-primary">+ Nova peça</button>'
    +'</div>';

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  todasPecas.forEach(p=>{
    const v=getValorGrad(p.id);
    const isCustom=pecasCustom.some(c=>c.id===p.id);
    html+='<div style="background:#f8fafc;border-radius:10px;padding:10px;position:relative">'
      +(isCustom?'<button onclick="window._gradExcluirPeca(\''+p.id+'\')" style="position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;font-size:13px;color:#dc2626" title="Excluir peça">✕</button>':'')
      +'<div style="font-size:10px;color:#64748b;font-weight:600;margin-bottom:6px;padding-right:'+(isCustom?'16px':'0')+'px">'+p.label+'</div>'
      +'<div style="display:flex;align-items:center;gap:4px">'
      +'<span style="font-size:12px;color:#475569">R$</span>'
      +'<input type="number" id="gv-'+p.id+'" value="'+v.toFixed(2)+'" step="0.01" min="0" style="flex:1;border:1.5px solid #e2e8f0;border-radius:8px;padding:5px 6px;font-size:13px;font-weight:700;width:100%">'
      +'</div>'
      +(isCustom?'':'<button onclick="window._gradOcultarPecaPadrao(\''+p.id+'\')" style="margin-top:6px;width:100%;background:none;border:1px solid #e2e8f0;border-radius:6px;padding:3px;font-size:10px;color:#94a3b8;cursor:pointer">Remover</button>')
      +'</div>';
  });
  html+='</div>'
    +'<button onclick="window._gradSalvarConfig()" class="btn btn-primary" style="width:100%;margin-top:14px;padding:12px;font-size:14px">Salvar valores</button>'
    +'</div>';

  // Peças padrão ocultas (pode restaurar)
  if(pecasExcluidas.length){
    html+='<div class="card"><div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px">Peças removidas</div>';
    pecasExcluidas.forEach(id=>{
      const p=PECAS_GRAD.find(x=>x.id===id);
      if(!p) return;

  }

  return html;
}

  const gradId=window._gradApontSel;
  if(!gradId){showToast('Selecione um gradista.');return;}
  const q=getQuinzenaAtualGrad();
  const pecas={};
  let temAlgo=false;
  PECAS_GRAD.forEach(p=>{
    const v=parseInt(document.getElementById('grad-peca-'+p.id)?.value)||0;
    if(v>0){pecas[p.id]=v;temAlgo=true;}
  });
  if(!temAlgo){showToast('Lance pelo menos uma peça.');return;}

  const apontId='a'+Date.now();
  const apont={id:apontId,data:today(),pecas};

  let ficha=fichasGrad.find(f=>f.gradId===gradId&&f.quinzena===q&&f.status==='aberta');
  if(!ficha){
    const ref=await addDoc(collection(db,'fichas_grad'),{gradId,quinzena:q,status:'aberta',pago:false,apontamentos:[apont]});
    fichasGrad.push({id:ref.id,gradId,quinzena:q,status:'aberta',pago:false,apontamentos:[apont]});

    const apontamentos=[...(ficha.apontamentos||[]),apont];
    await updateDoc(doc(db,'fichas_grad',ficha.id),{apontamentos});
  }
  showToast('Apontamento salvo!');
  reloadTab();
};

// ── Helpers ───────────────────────────────────────────────────────
function getEnrInt(id){ return enroladoresInt.find(e=>e.id===id)||{}; }
function getTiposInt(){ return configInt.tipos||[]; }
function getValorInt(tipoId){ return parseFloat((configInt.valores||{})[tipoId])||0; }


function fichasIntAbertas(){ return fichasInt.filter(f=>f.status==='aberta'); }
function fichasIntPorEnrolador(enrId){ return fichasInt.filter(f=>f.enroladorId===enrId); }
function fichaIntAtiva(enrId){
  return fichasInt.find(f=>f.enroladorId===enrId&&f.status==='aberta');
}

function somaProducaoFicha(ficha){
  return (ficha.apontamentos||[]).reduce((s,a)=>{
    getTiposInt().forEach(t=>{ s+=(parseInt((a.tipos||{})[t.id])||0)*getValorInt(t.id); });
    return s;
  },0);
}
function calcularPagamentoInt(ficha){
  return somaProducaoFicha(ficha);
}
function totalPecasFichaInt(ficha){
  const tot={};
  (ficha.apontamentos||[]).forEach(a=>{
    getTiposInt().forEach(t=>{
      tot[t.id]=(tot[t.id]||0)+(parseInt((a.tipos||{})[t.id])||0);
    });
  });
  return tot;
}
function totalRolosFicha(ficha){
  // Pegar entregas de fita para esse enrolador no período da ficha
  if(!ficha.dataAbertura) return 0;
  return entregasFitas.filter(e=>e.enroladorIntId===ficha.enroladorId
    &&(e.data||'')>=ficha.dataAbertura
    &&(!ficha.dataFechamento||(e.data||'')<=ficha.dataFechamento)
  ).reduce((s,e)=>s+(parseInt(e.rolos)||0),0);
}

// ── Painel ────────────────────────────────────────────────────────
function renderPainelInt(){
  const hoje=today();
  const mesAtual=hoje.slice(0,7);
  const abertas=fichasIntAbertas();

  // Totais por tipo — hoje e mês
  const totHojeGeral={};
  const totMesGeral={};
  fichasInt.forEach(f=>{
    (f.apontamentos||[]).forEach(a=>{
      getTiposInt().forEach(t=>{
        const v=parseInt((a.tipos||{})[t.id])||0;
        if(a.data===hoje) totHojeGeral[t.id]=(totHojeGeral[t.id]||0)+v;
        if((a.data||'').startsWith(mesAtual)) totMesGeral[t.id]=(totMesGeral[t.id]||0)+v;
      });
    });
  });
  const totalHoje=Object.values(totHojeGeral).reduce((s,v)=>s+v,0);
  const totalMes=Object.values(totMesGeral).reduce((s,v)=>s+v,0);
  const tiposAtivos=getTiposInt().filter(t=>(totHojeGeral[t.id]||0)>0||(totMesGeral[t.id]||0)>0);

  // Cards de resumo
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px">'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)"><div><div class="stat-label">Fichas abertas</div><div class="stat-value">'+abertas.length+'</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)"><div><div class="stat-label">Enroladores</div><div class="stat-value">'+enroladoresInt.length+'</div></div></div>'
    +'</div>';

  // Cards de peças por tipo
  if(tiposAtivos.length>0){
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px">';
    tiposAtivos.forEach(t=>{
      const qHoje=totHojeGeral[t.id]||0;
      const qMes=totMesGeral[t.id]||0;
      html+=`<div class="card" style="padding:12px;border-top:3px solid #1e40af">
        <div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:8px">${t.label}</div>
        <div style="display:flex;justify-content:space-between;gap:8px">
          <div style="text-align:center;flex:1;background:#eff6ff;border-radius:8px;padding:6px">
            <div style="font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase">Hoje</div>
            <div style="font-size:18px;font-weight:900;color:#1e40af">${qHoje}</div>
          </div>
          <div style="text-align:center;flex:1;background:#f0fdf4;border-radius:8px;padding:6px">
            <div style="font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase">Mês</div>
            <div style="font-size:18px;font-weight:900;color:#065f46">${qMes}</div>
          </div>
        </div>
      </div>`;
    });

    html+='</div>';
  }

  if(!enroladoresInt.length) return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhum enrolador cadastrado ainda.</div></div>';

  // Cards por enrolador
  html+='<div style="display:flex;flex-direction:column;gap:10px">';
  enroladoresInt.forEach(enr=>{
    const ficha=fichaIntAtiva(enr.id);
    const pecasHoje=fichasInt.reduce((s,f)=>f.enroladorId!==enr.id?s:
      s+(f.apontamentos||[]).filter(a=>a.data===hoje).reduce((ss,a)=>{
        getTiposInt().forEach(t=>{ ss+=parseInt((a.tipos||{})[t.id])||0; });
        return ss;
      },0),0);
    const ganhoFicha=ficha?somaProducaoFicha(ficha):0;

    // Peças do mês por tipo
    const mesAtual=hoje.slice(0,7);
    const totMes={};
    fichasInt.filter(f=>f.enroladorId===enr.id).forEach(f=>{
      (f.apontamentos||[]).filter(a=>(a.data||'').startsWith(mesAtual)).forEach(a=>{
        getTiposInt().forEach(t=>{ totMes[t.id]=(totMes[t.id]||0)+(parseInt((a.tipos||{})[t.id])||0); });
      });
    });
    const totalMes=Object.values(totMes).reduce((s,v)=>s+v,0);

    html+='<div class="card" style="padding:14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div style="width:36px;height:36px;border-radius:50%;background:#065f46;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">'+enr.nome[0]+'</div>'
      +'<div><div style="font-weight:700;font-size:13px">'+enr.nome+'</div>'
      +'<div style="font-size:11px;color:#64748b">'+(ficha?'Ficha aberta desde '+fmtDate(ficha.dataAbertura):'Sem ficha aberta')+'</div>'
      +'</div></div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:10px;color:#64748b">peças hoje</div>'
      +'<div style="font-size:18px;font-weight:800;color:#065f46">'+pecasHoje+'</div>'
      +(ganhoFicha?'<div style="font-size:11px;color:#10b981">'+fmtMoeda(ganhoFicha)+' na ficha</div>':'')
      +'</div></div>';

    // Hoje por tipo + mês por tipo lado a lado
    const tiposComDados=getTiposInt().filter(t=>(totMes[t.id]||0)>0||(pecasHoje>0));
    if(tiposComDados.length>0){
      // Hoje
      const totHoje={};
      fichasInt.filter(f=>f.enroladorId===enr.id).forEach(f=>{
        (f.apontamentos||[]).filter(a=>a.data===hoje).forEach(a=>{
          getTiposInt().forEach(t=>{ totHoje[t.id]=(totHoje[t.id]||0)+(parseInt((a.tipos||{})[t.id])||0); });
        });
      });

      const tiposAtivos=getTiposInt().filter(t=>(totHoje[t.id]||0)>0||(totMes[t.id]||0)>0);
      if(tiposAtivos.length>0){
        html+='<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:10px">'
          +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">';
        tiposAtivos.forEach(t=>{
          const qHoje=totHoje[t.id]||0;
          const qMes=totMes[t.id]||0;
          html+='<div style="background:#f8fafc;border-radius:10px;padding:8px 10px">'
            +'<div style="font-size:10px;color:#64748b;font-weight:600;margin-bottom:4px">'+t.label+'</div>'
            +'<div style="display:flex;justify-content:space-between;align-items:flex-end">'
            +'<div>'
            +(qHoje>0?'<div style="font-size:11px;color:#475569">Hoje: <strong style="color:#1e40af">'+qHoje+'</strong></div>':'')
            +(qMes>0?'<div style="font-size:11px;color:#475569">Mês: <strong style="color:#065f46">'+qMes+'</strong></div>':'')
            +'</div>'
            +'</div>'
            +'</div>';
        });
        html+='</div>'
          +(totalMes>0?'<div style="margin-top:6px;font-size:11px;color:#64748b;text-align:right">Total no mês: <strong style="color:#065f46">'+totalMes+' peças</strong></div>':'')
          +'</div>';
      }
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}

    +'</div>').join('');

  return '<div class="card">'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:12px">Registrar produção</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Enrolador</label>'
    +'<select id="ai-enrolador" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px;width:100%">'
    +'<option value="">Selecione...</option>'+optsEnr+'</select></div>'
    +'<div class="form-group"><label>Data</label>'
    +'<input type="date" id="ai-data" value="'+today()+'" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px;width:100%"></div>'
    +'</div>'
    +(getTiposInt().length?'<div class="section-label" style="margin-top:8px">peças produzidas</div><div class="num-inputs">'+tiposHtml+'</div>':'<div style="color:#94a3b8;font-size:12px;padding:8px">Configure os tipos de peça nas Configurações.</div>')
    +'<div style="margin-top:12px;display:flex;gap:8px">'
    +'<button class="btn btn-primary" onclick="window._registrarApontInt()">Registrar</button>'
    +'<button class="btn btn-ghost" onclick="window._limparApontInt()">Limpar</button>'
    +'</div>'
    +'</div>'
    +'<div class="card" style="margin-top:12px">'
    +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:8px">📋 Apontamentos de hoje</div>'
    +historicoApontInt()
    +'</div>';
}

function historicoApontInt(){
  const hoje=today();
  const movs=[];
  fichasInt.forEach(f=>{
    (f.apontamentos||[]).filter(a=>a.data===hoje).forEach(a=>{
      const enr=getEnrInt(f.enroladorId);
      const pecas=getTiposInt().map(t=>{
        const v=parseInt((a.tipos||{})[t.id])||0;
        return v>0?v+'× '+t.label:'';
      }).filter(Boolean).join(', ');
      if(pecas) movs.push({nome:enr.nome||'?',pecas,apontId:a.id,fichaId:f.id,tipos:a.tipos||{}});
    });
  });
  if(!movs.length) return '<div style="color:#94a3b8;font-size:12px;text-align:center;padding:8px">Nenhum apontamento hoje.</div>';
  return movs.map((m,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;'+(i>0?'border-top:1px solid #f1f5f9':'')+'">'
    +'<div><div style="font-weight:700;font-size:12px">'+m.nome+'</div>'
    +'<div style="font-size:11px;color:#64748b">'+m.pecas+'</div></div>'
    +'<div style="display:flex;gap:6px">'
    +'<button class="btn btn-sm" style="font-size:11px;padding:3px 10px" onclick="window._editarApontInt(\''+m.fichaId+'\',\''+m.apontId+'\')">Editar</button>'
    +'<button class="btn btn-sm btn-danger" style="font-size:11px;padding:3px 10px" onclick="window._excluirApontInt(\''+m.fichaId+'\',\''+m.apontId+'\')">Excluir</button>'
    +'</div>'
    +'</div>').join('');
}

window._editarApontInt=function(fichaId, apontId){
  const ficha=fichasInt.find(f=>f.id===fichaId);
  if(!ficha) return;
  const apont=ficha.apontamentos.find(a=>a.id===apontId);
  if(!apont) return;
  const enr=getEnrInt(ficha.enroladorId);
  const campos=getTiposInt().map(t=>`
    <div class="form-group">
      <label>${t.label}</label>
      <input type="number" id="edit-apont-${t.id}" min="0" value="${parseInt((apont.tipos||{})[t.id])||0}"
        style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px;width:100%">
    </div>`).join('');
  showModal('Editar apontamento — '+enr.nome,
    `<div style="font-size:12px;color:#64748b;margin-bottom:12px">Data: ${apont.data?apont.data.split('-').reverse().join('/'):'—'}</div>
     <div class="form-row">${campos}</div>`,
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-primary" onclick="window._salvarEdicaoApontInt('${fichaId}','${apontId}')">Salvar</button>`
  );
};

window._salvarEdicaoApontInt=async function(fichaId, apontId){
  const ficha=fichasInt.find(f=>f.id===fichaId);
  if(!ficha) return;
  const tipos={};
  getTiposInt().forEach(t=>{
    const v=parseInt(document.getElementById('edit-apont-'+t.id)?.value)||0;
    if(v>0) tipos[t.id]=v;
  });
  const apontamentos=ficha.apontamentos.map(a=>a.id===apontId?{...a,tipos}:a);
  closeModal();
  await updateDoc(doc(db,'fichas_int',fichaId),{apontamentos});
  showToast('Apontamento atualizado!');
};

window._excluirApontInt=function(fichaId, apontId){
  window._pendingExcluirApont={fichaId,apontId};
  showModal('Excluir apontamento',
    '<div style="font-size:13px;color:#444;line-height:1.6">Tem certeza que deseja excluir este apontamento?</div>',
    `<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-sm btn-danger" onclick="window._confirmarExcluirApontInt()">Excluir</button>`);
};

window._confirmarExcluirApontInt=async function(){
  const {fichaId,apontId}=window._pendingExcluirApont||{};
  if(!fichaId||!apontId) return;
  closeModal();
  const ficha=fichasInt.find(f=>f.id===fichaId);
  if(!ficha) return;
  const apontamentos=ficha.apontamentos.filter(a=>a.id!==apontId);
  await updateDoc(doc(db,'fichas_int',fichaId),{apontamentos});
  window._pendingExcluirApont=null;
  showToast('Apontamento excluído!');
};

window._registrarApontInt=async function(){
  const enrId=document.getElementById('ai-enrolador')?.value;
  const data=document.getElementById('ai-data')?.value;
  if(!enrId||!data){showToast('Selecione o enrolador e a data.');return;}
  const tipos={};
  let total=0;
  getTiposInt().forEach(t=>{
    const v=parseInt(document.getElementById('ai-'+t.id)?.value)||0;
    if(v>0){tipos[t.id]=v;total+=v;}
  });
  if(!total){showToast('Registre pelo menos uma peça.');return;}

  // Buscar ou criar ficha ativa
  let ficha=fichaIntAtiva(enrId);
  if(!ficha){
    const enr=getEnrInt(enrId);
    const ref=await addDoc(collection(db,'fichas_int'),{
      enroladorId:enrId,dataAbertura:data,status:'aberta',apontamentos:[]
    });
    ficha={id:ref.id,enroladorId:enrId,dataAbertura:data,status:'aberta',apontamentos:[]};
  }

  const apontamentos=[...(ficha.apontamentos||[]),{
    id:Date.now().toString(),data,tipos,criadoEm:new Date().toISOString(),
    apontadorId:currentUserData?.uid||'',apontadorNome:currentUserData?.nome||''
  }];
  await updateDoc(doc(db,'fichas_int',ficha.id),{apontamentos});
  showToast('Produção registrada!');
  window._limparApontInt();
};

window._limparApontInt=function(){
  getTiposInt().forEach(t=>{const el=document.getElementById('ai-'+t.id);if(el)el.value='';});
};

// ── Fichas ────────────────────────────────────────────────────────
function renderFichasInt(){
  if(!window._fichasIntFiltro) window._fichasIntFiltro='abertas';
  const filtro=window._fichasIntFiltro;
  const fichasFilt=filtro==='abertas'?fichasInt.filter(f=>f.status==='aberta'):
    filtro==='fechadas'?fichasInt.filter(f=>f.status==='fechada'):fichasInt;
  fichasFilt.sort((a,b)=>b.dataAbertura>a.dataAbertura?1:-1);

  let html='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'
    +['abertas','fechadas','todas'].map(f=>'<button class="btn btn-sm '+(filtro===f?'btn-primary':'btn-ghost')+'" onclick="window._fichasIntFiltro=\''+f+'\';reloadTab()">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>').join('')
    +'</div>';

  if(!fichasFilt.length) return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma ficha '+filtro+'.</div></div>';

  html+=fichasFilt.map(f=>{
    const enr=getEnrInt(f.enroladorId);
    const totPecas=totalPecasFichaInt(f);
    const ganho=somaProducaoFicha(f);
    const rolos=totalRolosFicha(f);
    const totalPecasN=Object.values(totPecas).reduce((s,v)=>s+v,0);
    const podeFechar=f.status==='aberta'&&['admin','encarregado_cad','apontador_int'].includes(currentUserData?.perfil);

    // Histórico por dia
    const diasMap={};
    (f.apontamentos||[]).forEach(a=>{
      if(!a.data) return;
      if(!diasMap[a.data]) diasMap[a.data]={};
      getTiposInt().forEach(t=>{
        diasMap[a.data][t.id]=(diasMap[a.data][t.id]||0)+(parseInt((a.tipos||{})[t.id])||0);
      });
    });
    const dias=Object.keys(diasMap).sort().reverse();

    const historicoHtml=dias.length?`
      <div style="margin-top:12px;border-top:1px solid #f1f5f9;padding-top:10px">
        <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Histórico por dia</div>
        <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:#f8fafc">
            <th style="padding:6px 10px;text-align:left;color:#94a3b8;font-weight:700">Data</th>
            <th style="padding:6px 10px;text-align:center;color:#94a3b8;font-weight:700">Total</th>
            <th style="padding:6px 10px;text-align:left;color:#94a3b8;font-weight:700">Detalhes</th>
          </tr></thead>
          <tbody>
            ${dias.map((dia,i)=>{
              const tots=diasMap[dia];
              const totalDia=Object.values(tots).reduce((s,v)=>s+v,0);
              const det=getTiposInt().filter(t=>tots[t.id]>0).map(t=>`<span style="font-size:10px;color:#64748b">${t.label}: <strong>${tots[t.id]}</strong></span>`).join(' · ');
              const [y,m,d]=dia.split('-');
              return `<tr style="${i%2?'background:#f8fafc':''}">
                <td style="padding:6px 10px;font-weight:600;white-space:nowrap">${d}/${m}/${y}</td>
                <td style="padding:6px 10px;text-align:center;font-weight:800;color:#1e40af">${totalDia}</td>
                <td style="padding:6px 10px">${det}</td>
              </tr>`;
            }).join('')}
            <tr style="background:#dbeafe;font-weight:800">
              <td style="padding:6px 10px;color:#1e40af">Total</td>
              <td style="padding:6px 10px;text-align:center;color:#1e40af">${totalPecasN}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>`:'';

    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-weight:700;font-size:14px">${enr.nome}</div>
          <div style="font-size:11px;color:#64748b">Aberta: ${fmtDate(f.dataAbertura)}${f.dataFechamento?' · Fechada: '+fmtDate(f.dataFechamento):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:800;color:#065f46">${fmtMoeda(ganho)}</div>
            <div style="font-size:11px;color:#64748b">${totalPecasN} peças · ${rolos} rolos</div>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${f.status==='aberta'?'#d1fae5':'#f1f5f9'};color:${f.status==='aberta'?'#065f46':'#64748b'}">${f.status}</span>
          </div>
          ${podeFechar?`<button class="btn btn-sm btn-warn" onclick="window._fecharFichaInt('${f.id}')">Fechar ficha</button>`:''}
        </div>
      </div>
      <div style="margin-top:8px;display:flex;gap:12px;flex-wrap:wrap">
        ${getTiposInt().map(t=>totPecas[t.id]>0?`<div style="font-size:11px"><span style="font-weight:700;color:#1e40af">${totPecas[t.id]}</span> ${t.label}</div>`:'').join('')}
      </div>
      ${historicoHtml}
    </div>`;
  }).join('');

  return html;
}

window._fecharFichaInt=async function(fichaId){
  if(!confirm('Fechar esta ficha?')) return;
  await updateDoc(doc(db,'fichas_int',fichaId),{status:'fechada',dataFechamento:today()});
  showToast('Ficha fechada!');
};

window._abrirNovoEnrolInt=function(enr){
  const edit=enr&&enr.id;
  const r=enr||{};
  showModal((edit?'Editar':'Novo')+' enrolador',
    '<div class="form-row">'
    +'<div class="form-group"><label>Nome</label><input id="ei-nome" value="'+(r.nome||'')+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'

    +'</div>'
    +'<div class="form-group"><label>Status</label>'
    +'<select id="ei-ativo" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">'
    +'<option value="true"'+(r.ativo!==false?' selected':'')+'>Ativo</option>'
    +'<option value="false"'+(r.ativo===false?' selected':'')+'>Inativo</option>'
    +'</select></div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +(edit?'<button class="btn btn-danger btn-sm" onclick="window._excluirEnrolInt(\''+r.id+'\',true)">Excluir</button>':'')
    +'<button class="btn btn-primary btn-sm" onclick="window._salvarEnrolInt(\''+(r.id||'')+'\')">Salvar</button>',
    true);
};
window._salvarEnrolInt=async function(id){
  const nome=document.getElementById('ei-nome')?.value.trim();
  if(!nome){showToast('Informe o nome.');return;}
  const dados={nome,ativo:document.getElementById('ei-ativo')?.value!=='false'};
  if(id){await updateDoc(doc(db,'enroladores_int',id),dados);}
  else{await addDoc(collection(db,'enroladores_int'),dados);}
  closeModal();showToast('Enrolador salvo!');
};
window._editarEnrolInt=function(id){const e=enroladoresInt.find(x=>x.id===id);if(e)window._abrirNovoEnrolInt(e);};
window._excluirEnrolInt=async function(id,fromModal){
  if(!confirm('Excluir enrolador?'))return;
  if(fromModal)closeModal();
  await deleteDoc(doc(db,'enroladores_int',id));showToast('Excluído.');
};

function renderConfigInt(){
  const tipos=getTiposInt();
  const tiposHtml=tipos.map((t,i)=>'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<input value="'+t.label+'" id="cit-label-'+i+'" style="flex:1;font-size:12px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px">'
    +'<input type="number" step="0.01" placeholder="R$" value="'+(getValorInt(t.id)||'')+'" id="cit-val-'+i+'" style="width:80px;font-size:12px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px">'

    +'</div>').join('');

  return '<div class="card">'

    +'<div id="cit-lista">'+tiposHtml+'</div>'
    +'<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="window._addTipoInt()">+ Adicionar tipo</button>'

window._addTipoInt=function(){
  const lista=document.getElementById('cit-lista');
  if(!lista) return;
  const i=lista.children.length;
  const div=document.createElement('div');
  div.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px';
  div.innerHTML='<input placeholder="Nome da peça" id="cit-label-'+i+'" style="flex:1;font-size:12px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px">'
    +'<input type="number" step="0.01" placeholder="R$" id="cit-val-'+i+'" style="width:80px;font-size:12px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px">'
    +'<button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:16px">×</button>';
  lista.appendChild(div);
};
window._removerTipoInt=function(i){
  const row=document.querySelector('#cit-lista > div:nth-child('+(i+1)+')');
  if(row) row.remove();
};
window._salvarConfigInt=async function(){
  const lista=document.getElementById('cit-lista');
  if(!lista) return;
  const tipos=[];
  const valores={};
  Array.from(lista.children).forEach((row,i)=>{
    const label=document.getElementById('cit-label-'+i)?.value.trim();
    const val=parseFloat(document.getElementById('cit-val-'+i)?.value)||0;
    if(label){
      const id=label.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
      tipos.push({id,label});
      valores[id]=val;
    }
  });
  await setDoc(doc(db,'config_int','geral'),{tipos,valores});
  closeModal&&closeModal();
  showToast('Configurações salvas!');
};

function renderTabFitas(tab){
  try{
    if(tab==='estoque_fitas')   return renderEstoqueFitas();
    if(tab==='producao_fitas')  return renderProducaoFitas();
    if(tab==='saidas_fitas')    return renderSaidasFitas();
    if(tab==='relatorio_fitas') return renderRelatorioFitas();
    if(tab==='config_fitas')    return renderConfigFitas();
    return renderEstoqueFitas();
  }catch(e){
    return '<div class="card" style="color:red;padding:20px">Erro: '+e.message+'<br><small>'+e.stack+'</small></div>';
  }
}

window._registrarEntregaFita=async function(){
  const enroladorIntId=document.getElementById('ef-enrolador')?.value;
  const data=document.getElementById('ef-data')?.value;
  const rolos=parseInt(document.getElementById('ef-rolos')?.value)||0;
  const fio=parseInt(document.getElementById('ef-fio')?.value)||0;
  const cor=document.getElementById('ef-cor')?.value.trim()||'';
  const obs=document.getElementById('ef-obs')?.value.trim()||'';
  if(!enroladorIntId||!data){showToast('Selecione o enrolador e a data.');return;}
  if(!rolos&&!fio){showToast('Informe pelo menos rolos de fita ou fio.');return;}
  await addDoc(collection(db,'entregas_fitas'),{enroladorIntId,data,rolos,fio,cor,obs,
    registradoPor:currentUserData?.nome||'',criadoEm:new Date().toISOString()});
  document.getElementById('ef-rolos').value='';
  document.getElementById('ef-fio').value='';
  document.getElementById('ef-cor').value='';
  document.getElementById('ef-obs').value='';
  showToast('Entrega registrada!');
};


// ── Helpers Fitas ─────────────────────────────────────────────────
function getCoresFitas(){ return configFitas.cores||[]; }
function estoqueCor(cor){
  const prod=producaoFitas.filter(p=>p.cor===cor).reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  const said=saidasFitas.filter(s=>s.cor===cor).reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  return prod-said;
}
function estoqueFio(){
  const prod=producaoFitas.filter(p=>p.tipo==='fio').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  const said=saidasFitas.filter(s=>s.tipo==='fio').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  return prod-said;
}

// ── Estoque ───────────────────────────────────────────────────────
function renderEstoqueFitas(){
  const cores=getCoresFitas();
  let html='<div style="font-size:15px;font-weight:700;margin-bottom:14px">🔩 Estoque de Fitas e Fio</div>';

  if(!cores.length){
    return html+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Configure as cores nas Configurações.</div></div>';
  }

  // Cards por cor
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px">';
  cores.forEach(c=>{
    const qtd=estoqueCor(c.nome);
    const cor_bg=c.hex||'#6366f1';
    const baixo=qtd<=5;
    html+='<div class="card" style="text-align:center;padding:14px;border-top:4px solid '+cor_bg+'">'
      +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px">'+c.nome+'</div>'
      +'<div style="font-size:28px;font-weight:800;color:'+(baixo?'#dc2626':'#1e40af')+'">'+qtd+'</div>'
      +'<div style="font-size:10px;color:#94a3b8">rolos</div>'
      +(baixo&&qtd>0?'<div style="font-size:10px;color:#dc2626;margin-top:4px">⚠️ Estoque baixo</div>':'')
      +(qtd===0?'<div style="font-size:10px;color:#dc2626;margin-top:4px">❌ Sem estoque</div>':'')
      +'</div>';
  });
  html+='</div>';

  // Card fio
  const qtdFio=estoqueFio();
  html+='<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:14px">'
    +'<div><div style="font-size:13px;font-weight:700">🧵 Fio</div>'
    +'<div style="font-size:11px;color:#64748b">Estoque atual</div></div>'
    +'<div style="text-align:right">'
    +'<div style="font-size:28px;font-weight:800;color:'+(qtdFio<=5?'#dc2626':'#065f46')+'">'+qtdFio+'</div>'
    +'<div style="font-size:10px;color:#94a3b8">rolos</div>'
    +'</div></div>';

  return html;
}

window._pFitasTipoChange=function(){
  const tipo=document.getElementById('pf-tipo')?.value;
  const gr=document.getElementById('pf-cor-group');
  if(gr) gr.style.display=tipo==='fio'?'none':'block';
  // Recarregar cores dinamicamente
  const sel=document.getElementById('pf-cor');
  if(sel&&tipo==='fita'){
    const cores=getCoresFitas();
    sel.innerHTML='<option value="">— Cor —</option>'+cores.map(c=>'<option value="'+c.nome+'">'+c.nome+'</option>').join('');
  }
};

window._registrarProducaoFita=async function(){
  const tipo=document.getElementById('pf-tipo')?.value||'fita';
  const cor=tipo==='fita'?document.getElementById('pf-cor')?.value:'';
  const rolos=parseInt(document.getElementById('pf-rolos')?.value)||0;
  const data=document.getElementById('pf-data')?.value;
  const obs=document.getElementById('pf-obs')?.value.trim()||'';
  if(tipo==='fita'&&!cor){showToast('Selecione a cor.');return;}
  if(!rolos||rolos<=0){showToast('Informe a quantidade de rolos.');return;}
  await addDoc(collection(db,'producao_fitas'),{tipo,cor,rolos,data,obs,
    operador:currentUserData?.nome||'',criadoEm:new Date().toISOString()});
  document.getElementById('pf-rolos').value='';
  document.getElementById('pf-obs').value='';
  showToast('Produção registrada!');
};

  const cores=getCoresFitas();
  const optsCores=cores.map(c=>'<option value="'+c.nome+'"'+(c.nome===p.cor?' selected':'')+'>'+c.nome+'</option>').join('');
  showModal('Editar produção',
    '<div class="form-row">'
    +'<div class="form-group"><label>Tipo</label><select id="ep-tipo" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">'
    +'<option value="fita"'+(p.tipo==='fita'?' selected':'')+'>Fita</option>'
    +'<option value="fio"'+(p.tipo==='fio'?' selected':'')+'>Fio</option>'
    +'</select></div>'
    +'<div class="form-group" id="ep-cor-group" style="'+(p.tipo==='fio'?'display:none':'')+'"><label>Cor</label>'
    +'<select id="ep-cor" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%">'
    +'<option value="">— Cor —</option>'+optsCores+'</select></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Rolos</label><input id="ep-rolos" type="number" min="1" value="'+p.rolos+'" onfocus="this.select()" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'<div class="form-group"><label>Data</label><input id="ep-data" type="date" value="'+p.data+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>'
    +'</div>'
    +'<div class="form-group"><label>Observação</label><input id="ep-obs" value="'+(p.obs||'')+'" style="font-size:13px;border:1px solid #d0d0d0;border-radius:8px;padding:6px 9px;width:100%"></div>',

window._salvarProdFita=async function(id){
  const tipo=document.getElementById('ep-tipo')?.value||'fita';
  const cor=tipo==='fita'?document.getElementById('ep-cor')?.value:'';
  const rolos=parseInt(document.getElementById('ep-rolos')?.value)||0;
  const data=document.getElementById('ep-data')?.value;
  const obs=document.getElementById('ep-obs')?.value||'';
  if(tipo==='fita'&&!cor){showToast('Selecione a cor.');return;}
  if(!rolos){showToast('Informe os rolos.');return;}
  await updateDoc(doc(db,'producao_fitas',id),{tipo,cor,rolos,data,obs});
  closeModal();showToast('Produção atualizada!');
};

window._excluirProdFita=async function(id){
  if(!confirm('Excluir este registro de produção?')) return;
  closeModal();
  await deleteDoc(doc(db,'producao_fitas',id));
  showToast('Produção excluída.');
};

window._salvarSaidaFita=async function(id){
  const tipo=document.getElementById('es-tipo')?.value||'fita';
  const cor=tipo==='fita'?document.getElementById('es-cor')?.value:'';
  const rolos=parseInt(document.getElementById('es-rolos')?.value)||0;
  const data=document.getElementById('es-data')?.value;
  const obs=document.getElementById('es-obs')?.value||'';
  if(tipo==='fita'&&!cor){showToast('Selecione a cor.');return;}
  if(!rolos){showToast('Informe os rolos.');return;}

window._excluirSaidaFita=async function(id){

window._registrarSaidaFita=async function(){
  const destino=document.getElementById('sf-destino')?.value;
  const tipo=document.getElementById('sf-tipo')?.value||'fita';
  const cor=tipo==='fita'?document.getElementById('sf-cor')?.value:'';
  const rolos=parseInt(document.getElementById('sf-rolos')?.value)||0;
  const data=document.getElementById('sf-data')?.value;
  const obs=document.getElementById('sf-obs')?.value.trim()||'';
  if(!destino){showToast('Selecione o destino.');return;}
  if(tipo==='fita'&&!cor){showToast('Selecione a cor.');return;}
  if(!rolos||rolos<=0){showToast('Informe a quantidade.');return;}

  // Verificar estoque
  const estoqueAtual=tipo==='fio'?estoqueFio():estoqueCor(cor);
  if(rolos>estoqueAtual){showToast('Estoque insuficiente! Disponível: '+estoqueAtual+' rolos.');return;}

  // Resolver nome do destino
  let destinoNome=destino;
  let enroladorIntId=null;
  let enroladorExtId=null;
  if(destino.startsWith('enr_int:')){
    enroladorIntId=destino.split(':')[1];
    destinoNome='Enrolador Interno — '+(enroladoresInt.find(e=>e.id===enroladorIntId)?.nome||'');
  } else if(destino.startsWith('apt:')){
    const nomes={'apontador1':'Inácio','apontador2':'Mirandinha'};
    destinoNome='Terceirizado — '+(nomes[destino.split(':')[1]]||destino);
  } else {
    const labels={venda:'Venda',doacao:'Doação',outro:'Outro'};
    destinoNome=labels[destino]||destino;
  }

  const dados={tipo,cor,rolos,data,obs,destino,destinoNome,enroladorIntId,enroladorExtId,
    operador:currentUserData?.nome||'',criadoEm:new Date().toISOString()};
  await addDoc(collection(db,'saidas_fitas'),dados);

  // Se destino é enrolador interno, também criar entrega_fita para a ficha dele
  if(enroladorIntId){
    await addDoc(collection(db,'entregas_fitas'),{
      enroladorIntId,data,rolos:tipo==='fita'?rolos:0,fio:tipo==='fio'?rolos:0,
      cor:cor||'',obs,registradoPor:currentUserData?.nome||'',criadoEm:new Date().toISOString()
    });
  }

  document.getElementById('sf-rolos').value='';
  document.getElementById('sf-obs').value='';
  showToast('Saída registrada!');
};

function renderRelatorioFitas(){
  if(!window._fitRelMes) window._fitRelMes=today().slice(0,7);
  const mes=window._fitRelMes;
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano,m]=mes.split('-');
  const mesNome=MESES[parseInt(m)-1]+' '+ano;
  const mAnt=new Date(parseInt(ano),parseInt(m)-2,1);
  const mProx=new Date(parseInt(ano),parseInt(m),1);
  const mAntStr=mAnt.getFullYear()+'-'+String(mAnt.getMonth()+1).padStart(2,'0');
  const mProxStr=mProx.getFullYear()+'-'+String(mProx.getMonth()+1).padStart(2,'0');

  const prodMes=producaoFitas.filter(p=>(p.data||'').slice(0,7)===mes);
  const saidMes=saidasFitas.filter(s=>(s.data||'').slice(0,7)===mes);

  const totalProdFita=prodMes.filter(p=>p.tipo==='fita').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  const totalProdFio=prodMes.filter(p=>p.tipo==='fio').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  const totalSaidFita=saidMes.filter(s=>s.tipo==='fita').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
  const totalSaidFio=saidMes.filter(s=>s.tipo==='fio').reduce((s,p)=>s+(parseInt(p.rolos)||0),0);

  let html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">'
    +'<button class="btn btn-ghost btn-sm" onclick="window._fitNavMes(\''+mAntStr+'\')">←</button>'
    +'<div style="font-size:16px;font-weight:700">'+mesNome+'</div>'
    +'<button class="btn btn-ghost btn-sm" onclick="window._fitNavMes(\''+mProxStr+'\')">→</button>'
    +'</div>';

  // Stat cards
  html+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)"><div><div class="stat-label">Fita produzida</div><div class="stat-value">'+totalProdFita+' rolos</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#dc2626,#ef4444)"><div><div class="stat-label">Fita saída</div><div class="stat-value">'+totalSaidFita+' rolos</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#1e40af,#3b82f6)"><div><div class="stat-label">Fio produzido</div><div class="stat-value">'+totalProdFio+' rolos</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#7c3aed,#8b5cf6)"><div><div class="stat-label">Fio saído</div><div class="stat-value">'+totalSaidFio+' rolos</div></div></div>'
    +'</div>';

  // Produção por cor no mês
  const cores=getCoresFitas();
  if(cores.length&&prodMes.length){
    html+='<div class="card" style="margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">Produção por cor</div>'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<thead><tr style="background:#f1f5f9"><th style="padding:7px 10px;text-align:left">Cor</th><th style="padding:7px 10px;text-align:right">Produzido</th><th style="padding:7px 10px;text-align:right">Saído</th><th style="padding:7px 10px;text-align:right">Saldo</th></tr></thead><tbody>'
      +cores.map((c,i)=>{
        const prod=prodMes.filter(p=>p.tipo==='fita'&&p.cor===c.nome).reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
        const said=saidMes.filter(s=>s.tipo==='fita'&&s.cor===c.nome).reduce((s,p)=>s+(parseInt(p.rolos)||0),0);
        return '<tr style="'+(i%2?'background:#f8fafc;':'')+'">'
          +'<td style="padding:7px 10px;font-weight:700"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(c.hex||'#6366f1')+';margin-right:6px"></span>'+c.nome+'</td>'
          +'<td style="padding:7px 10px;text-align:right;color:#065f46">'+prod+'</td>'
          +'<td style="padding:7px 10px;text-align:right;color:#dc2626">'+said+'</td>'
          +'<td style="padding:7px 10px;text-align:right;font-weight:700;color:'+(prod-said>=0?'#1e40af':'#dc2626')+'">'+(prod-said)+'</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div></div>';
  }

  // Saídas por destino
  if(saidMes.length){
    const porDest={};
    saidMes.forEach(s=>{
      const k=s.destinoNome||s.destino||'Outro';
      if(!porDest[k]) porDest[k]={fita:0,fio:0};
      if(s.tipo==='fio') porDest[k].fio+=(parseInt(s.rolos)||0);
      else porDest[k].fita+=(parseInt(s.rolos)||0);
    });
    html+='<div class="card">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">Saídas por destino</div>'
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<thead><tr style="background:#f1f5f9"><th style="padding:7px 10px;text-align:left">Destino</th><th style="padding:7px 10px;text-align:right">Fita (rolos)</th><th style="padding:7px 10px;text-align:right">Fio (rolos)</th></tr></thead><tbody>'
      +Object.entries(porDest).sort((a,b)=>(b[1].fita+b[1].fio)-(a[1].fita+a[1].fio)).map(([k,v],i)=>'<tr style="'+(i%2?'background:#f8fafc;':'')+'">'
        +'<td style="padding:7px 10px;font-weight:600">'+k+'</td>'
        +'<td style="padding:7px 10px;text-align:right">'+v.fita+'</td>'
        +'<td style="padding:7px 10px;text-align:right">'+v.fio+'</td>'
        +'</tr>').join('')
      +'</tbody></table></div></div>';
  }

  return html;
}

window._salvarConfigFitas=async function(){
  const lista=document.getElementById('cf-lista');
  console.log('cf-lista:', lista, 'filhos:', lista?.children.length);
  if(!lista) return;
  const cores=[];
  Array.from(lista.children).forEach(row=>{
    const inputs=Array.from(row.querySelectorAll("input"));
    const hexEl=inputs.find(el=>el.type==="color");
    const nomeEl=inputs.find(el=>el.type!=="color");
    const nome=(nomeEl?.value||'').trim();
    const hex=hexEl?.value||'#6366f1';
    if(nome) cores.push({nome,hex});
  });
  console.log('Cores a salvar:', JSON.stringify(cores));
  if(!cores.length){ showToast('Nenhuma cor para salvar.'); return; }
  try{
    await setDoc(doc(db,'config_fitas','geral'),{cores});
    // Recarregar config imediatamente
    const snap=await getDoc(doc(db,'config_fitas','geral'));
    if(snap.exists()) configFitas={cores:[],tiposFio:['Fio Padrão'],...snap.data()};
    console.log('Config após save:', configFitas);
    showToast('Cores salvas! ('+cores.length+' cores)');
    setTimeout(()=>reloadTab(),500);
  }catch(e){
    showToast('Erro: '+e.message);
    console.error('Erro Firestore:', e);
  }
};

function renderMinhaProd(){

  const c=avatarColor(soldadores.findIndex(s=>s.id===sol.id));

  if(diasComApont.length>0){
    const vProd=configMetal.valoresProd||{};
    const vRef=configMetal.valoresRef||{};

    const linhas=diasComApont.map((dia,i)=>{

        const val=p.reforma?(parseFloat(vRef[p.id.replace('ref_','')])||0):(parseFloat(vProd[p.id])||0);
        return s+(qtd*val);
      },0);
      const pecasDia=PECAS_METAL_FULL.filter(p=>apontsDia.some(a=>parseInt((a.pecas||{})[p.id])>0));
      const detalDia=pecasDia.map(p=>{

      const [,, dd]=dia.split('-');
      return '<tr style="'+(i%2?'background:#f8fafc':'')+';border-bottom:1px solid #f1f5f9">'
        +'<td style="padding:7px 10px;font-size:12px;font-weight:600;white-space:nowrap">'+dd+'/'+qMes+'/'+qAno+'</td>'
        +'<td style="padding:7px 10px;font-size:13px;font-weight:800;color:#1e40af;text-align:center">'+totalDia+'</td>'

      +'<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Produção por dia — '+quinzenaLabel(q)+'</div>'
      +'<div style="overflow-x:auto">'
      +'<table style="width:100%;border-collapse:collapse">'
      +'<thead><tr style="background:#f1f5f9">'
      +'<th style="padding:7px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left">Data</th>'
      +'<th style="padding:7px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:center">Peças</th>'
      +'<th style="padding:7px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:right">Ganho</th>'
      +'<th style="padding:7px 10px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left">Detalhes</th>'

      +'<tbody>'+linhas+'</tbody>'
      +'<tfoot><tr style="background:#eff6ff;font-weight:800">'
      +'<td style="padding:8px 10px;font-size:12px;color:#1e40af">Total quinzena</td>'
      +'<td style="padding:8px 10px;font-size:14px;color:#1e40af;text-align:center">'+totalPecasQ+'</td>'
      +'<td style="padding:8px 10px;font-size:14px;color:#059669;text-align:right">'+fmtR(ganhoQ)+'</td>'
      +'<td></td>'
      +'</tr></tfoot>'
      +'</table>'
      +'</div>'
      +'</div>';
  } else {
    html+='<div style="border-top:1px solid #e2e8f0;padding-top:12px;margin-top:4px;color:#94a3b8;text-align:center;font-size:13px">Nenhuma produção registrada nesta quinzena.</div>';
  }

  html+='</div>';

  // ── Histórico de pagamentos ──────────────────────────────────────
  const fichasPagas=fichasMetal.filter(f=>f.soldadorId===sol.id&&f.pago)
    .sort((a,b)=>b.quinzena>a.quinzena?1:-1);

  const fichasFechadasNaoPagas=fichasMetal.filter(f=>f.soldadorId===sol.id&&f.status==='fechada'&&!f.pago&&f.quinzena!==q)
    .sort((a,b)=>b.quinzena>a.quinzena?1:-1);

  const fichasHistorico=[...fichasFechadasNaoPagas,...fichasPagas];

  if(fichasHistorico.length){
    html+='<div class="card" style="margin-top:4px">'
      +'<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">📁 Histórico de pagamentos</div>'
      +fichasHistorico.map((f,i)=>{
        const ganho=f.ganho||calcGanhoSoldador(sol.id,f.quinzena);
        const dpag=f.dataPagamento?fmtDate(f.dataPagamento):'—';
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;'+(i>0?'border-top:1px solid #f1f5f9':'')+'">'
          +'<div>'
          +'<div style="font-size:12px;font-weight:700">'+quinzenaLabel(f.quinzena)+'</div>'
          +'<div style="font-size:10px;color:#64748b">'+(f.pago?'Pago em '+dpag:'Aguardando pagamento')+'</div>'
          +'</div>'
          +'<div style="text-align:right">'
          +(f.pago?'<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:99px;font-weight:700">✓ Pago</span>'
            :'<span style="font-size:10px;background:#ede9fe;color:#4c1d95;padding:2px 8px;border-radius:99px;font-weight:700">Pendente</span>')
          +'<div style="font-size:15px;font-weight:800;color:'+(f.pago?'#059669':'#d97706')+';margin-top:3px">'+fmtR(ganho)+'</div>'
          +'</div>'
          +'</div>';
      }).join('')
      +'</div>';
  }

  return html;
}


function renderMeuDesempenho(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const uid=currentUser?.uid||'';
  const idUsuario=currentUserData?.id||'';
  const sol=soldadores.find(s=>s.usuarioUid===uid||s.usuarioUid===idUsuario);
  if(!sol) return '<div class="card"><div style="color:#64748b;text-align:center;padding:20px">Seu usuário não está vinculado a nenhum soldador.</div></div>';

  const c=avatarColor(soldadores.findIndex(s=>s.id===sol.id));
  const hoje_=today();
  const mesAtual=hoje_.slice(0,7);

  // ── Acumulado total
  const totalAcum=PECAS_METAL_FULL.reduce((s,p)=>s+totalPecaPeriodo(sol.id,p.id,'mes')*0,0)
    +apontSoldador(sol.id).reduce((s,a)=>s+Object.values(a.pecas||{}).reduce((x,v)=>x+(parseInt(v)||0),0),0);

  // ── Recorde semanal (total de peças em uma semana)
  // Agrupar apontamentos por semana (segunda a domingo)
  function getInicioSemana(dataStr){
    const d=new Date(dataStr+'T00:00:00');
    const dia=d.getDay(); // 0=dom
    const diff=dia===0?6:dia-1; // segunda=0
    const seg=new Date(d); seg.setDate(d.getDate()-diff);
    return seg.toISOString().slice(0,10);
  }

  const semanas={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const seg=getInicioSemana(a.data);
    if(!semanas[seg])semanas[seg]=0;
    Object.values(a.pecas||{}).forEach(v=>semanas[seg]+=(parseInt(v)||0));
  });
  const semanaAtual=getInicioSemana(hoje_);
  const totalSemanaAtual=semanas[semanaAtual]||0;
  const recordeSemanal=Math.max(0,...Object.values(semanas));
  const semanaAnterior=new Date(semanaAtual+'T00:00:00');
  semanaAnterior.setDate(semanaAnterior.getDate()-7);
  const totalSemanaAnterior=semanas[semanaAnterior.toISOString().slice(0,10)]||0;
  const diffSemana=totalSemanaAtual-totalSemanaAnterior;

  // ── Peças produzidas esta semana com suas metas individuais
  const pecasSemana=PECAS_METAL.map(p=>{
    const qtd=totalPecaPeriodo(sol.id,p.id,'semana');
    const meta=parseInt((configMetal.metas||{})[p.id])||0;
    const metaSab=Math.round(meta/2);
    const diaSemana=new Date(hoje_+'T00:00:00').getDay();
    const ehSabado=diaSemana===6;
    const metaSemanal=Math.round(meta*5.5);
    return {p,qtd,meta,metaSemanal,ehSabado};
  }).filter(x=>x.qtd>0);
  const totalSemanalMeta=pecasSemana.reduce((s,x)=>s+x.metaSemanal,0);

  // ── Streak (dias consecutivos com apontamento)
  const diasComApoint=new Set(apontSoldador(sol.id).map(a=>a.data));
  let streak=0;
  let d=new Date(hoje_+'T00:00:00');
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(diasComApoint.has(ds)){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }

  // ── Resumo mensal
  const mesesMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const m=a.data.slice(0,7);
    if(!mesesMap[m])mesesMap[m]=0;
    Object.values(a.pecas||{}).forEach(v=>mesesMap[m]+=(parseInt(v)||0));
  });
  const mesesList=Object.entries(mesesMap).sort((a,b)=>b[0]>a[0]?1:-1).slice(0,6);
  const maxMes=Math.max(1,...mesesList.map(m=>m[1]));

  // ── Melhor quinzena
  const quinzenasMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const q=getQuinzena(a.data);
    if(!quinzenasMap[q])quinzenasMap[q]=0;
    Object.values(a.pecas||{}).forEach(v=>quinzenasMap[q]+=(parseInt(v)||0));
  });
  const qAtual=getQuinzenaAtual();
  const totalQAtual=quinzenasMap[qAtual]||0;
  const recordeQuinzena=Math.max(0,...Object.values(quinzenasMap));
  const isRecordeQ=totalQAtual>0&&totalQAtual>=recordeQuinzena;

  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="width:52px;height:52px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800">${initials(sol.nome)}</div>
      <div>
        <div style="font-size:18px;font-weight:800">${sol.nome}</div>
        <div style="font-size:12px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;width:100%">
    <div class="metric" style="border-left:4px solid ${c}">
      <div class="metric-label">Total acumulado</div>
      <div class="metric-value" style="font-size:28px;color:${c}">${totalAcum}</div>
      <div style="font-size:11px;color:#94a3b8">peças soldadas</div>
    </div>
    <div class="metric" style="border-left:4px solid #f59e0b">
      <div class="metric-label">🔥 Sequência atual</div>
      <div class="metric-value" style="font-size:28px;color:#f59e0b">${streak}</div>
      <div style="font-size:11px;color:#94a3b8">dia${streak!==1?'s':''} seguido${streak!==1?'s':''}</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px;border-left:4px solid #3b82f6">
    <div style="font-size:13px;font-weight:700;color:#1e40af;margin-bottom:10px">📅 Esta semana</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:36px;font-weight:800;color:#1e40af">${totalSemanaAtual}</div>
        <div style="font-size:11px;color:#64748b">peças esta semana</div>
      </div>
      <div style="text-align:right">
        ${totalSemanaAtual>=recordeSemanal&&totalSemanaAtual>0
          ?'<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">🏆 Novo recorde!</div>'
          :`<div style="font-size:11px;color:#64748b">Recorde</div>
           <div style="font-size:20px;font-weight:700;color:#475569">${recordeSemanal}</div>`}
        <div style="font-size:11px;color:${diffSemana>=0?'#059669':'#dc2626'};margin-top:4px">
          ${diffSemana>=0?'↑':'↓'} ${Math.abs(diffSemana)} vs semana anterior
        </div>
      </div>
    </div>
    ${pecasSemana.length>0?`<div style="margin-top:10px">
      <div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:8px">Progresso por peça</div>
      ${pecasSemana.map(({p,qtd,metaSemanal})=>{
        const pct=metaSemanal>0?Math.min(100,Math.round(qtd/metaSemanal*100)):100;
        const cor=pct>=100?'#059669':pct>=70?'#f59e0b':'#3b82f6';
        return `<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
            <span style="color:#475569">${p.label}</span>
            <span style="font-weight:700;color:${cor}">${qtd}${metaSemanal>0?' / '+metaSemanal:''}</span>
          </div>
          <div style="height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${cor};border-radius:99px"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}
  </div>

  <div class="card" style="margin-bottom:14px;border-left:4px solid #8b5cf6">
    <div style="font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px">📆 Quinzena atual — ${quinzenaLabel(qAtual)}</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:36px;font-weight:800;color:#7c3aed">${totalQAtual}</div>
        <div style="font-size:11px;color:#64748b">peças na quinzena</div>
      </div>
      <div style="text-align:right">
        ${isRecordeQ
          ?'<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">🏆 Recorde de quinzena!</div>'
          :`<div style="font-size:11px;color:#64748b">Melhor quinzena</div>
           <div style="font-size:20px;font-weight:700;color:#475569">${recordeQuinzena}</div>`}
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Resumo mensal</div>
    ${mesesList.length?mesesList.map(([m,total])=>{
      const [ano,mes]=m.split('-');
      const nomeMes=MESES[parseInt(mes)-1]+' '+ano;
      const bar=Math.round(total/maxMes*100);
      const isMesAtual=m===mesAtual;
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <span style="font-size:12px;font-weight:${isMesAtual?700:400};color:${isMesAtual?'#1e40af':'#475569'}">${nomeMes}${isMesAtual?' ◀':''}</span>
          <span style="font-size:14px;font-weight:800;color:${isMesAtual?'#1e40af':'#1e293b'}">${total}</span>
        </div>
        <div style="height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${bar}%;background:${isMesAtual?'#3b82f6':c};border-radius:99px"></div>
        </div>
      </div>`;
    }).join(''):'<div style="color:#94a3b8;font-size:13px;text-align:center;padding:12px">Nenhuma produção registrada ainda.</div>'}
  </div>`;
}

function renderRankingMetal(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  if(!window._rankMetalPeriodo) window._rankMetalPeriodo='quinzena';
  const per=window._rankMetalPeriodo;
  const qAtual=getQuinzenaAtual();
  const hoje_=today();
  const mesAtual=hoje_.slice(0,7);

  function perLabel(){
    if(per==='quinzena') return quinzenaLabel(qAtual);
    const m=parseInt(mesAtual.slice(5,7))-1;
    return MESES[m]+' '+mesAtual.slice(0,4);
  }

  function btnPer(v,l){
    const ativo=per===v;
    return '<button class="btn btn-sm '+(ativo?'btn-primary':'btn-ghost')+'"'
      +' onclick="window._setRankMetalPeriodo(&quot;'+v+'&quot;)">'+l+'</button>';
  }
  const filtroPerHtml='<div style="display:flex;gap:8px;margin-bottom:16px">'
    +btnPer('quinzena','Quinzena')
    +btnPer('mes','Mensal')
    +'</div>';

  function qtdSoldador(soldadorId, pecaId){
    return totalPecaPeriodo(soldadorId, pecaId, per==='quinzena'?qAtual:mesAtual);
  }

  // Só peças com produção no período
  const pecasComProd=PECAS_METAL.filter(p=>
    soldadores.some(s=>qtdSoldador(s.id,p.id)>0)
  );

  if(!pecasComProd.length){
    return `<div style="background:#1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px;width:100%">
      <div style="font-size:16px;font-weight:800;color:#fff">⚙️ Ranking Metalúrgica</div>
      <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px">${perLabel()}</div>
    </div>`+filtroPerHtml+'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma produção registrada no período.</div></div>';
  }

  const cardsPecas=pecasComProd.map(p=>{
    const ranking=soldadores.map(s=>({s,qtd:qtdSoldador(s.id,p.id)}))
      .filter(x=>x.qtd>0)
      .sort((a,b)=>b.qtd-a.qtd);
    if(!ranking.length) return '';
    const maxQtd=ranking[0].qtd;
    const medalhas=['🥇','🥈','🥉'];
    const rows=ranking.map(({s,qtd},i)=>{
      const ci=soldadores.findIndex(x=>x.id===s.id);
      const cor=avatarColor(ci);
      const pct=Math.round(qtd/maxQtd*100);
      const barCor=i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#cd7f32':'#3b82f6';
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">'
        +'<span style="font-size:16px;width:24px;text-align:center">'+(i<3?medalhas[i]:'<span style="font-size:12px;color:#64748b">'+(i+1)+'</span>')+'</span>'
        +'<div style="width:36px;height:36px;border-radius:50%;background:'+cor+'22;color:'+cor+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+initials(s.nome)+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:700">'+s.nome+'</div>'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px;margin-top:4px;overflow:hidden">'
        +'<div style="height:100%;width:'+pct+'%;background:'+barCor+';border-radius:99px"></div>'
        +'</div></div>'
        +'<div style="font-size:20px;font-weight:800;color:'+barCor+'">'+qtd+'</div>'
        +'</div>';
    }).join('');
    return '<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
      +'<div style="font-size:14px;font-weight:700;color:#1e293b">'+p.label+'</div>'
      +'<div style="font-size:11px;color:#64748b">'+perLabel()+'</div>'
      +'</div>'
      +rows+'</div>';
  }).join('');

  return `<div style="background:#1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px;width:100%">
    <div style="font-size:16px;font-weight:800;color:#fff">⚙️ Ranking Metalúrgica</div>
    <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px">${perLabel()}</div>
  </div>`+filtroPerHtml+cardsPecas;
}
