      const btnFechar=isAdmin&&status==='aberta'&&totalPecas>0
        ?`<button class="btn btn-sm btn-success" onclick="window._fecharFichaMetal('${sol.id}','${q}')">Fechar ficha</button>`:'';
      const btnPagar='';

      // Histórico por dia na quinzena
      const [qAno,qMes,qParte]=q.split('-');
      const diaIni=qParte==='Q1'?1:16;
      const diaFim=qParte==='Q1'?15:new Date(parseInt(qAno),parseInt(qMes),0).getDate();
      const apontsDaQ=apontSoldador(sol.id).filter(a=>getQuinzena(a.data)===q);
      const diasComApont=[...new Set(apontsDaQ.map(a=>a.data))].sort();
      let historicoHtml='';
      if(diasComApont.length>0){
        const vProdH=configMetal.valoresProd||{};
        const vMetaH=configMetal.valoresMeta||{};
        const vRefH=configMetal.valoresRef||{};
        const metasH=configMetal.metas||{};
        const linhas=diasComApont.map(dia=>{
          const apontsDia=apontsDaQ.filter(a=>a.data===dia);
          const totalDia=apontsDia.reduce((s,a)=>s+Object.values(a.pecas||{}).reduce((ss,v)=>ss+(parseInt(v)||0),0),0);
          const pecasDia=PECAS_METAL_FULL.filter(p=>apontsDia.some(a=>parseInt((a.pecas||{})[p.id])>0));
          const detalDia=pecasDia.map(p=>{
            const qtdP=apontsDia.reduce((s,a)=>s+(parseInt((a.pecas||{})[p.id])||0),0);
            return `<span style="font-size:10px;color:#64748b">${p.label}: <strong>${qtdP}</strong></span>`;
          }).join(' · ');
          const [,, dd]=dia.split('-');
          // Calcular ganho do dia
          const ganhoDia=calcGanhoSoldador(sol.id, dia);
          const corGanho=ganhoDia>0?'#059669':'#94a3b8';
          return `<tr style="border-bottom:1px solid #f1f5f9">
            <td style="padding:5px 8px;font-size:12px;font-weight:600;color:#374151;white-space:nowrap">${dd}/${qMes}/${qAno}</td>
            <td style="padding:5px 8px;font-size:12px;font-weight:700;color:#1e40af;text-align:center">${totalDia}</td>
            <td style="padding:5px 8px;font-size:12px;font-weight:700;color:${corGanho};text-align:right;white-space:nowrap">${ganhoDia>0?fmtR(ganhoDia):'—'}</td>
            <td style="padding:5px 8px;font-size:11px;color:#64748b">${detalDia}</td>
          </tr>`;
        }).join('');
        historicoHtml=`<div style="margin-top:10px;border-top:1px solid #e2e8f0;padding-top:8px">
          <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Histórico por dia</div>
          <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse">
            <thead><tr style="background:#f8fafc">
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left">Data</th>
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#94a3b8;text-align:center">Total</th>
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#94a3b8;text-align:right">Ganho</th>
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#94a3b8;text-align:left">Detalhes</th>
            </tr></thead>
            <tbody>${linhas}</tbody>
            <tfoot><tr style="background:#f0f9ff">
              <td style="padding:5px 8px;font-size:11px;font-weight:700;color:#1e40af">Total quinzena</td>
              <td style="padding:5px 8px;font-size:12px;font-weight:800;color:#1e40af;text-align:center">${totalPecas}</td>
              <td style="padding:5px 8px;font-size:12px;font-weight:800;color:#059669;text-align:right">${fmtR(ganho)}</td>
              <td></td>
            </tr></tfoot>
          </table>
          </div>
        </div>`;
      }

      html+=`<div class="card" style="margin-bottom:8px${status==='fechada'?';border-left:4px solid '+(pago?'#10b981':'#8b5cf6'):';border-left:4px solid #3b82f6'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${(detalhe||historicoHtml)?'10px':'0'}">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:42px;height:42px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">${initials(sol.nome)}</div>
            <div>
              <div style="font-size:14px;font-weight:700">${sol.nome}</div>
              <div style="font-size:11px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'} · ${totalPecas} peças</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
            ${badgeStatus}
            <div style="text-align:right">
              <div style="font-size:10px;color:#64748b">a receber</div>
              <div style="font-size:18px;font-weight:800;color:${pago?'#059669':'#d97706'}">${fmtR(ganho)}</div>
            </div>
            ${btnFechar}${btnPagar}
          </div>
        </div>
        ${detalhe?`<div style="display:flex;flex-wrap:wrap;gap:2px">${detalhe}</div>`:''}
        ${historicoHtml}
      </div>`;
    });
  });

  return html||'<div class="card"><div style="color:#94a3b8;text-align:center;padding:20px">Nenhuma ficha ainda.</div></div>';
}

window._fecharFichaMetal=async(soldadorId,quinzena)=>{
  const sol=soldadores.find(s=>s.id===soldadorId);
  showModal('Fechar ficha — '+sol?.nome,
    `<div style="font-size:13px;color:#444;line-height:1.6">Fechar a ficha de <strong>${sol?.nome}</strong> referente a <strong>${quinzenaLabel(quinzena)}</strong>?<br><br>Após fechar, o financeiro será notificado para efetuar o pagamento.</div>`,
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-success btn-sm" onclick="window._confirmarFecharFichaMetal(&quot;'+soldadorId+'&quot;,&quot;'+quinzena+'&quot;)">Fechar ficha</button>');
};

window._confirmarFecharFichaMetal=async(soldadorId,quinzena)=>{
  closeModal();
  const sol=soldadores.find(s=>s.id===soldadorId);
  const ganho=calcGanhoSoldador(soldadorId,quinzena);
  // Cria ou atualiza ficha
  const existing=getFichaMetal(soldadorId,quinzena);
  if(existing){
    await updateDoc(doc(db,'fichas_metal',existing.id),{status:'fechada',dataFechamento:today(),ganho});
  } else {
    await addDoc(collection(db,'fichas_metal'),{soldadorId,quinzena,status:'fechada',pago:false,dataFechamento:today(),ganho});
  }
  // Notificar financeiro
  await addDoc(collection(db,'notificacoes'),{
    tipo:'ficha_metal_fechada',
    soldadorNome:sol?.nome||'',
    quinzena,quinzenaLabel:quinzenaLabel(quinzena),
    ganho,data:today(),lida:false,criadaEm:new Date().toISOString(),
  });
  showToast('Ficha fechada! Financeiro notificado.');
};

window._pagarFichaMetal=async(fichaId)=>{
  showModal('Confirmar pagamento',
    '<div style="font-size:13px;color:#444">Confirmar o pagamento desta ficha?</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._confirmarPagarFichaMetal(&quot;'+fichaId+'&quot;)">Confirmar pagamento</button>');
};
window._confirmarPagarFichaMetal=async id=>{
  closeModal();
  await updateDoc(doc(db,'fichas_metal',id),{pago:true,dataPagamento:today()});
  showToast('Pagamento registrado!');
};

const MANUT_SETORES=['Metalúrgica','Fitas','Grades','Tapeçaria','Espuma','Pintura','Oficina','Outro'];
const MANUT_TIPOS=[
  {id:'preventiva', label:'Preventiva', cor:'#1d4ed8', bg:'#dbeafe'},
  {id:'corretiva',  label:'Corretiva',  cor:'#dc2626', bg:'#fee2e2'},
  {id:'oleo',       label:'Troca de Óleo', cor:'#92400e', bg:'#fef3c7'},
];

function renderTabManutencao(tab){
  try{
    if(tab==='man_painel')    return renderManPainel();
    if(tab==='man_maquinas')  return renderManMaquinas();
    if(tab==='man_relatorio') return renderManRelatorio();
    return renderManPainel();
  }catch(e){
    console.error('Erro renderTabManutencao:',e);
    return '<div class="card" style="color:#dc2626;padding:16px">Erro: '+e.message+'</div>';
  }
}

// ── Painel ───────────────────────────────────────────────────────
function renderManPainel(){
  // Helper: calcular status de prazo
  function calcPrazo(maquinaId, tipos, periodMeses){
    if(!periodMeses) return null;
    const ult=manutRegistros.filter(r=>r.maquinaId===maquinaId&&tipos.includes(r.tipo)).sort((a,b)=>b.data>a.data?1:-1)[0];
    if(!ult) return {label:'Sem histórico',cor:'#94a3b8',dias:null};
    const prox=new Date(ult.data+'T12:00:00');
    prox.setMonth(prox.getMonth()+periodMeses);
    const dias=Math.round((prox-new Date())/86400000);
    if(dias<0) return {label:'Vencida há '+Math.abs(dias)+'d',cor:'#dc2626',dias,ult};
    if(dias<=15) return {label:'Vence em '+dias+'d',cor:'#d97706',dias,ult};
    return {label:'Próxima em '+dias+'d',cor:'#059669',dias,ult};
  }

  // Cards de status resumido
  const operando=manutMaquinas.filter(m=>!m.parada).length;
  const paradas=manutMaquinas.filter(m=>m.parada).length;
  let html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#059669,#10b981)"><div><div class="stat-label">Operando</div><div class="stat-value">'+operando+'</div></div></div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#dc2626,#ef4444)"><div><div class="stat-label">Paradas</div><div class="stat-value">'+paradas+'</div></div></div>'
    +'</div>';

  // Cards de máquinas por setor — clicável
  MANUT_SETORES.forEach(setor=>{
    const maqSetor=manutMaquinas.filter(m=>m.setor===setor);
    if(!maqSetor.length) return;
    html+='<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">'+setor+'</div>';
    maqSetor.forEach(m=>{
      const parada=m.parada;
      const cor=parada?'#dc2626':'#059669';
      const bg=parada?'#fff5f5':'#f0fdf4';
      const border=parada?'#fca5a5':'#86efac';

      // Tempo parada
      let tempoParada='';
      if(parada&&m.paradaDesde){
        const diff=new Date()-new Date(m.paradaDesde);
        const h=Math.floor(diff/3600000);
        const d=Math.floor(h/24);
        tempoParada=d>0?d+'d '+(h%24)+'h':h+'h';
      }

      // Prazos
      const prazoPrev=calcPrazo(m.id,['preventiva','corretiva'],m.periodMeses);
      const prazoOleo=calcPrazo(m.id,['oleo'],m.periodOleoMeses);
      const prazoHtml=(prazoPrev?'<span style="font-size:10px;font-weight:600;color:'+prazoPrev.cor+'">🔧 '+prazoPrev.label+'</span>  ':'')
        +(prazoOleo?'<span style="font-size:10px;font-weight:600;color:'+prazoOleo.cor+'">🛢️ '+prazoOleo.label+'</span>':'');
      const ultimaReg=manutRegistros.filter(r=>r.maquinaId===m.id)[0];

      html+='<div style="background:'+bg+';border:2px solid '+border+';border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer" onclick="window._manAbrirMaquina(&quot;'+m.id+'&quot;)">'
        +'<div style="display:flex;align-items:center;justify-content:space-between">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:28px">'+(parada?'🔴':'✅')+'</span>'
        +'<div>'
        +'<div style="font-size:15px;font-weight:800;color:#1e293b">'+m.nome+'</div>'
        +'<div style="font-size:11px;font-weight:700;color:'+cor+'">'+(parada?'PARADA'+(tempoParada?' há '+tempoParada:''):'OPERANDO')+'</div>'
        +(m.paradaMotivo?'<div style="font-size:11px;color:#dc2626">'+m.paradaMotivo+'</div>':'')
        +'</div></div>'
        +'<span style="font-size:22px;color:#94a3b8">›</span>'
        +'</div>'
        +(prazoHtml?'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid '+(parada?'#fecaca':'#bbf7d0')+'">'+prazoHtml+'</div>':'')
        +(ultimaReg?'<div style="font-size:10px;color:#94a3b8;margin-top:4px">Última manut: '+fmtDate(ultimaReg.data)+' · '+(MANUT_TIPOS.find(t=>t.id===ultimaReg.tipo)?.label||ultimaReg.tipo)+'</div>':'')
        +'</div>';
    });
  });

  if(!manutMaquinas.length) html+='<div class="card" style="text-align:center;color:#94a3b8;padding:24px">Nenhuma máquina cadastrada.</div>';
  return html;
}


// ── Máquinas ─────────────────────────────────────────────────────
function renderManMaquinas(){
  const podeEditar=can('admin')||['admin','proprietario'].includes(currentUserData?.perfil);
  let html='<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'
    +'<button class="btn btn-primary btn-sm" onclick="window._manNovaMaquina()">+ Máquina</button>'
    +'</div>';

  MANUT_SETORES.forEach(setor=>{
    const maq=manutMaquinas.filter(m=>m.setor===setor);
    if(!maq.length) return;
    html+='<div class="section-label">'+setor+'</div>';
    maq.forEach(m=>{
      const regs=manutRegistros.filter(r=>r.maquinaId===m.id);
      const custoTotal=regs.reduce((s,r)=>s+(parseFloat(r.custo)||0),0);
      const ultima=regs[0];
      const ultimaPreventiva=regs.find(r=>r.tipo==='preventiva'||r.tipo==='corretiva');
      html+='<div class="card" style="margin-bottom:8px;border-left:4px solid '+(m.parada?'#dc2626':'#059669')+'">'
        +'<div style="display:flex;align-items:center;justify-content:space-between">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:24px">'+(m.parada?'🔴':'✅')+'</span>'
        +'<div>'
        +'<div style="font-size:14px;font-weight:700">'+m.nome+'</div>'
        +'<div style="font-size:11px;color:#64748b">'+m.setor+(m.modelo?' · '+m.modelo:'')+'</div>'
        +(()=>{
          let info='';
          if(ultima) info='<div style="font-size:10px;color:#94a3b8">Última manut: '+fmtDate(ultima.data)+' · '+(MANUT_TIPOS.find(t=>t.id===ultima.tipo)?.label||ultima.tipo)+'</div>';
          else info='<div style="font-size:10px;color:#94a3b8">Sem manutenções registradas</div>';
          if(m.periodMeses){
            info+='<div style="font-size:10px;color:#64748b">Preventiva: a cada '+m.periodMeses+' mês'+(m.periodMeses>1?'es':'')+'</div>';
            if(ultimaPreventiva){
              const ultimaData=new Date(ultimaPreventiva.data+'T12:00:00');
              const proxData=new Date(ultimaData);
              proxData.setMonth(proxData.getMonth()+m.periodMeses);
              const hoje_=new Date();
              const diasRestantes=Math.round((proxData-hoje_)/86400000);
              const vencida=diasRestantes<0;
              const proxima=!vencida&&diasRestantes<=15;
              if(vencida) info+='<div style="font-size:10px;font-weight:700;color:#dc2626">⚠️ Vencida há '+Math.abs(diasRestantes)+'d</div>';
              else if(proxima) info+='<div style="font-size:10px;font-weight:700;color:#d97706">⏰ Vence em '+diasRestantes+'d</div>';
              else info+='<div style="font-size:10px;color:#059669">✅ Próxima em '+diasRestantes+'d</div>';
            }
          }
          if(m.periodOleoMeses){
            info+='<div style="font-size:10px;color:#92400e">Troca de óleo: a cada '+m.periodOleoMeses+' mês'+(m.periodOleoMeses>1?'es':'')+'</div>';
            const ultimaOleo=manutRegistros.filter(r=>r.maquinaId===m.id&&r.tipo==='oleo').sort((a,b)=>b.data>a.data?1:-1)[0];
            if(ultimaOleo){
              const proxOleo=new Date(ultimaOleo.data+'T12:00:00');
              proxOleo.setMonth(proxOleo.getMonth()+m.periodOleoMeses);
              const diasO=Math.round((proxOleo-new Date())/86400000);
              if(diasO<0) info+='<div style="font-size:10px;font-weight:700;color:#dc2626">⚠️ Óleo vencido há '+Math.abs(diasO)+'d</div>';
              else if(diasO<=15) info+='<div style="font-size:10px;font-weight:700;color:#d97706">🛢️ Trocar óleo em '+diasO+'d</div>';
              else info+='<div style="font-size:10px;color:#059669">🛢️ Próxima troca em '+diasO+'d</div>';
            }
          }
          return info;
        })()
        +'</div></div>'
        +'<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">'
        +'<div style="font-size:11px;color:#64748b">'+regs.length+' manut.</div>'
        +'<div style="font-size:13px;font-weight:700;color:#92400e">'+fmtMoeda(custoTotal)+'</div>'
        +(podeEditar?'<button class="btn btn-sm btn-warn" style="font-size:11px" onclick="window._manEditarMaquina(\''+m.id+'\')">Editar</button>':'')
        +'</div>'
        +'</div>'
        +'</div>';
    });
  });

  if(!manutMaquinas.length) html+='<div class="card" style="text-align:center;color:#94a3b8;padding:20px">Nenhuma máquina cadastrada.</div>';
  return html;
}

// ── Relatórios ───────────────────────────────────────────────────
function renderManRelatorio(){
  if(!window._manRelFiltroMaq) window._manRelFiltroMaq='';
  if(!window._manRelFiltroTipo) window._manRelFiltroTipo='';
  if(!window._manRelAno) window._manRelAno=today().slice(0,4);

  const anos=[...new Set(manutRegistros.map(r=>(r.data||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!anos.includes(window._manRelAno)&&anos.length) window._manRelAno=anos[0];

  const filtrados=manutRegistros.filter(r=>{
    if(window._manRelFiltroMaq&&r.maquinaId!==window._manRelFiltroMaq) return false;
    if(window._manRelFiltroTipo&&r.tipo!==window._manRelFiltroTipo) return false;
    if(window._manRelAno&&!(r.data||'').startsWith(window._manRelAno)) return false;
    return true;
  });
  const custoTotal=filtrados.reduce((s,r)=>s+(parseFloat(r.custo)||0),0);

  // Filtros
  const selectAno='<select onchange="window._manSetRelAno(this.value)" style="font-size:12px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 10px">'
    +anos.map(a=>'<option value="'+a+'"'+(a===window._manRelAno?' selected':'')+'>'+a+'</option>').join('')+'</select>';
  const selectMaq='<select onchange="window._manSetRelFiltroMaq(this.value)" style="font-size:12px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 10px">'
    +'<option value="">Todas</option>'
    +manutMaquinas.map(m=>'<option value="'+m.id+'"'+(m.id===window._manRelFiltroMaq?' selected':'')+'>'+m.nome+'</option>').join('')+'</select>';
  const selectTipo='<select onchange="window._manSetRelFiltroTipo(this.value)" style="font-size:12px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 10px">'
    +'<option value="">Todos</option>'
    +MANUT_TIPOS.map(t=>'<option value="'+t.id+'"'+(t.id===window._manRelFiltroTipo?' selected':'')+'>'+t.label+'</option>').join('')+'</select>';

  let html='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+selectAno+selectMaq+selectTipo+'</div>';

  // Cards resumo
  const porTipo={};
  MANUT_TIPOS.forEach(t=>{ porTipo[t.id]={qtd:0,custo:0}; });
  filtrados.forEach(r=>{
    if(porTipo[r.tipo]){ porTipo[r.tipo].qtd++; porTipo[r.tipo].custo+=parseFloat(r.custo)||0; }
  });
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:16px">';
  MANUT_TIPOS.forEach(t=>{
    html+='<div style="background:'+t.bg+';border-radius:12px;padding:10px;text-align:center">'
      +'<div style="font-size:10px;font-weight:700;color:'+t.cor+';margin-bottom:4px">'+t.label+'</div>'
      +'<div style="font-size:22px;font-weight:900;color:'+t.cor+'">'+porTipo[t.id].qtd+'</div>'
      +'<div style="font-size:10px;color:'+t.cor+';opacity:.8">'+fmtMoeda(porTipo[t.id].custo)+'</div>'
      +'</div>';
  });
  html+='</div>';

  // Total
  html+='<div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'
    +'<div style="font-size:13px;color:#64748b">'+filtrados.length+' registro'+( filtrados.length!==1?'s':'')+' em '+window._manRelAno+'</div>'
    +'<div style="font-size:18px;font-weight:800;color:#92400e">'+fmtMoeda(custoTotal)+'</div>'
    +'</div>';

  // Custo por máquina
  if(filtrados.length){
    const porMaq={};
    filtrados.forEach(r=>{
      if(!porMaq[r.maquinaId]) porMaq[r.maquinaId]={qtd:0,custo:0};
      porMaq[r.maquinaId].qtd++;
      porMaq[r.maquinaId].custo+=parseFloat(r.custo)||0;
    });
    const maqOrdenadas=Object.entries(porMaq).sort((a,b)=>b[1].custo-a[1].custo);
    html+='<div class="card" style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">Custo por máquina</div>';
    maqOrdenadas.forEach(([mid,d])=>{
      const m=manutMaquinas.find(x=>x.id===mid);
      const pct=custoTotal>0?Math.round(d.custo/custoTotal*100):0;
      html+='<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
        +'<span style="font-size:12px;font-weight:600">'+(m?.nome||'—')+'</span>'
        +'<span style="font-size:12px;color:#92400e;font-weight:700">'+fmtMoeda(d.custo)+'</span>'
        +'</div>'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px">'
        +'<div style="height:100%;width:'+pct+'%;background:#f59e0b;border-radius:99px"></div>'
        +'</div>'
        +'</div>';
    });
    html+='</div>';
  }

  // Lista de registros
  if(!filtrados.length){
    html+='<div class="card" style="text-align:center;color:#94a3b8;padding:20px">Nenhuma manutenção registrada.</div>';
    return html;
  }
  html+='<div class="card"><div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">Histórico</div>';
  html+=filtrados.map((r,i)=>{
    const maq=manutMaquinas.find(m=>m.id===r.maquinaId);
    const tipo=MANUT_TIPOS.find(t=>t.id===r.tipo)||{label:r.tipo,cor:'#475569',bg:'#f1f5f9'};
    return '<div style="padding:8px 0;'+(i>0?'border-top:1px solid #f8fafc':'')+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between">'
      +'<div>'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'
      +'<span style="font-size:10px;font-weight:700;background:'+tipo.bg+';color:'+tipo.cor+';padding:1px 7px;border-radius:99px">'+tipo.label+'</span>'
      +'<span style="font-size:11px;color:#64748b">'+fmtDate(r.data)+'</span>'
      +'</div>'
      +'<div style="font-size:13px;font-weight:600">'+(maq?.nome||'—')+'</div>'
      +(r.descricao?'<div style="font-size:11px;color:#64748b">'+r.descricao+'</div>':'')
      +(r.responsavel?'<div style="font-size:10px;color:#94a3b8">'+r.responsavel+'</div>':'')
      +'</div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:14px;font-weight:700;color:#92400e">'+(r.custo?fmtMoeda(parseFloat(r.custo)):'—')+'</div>'
      +'<button class="btn btn-sm btn-danger" style="font-size:10px;margin-top:4px" onclick="window._manExcluirRegistro(\''+r.id+'\')">✕</button>'
      +'</div></div></div>';
  }).join('');
  html+='</div>';
  return html;
}

window._manAbrirMaquina=function(id){
  const m=manutMaquinas.find(x=>x.id===id);
  if(!m) return;

  if(m.parada){
    // Máquina parada — pergunta se fez corretiva
    const desde=m.paradaDesde?new Date(m.paradaDesde):null;
    const diff=desde?new Date()-desde:0;
    const h=Math.floor(diff/3600000);
    const d=Math.floor(h/24);
    const tempo=d>0?d+'d '+(h%24)+'h':h+'h';
    showModal('🔴 '+m.nome+' — Parada'+(tempo?' há '+tempo:''),
      (m.paradaMotivo?'<div style="font-size:12px;color:#dc2626;margin-bottom:12px">Motivo: '+m.paradaMotivo+'</div>':'')
      +'<div style="font-size:13px;color:#444;margin-bottom:14px">A manutenção corretiva foi realizada?</div>'
      +'<div class="form-group"><label>O que foi feito (opcional)</label>'
      +'<textarea id="mc-desc" rows="2" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 10px;width:100%;resize:none"></textarea></div>'
      +'<div class="form-group"><label>Custo (R$) — opcional</label>'
      +'<input type="number" id="mc-custo" min="0" step="0.01" placeholder="0,00" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 10px;width:100%"></div>',

      +'<button class="btn btn-sm btn-primary" onclick="window._manCorretivaConcluida(\''+id+'\')">✅ Sim, voltou!</button>');
  } else {
    // Máquina operando — menu de ações
    showModal('🔧 '+m.nome,
      '<div style="display:flex;flex-direction:column;gap:10px">'
      +'<button onclick="window._manAcao(\'parou\',\''+id+'\')" style="padding:16px;border-radius:12px;background:#fee2e2;border:2px solid #fca5a5;font-size:15px;font-weight:700;color:#dc2626;cursor:pointer;text-align:left">🔴 A máquina parou</button>'

// ── helpers financeiros ──────────────────────────────────────────
function finPagamentosTodos(){
  // Recolhe todas as fichas fechadas/canceladas pagas ou a pagar de todos os setores
  const lista=[];

  // Enrolamento terceirizado
  fichas.filter(f=>f.status==='fechada'||(f.status==='cancelada'&&(f.recolhimentos||[]).some(r=>!r.administrativo)&&calcularPagamentoCancelada(f)>0))
    .forEach(f=>{
      const enr=getEnr(f.enroladorId);
      const isCancelada=f.status==='cancelada';
      const valor=isCancelada?calcularPagamentoCancelada(f):calcularPagamento(f);
      if(valor<=0) return;
      lista.push({id:f.id,setor:'Enrolamento Terc.',pessoa:enr?.nome||'—',valor,pago:!!f.pago,
        dataPagamento:f.dataPagamento||null,dataRef:f.dataAbertura||'',tipo:'ficha',fichaObj:f,setorKey:'enrolamento_terc'});
    });

  // Metalúrgica
  fichasMetal.filter(f=>f.status==='fechada').forEach(f=>{
    const sol=soldadores.find(s=>s.id===f.soldadorId);
    const valor=f.ganho||calcGanhoSoldador(f.soldadorId,f.quinzena);
    if(valor<=0) return;
    lista.push({id:f.id,setor:'Metalúrgica',pessoa:sol?.nome||'—',valor,pago:!!f.pago,
      dataPagamento:f.dataPagamento||null,dataRef:f.quinzena||'',tipo:'quinzena',fichaObj:f,setorKey:'metalurgica'});
  });

  // Grades
  fichasGrad.filter(f=>f.status==='fechada').forEach(f=>{
    const grad=gradistas.find(g=>g.id===f.gradId);
    const valor=f.ganho||calcGanhoGrad(f.apontamentos||[]);
    if(valor<=0) return;
    lista.push({id:f.id,setor:'Grades',pessoa:grad?.nome||'—',valor,pago:!!f.pago,
      dataPagamento:f.dataPagamento||null,dataRef:f.dataFechamento||f.quinzena||'',tipo:'quinzena',fichaObj:f,setorKey:'grades'});
  });

  // Enrolamento interno
  fichasInt.filter(f=>f.status==='fechada').forEach(f=>{
    const enrI=enroladoresInt.find(e=>e.id===f.enroladorId);
    const valor=calcularPagamentoInt(f);
    if(valor<=0) return;
    lista.push({id:f.id,setor:'Enrol. Interno',pessoa:enrI?.nome||'—',valor,pago:!!f.pago,
      dataPagamento:f.dataPagamento||null,dataRef:f.dataFechamento||f.dataAbertura||'',tipo:'ficha',fichaObj:f,setorKey:'enrolamento_int'});
  });

  // Bônus (Enrolamento Terc.)
  const mesesComBonus=[...new Set([
    ...Object.keys(bonusPagos),
    ...enroladores.filter(e=>e.apontadorPerfil==='apontador1').flatMap(e=>{
      // meses dos últimos 12 meses que tiveram bonus
      const meses=[];
      const hoje=today();
      for(let i=0;i<12;i++){
        const d=new Date(hoje.slice(0,4),parseInt(hoje.slice(5,7))-1-i,1);
        meses.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
      }
      return meses;
    }),
  ])];
  mesesComBonus.forEach(anoMes=>{
    const bonusDoMes=getBonusDoMes(anoMes);
    bonusDoMes.forEach(b=>{
      const chave=b.enroladorId+'-'+anoMes;
      const pagObj=bonusPagos[chave];
      const pago=!!pagObj;
      lista.push({
        id:'bonus-'+chave,
        setor:'Bônus',
        pessoa:b.enrNome,
        valor:b.totalBonus,
        pago,
        dataPagamento:pagObj?.pagoEm||null,
        dataRef:anoMes,
        tipo:'bonus',
        fichaObj:null,
        setorKey:'bonus',
        bonusEnroladorId:b.enroladorId,
        bonusAnoMes:anoMes,
      });
    });
  });

  return lista.sort((a,b)=>{
    if(!a.pago&&b.pago) return -1;
    if(a.pago&&!b.pago) return 1;
    return (b.dataRef||'')>(a.dataRef||'')?1:-1;
  });
}

function finComprasTodos(){
  return (almMovimentos||[]).filter(m=>m.tipo==='entrada'&&m.custoTotal>0)
    .map(m=>{
      const item=almItens.find(i=>i.id===m.itemId);
      return {...m,itemDesc:item?.descricao||'Item desconhecido',itemUnidade:item?.unidade||''};
    })
    .sort((a,b)=>(b.data||'')>(a.data||'')?1:-1);
}

// ── Dashboard ───────────────────────────────────────────────────
function renderFinDashboard(){
  const pagamentos=finPagamentosTodos();
  const pendentes=pagamentos.filter(p=>!p.pago);
  const pagas=pagamentos.filter(p=>p.pago);
  const totalPendente=pendentes.reduce((s,p)=>s+p.valor,0);
  const totalPago=pagas.reduce((s,p)=>s+p.valor,0);

  const compras=finComprasTodos();
  const totalCompras=compras.reduce((s,c)=>s+(parseFloat(c.custoTotal)||0),0);

  // Por setor (pendente)
  const porSetor={};
  pendentes.forEach(p=>{
    if(!porSetor[p.setor]) porSetor[p.setor]={nome:p.setor,valor:0,qtd:0};
    porSetor[p.setor].valor+=p.valor;
    porSetor[p.setor].qtd++;
  });

  // Meses com gastos (pagamentos pagos)
  const porMes={};
  pagas.forEach(p=>{
    const m=(p.dataPagamento||p.dataRef||'').slice(0,7);
    if(!m) return;
    if(!porMes[m]) porMes[m]=0;
    porMes[m]+=p.valor;
  });
  const mesesOrdenados=Object.keys(porMes).sort().reverse().slice(0,6).reverse();

  const MESES_N=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesLabel=m=>{const[y,mo]=m.split('-');return MESES_N[parseInt(mo)-1]+'/'+y.slice(2);};

  const maxBarVal=Math.max(...mesesOrdenados.map(m=>porMes[m]),1);

  let html='';

  // Cards de resumo
  html+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">
    <div class="card" style="background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;text-align:center;padding:18px">
      <div style="font-size:10px;font-weight:700;opacity:.8;margin-bottom:4px">A PAGAR</div>
      <div style="font-size:28px;font-weight:900">${fmtMoeda(totalPendente)}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${pendentes.length} pendência${pendentes.length!==1?'s':''}</div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,#059669,#10b981);color:#fff;text-align:center;padding:18px">
      <div style="font-size:10px;font-weight:700;opacity:.8;margin-bottom:4px">TOTAL PAGO</div>
      <div style="font-size:28px;font-weight:900">${fmtMoeda(totalPago)}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${pagas.length} pagamento${pagas.length!==1?'s':''}</div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;text-align:center;padding:18px">
      <div style="font-size:10px;font-weight:700;opacity:.8;margin-bottom:4px">COMPRAS DE MATERIAL</div>
      <div style="font-size:28px;font-weight:900">${fmtMoeda(totalCompras)}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${compras.length} entradas</div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;text-align:center;padding:18px">
      <div style="font-size:10px;font-weight:700;opacity:.8;margin-bottom:4px">GASTO TOTAL GERAL</div>
      <div style="font-size:28px;font-weight:900">${fmtMoeda(totalPago+totalCompras)}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">mão de obra + materiais</div>
    </div>
  </div>`;

  // Pendências por setor
  if(Object.keys(porSetor).length){
    html+='<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">⚠️ Pendências por setor</div>';
    html+=Object.values(porSetor).map(s=>{
    const pLabel=s.qtd!==1?'s':'';
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9">'
      +'<div style="font-size:13px;font-weight:600">'+s.nome+'</div>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<span style="font-size:11px;color:#64748b">'+s.qtd+' pendência'+pLabel+'</span>'
      +'<span style="font-size:15px;font-weight:800;color:#dc2626">'+fmtMoeda(s.valor)+'</span>'
      +'</div></div>';
  }).join('');
    html+='</div>';
  }

  // Gráfico de barras de pagamentos por mês
  if(mesesOrdenados.length){
    html+='<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:16px">📊 Pagamentos de mão de obra por mês</div>';
    html+='<div style="display:flex;align-items:flex-end;gap:10px;height:120px">';
    html+=mesesOrdenados.map(m=>{
      const val=porMes[m];
      const h=Math.round((val/maxBarVal)*100);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-size:9px;color:#64748b;font-weight:700">${fmtMoeda(val).replace('R$','').trim()}</div>
        <div style="width:100%;background:linear-gradient(180deg,#3b82f6,#1e40af);border-radius:6px 6px 0 0;height:${h}%;min-height:4px"></div>
        <div style="font-size:9px;color:#94a3b8">${mesLabel(m)}</div>
      </div>`;
    }).join('');
    html+='</div></div>';
  }

  // Últimas transações (mistura pagamentos + compras recentes)
  const ultimas=[
    ...pagas.slice(0,5).map(p=>({data:p.dataPagamento||p.dataRef,desc:p.pessoa+' — '+p.setor,valor:p.valor,tipo:'pagamento'})),
    ...compras.slice(0,5).map(c=>({data:c.data,desc:c.itemDesc,valor:parseFloat(c.custoTotal)||0,tipo:'compra'})),
  ].sort((a,b)=>(b.data||'')>(a.data||'')?1:-1).slice(0,8);

  if(ultimas.length){
    html+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:12px">🕐 Últimas transações</div>';
    html+=ultimas.map((t,i)=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;${i>0?'border-top:1px solid #f8fafc':''}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:${t.tipo==='compra'?'#fef3c7':'#d1fae5'};display:flex;align-items:center;justify-content:center;font-size:14px">${t.tipo==='compra'?'🛒':'💸'}</div>
          <div>
            <div style="font-size:12px;font-weight:600">${t.desc}</div>
            <div style="font-size:10px;color:#94a3b8">${t.data?t.data.split('-').reverse().join('/'):''}</div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:700;color:${t.tipo==='compra'?'#b45309':'#059669'}">${fmtMoeda(t.valor)}</div>
      </div>`).join('');
    html+='</div>';
  }

  return html;
}

// ── Pagamentos ──────────────────────────────────────────────────
function renderFinPagamentos(){
  if(!window._finPagFiltroStatus) window._finPagFiltroStatus='pendente';
  if(!window._finPagView) window._finPagView='lista';

  // ── Modo relatório mensal ────────────────────────────────────────
  if(window._finPagView==='relatorio'){
    return renderFinRelPagamentos();
  }

  const pagamentos=finPagamentosTodos();

  const filtrados=pagamentos.filter(p=>{
    if(window._finPagFiltroStatus==='pendente'&&p.pago) return false;
    if(window._finPagFiltroStatus==='pago'&&!p.pago) return false;
    return true;
  });

  const totalFiltrado=filtrados.reduce((s,p)=>s+p.valor,0);
  const totalPendente=pagamentos.filter(p=>!p.pago).reduce((s,p)=>s+p.valor,0);
  const totalPago=pagamentos.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);

  const btnStatus=(v,label)=>`<button onclick="window._finSetFiltroStatus('${v}')" style="padding:7px 18px;border-radius:99px;font-size:13px;font-weight:700;border:2px solid ${window._finPagFiltroStatus===v?'#1e40af':'#e2e8f0'};background:${window._finPagFiltroStatus===v?'#1e40af':'#fff'};color:${window._finPagFiltroStatus===v?'#fff':'#64748b'};cursor:pointer">${label}</button>`;

  // Botão relatório
  let html=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button onclick="window._finSetPagView('relatorio')" style="display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:99px;font-size:12px;font-weight:700;border:2px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Relatório mensal
    </button>
  </div>`;

  // Mini-cards de resumo
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="card" style="text-align:center;padding:14px;background:${window._finPagFiltroStatus==='pendente'?'linear-gradient(135deg,#d97706,#f59e0b)':'#fff'};cursor:pointer" onclick="window._finSetFiltroStatus('pendente')">
      <div style="font-size:10px;font-weight:700;color:${window._finPagFiltroStatus==='pendente'?'rgba(255,255,255,.8)':'#94a3b8'};margin-bottom:4px">A PAGAR</div>
      <div style="font-size:22px;font-weight:900;color:${window._finPagFiltroStatus==='pendente'?'#fff':'#d97706'}">${fmtMoeda(totalPendente)}</div>
      <div style="font-size:10px;color:${window._finPagFiltroStatus==='pendente'?'rgba(255,255,255,.7)':'#94a3b8'};margin-top:2px">${pagamentos.filter(p=>!p.pago).length} pendências</div>
    </div>
    <div class="card" style="text-align:center;padding:14px;background:${window._finPagFiltroStatus==='pago'?'linear-gradient(135deg,#059669,#10b981)':'#fff'};cursor:pointer" onclick="window._finSetFiltroStatus('pago')">
      <div style="font-size:10px;font-weight:700;color:${window._finPagFiltroStatus==='pago'?'rgba(255,255,255,.8)':'#94a3b8'};margin-bottom:4px">PAGO</div>
      <div style="font-size:22px;font-weight:900;color:${window._finPagFiltroStatus==='pago'?'#fff':'#059669'}">${fmtMoeda(totalPago)}</div>
      <div style="font-size:10px;color:${window._finPagFiltroStatus==='pago'?'rgba(255,255,255,.7)':'#94a3b8'};margin-top:2px">${pagamentos.filter(p=>p.pago).length} pagamentos</div>
    </div>
  </div>`;

  if(!filtrados.length){
    html+='<div class="card" style="text-align:center;color:#94a3b8;padding:24px">Nenhum pagamento encontrado.</div>';
    return html;
  }

  // Agrupar por setor
  const setoresConfig={
    'Enrolamento Terc.': {icon:'🧵', cor:'#1e40af'},
    'Metalúrgica':       {icon:'⚙️',  cor:'#374151'},
    'Enrol. Interno':    {icon:'🏭', cor:'#065f46'},
    'Grades':            {icon:'🪚', cor:'#92400e'},
    'Bônus':             {icon:'⭐', cor:'#92400e'},
  };
  const setoresPresentes=[...new Set(filtrados.map(p=>p.setor))];

  const renderFichaLinha=(p,i,border=true)=>{
    const dataRef=p.dataRef?p.dataRef.split('-').reverse().join('/'):'—';
    const dataPag=p.dataPagamento?p.dataPagamento.split('-').reverse().join('/'):'';
    const podePagar=can('marcarPago')&&!p.pago;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 4px;${i>0&&border?'border-top:1px solid #f1f5f9':''}">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:8px;height:8px;border-radius:50%;background:${p.pago?'#10b981':'#f59e0b'};flex-shrink:0"></div>
        <div>
          <div style="font-size:13px;font-weight:700">${p.pessoa}</div>
          <div style="font-size:11px;color:#64748b">${p.tipo==='quinzena'?'Quinzena: '+p.dataRef:p.tipo==='bonus'?'Bônus meta: '+p.dataRef:'Ref: '+dataRef}${dataPag?' · Pago em '+dataPag:''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <div style="font-size:16px;font-weight:800;color:${p.pago?'#059669':'#d97706'}">${fmtMoeda(p.valor)}</div>

          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Imprimir
        </button>
        ${podePagar?(p.tipo==='bonus'
          ?'<button class="btn btn-sm btn-primary" onclick="window._pagarBonus(\''+p.bonusEnroladorId+'\',\''+p.bonusAnoMes+'\')">Marcar pago</button>'
          :'<button class="btn btn-sm btn-primary" onclick="window._confirmarPago(\''+p.id+'\')">Marcar pago</button>')
          :''}      </div>
    </div>`;
  };

  setoresPresentes.forEach(setor=>{
    const itens=filtrados.filter(p=>p.setor===setor);
    const totalSetor=itens.reduce((s,p)=>s+p.valor,0);
    const pendentesSetor=itens.filter(p=>!p.pago).length;
    const cfg=setoresConfig[setor]||{icon:'💼',cor:'#475569'};

    // Enrolamento Terc. → dividir por apontador (Inácio / Mirandinha)
    if(setor==='Enrolamento Terc.'){
      const getAp=p=>{
        const enrObj=getEnr(p.fichaObj?.enroladorId);
        return enrObj?.apontadorPerfil||'apontador1';
      };
      const itensInacio=itens.filter(p=>getAp(p)==='apontador1');
      const itensMirandinha=itens.filter(p=>getAp(p)==='apontador2');
      const totalInacio=itensInacio.reduce((s,p)=>s+p.valor,0);
      const totalMirandinha=itensMirandinha.reduce((s,p)=>s+p.valor,0);
      const pendInacio=itensInacio.filter(p=>!p.pago).length;
      const pendMirandinha=itensMirandinha.filter(p=>!p.pago).length;

      html+=`<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
        <div style="background:#1e40af;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">🧵</span>
            <span style="font-size:14px;font-weight:700;color:#fff">Enrolamento Terc.</span>
            ${pendentesSetor>0?`<span style="font-size:10px;background:rgba(255,255,255,.25);color:#fff;padding:2px 8px;border-radius:99px;font-weight:700">${pendentesSetor} pendente${pendentesSetor>1?'s':''}</span>`:''}
          </div>
          <div style="text-align:right">
            <div style="font-size:10px;color:rgba(255,255,255,.7)">total</div>
            <div style="font-size:18px;font-weight:900;color:#fff">${fmtMoeda(totalSetor)}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:0">
          <!-- Inácio -->
          <div style="border-bottom:2px solid #e2e8f0">
            <div style="padding:8px 12px 4px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;background:#f8fafc">
              <span style="font-size:12px;font-weight:700;color:#0f766e">Inácio</span>
              <div style="text-align:right">
                ${pendInacio>0?`<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:99px;font-weight:700">${pendInacio} pend.</span>`:''}
                <div style="font-size:13px;font-weight:800;color:#0f766e">${fmtMoeda(totalInacio)}</div>
              </div>
            </div>
            <div style="padding:4px 12px">
              ${itensInacio.length?itensInacio.map((p,i)=>renderFichaLinha(p,i)).join(''):'<div style="padding:12px 4px;font-size:12px;color:#94a3b8;text-align:center">Nenhum</div>'}
            </div>
          </div>
          <!-- Mirandinha -->
          <div>
            <div style="padding:8px 12px 4px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;background:#f8fafc">
              <span style="font-size:12px;font-weight:700;color:#b45309">Mirandinha</span>
              <div style="text-align:right">
                ${pendMirandinha>0?`<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:99px;font-weight:700">${pendMirandinha} pend.</span>`:''}
                <div style="font-size:13px;font-weight:800;color:#b45309">${fmtMoeda(totalMirandinha)}</div>
              </div>
            </div>
            <div style="padding:4px 12px">
              ${itensMirandinha.length?itensMirandinha.map((p,i)=>renderFichaLinha(p,i)).join(''):'<div style="padding:12px 4px;font-size:12px;color:#94a3b8;text-align:center">Nenhum</div>'}
            </div>
          </div>
        </div>
      </div>`;
      return;
    }

    // Demais setores — layout normal
    html+=`<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
      <div style="background:${cfg.cor};padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:18px">${cfg.icon}</span>
          <span style="font-size:14px;font-weight:700;color:#fff">${setor}</span>
          ${pendentesSetor>0?`<span style="font-size:10px;background:rgba(255,255,255,.25);color:#fff;padding:2px 8px;border-radius:99px;font-weight:700">${pendentesSetor} pendente${pendentesSetor>1?'s':''}</span>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:rgba(255,255,255,.7)">${window._finPagFiltroStatus==='pago'?'total pago':'total'}</div>
          <div style="font-size:18px;font-weight:900;color:#fff">${fmtMoeda(totalSetor)}</div>
        </div>
      </div>
      <div style="padding:8px 12px">
        ${itens.map((p,i)=>renderFichaLinha(p,i)).join('')}
      </div>
    </div>`;
  });

  return html;
}

// ── Relatório mensal de pagamentos ──────────────────────────────
function renderFinRelPagamentos(){
  const pagamentos=finPagamentosTodos().filter(p=>p.pago);
  const MESES_NOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Agrupar por mês
  const porMes={};
  pagamentos.forEach(p=>{
    const m=(p.dataPagamento||p.dataRef||'').slice(0,7);
    if(!m) return;
    if(!porMes[m]) porMes[m]={mes:m,total:0,itens:[]};
    porMes[m].total+=p.valor;
    porMes[m].itens.push(p);
  });
  const mesesOrdenados=Object.values(porMes).sort((a,b)=>b.mes>a.mes?1:-1);

  if(!window._finRelPagMes&&mesesOrdenados.length) window._finRelPagMes=mesesOrdenados[0].mes;

  const totalGeral=pagamentos.reduce((s,p)=>s+p.valor,0);

  let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <button onclick="window._finSetPagView('lista')" style="display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:2px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer">← Voltar</button>
    <div style="font-size:15px;font-weight:800;color:#1e40af">Relatório de Pagamentos</div>
  </div>`;

  if(!mesesOrdenados.length){
    html+='<div class="card" style="text-align:center;color:#94a3b8;padding:24px">Nenhum pagamento realizado ainda.</div>';
    return html;
  }

  // Card total geral
  html+=`<div class="card" style="background:linear-gradient(135deg,#059669,#10b981);color:#fff;text-align:center;padding:16px;margin-bottom:16px">
    <div style="font-size:10px;font-weight:700;opacity:.8;margin-bottom:4px">TOTAL PAGO (TODOS OS MESES)</div>
    <div style="font-size:30px;font-weight:900">${fmtMoeda(totalGeral)}</div>
    <div style="font-size:11px;opacity:.7;margin-top:4px">${pagamentos.length} pagamentos · ${mesesOrdenados.length} ${mesesOrdenados.length===1?'mês':'meses'}</div>
  </div>`;

  // Lista de meses (accordion-style: clica no mês para ver detalhes)
  mesesOrdenados.forEach(({mes,total,itens})=>{
    const [ano,mo]=mes.split('-');
    const label=MESES_NOME[parseInt(mo)-1]+' '+ano;
    const aberto=window._finRelPagMes===mes;

    // Sub-total por setor no mês
    const porSetor={};
    itens.forEach(p=>{
      if(!porSetor[p.setor]) porSetor[p.setor]={nome:p.setor,valor:0};
      porSetor[p.setor].valor+=p.valor;
    });

    html+=`<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">
      <div onclick="window._finSetRelPagMes('${aberto?'':'mes'===mes?'':mes}')" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:${aberto?'#1e40af':'#fff'}">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:16px">📅</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:${aberto?'#fff':'#1e293b'}">${label}</div>
            <div style="font-size:11px;color:${aberto?'rgba(255,255,255,.7)':'#94a3b8'}">${itens.length} pagamento${itens.length!==1?'s':''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:18px;font-weight:900;color:${aberto?'#fff':'#059669'}">${fmtMoeda(total)}</div>
          <span style="font-size:14px;color:${aberto?'#fff':'#94a3b8'}">${aberto?'▲':'▼'}</span>
        </div>
      </div>
      ${aberto?`
      <div style="padding:12px 16px;border-top:1px solid #e2e8f0">
        <!-- Resumo por setor -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">

              return `<tr style="${i%2?'background:#f8fafc':''}">

                <td style="padding:7px 10px;color:#64748b">${p.setor}</td>
                <td style="padding:7px 10px;color:#64748b">${p.tipo==='quinzena'?'Quinzena: '+dataRef:'Ref: '+dataRef}</td>
                <td style="padding:7px 10px;text-align:right;font-weight:700;color:#059669">${fmtMoeda(p.valor)}</td>

                <td style="padding:7px 10px">
                  <button class="btn btn-sm btn-ghost" style="font-size:10px;padding:3px 8px;display:flex;align-items:center;gap:3px;white-space:nowrap" onclick="window._imprimirFicha('${p.id}','${p.tipo}')">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Imprimir
                  </button>
                </td>
              </tr>`;
            }).join('')}
            <tr style="background:#d1fae5;font-weight:800">
              <td colspan="3" style="padding:7px 10px">Total ${label}</td>
              <td style="padding:7px 10px;text-align:right;color:#059669">${fmtMoeda(total)}</td>
              <td colspan="2"></td>
            </tr>
          </tbody>
        </table>
      </div>`:''}
    </div>`;
  });

  return html;
}

// ── Compras ─────────────────────────────────────────────────────
function renderFinCompras(){
  if(!window._finComprasMes) window._finComprasMes='';

  const compras=finComprasTodos();
  const mesesDisp=[...new Set(compras.map(c=>(c.data||'').slice(0,7)).filter(Boolean))].sort().reverse();

  if(!window._finComprasMes&&mesesDisp.length) window._finComprasMes=mesesDisp[0];

  const MESES_N2=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesLabel2=m=>{if(!m)return'';const[y,mo]=m.split('-');return MESES_N2[parseInt(mo)-1]+' '+y;};

  const filtradas=window._finComprasMes?compras.filter(c=>(c.data||'').startsWith(window._finComprasMes)):compras;
  const totalMes=filtradas.reduce((s,c)=>s+(parseFloat(c.custoTotal)||0),0);

  // Por item (agrupado)
  const porItem={};
  filtradas.forEach(c=>{
    if(!porItem[c.itemId]) porItem[c.itemId]={desc:c.itemDesc,unidade:c.itemUnidade,qtd:0,custo:0,movs:0};
    porItem[c.itemId].qtd+=(parseInt(c.quantidade)||0);
    porItem[c.itemId].custo+=(parseFloat(c.custoTotal)||0);
    porItem[c.itemId].movs++;
  });

  const mesSelect=`<select onchange="window._finSetComprasMes(this.value)" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 12px">
    <option value="">Todos os meses</option>
    ${mesesDisp.map(m=>'<option value="'+m+'"'+(m===window._finComprasMes?' selected':'')+'>'+mesLabel2(m)+'</option>').join('')}
  </select>`;

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    ${mesSelect}
    <div style="text-align:right">
      <div style="font-size:10px;color:#64748b">${window._finComprasMes?mesLabel2(window._finComprasMes):'Total geral'}</div>
      <div style="font-size:22px;font-weight:900;color:#b45309">${fmtMoeda(totalMes)}</div>
    </div>
  </div>`;

  // Resumo por item
  const itensOrdenados=Object.entries(porItem).sort((a,b)=>b[1].custo-a[1].custo);
  if(itensOrdenados.length){
    html+='<div class="card" style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">📦 Resumo por item</div>';
    html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
    html+='<thead><tr style="background:#fef3c7"><th style="padding:7px 10px;text-align:left">Item</th><th style="padding:7px 10px;text-align:center">Qtd.</th><th style="padding:7px 10px;text-align:center">Entradas</th><th style="padding:7px 10px;text-align:right">Total</th></tr></thead><tbody>';
    html+=itensOrdenados.map(([,v],i)=>`<tr style="${i%2?'background:#fafaf9':''}">
      <td style="padding:7px 10px;font-weight:600">${v.desc}</td>
      <td style="padding:7px 10px;text-align:center;color:#64748b">${v.qtd} ${v.unidade}</td>
      <td style="padding:7px 10px;text-align:center;color:#64748b">${v.movs}</td>
      <td style="padding:7px 10px;text-align:right;font-weight:700;color:#b45309">${fmtMoeda(v.custo)}</td>
    </tr>`).join('');
    html+='<tr style="background:#fef9c3;font-weight:800"><td style="padding:7px 10px">Total</td><td colspan="2"></td><td style="padding:7px 10px;text-align:right;color:#b45309">${fmtMoeda(totalMes)}</td></tr>'.replace('${fmtMoeda(totalMes)}',fmtMoeda(totalMes));
    html+='</tbody></table></div></div>';
  }

  // Transações individuais
  html+='<div class="card"><div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:10px">🧾 Transações</div>';
  if(!filtradas.length){
    html+='<div style="text-align:center;color:#94a3b8;padding:16px">Nenhuma compra encontrada.</div>';
  } else {
    html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
    html+='<thead><tr style="background:#f8fafc"><th style="padding:7px 10px;text-align:left">Data</th><th style="padding:7px 10px;text-align:left">Item</th><th style="padding:7px 10px;text-align:center">Qtd.</th><th style="padding:7px 10px;text-align:right">Unit.</th><th style="padding:7px 10px;text-align:right">Total</th><th style="padding:7px 10px;text-align:left">Fornecedor</th><th style="padding:7px 10px;text-align:left">NF</th></tr></thead><tbody>';
    html+=filtradas.map((c,i)=>{
      const d=(c.data||'').split('-').reverse().join('/');
      const unit=c.custoUnitario?fmtMoeda(parseFloat(c.custoUnitario)):'—';
      return `<tr style="${i%2?'background:#f8fafc':''}">
        <td style="padding:7px 10px;white-space:nowrap">${d}</td>
        <td style="padding:7px 10px;font-weight:600">${c.itemDesc}</td>
        <td style="padding:7px 10px;text-align:center">${c.quantidade} ${c.itemUnidade}</td>
        <td style="padding:7px 10px;text-align:right;color:#64748b">${unit}</td>
        <td style="padding:7px 10px;text-align:right;font-weight:700;color:#b45309">${fmtMoeda(parseFloat(c.custoTotal)||0)}</td>
        <td style="padding:7px 10px;color:#64748b">${c.fornecedor||'—'}</td>
        <td style="padding:7px 10px;color:#64748b">${c.notaFiscal||'—'}</td>
      </tr>`;
    }).join('');
    html+='</tbody></table></div>';
  }
  html+='</div>';
  return html;
}

// ── Relatório ───────────────────────────────────────────────────
function renderFinRelatorio(){
  if(!window._finRelAno) window._finRelAno=today().slice(0,4);

  const pagamentos=finPagamentosTodos();
  const compras=finComprasTodos();
  const ano=window._finRelAno;
  const MESES_N3=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const anosDisp=[...new Set([
    ...pagamentos.map(p=>(p.dataPagamento||p.dataRef||'').slice(0,4)),
    ...compras.map(c=>(c.data||'').slice(0,4)),
  ].filter(Boolean))].sort().reverse();

  const anoSelect=`<select onchange="window._finSetRelAno(this.value)" style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 12px">
    ${anosDisp.map(a=>`<option value="${a}"${a===ano?' selected':''}>${a}</option>`).join('')}
  </select>`;

  // Dados mensais do ano
  const mesesData=Array.from({length:12},(_,i)=>{
    const mes=ano+'-'+String(i+1).padStart(2,'0');
    const pagsMes=pagamentos.filter(p=>!!(p.dataPagamento||p.dataRef||'').startsWith(mes)&&p.pago);
    const comprasMes=compras.filter(c=>(c.data||'').startsWith(mes));
    const pagVal=pagsMes.reduce((s,p)=>s+p.valor,0);
    const compVal=comprasMes.reduce((s,c)=>s+(parseFloat(c.custoTotal)||0),0);
    return {mes,label:MESES_N3[i].slice(0,3),pagVal,compVal,total:pagVal+compVal};
  });

  const maxVal=Math.max(...mesesData.map(m=>m.total),1);
  const totalAnoPag=mesesData.reduce((s,m)=>s+m.pagVal,0);
  const totalAnoComp=mesesData.reduce((s,m)=>s+m.compVal,0);
  const totalAno=totalAnoPag+totalAnoComp;

  let html=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    ${anoSelect}
    <div style="font-size:12px;color:#64748b">Total ${ano}: <strong style="color:#1e40af;font-size:16px">${fmtMoeda(totalAno)}</strong></div>
  </div>`;

  // Gráfico anual
  html+='<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:16px">📊 Gastos mensais em '+ano+'</div>';
  html+='<div style="display:flex;align-items:flex-end;gap:6px;height:140px">';
  html+=mesesData.map(m=>{
    const hP=Math.round((m.pagVal/maxVal)*100);
    const hC=Math.round((m.compVal/maxVal)*100);
    const hT=hP+hC;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
      ${m.total>0?`<div style="font-size:8px;color:#475569;font-weight:700">${(m.total/1000).toFixed(1)}k</div>`:'<div style="font-size:8px;color:#e2e8f0">—</div>'}
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:110px;gap:1px">
        ${m.compVal>0?`<div style="width:100%;background:#f59e0b;border-radius:${m.pagVal>0?'0':'4px 4px'} 0 0;height:${hC}%;min-height:${m.compVal>0?'3px':'0'}"></div>`:''}
        ${m.pagVal>0?`<div style="width:100%;background:#3b82f6;border-radius:4px 4px 0 0;height:${hP}%;min-height:${m.pagVal>0?'3px':'0'}"></div>`:''}
      </div>
      <div style="font-size:8px;color:#94a3b8">${m.label}</div>
    </div>`;
  }).join('');
  html+='</div>';
  html+=`<div style="display:flex;gap:16px;margin-top:10px">
    <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;background:#3b82f6;border-radius:2px"></div><span style="font-size:11px;color:#64748b">Mão de obra ${fmtMoeda(totalAnoPag)}</span></div>
    <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;background:#f59e0b;border-radius:2px"></div><span style="font-size:11px;color:#64748b">Materiais ${fmtMoeda(totalAnoComp)}</span></div>
  </div>`;
  html+='</div>';

  // Tabela mensal detalhada
  html+='<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">📋 Detalhamento mensal</div>';
  html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  html+='<thead><tr style="background:#f1f5f9"><th style="padding:8px 10px;text-align:left">Mês</th><th style="padding:8px 10px;text-align:right">Mão de obra</th><th style="padding:8px 10px;text-align:right">Materiais</th><th style="padding:8px 10px;text-align:right;font-weight:800">Total</th></tr></thead><tbody>';
  html+=mesesData.filter(m=>m.total>0).map((m,i)=>`<tr style="${i%2?'background:#f8fafc':''}">
    <td style="padding:8px 10px;font-weight:600">${MESES_N3[parseInt(m.mes.slice(5))-1]}</td>
    <td style="padding:8px 10px;text-align:right;color:#3b82f6">${m.pagVal>0?fmtMoeda(m.pagVal):'—'}</td>
    <td style="padding:8px 10px;text-align:right;color:#f59e0b">${m.compVal>0?fmtMoeda(m.compVal):'—'}</td>
    <td style="padding:8px 10px;text-align:right;font-weight:800;color:#1e40af">${fmtMoeda(m.total)}</td>
  </tr>`).join('');
  html+=`<tr style="background:#dbeafe;font-weight:800"><td style="padding:8px 10px">Total ${ano}</td><td style="padding:8px 10px;text-align:right;color:#1e40af">${fmtMoeda(totalAnoPag)}</td><td style="padding:8px 10px;text-align:right;color:#b45309">${fmtMoeda(totalAnoComp)}</td><td style="padding:8px 10px;text-align:right;color:#1e40af">${fmtMoeda(totalAno)}</td></tr>`;
  html+='</tbody></table></div></div>';

  // Ranking de gastos por pessoa (mão de obra)
  const porPessoa={};
  pagamentos.filter(p=>p.pago&&(p.dataPagamento||p.dataRef||'').startsWith(ano)).forEach(p=>{
    if(!porPessoa[p.pessoa]) porPessoa[p.pessoa]={nome:p.pessoa,setor:p.setor,valor:0,qtd:0};
    porPessoa[p.pessoa].valor+=p.valor;
    porPessoa[p.pessoa].qtd++;
  });
  const rankingPessoas=Object.values(porPessoa).sort((a,b)=>b.valor-a.valor);

  if(rankingPessoas.length){
    html+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:12px">🏆 Ranking de mão de obra em '+ano+'</div>';
    html+=rankingPessoas.map((p,i)=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;${i>0?'border-top:1px solid #f1f5f9':''}">
        <div style="font-size:16px;font-weight:900;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'#e2e8f0'};width:24px;text-align:center">${i+1}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700">${p.nome}</div>
          <div style="font-size:10px;color:#94a3b8">${p.setor} · ${p.qtd} pagamento${p.qtd!==1?'s':''}</div>
        </div>
        <div style="font-size:15px;font-weight:800;color:#1e40af">${fmtMoeda(p.valor)}</div>
      </div>`).join('');
    html+='</div>';
  }

  return html;
}

function renderTabAlmox(tab){
  try {
    if(tab==='alm_painel')    return renderAlmPainel();
    if(tab==='alm_entrada')   return renderAlmMovimento('entrada');
    if(tab==='alm_saida')     return renderAlmMovimento('saida');
    if(tab==='alm_itens')     return renderAlmItens();
    if(tab==='alm_relatorio') return renderAlmRelatorio();
    if(tab==='alm_config')    return renderAlmConfig();
    return renderAlmPainel();
  } catch(e) {
    console.error('Erro em renderTabAlmox('+tab+'):', e.message, e.stack);
    return '<div class="card" style="color:#dc2626;padding:20px"><strong>Erro ao carregar aba:</strong><br>' + e.message + '<br><small>' + e.stack + '</small></div>';
  }
}

// ── Painel ───────────────────────────────────────────────────────
function renderAlmPainel(){
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((i,idx)=>({...i,id:'base-'+idx}));
  const totalItens=itens.length;
  const abaixoMin=itens.filter(i=>almEstoqueItem(i.id)<(parseInt(i.estoqueMin)||0)).length;

      <div><div class="stat-label">Abaixo do mínimo</div><div class="stat-value">${abaixoMin}</div></div>

    </div>

      <div><div class="stat-label">Saídas hoje</div><div class="stat-value">${saiHoje}</div></div>
    </div>
  </div>

  ${alertas.length?`<div class="card" style="margin-bottom:14px;border-left:4px solid #dc2626">
    <div style="font-size:12px;font-weight:700;color:#dc2626;margin-bottom:10px">⚠️ Itens abaixo do estoque mínimo</div>

  if(!movs.length) return '';
  const isEnt=tipo==='entrada';
  const cor=isEnt?'#059669':'#d97706';
  const rows=movs.map(m=>{
    const item=almItens.find(i=>i.id===m.itemId);
    const desc=item?item.descricao:(m.itemDesc||'Item');
    const und=item?item.unidade:'';
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f5f9">'
      +'<div>'
      +'<div style="font-size:12px;font-weight:700">'+desc+'</div>'
      +'<div style="font-size:10px;color:#64748b">'+m.tipoMov+(m.pessoa?' · '+m.pessoa:'')+(m.setor?' · '+m.setor:'')+'</div>'      +(m.obs?'<div style="font-size:10px;color:#475569;font-style:italic;margin-top:2px">📝 '+m.obs+'</div>':'')
      +'</div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:15px;font-weight:800;color:'+cor+'">'+(isEnt?'+':'-')+m.quantidade+' '+und+'</div>'
      +(m.custoTotal?'<div style="font-size:10px;color:#92400e">R$ '+parseFloat(m.custoTotal).toFixed(2)+'</div>':'')

      +'</div>';

window._salvarMovAlm=async function(id_or_btn,tipo_or_undef){
  const id=typeof id_or_btn==='string'?id_or_btn:id_or_btn.dataset?.id||id_or_btn;
  const tipo=tipo_or_undef||(typeof id_or_btn==='object'?id_or_btn.dataset?.tipo:'');
  const itemId=document.getElementById('em-item')?.value;
  const quantidade=parseInt(document.getElementById('em-qtd')?.value)||0;
  const data=document.getElementById('em-data')?.value;
  if(!itemId||quantidade<=0){showToast('Informe item e quantidade.');return;}
  const dados={itemId,quantidade,data,
    itemDesc:(almItens.find(i=>i.id===itemId)?.descricao||''),
    obs:document.getElementById('em-obs')?.value||''};
  if(tipo==='entrada'){
    const custo=parseFloat(document.getElementById('em-custo')?.value)||0;
    if(custo>0){dados.custoUnitario=custo;dados.custoTotal=parseFloat((custo*quantidade).toFixed(2));}
  } else {
    dados.pessoa=document.getElementById('em-pessoa')?.value||'';
    dados.setor=document.getElementById('em-setor')?.value||'';
  }
  await updateDoc(doc(db,'alm_movimentos',id),dados);
  closeModal();showToast('Movimentação atualizada!');
};

window._excluirMovAlm=async function(id_or_btn){
  const id=typeof id_or_btn==='string'?id_or_btn:id_or_btn.dataset?.id||id_or_btn;
  if(!confirm('Excluir esta movimentação?')) return;
  closeModal();
  await deleteDoc(doc(db,'alm_movimentos',id));
  showToast('Movimentação excluída.');
};

window._almGerarOpts=function(q){
  const lower=(q||'').toLowerCase();
  const itens=(almItens.length?almItens:ALM_ITENS_BASE.map(function(it,i){return Object.assign({},it,{id:'base-'+i});}))
    .filter(function(i){return !lower||(i.descricao||'').toLowerCase().startsWith(lower);})
    .sort(function(a,b){return (a.descricao||'').localeCompare(b.descricao||'','pt-BR');});
  return itens.map(function(i){
    const estoque=almEstoqueItem(i.id);
    const cor=estoque<=0?'#dc2626':estoque<=(parseInt(i.estoqueMin)||0)?'#d97706':'#059669';
    const badge='<span style="font-size:10px;font-weight:700;color:'+cor+';background:'+cor+'18;padding:1px 7px;border-radius:99px;margin-left:8px">'+estoque+' '+i.unidade+'</span>';
    return '<div class="alm-item-opt" data-id="'+i.id+'" data-desc="'+i.descricao+'"'
      +' onclick="window._selecionarAlmItem(this)"'
      +' style="padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between">'      +'<span>'+i.descricao+'</span>'+badge+'</div>';
  }).join('');
};

window._selecionarAlmItem=function(el){
  document.getElementById('alm-item').value=el.dataset.id;
  document.getElementById('alm-busca-item').value=el.dataset.desc;
  document.getElementById('alm-busca-item').setAttribute('readonly','true');
  document.getElementById('alm-item-lista').style.display='none';
  // Mostrar custo atual do item
  const item=almItens.find(i=>i.id===el.dataset.id);
  if(item&&item.custoUnitario){
    const custoEl=document.getElementById('alm-custo');
    if(custoEl&&!custoEl.value) custoEl.value=parseFloat(item.custoUnitario).toFixed(2);
    window._almAtualizarTotal();
  }
};

window._filtrarAlmItem=function(q){
  const lista=document.getElementById('alm-item-lista');
  if(lista){
    lista.innerHTML=window._almGerarOpts(q);
    lista.style.display='block';
  }
};

window._almAtualizarTotal=function(){
  const qtd=parseInt(document.getElementById('alm-qtd')?.value)||0;
  const custo=parseFloat(document.getElementById('alm-custo')?.value)||0;
  const totalEl=document.getElementById('alm-total');

window._almAutoSetor=function(){

window._registrarAlmMov=async(tipo)=>{
  const itemId=document.getElementById('alm-item')?.value;
  const tipoMov=document.getElementById('alm-tipo-mov')?.value;
  const qtd=parseInt(document.getElementById('alm-qtd')?.value)||0;
  const data=document.getElementById('alm-data')?.value||today();
  const pessoa=tipo==='saida'?(document.getElementById('alm-pessoa')?.value||''):'';
  const setor=tipo==='saida'?(document.getElementById('alm-setor')?.value||''):'';
  const obs=document.getElementById('alm-obs')?.value||'';
  const custoUnitario=tipo==='entrada'?(parseFloat(document.getElementById('alm-custo')?.value)||0):0;
  if(!itemId||qtd<=0){showToast('Informe o item e a quantidade.');return;}
  const item=almItens.find(i=>i.id===itemId)||ALM_ITENS_BASE.find((_,idx)=>'base-'+idx===itemId);
  // Validar estoque para saída
  if(tipo==='saida'){
    const estoqueAtual=almEstoqueItem(itemId);
    if(estoqueAtual<=0){
      showToast('❌ Estoque zerado! Não é possível registrar saída.');return;
    }
    if(qtd>estoqueAtual){
      showToast('❌ Estoque insuficiente! Disponível: '+estoqueAtual+' '+( item?.unidade||''));return;
    }
  }
  const mov={
    itemId,itemDesc:item?.descricao||'',itemCod:item?.codigo||'',
    tipo,tipoMov,quantidade:qtd,data,pessoa,setor,obs,
    registradoPor:currentUserData?.nome||'',
    criadoEm:new Date().toISOString(),
  };
  if(tipo==='entrada'&&custoUnitario>0){
    mov.custoUnitario=custoUnitario;
    mov.custoTotal=parseFloat((custoUnitario*qtd).toFixed(2));
  }
  if(tipo==='entrada'&&custoUnitario>0&&item&&almItens.find(i=>i.id===itemId)){
    // Custo médio ponderado: (estoque_atual * custo_atual + qtd_nova * custo_novo) / (estoque_atual + qtd_nova)
    const estoqueAtual=almEstoqueItem(itemId);
    const custoAtual=parseFloat(item.custoUnitario)||0;
    let novoCustoMedio;
    if(custoAtual>0&&estoqueAtual>0){
      novoCustoMedio=parseFloat(((custoAtual*estoqueAtual+custoUnitario*qtd)/(estoqueAtual+qtd)).toFixed(4));
    } else {
      novoCustoMedio=custoUnitario;
    }
    await updateDoc(doc(db,'alm_itens',itemId),{custoUnitario:novoCustoMedio});
  }
  await addDoc(collection(db,'alm_movimentos'),mov);
  showToast((tipo==='entrada'?'✅ Entrada':'✅ Saída')+' registrada com sucesso!');
  document.getElementById('alm-qtd').value='';
  document.getElementById('alm-obs').value='';
  const custoEl=document.getElementById('alm-custo');if(custoEl)custoEl.value='';
  if(custoEl) custoEl.value='';
};

// Previsão de duração do estoque (dias)
function almDuracaoEstoque(itemId){
  const hoje = new Date(today()+'T00:00:00');
  const limite = new Date(hoje); limite.setDate(hoje.getDate()-30);
  const limiteStr = limite.toISOString().slice(0,10);
  const saidas30 = almMovimentos.filter(m=>
    m.itemId===itemId && m.tipo==='saida' && m.data>=limiteStr
  );
  if(!saidas30.length) return null;
  const totalSaidas = saidas30.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
  const mediaDiaria = totalSaidas / 30;
  if(mediaDiaria<=0) return null;
  const estoque = almEstoqueItem(itemId);
  if(estoque<=0) return 0;
  return Math.floor(estoque / mediaDiaria);
}

function almDuracaoLabel(dias){
  if(dias===null) return {label:'Sem movimentação recente', cor:'#94a3b8', bg:'#f1f5f9'};
  if(dias===0) return {label:'Esgotado', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=7)  return {label:dias+'d restantes', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=15) return {label:dias+'d restantes', cor:'#d97706', bg:'#fef3c7'};
  if(dias<=30) return {label:dias+'d restantes', cor:'#2563eb', bg:'#dbeafe'};
  return {label:dias+'d restantes', cor:'#059669', bg:'#d1fae5'};
}

function renderAlmItens(){
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((item,idx)=>({...item,id:'base-'+idx}));
  if(!window._almFiltro) window._almFiltro='';
  if(!window._almClassFiltro) window._almClassFiltro='';

  const CORES_CLASS={'MATERIA PRIMA':'#1e40af','EPI':'#065f46','MATERIAL DE USO E CONSUMO':'#92400e',
    'FERRAMENTAS':'#4c1d95','PECAS PARA MAQUINARIOS':'#dc2626','PEÇAS PARA MAQUINÁRIOS':'#dc2626',
    'MAQUINARIO':'#374151','MAQUINÁRIO':'#374151','EMBALAGEM':'#0369a1','PRODUTO ACABADO':'#15803d'};

  const filtrados=itens.filter(i=>{
    const q=(window._almFiltro||'').toLowerCase();
    const matchQ=!q||(i.descricao||'').toLowerCase().startsWith(q);
    const matchC=!window._almClassFiltro||i.classificacao===window._almClassFiltro;
    return matchQ&&matchC;
  }).sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||'','pt-BR'));

  const podeEditar=['admin','apontador1'].includes(currentUserData?.perfil);
  const optsClass='<option value="">Todas as classificações</option>'+almClassificacoes().map(c=>'<option value="'+c+'"'+(window._almClassFiltro===c?' selected':'')+'>'+c+'</option>').join('');

  let html='<div class="card" style="margin-bottom:14px">'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Buscar item</label>'
    +'<input type="text" id="alm-busca" placeholder="Buscar por nome..." value="'+(window._almFiltro||'')+'"'
    +' oninput="window._filtrarAlmItens(this.value)"'
    +' style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px;width:100%"></div>'
    +'<div class="form-group"><label>Classificação</label>'
    +'<select onchange="window._almClassFiltro=this.value;reloadTab()"'
    +' style="font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:7px 10px;width:100%">'+optsClass+'</select></div>'
    +'</div>'
    +(podeEditar
      ?'<button class="btn btn-primary btn-sm" onclick="window._novoAlmItem()">+ Novo item</button>'
       +' <button class="btn btn-ghost btn-sm" onclick="window._importarAlmBase()">Importar base</button>'
      :'')
    +'</div>'
    +'<div id="alm-count" style="font-size:11px;color:#64748b;margin-bottom:8px">'+filtrados.length+' itens encontrados</div>'    +'<div id="alm-lista">';

  filtrados.forEach(function(item){
    const atual=almEstoqueItem(item.id);
    const min=parseInt(item.estoqueMin)||0;
    const max=parseInt(item.estoqueMax)||0;
    const cor=CORES_CLASS[item.classificacao]||'#475569';
    const alerta=min>0&&atual<min;
    const pct=max>0?Math.min(100,Math.round(atual/max*100)):50;
    const barCor=alerta?'#dc2626':pct<50?'#f59e0b':'#10b981';

    // Badge de duração

window._filtrarAlmItens=function(q){
  window._almFiltro=q;
  const lower=(q||'').toLowerCase();
  const classe=window._almClassFiltro||'';
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map(function(item,i){return Object.assign({},item,{id:'base-'+i});});
  const filtrados=itens.filter(function(i){
    const matchQ=!lower||(i.descricao||'').toLowerCase().startsWith(lower);
    const matchC=!classe||i.classificacao===classe;
    return matchQ&&matchC;
  });
  const countEl=document.getElementById('alm-count');
  if(countEl) countEl.textContent=filtrados.length+' itens encontrados';
  const listaEl=document.getElementById('alm-lista');
  if(!listaEl){reloadTab();return;}
  const CORES_CLASS={'MATERIA PRIMA':'#1e40af','EPI':'#065f46','MATERIAL DE USO E CONSUMO':'#92400e',
    'FERRAMENTAS':'#4c1d95','PEÇAS PARA MAQUINÁRIOS':'#dc2626','MAQUINÁRIO':'#374151',
    'EMBALAGEM':'#0369a1','PRODUTO ACABADO':'#15803d'};
  const podeEditar=['admin','apontador1'].includes(currentUserData&&currentUserData.perfil);
  let html='';
  filtrados.sort(function(a,b){return (a.descricao||'').localeCompare(b.descricao||'','pt-BR');}).forEach(function(item){
    const atual=almEstoqueItem(item.id);
    const min=parseInt(item.estoqueMin)||0;
    const max=parseInt(item.estoqueMax)||0;
    const cor=CORES_CLASS[item.classificacao]||'#475569';
    const alerta=min>0&&atual<min;
    const pct=max>0?Math.min(100,Math.round(atual/max*100)):50;
    const barCor=alerta?'#dc2626':pct<50?'#f59e0b':'#10b981';
    const dias=almDuracaoEstoque(item.id);
    const dl=almDuracaoLabel(dias);
    const duracaoBadge=dl
      ?'<div style="font-size:10px;background:'+dl.bg+';color:'+dl.cor+';padding:1px 6px;border-radius:99px;font-weight:700;margin-top:3px;display:inline-block">⏱ '+dl.label+'</div>'
      :'';
    const editBtn=podeEditar
      ?'<button class="btn btn-sm btn-warn" style="margin-left:8px;flex-shrink:0" onclick="window._editarAlmItem(this.dataset.id)" data-id="'+item.id+'">Editar</button>'
       +'<button class="btn btn-sm" style="margin-left:4px;flex-shrink:0;background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-size:11px" onclick="window._corrigirSaldoAlmItem(&quot;'+item.id+'&quot;)" title="Corrigir saldo real">⚖️ Corrigir saldo</button>'
      :'';
    html+='<div class="card" style="margin-bottom:8px'+(alerta?';border-left:3px solid #dc2626':'')+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
      +'<div style="flex:1;min-width:0">'
      +'<span style="font-size:13px;font-weight:700">'+item.descricao+'</span>'
      +'<div style="font-size:10px;color:'+cor+'">'+item.classificacao+'</div>'
      +'</div>'
      +'<div style="text-align:right;flex-shrink:0;margin-left:10px">'
      +'<div style="font-size:20px;font-weight:800;color:'+(alerta?'#dc2626':'#1e293b')+'">'+atual+' <span style="font-size:11px;color:#64748b">'+item.unidade+'</span></div>'
      +'<div style="font-size:10px;color:#94a3b8">mín: '+min+' · máx: '+max+'</div>'
      +(item.custoUnitario?'<div style="font-size:11px;font-weight:700;color:#059669;margin-top:2px">R$ '+parseFloat(item.custoUnitario).toFixed(2)+' / '+item.unidade+'<span style="font-size:10px;font-weight:600;color:#64748b;margin-left:8px">Total: R$ '+(parseFloat(item.custoUnitario)*atual).toFixed(2)+'</span></div>':'')
      +duracaoBadge
      +'</div>'

      +'</div></div>';
  });
  listaEl.innerHTML=html||'<div class="card"><div style="color:#94a3b8;text-align:center;padding:16px">Nenhum item encontrado.</div></div>';
};

// Corrige o estoqueAtual para que saldo calculado bata com o real informado
window._corrigirSaldoAlmItem=async(id)=>{
  const saldoRealStr=prompt('Digite o saldo REAL atual em estoque para este item:');
  if(saldoRealStr===null) return;
  const saldoReal=parseInt(saldoRealStr);
  if(isNaN(saldoReal)||saldoReal<0){showToast('Valor inválido.');return;}
  // saldoReal = estoqueAtual(base) + entradas - saidas
  // Precisamos: estoqueAtual(base) = saldoReal - (entradas - saidas dos movimentos)
  const movTotal=almMovimentos.filter(m=>m.itemId===id)
    .reduce((s,m)=>m.tipo==='entrada'?s+(parseInt(m.quantidade)||0):s-(parseInt(m.quantidade)||0),0);
  const novaBase=saldoReal-movTotal;
  await updateDoc(doc(db,'alm_itens',id),{estoqueAtual:novaBase});
  showToast('Saldo corrigido! Base ajustada para '+novaBase+'. Saldo calculado agora: '+saldoReal);
};

window._excluirAlmItem=async id=>{
  closeModal();
  await deleteDoc(doc(db,'alm_itens',id));
  showToast('Item excluído.');
};
