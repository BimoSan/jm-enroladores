<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JM — Controle Terceirizado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}

  /* ── Layout ── */
  .shell{display:flex;min-height:100vh;width:100%}
  .sidebar{width:220px;background:#1e40af;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid #2563eb}
  .sidebar-logo-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.5px}
  .sidebar-logo-sub{font-size:11px;color:#93c5fd;margin-top:2px}
  .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;font-weight:500;color:#bfdbfe;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
  .nav-item:hover{background:#2563eb33;color:#fff}
  .nav-item.active{background:#2563eb;color:#fff;border-left-color:#60a5fa}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .sidebar-footer{padding:14px 18px;border-top:1px solid #2563eb}
  .user-info{display:flex;align-items:center;gap:10px}
  .user-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#3b82f6;color:#fff;flex-shrink:0}
  .user-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:10px;color:#93c5fd}
  .btn-logout{margin-top:10px;width:100%;padding:7px;background:#1e3a8a;border:1px solid #2563eb;border-radius:8px;color:#93c5fd;font-size:12px;font-family:'Nunito',sans-serif;cursor:pointer;font-weight:600}
  .btn-logout:hover{background:#2563eb;color:#fff}

  /* ── Topbar ── */
  .main{margin-left:220px;display:flex;flex-direction:column;min-height:100vh;width:calc(100% - 220px)}
  .topbar{background:#1e40af;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-title{font-size:16px;font-weight:700;color:#fff}
  .topbar-sub{font-size:11px;color:#93c5fd}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .perfil-badge{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;background:#3b82f6;color:#fff}

  /* ── Page ── */
  .page{padding:22px 24px;flex:1;width:100%}
  .page-title{font-size:18px;font-weight:800;color:#1e293b;margin-bottom:16px}

  /* ── Cards ── */
  .card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%}
  .card-sm{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

  /* ── Stat cards coloridos ── */
  .stat-card{border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .stat-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat-icon svg{width:26px;height:26px;color:#fff}
  .stat-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:4px}
  .stat-value{font-size:26px;font-weight:700;color:#fff;line-height:1}
  .stat-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;width:100%}

  /* ── Métricas secundárias ── */
  .metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
  .metric{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .metric-label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
  .metric-value{font-size:18px;font-weight:700;color:#1e293b}

  /* ── Fichas ── */
  .ficha-card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid #e2e8f0;width:100%}
  .ficha-card.aberta{border-left-color:#3b82f6}
  .ficha-card.retornando{border-left-color:#f59e0b}
  .ficha-card.pronto{border-left-color:#10b981}
  .ficha-card.fechada{border-left-color:#6366f1}
  .ficha-card.cancelada{border-left-color:#dc2626}

  /* ── Badges ── */
  .badge{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
  .badge-open{background:#fef3c7;color:#92400e}
  .badge-partial{background:#dbeafe;color:#1e40af}
  .badge-closed{background:#d1fae5;color:#065f46}
  .badge-fechada{background:#ede9fe;color:#4c1d95}
  .badge-cancelada{background:#fee2e2;color:#991b1b}
  .pago-badge{font-size:10px;padding:3px 10px;border-radius:99px;background:#d1fae5;color:#065f46;font-weight:700}

  /* ── Botões ── */
  .btn{padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Nunito',sans-serif;border:none;transition:all .15s}
  .btn-primary{background:#1e40af;color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-success{background:#d1fae5;color:#065f46}
  .btn-success:hover{background:#a7f3d0}
  .btn-danger{background:#fee2e2;color:#991b1b}
  .btn-danger:hover{background:#fca5a5}
  .btn-warn{background:#fef3c7;color:#92400e}
  .btn-warn:hover{background:#fde68a}
  .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-sm{padding:4px 10px;font-size:11px}

  /* ── Forms ── */
  .form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .form-group label{font-size:12px;font-weight:600;color:#475569}
  .form-group input,.form-group select{font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 11px;background:#fff;color:#1e293b;font-family:'Nunito',sans-serif;transition:border .15s}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px #dbeafe}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .divider{border:none;border-top:1.5px solid #f1f5f9;margin:12px 0}
  .section-label{font-size:11px;font-weight:600;color:#64748b;letter-spacing:.3px;margin-bottom:10px}
  .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:9px 12px;font-size:12px;color:#1e40af;margin-bottom:12px}

  /* ── Tabelas ── */
  .data-table{width:100%;border-collapse:collapse;font-size:12px}
  .data-table th{text-align:left;color:#64748b;font-weight:600;padding:8px 10px;background:#f8fafc;font-size:11px}
  .data-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;font-size:12px}
  .data-table tr:last-child td{border-bottom:none}
  .tipos-table{width:100%;border-collapse:collapse;font-size:12px}
  .tipos-table th{font-size:11px;font-weight:600;color:#64748b;text-align:left;padding:7px 8px;background:#f8fafc}
  .tipos-table td{padding:7px 8px;border-bottom:1px solid #f1f5f9;font-size:12px}
  .tipos-table tr:last-child td{border-bottom:none}
  .pend-pos{color:#d97706;font-weight:700}
  .pend-zero{color:#059669;font-weight:700}

  /* ── Misc ── */
  .tag-tipo{font-size:10px;padding:2px 7px;border-radius:99px;background:#f1f5f9;color:#475569;display:inline-block;margin:1px;font-weight:600}
  .mat-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:#475569;margin:2px;font-weight:600}
  .cor-pill{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:99px;margin:2px;font-weight:700}
  .num-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}
  .num-group{display:flex;flex-direction:column;gap:3px}
  .num-group label{font-size:11px;font-weight:600;color:#475569}
  .num-group input{font-size:13px;border:1.5px solid #e2e8f0;border-radius:9px;padding:6px 8px;background:#fff;color:#1e293b;text-align:center;font-family:'Nunito',sans-serif}

  /* ── Login ── */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#2563eb 100%);padding:16px}
  .login-box{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .login-logo{font-size:28px;font-weight:800;color:#1e40af;letter-spacing:-1px}
  .login-sub{font-size:13px;color:#64748b;margin-bottom:28px;margin-top:4px}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(2px)}
  .modal-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal-title{font-size:15px;font-weight:800;color:#1e293b;margin-bottom:14px}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:opacity .3s;white-space:nowrap}
  .toast.show{opacity:1}

  /* ── Loading ── */
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:#64748b;flex-direction:column;gap:14px;background:#f0f4f8}
  .spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#1e40af;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Sidebar mobile ── */
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:4px}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}
  @media(max-width:768px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;width:100%}
    .menu-btn{display:block}
    .sidebar-overlay.show{display:block}
    .topbar{padding:0 14px}
    .page{padding:12px}
    .stat-card{padding:12px 10px;gap:8px}
    .stat-icon{width:36px;height:36px;flex-shrink:0}
    .stat-value{font-size:20px}
    .stat-label{font-size:10px}
    .stat-sub{font-size:10px}
    .metrics-row{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:480px){
    .stat-card{padding:10px 8px;gap:6px}
    .stat-value{font-size:18px}
  }
  details{width:100%}
  details summary{cursor:pointer;color:#64748b;font-size:12px;font-weight:600;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .sel-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#2563eb 100%);padding:20px}
  .sel-box{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .sel-title{font-size:22px;font-weight:800;color:#1e293b;margin-bottom:4px}
  .sel-sub{font-size:13px;color:#64748b;margin-bottom:28px}
  .fab-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:0}
  .fab-card{border-radius:14px;padding:22px 18px;cursor:pointer;border:2px solid transparent;transition:all .2s;text-align:center}
  .fab-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .fab-icon{font-size:36px;margin-bottom:10px}
  .fab-name{font-size:15px;font-weight:700;margin-bottom:4px}
  .fab-desc{font-size:11px;opacity:.8}
  .setor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .setor-card{border-radius:12px;padding:16px 14px;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;transition:all .2s;display:flex;align-items:center;gap:12px}
  .setor-card:hover{border-color:#3b82f6;background:#eff6ff;transform:translateY(-1px)}
  .setor-card.em-breve{opacity:.5;cursor:not-allowed}
  .setor-card.em-breve:hover{transform:none;border-color:#e2e8f0;background:#fff}
  .setor-icon{font-size:24px;flex-shrink:0}
  .setor-nome{font-size:13px;font-weight:700;color:#1e293b}
  .setor-desc{font-size:11px;color:#64748b;margin-top:2px}
  .back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:20px;padding:0;font-family:'Nunito',sans-serif}
  .back-btn:hover{color:#1e293b}
</style>
</head>

<div id="toast" class="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

// ── Firebase config ──────────────────────────────────────────────

// ── Constantes ───────────────────────────────────────────────────
const TIPOS=[
  {id:'varanda_sofia',label:'Varanda Sofia',principal:true},
  {id:'centro_luxo',label:'Centro Luxo',principal:true},
  {id:'varanda_luxo',label:'Varanda Luxo'},
  {id:'varanda_nova',label:'Varanda Nova'},
  {id:'centro_novo',label:'Centro Novo'},

// ── Peças da Metalúrgica ─────────────────────────────────────────
const PECAS_METAL = [

// Gera lista completa: peça normal + reforma
const PECAS_METAL_FULL = [
  ...PECAS_METAL,
  ...PECAS_METAL.map(p=>({id:`ref_${p.id}`, label:`Reforma ${p.label}`, reforma:true}))
];

// ── Cores fixas por tipo de peça
const TIPO_CORES={
  varanda_sofia: {bg:'#e8f0fb', border:'#c5d8f5', color:'#3266ad'},
  centro_luxo:   {bg:'#e8f5ef', border:'#b2dfce', color:'#1D9E75'},

  centro_sofia:  {bg:'#e0f7fa', border:'#80deea', color:'#00838f'},
};

// Valores unitários por peça (editáveis pelo admin no Firestore)
const _valoresDefault = {varanda_sofia:0,centro_luxo:0,varanda_luxo:0,varanda_nova:0,centro_novo:0,banqueta:0,mesa_bistro:0,cadeira_mesa:0,namoradeira:0,centro_sofia:0};
let valoresPecas = {
  apontador1: {..._valoresDefault},
  apontador2: {..._valoresDefault},
};

// Retorna os valores do apontador da ficha (ou do perfil atual)
function getValoresPorFicha(f){
  const enr=getEnr(f?.enroladorId);
  const ap=enr?.apontadorPerfil||'apontador1';
  return valoresPecas[ap]||valoresPecas.apontador1;
}
function getValoresPorPerfil(perfil){
  if(perfil==='apontador2') return valoresPecas.apontador2;
  return valoresPecas.apontador1;
}

const CORES=['Bege','Mogno','Marrom','Preto','Bicolor'];
const COR_STYLE={'Bege':{bg:'#f5e6c8',color:'#7a5c1e'},'Mogno':{bg:'#6b2a1a',color:'#f5d5c8'},'Marrom':{bg:'#4a2c0a',color:'#e8d0b0'},'Preto':{bg:'#222',color:'#eee'},'Bicolor':{bg:'#444',color:'#eee'}};
const COLORS=['#3266ad','#1D9E75','#D85A30','#D4537E','#BA7517','#639922','#7F77DD','#993C1D'];
const PERFIS={
  // Globais
  admin:            {label:'Administrador',       color:'#3266ad',bg:'#e8f0fb', fabricas:['cadeiras','estofados'], setor:null},

  // Fábrica de Cadeiras — Geral
  encarregado_cad:  {label:'Encarregado Geral',    color:'#1e40af',bg:'#dbeafe', fabricas:['cadeiras'],            setor:null},
  // Fábrica de Cadeiras — Enrolamento Terceirizado
  apontador1:       {label:'Apontador 1',          color:'#0f766e',bg:'#ccfbf1', fabricas:['cadeiras'],            setor:'enrolamento_terc', fichaColor:'#0f766e'},
  apontador2:       {label:'Apontador 2',          color:'#b45309',bg:'#fef3c7', fabricas:['cadeiras'],            setor:'enrolamento_terc', fichaColor:'#b45309'},
  entregador:       {label:'Entregador',           color:'#BA7517',bg:'#fef3e2', fabricas:['cadeiras'],            setor:'enrolamento_terc', fichaColor:null},
  enrolador:        {label:'Enrolador',            color:'#7c3aed',bg:'#ede9fe', fabricas:['cadeiras'],            setor:'enrolamento_terc', fichaColor:null},
  // Fábrica de Cadeiras — outros setores (em breve)
  apontador_metal:  {label:'Apontador Metalúrgica',color:'#374151',bg:'#f3f4f6', fabricas:['cadeiras'],            setor:'metalurgica',      fichaColor:null},
  soldador:         {label:'Soldador',             color:'#6b7280',bg:'#f9fafb', fabricas:['cadeiras'],            setor:'metalurgica',      fichaColor:null},

function somaEntr(f,k){if(k==='fita'||k==='fio')return(f.entregas||[]).reduce((a,e)=>a+(parseInt(e[k])||0),0);return(f.entregas||[]).reduce((a,e)=>a+(parseInt((e.tipos||{})[k])||0),0)}
function somaRecol(f,k){if(k==='fitaSobrando'||k==='fioSobrando')return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt(r[k])||0),0);return(f.recolhimentos||[]).reduce((a,r)=>a+(parseInt((r.tipos||{})[k])||0),0)}
function totalEnv(f){return TIPOS.reduce((a,t)=>a+somaEntr(f,t.id),0)}
function totalRec(f){return TIPOS.reduce((a,t)=>a+somaRecol(f,t.id),0)}
function pendentes(f){return totalEnv(f)-totalRec(f)}

// Retorna o apontador vinculado ao usuário atual (para filtrar fichas)
function getMeuApontadorId(){
  const perfil=currentUserData?.perfil;
  if(perfil==='apontador1'||perfil==='apontador2') return currentUserData.uid||currentUserData.id;
  return null;
}

// Verifica se a ficha pertence ao apontador atual
function fichaDoMeuApontador(ficha){
  const perfil=currentUserData?.perfil;
  if(perfil==='apontador1'||perfil==='apontador2'){
    // Verifica pelo enrolador da ficha — enrolador tem apontadorId
    const enr=getEnr(ficha.enroladorId);
    return enr&&enr.apontadorPerfil===perfil;
  }
  return true; // outros perfis veem tudo
}

// Cor da borda da ficha baseada no apontador do enrolador
function corFicha(ficha){
  const enr=getEnr(ficha.enroladorId);
  if(!enr) return '#e2e8f0';
  if(enr.apontadorPerfil==='apontador1') return '#0f766e';
  if(enr.apontadorPerfil==='apontador2') return '#b45309';
  return '#e2e8f0';
}

window._selecionarFabrica=id=>{
  currentFabrica=id;
  sessionStorage.setItem('jm_fabrica',id);
  if(id==='almoxarifado'){
    currentSetor='almoxarifado';
    sessionStorage.setItem('jm_setor','almoxarifado');
    currentTab='alm_painel';
  } else {
    currentSetor=null;
    sessionStorage.removeItem('jm_setor');
  }
  render();
};

// ── Seleção de setor ─────────────────────────────────────────────
function renderSelecionarSetor(){
  const setoresCadeiras=[
    {id:'enrolamento_terc', nome:'Enrolamento Terceirizado', icon:'🧵', desc:'Controle de fichas e enroladores', ativo:true},
    {id:'metalurgica',      nome:'Metalúrgica',              icon:'⚙️',  desc:'Produção de estruturas metálicas', ativo:true},
    {id:'fitas',            nome:'Setor de Fitas',           icon:'🎀', desc:'Controle de estoque de fitas', ativo:false},
    {id:'enrolamento_int',  nome:'Enrolamento Interno',      icon:'🏭', desc:'Enrolamento na própria fábrica', ativo:false},
  ];
  const setoresEstofados=[
    {id:'costura',    nome:'Costura',           icon:'🧵', desc:'Produção de capas e acabamentos', ativo:false},
    {id:'grades',     nome:'Grades',            icon:'🔩', desc:'Montagem de estruturas', ativo:false},
    {id:'tapecamento',nome:'Tapeçamento',       icon:'🪑', desc:'Aplicação de tecidos', ativo:false},
    {id:'espuma',     nome:'Blocos de Espuma',  icon:'🧱', desc:'Corte e controle de espuma', ativo:false},
  ];

  const setores=currentFabrica==='cadeiras'?setoresCadeiras:setoresEstofados;
  const fabInfo=currentFabrica==='cadeiras'
    ?{nome:'Fábrica de Cadeiras',icon:'🪑',cor:'#1e40af'}
    :{nome:'Fábrica de Estofados',icon:'🛋️',cor:'#7c3aed'};

  const cards=setores.map(s=>`
    <div class="setor-card ${s.ativo?'':'em-breve'}" onclick="${s.ativo?`window._selecionarSetor('${s.id}')`:'void(0)'}">
      <div class="setor-icon">${s.icon}</div>
      <div>
        <div class="setor-nome">${s.nome}</div>
        <div class="setor-desc">${s.ativo?s.desc:'Em breve'}</div>
      </div>
      ${s.ativo?'':'<span style="margin-left:auto;font-size:10px;background:#f1f5f9;color:#94a3b8;padding:2px 7px;border-radius:99px;font-weight:600">Em breve</span>'}
    </div>`).join('');

  const podeVerUsrFab=currentUserData?.perfil==='admin';
  const btnUsrFab=podeVerUsrFab?`
    <div style="margin-top:16px;border-top:1px solid #f1f5f9;padding-top:14px">
      <button class="btn btn-ghost" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px" onclick="window._abrirUsuariosFabrica('${currentFabrica}')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Usuários da Fábrica
      </button>
    </div>`:'';

  return `<div class="sel-wrap"><div class="sel-box">
    <button class="back-btn" onclick="window._voltarFabrica()">← Voltar</button>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <span style="font-size:28px">${fabInfo.icon}</span>
      <div class="sel-title" style="color:${fabInfo.cor}">${fabInfo.nome}</div>
    </div>
    <div class="sel-sub">Selecione o setor que deseja acessar.</div>
    <div class="setor-grid">${cards}</div>
    ${btnUsrFab}
  </div></div>`;
}

window._selecionarSetor=id=>{
  currentSetor=id;
  sessionStorage.setItem('jm_setor',id);
  // Tab inicial por perfil
  const pf=currentUserData?.perfil;
  if(pf==='financeiro') currentTab='relatorio';
  else if(can('verPainel')) currentTab='painel';
  else currentTab='fichas';
  render();
};

// Ao entrar no app, verifica se perfil tem setor fixo e pula seleção
function aplicarSetorAutomatico(){
  const p=PERFIS[currentUserData?.perfil];
  if(!p) return false;
  // Perfil com fábrica única e setor fixo → entra direto
  if(p.fabricas&&p.fabricas.length===1&&p.setor){
    currentFabrica=p.fabricas[0];
    currentSetor=p.setor;
    return true;
  }
  // Perfil com fábrica única mas sem setor fixo → mostra setores
  if(p.fabricas&&p.fabricas.length===1&&!p.setor){
    currentFabrica=p.fabricas[0];
    return false;
  }
  return false;
}
window._voltarFabrica=()=>{
  currentFabrica=null;
  currentSetor=null;
  sessionStorage.removeItem('jm_fabrica');
  sessionStorage.removeItem('jm_setor');
  render();
};
window._voltarSetores=()=>{
  // Se estiver no almoxarifado, voltar para seleção de fábricas
  if(currentFabrica==='almoxarifado'){
    currentFabrica=null;
    currentSetor=null;
    sessionStorage.removeItem('jm_fabrica');
    sessionStorage.removeItem('jm_setor');
  } else {
    currentSetor=null;
    sessionStorage.removeItem('jm_setor');
  }
  render();
};

function renderApp(){
  const p=PERFIS[currentUserData.perfil]||PERFIS.apontador;
  const tabs=[];
  if(currentSetor==='metalurgica'){
    // Tabs da metalúrgica
    const perfMetal=currentUserData?.perfil;
    if(['admin','encarregado_cad'].includes(perfMetal)){
      tabs.push('painel_metal','apontar','fichas_metal','ranking_metal','soldadores_metal','config_metal');
    }else if(perfMetal==='apontador_metal'){
      tabs.push('painel_metal','apontar','fichas_metal','ranking_metal');
    }else if(perfMetal==='soldador'){
      tabs.push('minha_prod','meu_desempenho','ranking_metal');
    }else{
      tabs.push('painel_metal','ranking_metal');
    }
    if(can('gerenciarUsuarios'))tabs.push('usuarios');
  } else if(currentSetor==='almoxarifado'){
    const pf=currentUserData?.perfil;
    const podeEditar=['admin','apontador1'].includes(pf);
    tabs.push('alm_painel');
    if(podeEditar) tabs.push('alm_entrada','alm_saida','alm_itens');
    else tabs.push('alm_itens');
    tabs.push('alm_relatorio');
    if(podeEditar) tabs.push('alm_config');
    if(!currentTab||!currentTab.startsWith('alm_')) currentTab='alm_painel';
  } else {
    if(can('verPainel'))tabs.push('painel');
    if(can('verFichas')||can('verFichasEntregador'))tabs.push('fichas');
    if(can('registrar'))tabs.push('entregar');
    if(can('registrar'))tabs.push('recolher');
    if(can('verRelatorio'))tabs.push('relatorio');
    if(can('verRanking'))tabs.push('ranking');
    if(can('verValores'))tabs.push('valores');
    if(can('cadastrarEnrolador'))tabs.push('enroladores');
    if(can('gerenciarUsuarios'))tabs.push('usuarios');
  }
  if(!tabs.includes(currentTab))currentTab=tabs[0]||'fichas';

  const perfisFixos=['soldador','enrolador','entregador',
    'enrolador_int','costureira','gradista','tapecador'];
  const perfilAtual=currentUserData?.perfil;
  const podeVoltarSetor=!perfisFixos.includes(perfilAtual);
  const btnVoltar=podeVoltarSetor?`
      <div style="padding:8px 18px 4px">
        <button onclick="window._voltarSetores()" style="width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#bfdbfe;font-size:12px;font-weight:600;padding:7px 10px;cursor:pointer;font-family:'Nunito',sans-serif;display:flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Trocar setor
        </button>
      </div>`:'';

  const navItems=tabs.map(t=>{
    const badge=t==='relatorio'&&notificacoes.length>0
      ?`<span style="margin-left:auto;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center">${notificacoes.length}</span>`
      :'';
    return `<div class="nav-item ${currentTab===t?'active':''}" onclick="window._switchTab('${t}')">
      ${NAV_ICONS[t]||''}
      <span>${TAB_LABELS[t]||t}</span>
      ${badge}
    </div>`;
  }).join('');

  return `<div class="shell">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="window._closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-title">JM</div>
        <div class="sidebar-logo-sub">Controle Terceirizado</div>
      </div>
      <div class="sidebar-nav">${btnVoltar}${navItems}</div>
      <div class="sidebar-footer">
        <div class="user-info">
          <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${initials(currentUserData.nome)}</div>
          <div style="min-width:0">
            <div class="user-name">${currentUserData.nome}</div>
            <div class="user-role">${p.label}</div>
          </div>
        </div>
        <button class="btn-logout" onclick="window._doLogout()">Sair</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">

// ── Resumo de movimento do painel ────────────────────────────────
function gerarResumoMovimento(){
  const hoje = today();
  const anoMes = hoje.slice(0,7);
  const mesNome = new Date().toLocaleDateString('pt-BR',{month:'long'});

  function calcMovimento(tipoId){
    let envHoje=0, envMes=0, recHoje=0, recMes=0;
    fichas.forEach(f=>{
      (f.entregas||[]).forEach(e=>{
        const v = parseInt((e.tipos||{})[tipoId])||0;
        if(e.data===hoje) envHoje+=v;
        if((e.data||'').slice(0,7)===anoMes) envMes+=v;
      });
      (f.recolhimentos||[]).forEach(r=>{
        const v = parseInt((r.tipos||{})[tipoId])||0;
        if(r.data===hoje) recHoje+=v;
        if((r.data||'').slice(0,7)===anoMes) recMes+=v;
      });
    });
    return {envHoje, envMes, recHoje, recMes};
  }

  const tiposAtivos = TIPOS.filter(t=>{
    const m = calcMovimento(t.id);
    return m.envHoje>0 || m.envMes>0 || m.recHoje>0 || m.recMes>0;
  });

  if(tiposAtivos.length===0){
    return `<div style="background:#fff;border-radius:14px;padding:24px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;margin-bottom:20px;text-align:center;color:#64748b">
      <div style="font-size:32px;margin-bottom:10px">📦</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">Nenhuma movimentação este mês</div>
      <div style="font-size:12px">Nenhuma entrega ou recolhimento registrado em ${mesNome}.</div>
    </div>`;
  }

  let html = `<div style="width:100%;margin-bottom:20px">`;

  tiposAtivos.forEach(t=>{
    const m = calcMovimento(t.id);
    const tc = TIPO_CORES[t.id] || {bg:'#f5f5f5', border:'#ddd', color:'#555'};

    // Card entrega
    let entregaHTML = '';
    if(m.envHoje === 0){
      entregaHTML = `<div style="font-size:11px;color:#94a3b8;font-style:italic;margin-bottom:8px">Nenhuma entrega hoje</div>
        <div style="font-size:10px;color:${tc.color}99">${mesNome}: <strong style="font-size:14px;color:${tc.color}">${m.envMes}</strong></div>`;
    } else {
      entregaHTML = `<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">
          <span style="font-size:28px;font-weight:800;color:${tc.color}">${m.envHoje}</span>
          <span style="font-size:11px;color:${tc.color}99">hoje</span>
        </div>
        <div style="font-size:11px;color:${tc.color}99">${mesNome}: <strong>${m.envMes}</strong></div>`;
    }

    // Card recolhimento
    let recolhHTML = '';
    if(m.recHoje === 0){
      recolhHTML = `<div style="font-size:11px;color:#94a3b8;font-style:italic;margin-bottom:8px">Nenhum recolhimento hoje</div>
        <div style="font-size:10px;color:${tc.color}99">${mesNome}: <strong style="font-size:14px;color:${tc.color}">${m.recMes}</strong></div>`;
    } else {
      recolhHTML = `<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">
          <span style="font-size:28px;font-weight:800;color:${tc.color}">${m.recHoje}</span>
          <span style="font-size:11px;color:${tc.color}99">hoje</span>
        </div>
        <div style="font-size:11px;color:${tc.color}99">${mesNome}: <strong>${m.recMes}</strong></div>`;
    }

    html += `<div style="background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;margin-bottom:10px;border-left:4px solid ${tc.color}">
      <div style="font-size:13px;font-weight:700;color:${tc.color};margin-bottom:10px">${t.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%">
        <div style="background:${tc.bg};border:1px solid ${tc.border};border-radius:10px;padding:10px 14px">
          <div style="font-size:10px;font-weight:700;color:${tc.color};text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Entregas</div>
          ${entregaHTML}
        </div>
        <div style="background:${tc.bg};border:1px solid ${tc.border};border-radius:10px;padding:10px 14px">
          <div style="font-size:10px;font-weight:700;color:${tc.color};text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Recolhimentos</div>
          ${recolhHTML}
        </div>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

// ── Sistema de Bônus por Volume ──────────────────────────────────

function calcVSofiaNoMes(enroladorId, anoMes){
  return fichas
    .filter(f=>f.enroladorId===enroladorId)
    .reduce((sum,f)=>{
      return sum+(f.recolhimentos||[]).reduce((s,r)=>{
        if((r.data||'').slice(0,7)!==anoMes) return s;
        return s+(parseInt((r.tipos||{}).varanda_sofia)||0);
      },0);
    },0);
}

function calcBonusEnrolador(enroladorId, anoMes){
  const enr=getEnr(enroladorId);
  if(!enr||enr.apontadorPerfil!=='apontador1') return null;
  if(!configBonus.ativo) return null;
  const total=calcVSofiaNoMes(enroladorId, anoMes);
  if(total<configBonus.meta) return null;
  return {
    enroladorId,
    enrNome:enr.nome,
    anoMes,
    totalVSofia:total,
    meta:configBonus.meta,
    valorBonus:configBonus.valorBonus,
    totalBonus:parseFloat((total*configBonus.valorBonus).toFixed(2)),
  };
}

function getBonusDoMes(anoMes){
  return enroladores
    .filter(e=>e.apontadorPerfil==='apontador1')
    .map(e=>calcBonusEnrolador(e.id, anoMes))
    .filter(b=>b!==null);
}

  // Só mostra para perfis que não são enroladores

}

// ── Fichas ───────────────────────────────────────────────────────
function renderFichas(){
  const isEntregador=can('verFichasEntregador')&&!can('verFichas');
  let html='';
  if(isEntregador)html+=`<div class="info-box">Você está visualizando as fichas abertas. Dados financeiros não exibidos.</div>`;
  if(!isEntregador){
    html+=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <select id="f-status" onchange="window._refreshFichas()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:8px;padding:5px 8px;background:#fff">
        <option value="all">Todos os status</option><option value="aberta">Em andamento</option><option value="fechada">Fechada</option>
      </select>
      <select id="f-enr" onchange="window._refreshFichas()" style="font-size:12px;border:1px solid #d0d0d0;border-radius:8px;padding:5px 8px;background:#fff">
        <option value="all">Todos enroladores</option>${[...enroladores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}
      </select>
    </div>`;
  }
  // Filtrar fichas por perfil
  let lista;
  const perfil=currentUserData?.perfil;
  if(isEntregador){
    lista=fichas.filter(f=>f.status==='aberta');
  }else if(perfil==='enrolador'){
    // Enrolador vê só as fichas do enrolador vinculado ao seu usuário
    const uid=currentUser?.uid||'';
    const idUsuario=currentUserData?.id||'';
    const minhasEnr=enroladores.filter(e=>
      e.usuarioUid===uid||
      e.usuarioUid===idUsuario
    ).map(e=>e.id);
    lista=fichas.filter(f=>minhasEnr.includes(f.enroladorId));
  }else if(perfil==='apontador1'||perfil==='apontador2'){
    const meusEnr=enroladores.filter(e=>e.apontadorPerfil===perfil).map(e=>e.id);
    lista=fichas.filter(f=>meusEnr.includes(f.enroladorId));
  }else{
    lista=[...fichas];
  }
  html+=`<div id="fichas-inner">${fichasInner(lista,isEntregador)}</div>`;
  return html;
}
window._refreshFichas=()=>{
  const st=document.getElementById('f-status')?.value||'all';
  const en=document.getElementById('f-enr')?.value||'all';
  let lista=[...fichas];
  if(st!=='all')lista=lista.filter(f=>f.status===st);
  if(en!=='all')lista=lista.filter(f=>f.enroladorId===en);
  document.getElementById('fichas-inner').innerHTML=fichasInner(lista,false);
};
function fichasInner(lista,isEntregador){
  if(!lista.length)return'<div class="card"><div style="color:#666;font-size:13px;text-align:center;padding:20px">Nenhuma ficha encontrada.</div></div>';

    const enr=getEnr(f.enroladorId);if(!enr)return'';
    const ci=enroladores.findIndex(e=>e.id===f.enroladorId),c=avatarColor(ci);
    const env=totalEnv(f),rec=totalRec(f),pend=env-rec,pct=env?Math.round(rec/env*100):0;
    const fitaEnv=somaEntr(f,'fita'),fioEnv=somaEntr(f,'fio'),fitaSob=somaRecol(f,'fitaSobrando'),fioSob=somaRecol(f,'fioSobrando');
    const closable=pend===0&&f.status==='aberta'&&can('fecharFicha');

    }).join(''):`<tr><td colspan="${isAdmin?5:4}" style="color:#666">Nenhum recolhimento.</td></tr>`;
    const sl=f.status==='cancelada'?'badge-cancelada':f.status==='fechada'?'badge-fechada':pend===0?'badge-closed':rec>0?'badge-partial':'badge-open';
    const st2=f.status==='cancelada'?'cancelada':f.status==='fechada'?'fechada':pend===0?'pronto':rec>0?'retornando':'aguardando';

          <div>

          ${isAdmin?`<button class="btn btn-sm btn-danger" onclick="window._excluirFicha('${f.id}')">Excluir ficha</button>`:''}
          ${(can('registrar')||can('editar'))&&f.status==='aberta'?`<button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border:1px solid #fca5a5" onclick="window._abrirRetiradaAdmin('${f.id}')">↩ Retirada</button>`:''}
          ${(()=>{
            if(!can('sinalizarProntos')||f.status!=='aberta')return'';

            if(currentUserData?.perfil==='enrolador'){

           ${can('verSinalizacoes')?renderBadgeProntos(f):''}
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;width:100%">

      <div style="width:100%;margin-top:4px;border-top:1px solid #f1f5f9;padding-top:10px">

  };
  await updateDoc(doc(db,'fichas',fichaId),{entregas});
  closeModal();showToast('Entrega atualizada!');
};
window._excluirEntrada=(fichaId,idx)=>{

// ── Relatório ────────────────────────────────────────────────────
function renderRelatorio(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Marcar notificações como lidas ao abrir o relatório
  if(notificacoes.length>0){
    notificacoes.forEach(async n=>{
      await updateDoc(doc(db,'notificacoes',n.id),{lida:true});
    });
    notificacoes=[];
  }

  const fechadas=fichas.filter(f=>f.status==='fechada');
  const pagas=fechadas.filter(f=>f.pago);
  const pendentes_pag=fechadas.filter(f=>!f.pago);
  const totalPecas=fechadas.reduce((a,f)=>a+totalEnv(f),0);

        </div>

  }).join('');
  return html;
}

// ── Valores e pagamento ──────────────────────────────────────
function calcularPagamento(f){
  const vals=getValoresPorFicha(f);
  return TIPOS.reduce((total,t)=>{
    const qtd=somaRecol(f,t.id);
    const valor=parseFloat(vals[t.id])||0;
    return total+(qtd*valor);
  },0);
}

function fmtMoeda(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

// ── Ranking ──────────────────────────────────────────────────
function renderRanking(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const hoje = today();
  const anoMeAtual = hoje.slice(0,7);
  const mesAtualNome = MESES[parseInt(hoje.slice(5,7))-1];
  const anoAtual = hoje.slice(0,4);

  function resumoMensal(fichasEnr){
    const map={};
    fichasEnr.forEach(f=>{
      (f.recolhimentos||[]).forEach(r=>{
        if(!r.data)return;
        const [y,m]=r.data.split('-');
        const chave=`${y}-${m.padStart(2,'0')}`;
        if(!map[chave])map[chave]={ano:parseInt(y),mes:parseInt(m),total:0,varandas:0,centros:0};
        TIPOS.forEach(t=>{map[chave].total+=(parseInt((r.tipos||{})[t.id])||0);});
        map[chave].varandas+=(parseInt((r.tipos||{}).varanda_sofia)||0);
        map[chave].centros+=(parseInt((r.tipos||{}).centro_luxo)||0);
      });
    });
    return Object.values(map).sort((a,b)=>b.ano!==a.ano?b.ano-a.ano:b.mes-a.mes);
  }

  function enroladoNoMes(fichasEnr, anoMes){
    let total=0;
    fichasEnr.forEach(f=>{
      (f.recolhimentos||[]).forEach(r=>{
        if((r.data||'').slice(0,7)===anoMes){
          TIPOS.forEach(t=>{total+=(parseInt((r.tipos||{})[t.id])||0);});
        }
      });
    });
    return total;
  }

  const dados = enroladores.map(enr=>{
    const fichasEnr      = fichas.filter(f=>f.enroladorId===enr.id);
    const totalEnrolado  = fichasEnr.reduce((a,f)=>a+totalRec(f),0);
    const totalEnviado   = fichasEnr.reduce((a,f)=>a+totalEnv(f),0);
    const totalPendente  = fichasEnr.reduce((a,f)=>a+Math.max(0,pendentes(f)),0);
    const varandas       = fichasEnr.reduce((a,f)=>a+somaRecol(f,'varanda_sofia'),0);
    const centros        = fichasEnr.reduce((a,f)=>a+somaRecol(f,'centro_luxo'),0);
    const txRetorno      = totalEnviado>0?Math.round(totalEnrolado/totalEnviado*100):0;
    const mensal         = resumoMensal(fichasEnr);
    const enroladoMesAtual = enroladoNoMes(fichasEnr, anoMeAtual);
    return {enr, totalEnrolado, totalEnviado, totalPendente, varandas, centros, txRetorno, mensal, enroladoMesAtual};
  }).filter(d=>d.totalEnviado>0)
    .sort((a,b)=>b.enroladoMesAtual-a.enroladoMesAtual || b.totalEnrolado-a.totalEnrolado);

  if(!dados.length) return '<div class="card"><div style="color:#64748b;font-size:13px;text-align:center;padding:20px">Nenhum dado disponível ainda.</div></div>';

  const maximoMes = Math.max(...dados.map(d=>d.enroladoMesAtual), 1);
  const medalhas = ['🥇','🥈','🥉'];

  // Totais do mês atual
  const totalGeralMes  = dados.reduce((a,d)=>a+d.enroladoMesAtual,0);

  // Varanda Sofia e Centro Luxo do mês atual
  function enroladoTipoNoMes(tipoId){
    let total=0;
    fichas.forEach(f=>{
      (f.recolhimentos||[]).forEach(r=>{
        if((r.data||'').slice(0,7)===anoMeAtual){
          total+=(parseInt((r.tipos||{})[tipoId])||0);
        }
      });
    });
    return total;
  }
  const varMes = enroladoTipoNoMes('varanda_sofia');
  const cenMes = enroladoTipoNoMes('centro_luxo');
  const totalCasas = dados.length;

  let html = `
    <div style="background:#1e40af;border-radius:14px;padding:14px 18px;margin-bottom:12px;width:100%">
      <div style="font-size:16px;font-weight:800;color:#fff;margin-bottom:2px">🏆 Ranking de Enroladores</div>
      <div style="font-size:12px;color:#93c5fd">Ordenado por peças enroladas em <strong style="color:#fff">${mesAtualNome} ${anoAtual}</strong></div>
    </div>

    <div style="background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;width:100%">
      <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Totais de ${mesAtualNome} — todas as casas</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%">
        <div class="metric"><div class="metric-label">Total enrolado</div><div class="metric-value" style="font-size:22px;color:#1e40af">${totalGeralMes}</div><div style="font-size:10px;color:#94a3b8">peças em ${mesAtualNome}</div></div>
        <div class="metric"><div class="metric-label">Casas ativas</div><div class="metric-value" style="font-size:22px">${totalCasas}</div><div style="font-size:10px;color:#94a3b8">enroladoras</div></div>
        <div class="metric"><div class="metric-label">Varanda Sofia</div><div class="metric-value" style="font-size:22px;color:#3266ad">${varMes}</div><div style="font-size:10px;color:#94a3b8">em ${mesAtualNome}</div></div>
        <div class="metric"><div class="metric-label">Centro Luxo</div><div class="metric-value" style="font-size:22px;color:#1D9E75">${cenMes}</div><div style="font-size:10px;color:#94a3b8">em ${mesAtualNome}</div></div>
      </div>
    </div>`;

  html += dados.map((d,i)=>{
    const ci  = enroladores.findIndex(e=>e.id===d.enr.id);
    const c   = avatarColor(ci);
    const bar = Math.round(d.enroladoMesAtual/maximoMes*100);
    const destaque = i===0 ? 'border:2px solid #f5c842;' : '';

    const mensalRows = d.mensal.length ? d.mensal.map(m=>{
      const nomeMes=`${MESES[m.mes-1]} ${m.ano}`;
      const isMesAtual=`${m.ano}-${String(m.mes).padStart(2,'0')}`===anoMeAtual;

window._atualizarSelectRecolhimento=()=>{
  const sel=document.getElementById('r-ficha');
  if(!sel)return;
  const valorAtual=sel.value;
  const perfil=currentUserData?.perfil;
  const abertas=fichas.filter(f=>{
    if(f.status!=='aberta')return false;
    if(perfil==='apontador1'||perfil==='apontador2'){
      const enr=getEnr(f.enroladorId);
      return enr&&enr.apontadorPerfil===perfil;
    }
    return true;
  });
  const enrolsComFichas=[...new Set(abertas.map(f=>f.enroladorId))]
    .sort((a,b)=>{const na=getEnr(a)?.nome||'';const nb=getEnr(b)?.nome||'';return na.localeCompare(nb,'pt-BR');});
  const optsHtml=enrolsComFichas.map(enrId=>{
    const fichasEnr=abertas.filter(f=>f.enroladorId===enrId).sort((a,b)=>a.dataAbertura>b.dataAbertura?1:-1);

  }).join('');

window._registrarEntrega=async()=>{
  const enrId=document.getElementById('e-enr').value;
  const data=document.getElementById('e-data').value;
  const entregador=document.getElementById('e-entregador').value.trim();
  const cor=document.getElementById('e-cor').value;
  const fita=parseInt(document.getElementById('e-fita').value)||0;
  const fio=parseInt(document.getElementById('e-fio').value)||0;
  const tipos=getTiposValues('e-tipos');
  if(!enrId||!data){showToast('Selecione o enrolador e a data.');return;}
  if(!fita&&!fio&&!Object.values(tipos).reduce((a,v)=>a+v,0)){showToast('Registre pelo menos fita, fio ou alguma peça.');return;}
  const novaEntrega={data,entregador,cor,fita,fio,tipos};
  const destEl=document.getElementById('e-ficha-dest');
  const dest=destEl?destEl.value:'nova';
  if(dest&&dest!=='nova'){
    // Adiciona à ficha existente
    const ficha=getFicha(dest);
    const entregas=[...(ficha.entregas||[]),novaEntrega];
    await updateDoc(doc(db,'fichas',dest),{entregas});
    showToast('Entrega adicionada à ficha existente!');
  }else{
    // Cria nova ficha
    await addDoc(collection(db,'fichas'),{enroladorId:enrId,dataAbertura:data,status:'aberta',pago:false,entregas:[novaEntrega],recolhimentos:[]});
    showToast('Nova ficha criada com a entrega!');
  }
  // Limpa apenas os campos sem reconstruir o form inteiro
  document.getElementById('e-data').value=today();
  document.getElementById('e-cor').value='';
  document.getElementById('e-fita').value='';
  document.getElementById('e-fio').value='';
  document.getElementById('e-entregador').value='';
  buildTiposInputs('e-tipos');
  // Atualiza as opções de ficha para o enrolador atual
  window._atualizarFichasEntrega();
};

window._registrarRecolhimento=async()=>{
  const fichaId=document.getElementById('r-ficha').value;
  const data=document.getElementById('r-data').value;
  const entregador=document.getElementById('r-entregador').value.trim();
  const fitaSobrando=parseInt(document.getElementById('r-fita').value)||0;
  const fioSobrando=parseInt(document.getElementById('r-fio').value)||0;
  const tipos=getTiposValues('r-tipos');
  if(!fichaId||!data){showToast('Selecione a ficha e a data.');return;}
  const totalPecasRec=Object.values(tipos).reduce((a,v)=>a+v,0);
  if(!totalPecasRec&&!fitaSobrando&&!fioSobrando){showToast('Registre pelo menos alguma peça recolhida.');return;}
  const f=getFicha(fichaId);

  // Validação: não permite recolher mais do que foi enviado por tipo
  for(const t of TIPOS){
    const jaRecol=somaRecol(f,t.id);
    const enviado=somaEntr(f,t.id);
    const tentando=tipos[t.id]||0;
    if(jaRecol+tentando>enviado){
      showToast(`Quantidade inválida: ${t.label} — enviadas: ${enviado}, já recolhidas: ${jaRecol}, máximo a recolher agora: ${enviado-jaRecol}.`);
      return;
    }
  }

  const recolhimentos=[...(f.recolhimentos||[]),{data,entregador,fitaSobrando,fioSobrando,tipos}];

  // Atualizar sinalização: subtrair peças recolhidas
  const prontoAtual={...(f.prontos||{})};
  let algumProntoRestante=false;
  TIPOS.forEach(t=>{
    const recolhido=tipos[t.id]||0;
    const prontoAntes=parseInt(prontoAtual[t.id])||0;
    prontoAtual[t.id]=Math.max(0, prontoAntes-recolhido);
    if(prontoAtual[t.id]>0) algumProntoRestante=true;
  });

  await updateDoc(doc(db,'fichas',fichaId),{
    recolhimentos,
    prontos: prontoAtual,
    prontoSinalizado: algumProntoRestante,
  });
  const fAtual={...f,recolhimentos};
  if(pendentes(fAtual)<=0){
    showModal('Todas as peças retornaram!',
      `<div style="font-size:13px;color:#444;line-height:1.6">As peças foram todas recolhidas. Deseja fechar a ficha de <strong>${getEnr(f.enroladorId)?.nome}</strong>?</div>`,
      `<button class="btn btn-sm" onclick="window._closeModal()">Agora não</button>
       <button class="btn btn-sm btn-success" onclick="window._fecharFichaDirecto('${fichaId}')">Fechar ficha</button>`);
  }else{
    showToast('Recolhimento registrado!');
  }
  // Limpa campos sem reconstruir o form — o listener do Firebase atualiza as fichas automaticamente
  document.getElementById('r-ficha').value='';
  document.getElementById('r-data').value=today();
  document.getElementById('r-entregador').value='';
  document.getElementById('r-fita').value='';
  document.getElementById('r-fio').value='';
  buildTiposInputs('r-tipos');
};

window._fecharFichaDirecto=async id=>{
  closeModal();
  const f=getFicha(id);
  const enr=getEnr(f?.enroladorId);
  await updateDoc(doc(db,'fichas',id),{status:'fechada',dataFechamento:today()});
  await addDoc(collection(db,'notificacoes'),{
    tipo:'ficha_fechada',
    fichaId:id,
    enroladorNome:enr?.nome||'',
    total:calcularPagamento({...f,status:'fechada'}),
    data:today(),
    lida:false,
    criadaEm:new Date().toISOString(),
  });
  showToast('Ficha fechada!');
};

// Contextos: 'global' | 'fabrica' | 'setor' (default)
function getPerfisContexto(contexto, fabrica, setor){
  return Object.entries(PERFIS).filter(([k,v])=>{
    if(contexto==='global'){
      // Só perfis presentes nas duas fábricas
      return v.fabricas&&v.fabricas.includes('cadeiras')&&v.fabricas.includes('estofados');
    }
    if(contexto==='fabrica'){
      // Perfis da fábrica sem setor fixo (encarregado geral, etc.)
      if(!v.fabricas||!v.fabricas.includes(fabrica)) return false;
      return !v.setor; // sem setor específico = nível de fábrica
    }
    // Setor específico
    if(v.fabricas&&v.fabricas.includes('cadeiras')&&v.fabricas.includes('estofados')) return true;
    if(fabrica&&v.fabricas&&!v.fabricas.includes(fabrica)) return false;
    if(setor&&v.setor&&v.setor!==setor) return false;
    return true;
  });
}

function renderUsuariosContexto(contexto, fabrica, setor, titulo){
  const perfisDisp = getPerfisContexto(contexto, fabrica, setor);
  const optsPerfilHtml = perfisDisp.map(function(e){return '<option value="'+e[0]+'">'+e[1].label+'</option>';}).join('');
  const usuariosFiltrados = contexto==='global'
    ? usuarios.filter(function(u){var p=PERFIS[u.perfil];return p&&p.fabricas&&p.fabricas.includes('cadeiras')&&p.fabricas.includes('estofados');})
    : contexto==='fabrica'
    ? usuarios.filter(function(u){var p=PERFIS[u.perfil];return p&&p.fabricas&&p.fabricas.includes(fabrica)&&!p.setor;})
    : usuarios;

  var rows=usuariosFiltrados.map(function(u){
    var p=PERFIS[u.perfil]||{label:u.perfil,color:'#555',bg:'#f0f0f0'};
    var excBtn=u.uid!==currentUser.uid
      ?'<button class="btn btn-sm btn-danger" onclick="window._excluirUsuario(&quot;'+u.id+'&quot;)">Excluir</button>'
      :'<span style="font-size:10px;color:#64748b">(você)</span>';
    return '<div class="card" style="margin-bottom:8px"><div style="display:flex;align-items:center;justify-content:space-between">'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<div style="width:44px;height:44px;border-radius:50%;background:'+p.bg+';color:'+p.color+';display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">'+initials(u.nome)+'</div>'
      +'<div><div style="font-size:14px;font-weight:700">'+u.nome+'</div><div style="font-size:11px;color:#64748b">'+u.email+'</div></div></div>'
      +'<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'
      +'<span style="font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;background:'+p.bg+';color:'+p.color+'">'+p.label+'</span>'
      +'<button class="btn btn-sm btn-warn" onclick="window._editarUsuario(&quot;'+u.id+'&quot;)">Editar</button>'
      +excBtn+'</div></div></div>';
  }).join('');

  if(!rows) rows='<div class="card"><div style="color:#64748b;text-align:center;padding:16px;font-size:13px">Nenhum usuário cadastrado.</div></div>';

  return '<div class="card" style="margin-bottom:10px">'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:10px">Cadastrar novo usuário — '+titulo+'</div>'
    +'<div class="form-row"><div class="form-group"><label>Nome</label><input type="text" id="nu-nome" placeholder="Nome completo"></div>'
    +'<div class="form-group"><label>Perfil</label><select id="nu-perfil">'+optsPerfilHtml+'</select></div></div>'
    +'<div class="form-row"><div class="form-group"><label>E-mail (login)</label><input type="email" id="nu-email" placeholder="email@empresa.com"></div>'
    +'<div class="form-group"><label>Senha inicial</label><input type="text" id="nu-senha" placeholder="mínimo 6 caracteres"></div></div>'
    +'<button class="btn btn-primary" onclick="window._cadastrarUsuario()">Cadastrar</button>'
    +'</div>'
    +'<div class="section-label">usuários cadastrados</div>'
    +rows;
}

window._cadastrarUsuario=async()=>{
  const nome=document.getElementById('nu-nome').value.trim();
  const perfil=document.getElementById('nu-perfil').value;
  const email=document.getElementById('nu-email').value.trim();
  const senha=document.getElementById('nu-senha').value.trim();
  if(!nome||!email||!senha){showToast('Preencha nome, e-mail e senha.');return;}
  if(senha.length<6){showToast('A senha precisa ter pelo menos 6 caracteres.');return;}
  try{
    await addDoc(collection(db,'usuarios'),{nome,perfil,email,uid:''});
    showToast('Usuário salvo! Crie o login no Firebase Console → Authentication → Add user.');
    reloadTab();
  }catch(e){showToast('Erro: '+e.message);}
};

// ── Sistema Metalúrgica ──────────────────────────────────────────

function getQuinzena(dataStr){
  const d = dataStr || today();
  const dia = parseInt(d.slice(8,10));
  const anoMes = d.slice(0,7);
  return dia <= 15 ? `${anoMes}-Q1` : `${anoMes}-Q2`;
}

function getQuinzenaAtual(){ return getQuinzena(today()); }

function quinzenaLabel(q){
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [ano,mes,q12]=q.split('-');
  const mNome=MESES[parseInt(mes)-1];
  return q12==='Q1'?`1–15 ${mNome} ${ano}`:`16–fim ${mNome} ${ano}`;
}

function isSemana(dataStr){
  const hoje=new Date(today()+'T00:00:00');
  const d=new Date(dataStr+'T00:00:00');
  const diff=(hoje-d)/(1000*60*60*24);
  const diaSemana=hoje.getDay(); // 0=dom
  const inicioSemana=new Date(hoje); inicioSemana.setDate(hoje.getDate()-diaSemana);
  return d>=inicioSemana;
}

function apontSoldador(soldadorId){
  return apontamentosMetal.filter(a=>a.soldadorId===soldadorId);
}

function totalPecaPeriodo(soldadorId, pecaId, periodo){
  // periodo: 'hoje', 'semana', 'quinzena', 'mes', ou anoMes-Q1/Q2
  const hoje_=today();
  const qAtual=getQuinzenaAtual();
  const mesAtual=hoje_.slice(0,7);
  return apontSoldador(soldadorId).reduce((sum,a)=>{
    const data=a.data||'';
    const match = periodo==='hoje'      ? data===hoje_
                : periodo==='semana'    ? isSemana(data)
                : periodo==='quinzena'  ? getQuinzena(data)===qAtual
                : periodo==='mes'       ? data.slice(0,7)===mesAtual
                : getQuinzena(data)===periodo;
    return sum + (match ? (parseInt((a.pecas||{})[pecaId])||0) : 0);
  }, 0);
}

function totalGeralPeriodo(soldadorId, periodo){
  return PECAS_METAL_FULL.reduce((s,p)=>s+totalPecaPeriodo(soldadorId,p.id,periodo),0);
}

function calcGanhoSoldador(soldadorId, periodo){
  const s=soldadores.find(x=>x.id===soldadorId);
  if(!s) return 0;
  const vProd=configMetal.valoresProd||{};
  const vMeta=configMetal.valoresMeta||{};
  const vRef=configMetal.valoresRef||{};
  const metas=configMetal.metas||{};
  const hoje_=today();
  const qAtual=getQuinzenaAtual();

  if(s.contrato==='producao'){
    // Ganha por tudo que produzir: peças normais usam vProd, reformas usam vRef
    return PECAS_METAL_FULL.reduce((sum,p)=>{
      const qtd=totalPecaPeriodo(soldadorId,p.id,periodo);
      const val=p.reforma ? (parseFloat(vRef[p.id.replace('ref_','')])||0) : (parseFloat(vProd[p.id])||0);
      return sum+(qtd*val);
    },0);
  } else {
    // Fichado: excedente usa vMeta para peças, vRef para reformas
    const diasPeriodo=new Set(
      apontSoldador(soldadorId)
        .filter(a=>{
          const data=a.data||'';
          return periodo==='hoje'     ? data===hoje_
               : periodo==='semana'   ? isSemana(data)
               : periodo==='quinzena' ? getQuinzena(data)===qAtual
               : periodo==='mes'      ? data.slice(0,7)===hoje_.slice(0,7)
               : getQuinzena(data)===periodo;
        })
        .map(a=>a.data)
    );
    let totalGanho=0;
    diasPeriodo.forEach(dia=>{
      PECAS_METAL_FULL.forEach(p=>{
        const qtdDia=apontSoldador(soldadorId)
          .filter(a=>a.data===dia)
          .reduce((s,a)=>s+(parseInt((a.pecas||{})[p.id])||0),0);
        if(p.reforma){
          // Reformas: paga tudo pelo valor de reforma
          const val=parseFloat(vRef[p.id.replace('ref_','')])||0;
          totalGanho+=qtdDia*val;
        } else {
          // Fichado: excedente usa preço da meta
          const val=parseFloat(vMeta[p.id])||0;
          const meta=parseInt(metas[p.id])||0;
          const excedente=Math.max(0,qtdDia-meta);
          totalGanho+=excedente*val;
        }
      });
    });
    return totalGanho;
  }
}

function fmtR(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// ── Helpers fichas metalúrgica ──────────────────────────────────
function calcGanhoFichaMetal(fichaId){
  const ficha=fichasMetal.find(f=>f.id===fichaId);
  if(!ficha) return 0;
  return calcGanhoSoldador(ficha.soldadorId, ficha.quinzena);
}

function getFichaMetal(soldadorId, quinzena){
  return fichasMetal.find(f=>f.soldadorId===soldadorId&&f.quinzena===quinzena);
}

function totalPecasFicha(soldadorId, quinzena){
  return apontamentosMetal
    .filter(a=>a.soldadorId===soldadorId&&getQuinzena(a.data)===quinzena)
    .reduce((sum,a)=>sum+Object.values(a.pecas||{}).reduce((s,v)=>s+(parseInt(v)||0),0),0);
}

// ── Alerta de casas sem retorno ──────────────────────────────────
function diasSemRetorno(enroladorId){
  // Pega fichas abertas com peças pendentes
  const fichasEnr=fichas.filter(f=>f.enroladorId===enroladorId&&f.status==='aberta'&&pendentes(f)>0);
  if(!fichasEnr.length) return null;

  // Referência: último recolhimento ou, se nunca houve recolhimento, a primeira entrega
  let dataRef=null;
  fichasEnr.forEach(f=>{
    // Verificar último recolhimento
    (f.recolhimentos||[]).forEach(r=>{
      if(r.data&&(!dataRef||r.data>dataRef)) dataRef=r.data;
    });
    // Se não há recolhimento, usar a data da primeira entrega
    if(!(f.recolhimentos||[]).length){
      (f.entregas||[]).forEach(e=>{
        if(e.data&&(!dataRef||e.data<dataRef)) dataRef=e.data;
      });
    }
  });

  if(!dataRef) return null;
  const diff=Math.floor((new Date(today()+'T00:00:00')-new Date(dataRef+'T00:00:00'))/(1000*60*60*24));
  return diff>=0?diff:null;
}

  const dias = diasSemRetorno(enroladorId);

window._registrarApontMetal=async()=>{
  const soldadorId=document.getElementById('ap-soldador').value;
  const data=document.getElementById('ap-data').value;
  if(!soldadorId||!data){showToast('Selecione o soldador e a data.');return;}
  const pecas={};
  let totalPecas=0;
  PECAS_METAL_FULL.forEach(p=>{
    const v=parseInt(document.getElementById(`ap-${p.id}`)?.value)||0;
    if(v>0){pecas[p.id]=v;totalPecas+=v;}
  });
  if(!totalPecas){showToast('Informe pelo menos uma peça.');return;}
  await addDoc(collection(db,'apontamentos_metal'),{soldadorId,data,pecas,criadoEm:new Date().toISOString()});
  showToast('Produção registrada!');
  window._limparApontMetal();
};

  PECAS_METAL_FULL.forEach(p=>{const el=document.getElementById('ap-'+p.id);if(el)el.value='';});

// ── Meu Desempenho (soldador) ────────────────────────────────────
function renderMeuDesempenho(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const uid=currentUser?.uid||'';
  const idUsuario=currentUserData?.id||'';
  const sol=soldadores.find(s=>s.usuarioUid===uid||s.usuarioUid===idUsuario);
  if(!sol) return '<div class="card"><div style="color:#64748b;text-align:center;padding:20px">Seu usuário não está vinculado a nenhum soldador.</div></div>';

  const c=avatarColor(soldadores.findIndex(s=>s.id===sol.id));
  const hoje_=today();
  const mesAtual=hoje_.slice(0,7);

  // ── Acumulado total
  const totalAcum=PECAS_METAL_FULL.reduce((s,p)=>s+totalPecaPeriodo(sol.id,p.id,'mes')*0,0)
    +apontSoldador(sol.id).reduce((s,a)=>s+Object.values(a.pecas||{}).reduce((x,v)=>x+(parseInt(v)||0),0),0);

  // ── Recorde semanal (total de peças em uma semana)
  // Agrupar apontamentos por semana (segunda a domingo)
  function getInicioSemana(dataStr){
    const d=new Date(dataStr+'T00:00:00');
    const dia=d.getDay(); // 0=dom
    const diff=dia===0?6:dia-1; // segunda=0
    const seg=new Date(d); seg.setDate(d.getDate()-diff);
    return seg.toISOString().slice(0,10);
  }

  const semanas={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const seg=getInicioSemana(a.data);
    if(!semanas[seg])semanas[seg]=0;
    Object.values(a.pecas||{}).forEach(v=>semanas[seg]+=(parseInt(v)||0));
  });
  const semanaAtual=getInicioSemana(hoje_);
  const totalSemanaAtual=semanas[semanaAtual]||0;
  const recordeSemanal=Math.max(0,...Object.values(semanas));
  const semanaAnterior=new Date(semanaAtual+'T00:00:00');
  semanaAnterior.setDate(semanaAnterior.getDate()-7);
  const totalSemanaAnterior=semanas[semanaAnterior.toISOString().slice(0,10)]||0;
  const diffSemana=totalSemanaAtual-totalSemanaAnterior;

  // ── Peças produzidas esta semana com suas metas individuais
  const pecasSemana=PECAS_METAL.map(p=>{
    const qtd=totalPecaPeriodo(sol.id,p.id,'semana');
    const meta=parseInt((configMetal.metas||{})[p.id])||0;
    const metaSab=Math.round(meta/2);
    const diaSemana=new Date(hoje_+'T00:00:00').getDay();
    const ehSabado=diaSemana===6;
    const metaSemanal=Math.round(meta*5.5);
    return {p,qtd,meta,metaSemanal,ehSabado};
  }).filter(x=>x.qtd>0);
  const totalSemanalMeta=pecasSemana.reduce((s,x)=>s+x.metaSemanal,0);

  // ── Streak (dias consecutivos com apontamento)
  const diasComApoint=new Set(apontSoldador(sol.id).map(a=>a.data));
  let streak=0;
  let d=new Date(hoje_+'T00:00:00');
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(diasComApoint.has(ds)){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }

  // ── Resumo mensal
  const mesesMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const m=a.data.slice(0,7);
    if(!mesesMap[m])mesesMap[m]=0;
    Object.values(a.pecas||{}).forEach(v=>mesesMap[m]+=(parseInt(v)||0));
  });
  const mesesList=Object.entries(mesesMap).sort((a,b)=>b[0]>a[0]?1:-1).slice(0,6);
  const maxMes=Math.max(1,...mesesList.map(m=>m[1]));

  // ── Melhor quinzena
  const quinzenasMap={};
  apontSoldador(sol.id).forEach(a=>{
    if(!a.data)return;
    const q=getQuinzena(a.data);
    if(!quinzenasMap[q])quinzenasMap[q]=0;
    Object.values(a.pecas||{}).forEach(v=>quinzenasMap[q]+=(parseInt(v)||0));
  });
  const qAtual=getQuinzenaAtual();
  const totalQAtual=quinzenasMap[qAtual]||0;
  const recordeQuinzena=Math.max(0,...Object.values(quinzenasMap));
  const isRecordeQ=totalQAtual>0&&totalQAtual>=recordeQuinzena;

  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="width:52px;height:52px;border-radius:50%;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800">${initials(sol.nome)}</div>
      <div>
        <div style="font-size:18px;font-weight:800">${sol.nome}</div>
        <div style="font-size:12px;color:#64748b">${sol.contrato==='producao'?'Por produção':'Fichado'}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;width:100%">
    <div class="metric" style="border-left:4px solid ${c}">
      <div class="metric-label">Total acumulado</div>
      <div class="metric-value" style="font-size:28px;color:${c}">${totalAcum}</div>
      <div style="font-size:11px;color:#94a3b8">peças soldadas</div>
    </div>
    <div class="metric" style="border-left:4px solid #f59e0b">
      <div class="metric-label">🔥 Sequência atual</div>
      <div class="metric-value" style="font-size:28px;color:#f59e0b">${streak}</div>
      <div style="font-size:11px;color:#94a3b8">dia${streak!==1?'s':''} seguido${streak!==1?'s':''}</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px;border-left:4px solid #3b82f6">
    <div style="font-size:13px;font-weight:700;color:#1e40af;margin-bottom:10px">📅 Esta semana</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:36px;font-weight:800;color:#1e40af">${totalSemanaAtual}</div>
        <div style="font-size:11px;color:#64748b">peças esta semana</div>
      </div>
      <div style="text-align:right">
        ${totalSemanaAtual>=recordeSemanal&&totalSemanaAtual>0
          ?'<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">🏆 Novo recorde!</div>'
          :`<div style="font-size:11px;color:#64748b">Recorde</div>
           <div style="font-size:20px;font-weight:700;color:#475569">${recordeSemanal}</div>`}
        <div style="font-size:11px;color:${diffSemana>=0?'#059669':'#dc2626'};margin-top:4px">
          ${diffSemana>=0?'↑':'↓'} ${Math.abs(diffSemana)} vs semana anterior
        </div>
      </div>
    </div>
    ${pecasSemana.length>0?`<div style="margin-top:10px">
      <div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:8px">Progresso por peça</div>
      ${pecasSemana.map(({p,qtd,metaSemanal})=>{
        const pct=metaSemanal>0?Math.min(100,Math.round(qtd/metaSemanal*100)):100;
        const cor=pct>=100?'#059669':pct>=70?'#f59e0b':'#3b82f6';
        return `<div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
            <span style="color:#475569">${p.label}</span>
            <span style="font-weight:700;color:${cor}">${qtd}${metaSemanal>0?' / '+metaSemanal:''}</span>
          </div>
          <div style="height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${cor};border-radius:99px"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}
  </div>

  <div class="card" style="margin-bottom:14px;border-left:4px solid #8b5cf6">
    <div style="font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px">📆 Quinzena atual — ${quinzenaLabel(qAtual)}</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:36px;font-weight:800;color:#7c3aed">${totalQAtual}</div>
        <div style="font-size:11px;color:#64748b">peças na quinzena</div>
      </div>
      <div style="text-align:right">
        ${isRecordeQ
          ?'<div style="background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">🏆 Recorde de quinzena!</div>'
          :`<div style="font-size:11px;color:#64748b">Melhor quinzena</div>
           <div style="font-size:20px;font-weight:700;color:#475569">${recordeQuinzena}</div>`}
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Resumo mensal</div>
    ${mesesList.length?mesesList.map(([m,total])=>{
      const [ano,mes]=m.split('-');
      const nomeMes=MESES[parseInt(mes)-1]+' '+ano;
      const bar=Math.round(total/maxMes*100);
      const isMesAtual=m===mesAtual;
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <span style="font-size:12px;font-weight:${isMesAtual?700:400};color:${isMesAtual?'#1e40af':'#475569'}">${nomeMes}${isMesAtual?' ◀':''}</span>
          <span style="font-size:14px;font-weight:800;color:${isMesAtual?'#1e40af':'#1e293b'}">${total}</span>
        </div>
        <div style="height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${bar}%;background:${isMesAtual?'#3b82f6':c};border-radius:99px"></div>
        </div>
      </div>`;
    }).join(''):'<div style="color:#94a3b8;font-size:13px;text-align:center;padding:12px">Nenhuma produção registrada ainda.</div>'}
  </div>`;
}

  showModal('Fechar ficha — '+sol?.nome,
    `<div style="font-size:13px;color:#444;line-height:1.6">Fechar a ficha de <strong>${sol?.nome}</strong> referente a <strong>${quinzenaLabel(quinzena)}</strong>?<br><br>Após fechar, o financeiro será notificado para efetuar o pagamento.</div>`,

};

window._confirmarFecharFichaMetal=async(soldadorId,quinzena)=>{
  closeModal();
  const sol=soldadores.find(s=>s.id===soldadorId);
  const ganho=calcGanhoSoldador(soldadorId,quinzena);
  // Cria ou atualiza ficha
  const existing=getFichaMetal(soldadorId,quinzena);
  if(existing){
    await updateDoc(doc(db,'fichas_metal',existing.id),{status:'fechada',dataFechamento:today(),ganho});
  } else {
    await addDoc(collection(db,'fichas_metal'),{soldadorId,quinzena,status:'fechada',pago:false,dataFechamento:today(),ganho});
  }
  // Notificar financeiro
  await addDoc(collection(db,'notificacoes'),{
    tipo:'ficha_metal_fechada',
    soldadorNome:sol?.nome||'',
    quinzena,quinzenaLabel:quinzenaLabel(quinzena),
    ganho,data:today(),lida:false,criadaEm:new Date().toISOString(),
  });
  showToast('Ficha fechada! Financeiro notificado.');
};

window._pagarFichaMetal=async(fichaId)=>{
  showModal('Confirmar pagamento',
    '<div style="font-size:13px;color:#444">Confirmar o pagamento desta ficha?</div>',
    '<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" onclick="window._confirmarPagarFichaMetal(&quot;'+fichaId+'&quot;)">Confirmar pagamento</button>');
};
window._confirmarPagarFichaMetal=async id=>{

};

    if(tab==='alm_entrada')   return renderAlmMovimento('entrada');
    if(tab==='alm_saida')     return renderAlmMovimento('saida');

function renderAlmPainel(){
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((i,idx)=>({...i,id:'base-'+idx}));
  const totalItens=itens.length;
  const abaixoMin=itens.filter(i=>almEstoqueItem(i.id)<(parseInt(i.estoqueMin)||0)).length;
  const movHoje=almMovimentos.filter(m=>m.data===today());
  const entHoje=movHoje.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
  const saiHoje=movHoje.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);

  const CORES_CLASS={'MATERIA PRIMA':'#1e40af','EPI':'#065f46','MATERIAL DE USO E CONSUMO':'#92400e',
    'FERRAMENTAS':'#4c1d95','PEÇAS PARA MAQUINÁRIOS':'#dc2626','MAQUINÁRIO':'#374151',
    'EMBALAGEM':'#0369a1','PRODUTO ACABADO':'#15803d'};

  // Alertas de estoque baixo
  const alertas=itens.filter(i=>{
    const atual=almEstoqueItem(i.id);
    const min=parseInt(i.estoqueMin)||0;
    return min>0&&atual<min;
  });

window._registrarAlmMov=async(tipo)=>{
  const itemId=document.getElementById('alm-item')?.value;
  const tipoMov=document.getElementById('alm-tipo-mov')?.value;
  const qtd=parseInt(document.getElementById('alm-qtd')?.value)||0;
  const data=document.getElementById('alm-data')?.value||today();
  const pessoa=document.getElementById('alm-pessoa')?.value;
  const setor=document.getElementById('alm-setor')?.value;
  const obs=document.getElementById('alm-obs')?.value||'';
  if(!itemId||qtd<=0){showToast('Informe o item e a quantidade.');return;}
  const item=almItens.find(i=>i.id===itemId)||ALM_ITENS_BASE.find((_,idx)=>'base-'+idx===itemId);
  await addDoc(collection(db,'alm_movimentos'),{
    itemId,itemDesc:item?.descricao||'',itemCod:item?.codigo||'',
    tipo,tipoMov,quantidade:qtd,data,pessoa,setor,obs,
    registradoPor:currentUserData?.nome||'',
    criadoEm:new Date().toISOString(),
  });
  showToast((tipo==='entrada'?'Entrada':'Saída')+' registrada com sucesso!');
  document.getElementById('alm-qtd').value='';
  document.getElementById('alm-obs').value='';
};

// Previsão de duração do estoque (dias)
function almDuracaoEstoque(itemId){
  const hoje = new Date(today()+'T00:00:00');
  const limite = new Date(hoje); limite.setDate(hoje.getDate()-30);
  const limiteStr = limite.toISOString().slice(0,10);
  const saidas30 = almMovimentos.filter(m=>
    m.itemId===itemId && m.tipo==='saida' && m.data>=limiteStr
  );
  if(!saidas30.length) return null;
  const totalSaidas = saidas30.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
  const mediaDiaria = totalSaidas / 30;
  if(mediaDiaria<=0) return null;
  const estoque = almEstoqueItem(itemId);
  if(estoque<=0) return 0;
  return Math.floor(estoque / mediaDiaria);
}

function almDuracaoLabel(dias){
  if(dias===null) return {label:'Sem movimentação recente', cor:'#94a3b8', bg:'#f1f5f9'};
  if(dias===0) return {label:'Esgotado', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=7)  return {label:dias+'d restantes', cor:'#dc2626', bg:'#fee2e2'};
  if(dias<=15) return {label:dias+'d restantes', cor:'#d97706', bg:'#fef3c7'};
  if(dias<=30) return {label:dias+'d restantes', cor:'#2563eb', bg:'#dbeafe'};
  return {label:dias+'d restantes', cor:'#059669', bg:'#d1fae5'};
}

// ── Relatório ─────────────────────────────────────────────────────
function renderAlmRelatorio(){
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesAtual=today().slice(0,7);
  const mesNome=MESES[parseInt(mesAtual.slice(5,7))-1]+' '+mesAtual.slice(0,4);
  if(!window._almRelPeriodo) window._almRelPeriodo='mes';
  const per=window._almRelPeriodo;

  const movFiltrados=almMovimentos.filter(m=>{
    if(per==='hoje') return m.data===today();
    if(per==='mes') return (m.data||'').slice(0,7)===mesAtual;
    return true;
  });

  const entradas=movFiltrados.filter(m=>m.tipo==='entrada');
  const saidas=movFiltrados.filter(m=>m.tipo==='saida');
  const totalEnt=entradas.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
  const totalSai=saidas.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);

  // Por classificação
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((i,idx)=>({...i,id:'base-'+idx}));
  const CORES_CLASS={'MATERIA PRIMA':'#1e40af','EPI':'#065f46','MATERIAL DE USO E CONSUMO':'#92400e',
    'FERRAMENTAS':'#4c1d95','PEÇAS PARA MAQUINÁRIOS':'#dc2626','MAQUINÁRIO':'#374151',
    'EMBALAGEM':'#0369a1','PRODUTO ACABADO':'#15803d'};

  const porClass={};
  movFiltrados.forEach(m=>{
    const item=itens.find(i=>i.id===m.itemId);
    const cl=item?.classificacao||'Outros';
    if(!porClass[cl])porClass[cl]={entrada:0,saida:0};
    if(m.tipo==='entrada') porClass[cl].entrada+=parseInt(m.quantidade)||0;
    else porClass[cl].saida+=parseInt(m.quantidade)||0;
  });

  // Por setor (saídas)
  const porSetor={};
  saidas.forEach(m=>{
    if(!porSetor[m.setor]) porSetor[m.setor]=0;
    porSetor[m.setor]+=parseInt(m.quantidade)||0;
  });
  const setoresList=Object.entries(porSetor).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSetor=setoresList[0]?.[1]||1;

  const btnPer=(k,l)=>'<button class="btn btn-sm '+(per===k?'btn-primary':'btn-ghost')+'" onclick="window._almRelPeriodo=\''+k+'\';reloadTab()">'+l+'</button>';

  return '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'
    +btnPer('hoje','Hoje')+btnPer('mes',mesNome)+btnPer('total','Tudo')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;width:100%">'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#065f46,#10b981)">'
    +'<div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="24" height="24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></div>'
    +'<div><div class="stat-label">Total entradas</div><div class="stat-value">'+totalEnt+'</div><div class="stat-sub">'+entradas.length+' movimentos</div></div>'
    +'</div>'
    +'<div class="stat-card" style="background:linear-gradient(135deg,#92400e,#f59e0b)">'
    +'<div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="24" height="24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>'
    +'<div><div class="stat-label">Total saídas</div><div class="stat-value">'+totalSai+'</div><div class="stat-sub">'+saidas.length+' movimentos</div></div>'
    +'</div>'
    +'</div>'

    +(Object.keys(porClass).length?'<div class="card" style="margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Movimentação por classificação</div>'
    +Object.entries(porClass).map(([cl,v])=>{
      const cor=CORES_CLASS[cl]||'#475569';
      return '<div style="margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">'
        +'<span style="color:'+cor+';font-weight:600">'+cl+'</span>'
        +'<span style="color:#64748b">▲ '+v.entrada+' ▼ '+v.saida+'</span>'
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">'
        +'<div style="height:100%;width:'+Math.min(100,v.entrada)+'%;background:'+cor+';opacity:.8;border-radius:99px"></div></div>'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">'
        +'<div style="height:100%;width:'+Math.min(100,v.saida)+'%;background:'+cor+';opacity:.4;border-radius:99px"></div></div>'
        +'</div></div>';
    }).join('')+'</div>':'')

    +(setoresList.length?'<div class="card" style="margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:12px">📤 Saídas por setor</div>'
    +setoresList.map(([s,v])=>{
      const bar=Math.round(v/maxSetor*100);
      return '<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'
        +'<span style="color:#475569">'+s+'</span><span style="font-weight:700">'+v+'</span></div>'
        +'<div style="height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">'
        +'<div style="height:100%;width:'+bar+'%;background:#f59e0b;border-radius:99px"></div></div></div>';
    }).join('')+'</div>':'')

    +'<div class="section-label">Histórico de movimentos</div>'
    +([...movFiltrados].sort((a,b)=>b.criadoEm>a.criadoEm?1:-1).slice(0,30).map(m=>{
      const item=itens.find(i=>i.id===m.itemId);
      const isEnt=m.tipo==='entrada';
      return '<div class="card" style="margin-bottom:6px;padding:10px 14px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center">'
        +'<div>'
        +'<div style="font-size:12px;font-weight:700">'+(item?item.descricao:m.itemDesc||'Item')+'</div>'
        +'<div style="font-size:10px;color:#64748b">'+m.tipoMov+' · '+m.pessoa+' · '+m.setor+' · '+fmtDate(m.data)+'</div>'
        +'</div>'
        +'<div style="font-size:16px;font-weight:800;color:'+(isEnt?'#059669':'#d97706')+'">'
        +(isEnt?'+':'-')+m.quantidade+' '+(item?.unidade||'')+'</div>'
        +'</div></div>';
    }).join('')||'<div class="card"><div style="color:#94a3b8;text-align:center;padding:16px">Nenhuma movimentação no período.</div></div>');
}

window._addAlmLista=async(chave)=>{
  const el=document.getElementById('alm-novo-'+chave);
  const val=(el?.value||'').trim();
  if(!val){showToast('Digite um valor.');return;}
  const lista=[...(almConfig[chave]||[])];
  if(lista.includes(val)){showToast('Já existe na lista.');return;}
  lista.push(val);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Adicionado!');
  el.value='';
};

window._removeAlmLista=async(chave,idx)=>{
  const lista=[...(almConfig[chave]||[])];
  lista.splice(idx,1);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Removido!');
};
