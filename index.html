function renderAlmRelatorio(){
  if(!window._almRelAno) window._almRelAno=today().slice(0,4);
  const anoSel=window._almRelAno;
  const MESES_ABREV=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const MESES_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const itens=almItens.length?almItens:ALM_ITENS_BASE.map((i,idx)=>({...i,id:'base-'+idx}));

  function getItem(id){return itens.find(i=>i.id===id)||{};}

  // ── Últimos 7 dias ──────────────────────────────────────────
  const dias7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today()+'T00:00:00');
    d.setDate(d.getDate()-i);
    dias7.push(d.toISOString().slice(0,10));
  }

  const resumo7=dias7.map(data=>{
    const movs=almMovimentos.filter(m=>m.data===data);
    const entQtd=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const saiQtd=movs.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const entCusto=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseFloat(m.custoTotal)||0),0);
    return {data,entQtd,saiQtd,entCusto};
  });
  const totalCusto7=resumo7.reduce((s,r)=>s+r.entCusto,0);
  const totalEnt7=resumo7.reduce((s,r)=>s+r.entQtd,0);
  const totalSai7=resumo7.reduce((s,r)=>s+r.saiQtd,0);

  // Gráfico linha 7 dias
  const G7W=320; const G7H=110; const pts7=dias7.length;
  const maxQ7=Math.max(...resumo7.map(r=>Math.max(r.entQtd,r.saiQtd)),1);
  const xPad=18;
  function px7(i,v){return {x:xPad+i*(G7W-xPad*2)/(pts7-1),y:G7H-10-Math.round(v/maxQ7*(G7H-20))};}
  const ptEnt=resumo7.map((r,i)=>px7(i,r.entQtd));
  const ptSai=resumo7.map((r,i)=>px7(i,r.saiQtd));
  const lineEnt='M'+ptEnt.map(p=>p.x+','+p.y).join('L');
  const lineSai='M'+ptSai.map(p=>p.x+','+p.y).join('L');
  const dias7Labels=resumo7.map((r,i)=>{
    const d=new Date(r.data+'T00:00:00');
    // Linha 1: dia da semana abreviado, Linha 2: dd/mm
    const diaNm=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
    const diaDt=d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0');
    const isHoje=r.data===today();
    return `<text x="${ptEnt[i].x}" y="${G7H+13}" text-anchor="middle" font-size="8" fill="${isHoje?'#1e40af':'#64748b'}" font-weight="${isHoje?700:400}">${diaNm}</text>
    <text x="${ptEnt[i].x}" y="${G7H+22}" text-anchor="middle" font-size="7" fill="${isHoje?'#3b82f6':'#94a3b8'}">${diaDt}</text>`;
  }).join('');
  const valEnt=resumo7.map((r,i)=>r.entQtd?`<text x="${ptEnt[i].x}" y="${ptEnt[i].y-5}" text-anchor="middle" font-size="8" fill="#059669">${r.entQtd}</text>`:'').join('');
  const valSai=resumo7.map((r,i)=>r.saiQtd?`<text x="${ptSai[i].x}" y="${ptSai[i].y-5}" text-anchor="middle" font-size="8" fill="#dc2626">${r.saiQtd}</text>`:'').join('');
  const dotEnt=resumo7.map((r,i)=>`<circle cx="${ptEnt[i].x}" cy="${ptEnt[i].y}" r="3" fill="#059669"/>`).join('');
  const dotSai=resumo7.map((r,i)=>`<circle cx="${ptSai[i].x}" cy="${ptSai[i].y}" r="3" fill="#dc2626"/>`).join('');

  const grafico7=`<svg viewBox="0 0 ${G7W} ${G7H+28}" style="width:100%;display:block">
    <path d="${lineEnt}" fill="none" stroke="#059669" stroke-width="2"/>
    <path d="${lineSai}" fill="none" stroke="#dc2626" stroke-width="2"/>
    ${dotEnt}${dotSai}${valEnt}${valSai}${dias7Labels}
  </svg>`;

  // Tabela custo 7 dias
  const tabela7=resumo7.map(r=>{
    const d=new Date(r.data+'T00:00:00');
    const nome=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()]+' - '+r.data.split('-').reverse().join('/');
    const isHoje=r.data===today();
    return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f5f9;'+(isHoje?'font-weight:700':'')+'">'
      +'<span style="font-size:12px;color:#475569">'+nome+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:'+(r.entCusto>0?'#059669':'#94a3b8')+'">'+fmtMoeda(r.entCusto)+'</span>'
      +'</div>';
  }).join('');

  // ── Análise mensal ──────────────────────────────────────────
  const mesesAno=MESES_ABREV.map((_,mi)=>{
    const mesStr=anoSel+'-'+String(mi+1).padStart(2,'0');
    const movs=almMovimentos.filter(m=>(m.data||'').slice(0,7)===mesStr);
    const entQtd=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const saiQtd=movs.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);
    const entCusto=movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+(parseFloat(m.custoTotal)||0),0);
    return {mes:mesStr,entQtd,saiQtd,entCusto};
  });
  const totalCustoAno=mesesAno.reduce((s,m)=>s+m.entCusto,0);
  const totalEntAno=mesesAno.reduce((s,m)=>s+m.entQtd,0);
  const totalSaiAno=mesesAno.reduce((s,m)=>s+m.saiQtd,0);

  // Gráfico barras mensal
  const GBH=120;
  const bW=16; const bGap=8; const bPad=10;
  const GBW=bPad*2+12*(bW*2+2+bGap);  // largura real para 12 meses
  const maxMes=Math.max(...mesesAno.map(m=>Math.max(m.entQtd,m.saiQtd)),1);
  const barsMes=mesesAno.map((m,i)=>{
    const x=bPad+i*(bW*2+2+bGap);

      <rect x="${x}" y="${GBH-hE}" width="${bW}" height="${hE}" rx="2" fill="#059669" opacity="${m.entQtd?1:0.15}"/>
      <rect x="${x+bW+2}" y="${GBH-hS}" width="${bW}" height="${hS}" rx="2" fill="#dc2626" opacity="${m.saiQtd?1:0.15}"/>
      ${m.entQtd?`<text x="${x+bW/2}" y="${GBH-hE-3}" text-anchor="middle" font-size="8" fill="#059669">${m.entQtd}</text>`:''}

  const anoOpts=anos.map(a=>`<option value="${a}" ${a===anoSel?'selected':''}>${a}</option>`).join('');

  // Total geral -- donut SVG simples

      </div>

      <div style="font-size:28px;font-weight:800;color:#1e40af">${fmtMoeda(itens.reduce((s,i)=>{const est=almEstoqueItem(i.id);const custo=parseFloat(i.custoUnitario)||0;return s+(est>0?est*custo:0);},0))}</div>

    +(pecaSel?'<button class="btn btn-ghost btn-sm" onclick="window._almNavMes(this.dataset.m)" data-m="'+mAntStr+'">←</button>'

      +'<button class="btn btn-ghost btn-sm" onclick="window._almNavMes(this.dataset.m)" data-m="'+mProxStr+'">→</button>':'')
    +'</div>';

  if(pecaSel){
    const item=itens.find(i=>i.id===pecaSel);
    const movsMes=almMovimentos.filter(m=>m.tipo==='saida'&&m.itemId===pecaSel&&(m.data||'').slice(0,7)===mesSel)
      .sort((a,b)=>a.data>b.data?1:-1);

    if(!movsMes.length){
      htmlPeca+='<div style="color:#94a3b8;text-align:center;padding:16px">Nenhuma saída de '+(item?.descricao||'')+'em '+mesNomeN+'.</div>';
    } else {
      // Agrupar por dia
      const porDia={};
      movsMes.forEach(m=>{
        if(!porDia[m.data]) porDia[m.data]={qtd:0,movs:[]};
        porDia[m.data].qtd+=parseInt(m.quantidade)||0;
        porDia[m.data].movs.push(m);
      });
      const totalMes=movsMes.reduce((s,m)=>s+(parseInt(m.quantidade)||0),0);

      htmlPeca+='<div style="margin-bottom:8px;font-size:12px;color:#64748b">'
        +'Total em '+mesNomeN+': <strong style="color:#d97706">'+totalMes+' '+(item?.unidade||'')+'</strong></div>'
        +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
        +'<thead><tr style="background:#f1f5f9">'
        +'<th style="padding:7px 10px;text-align:left">Data</th>'
        +'<th style="padding:7px 10px;text-align:right">Quantidade</th>'
        +'<th style="padding:7px 10px;text-align:left">Quem retirou</th>'
        +'<th style="padding:7px 10px;text-align:left">Setor</th>'
        +'<th style="padding:7px 10px;text-align:left">Obs</th>'
        +'</tr></thead><tbody>'
        +movsMes.map((m,i)=>{
          const d=m.data?m.data.split('-').reverse().join('/'):'—';
          return '<tr style="'+(i%2?'background:#f8fafc;':'')+'">'
            +'<td style="padding:7px 10px">'+d+'</td>'
            +'<td style="padding:7px 10px;text-align:right;font-weight:700;color:#d97706">'+m.quantidade+' '+(item?.unidade||'')+'</td>'
            +'<td style="padding:7px 10px">'+(m.pessoa||'—')+'</td>'
            +'<td style="padding:7px 10px">'+(m.setor||'—')+'</td>'
            +'<td style="padding:7px 10px;color:#64748b;font-style:italic">'+(m.obs||'')+'</td>'
            +'</tr>';
        }).join('')
        +'<tr style="background:#fef9c3;font-weight:700">'
        +'<td style="padding:7px 10px">TOTAL</td>'
        +'<td style="padding:7px 10px;text-align:right;color:#d97706">'+totalMes+' '+(item?.unidade||'')+'</td>'
        +'<td colspan="3"></td></tr>'
        +'</tbody></table></div>';
    }
  }
  htmlPeca+='</div>';

  // ── Entradas por peça ─────────────────────────────────────────────
  if(!window._almRelEntPeca) window._almRelEntPeca='';
  if(!window._almRelEntMes) window._almRelEntMes=today().slice(0,7);

  const entPecaSel=window._almRelEntPeca;

    +'<option value="">— Selecionar peça —</option>'+optsEntPeca+'</select>'
    +(entPecaSel?'<button class="btn btn-ghost btn-sm" onclick="window._almNavEntMes(this.dataset.m)" data-m="'+mAntEStr+'">←</button>'

      +'<button class="btn btn-ghost btn-sm" onclick="window._almNavEntMes(this.dataset.m)" data-m="'+mProxEStr+'">→</button>':'')
    +'</div>';

  if(entPecaSel){
    const itemE=itens.find(i=>i.id===entPecaSel);

      .sort((a,b)=>a.data>b.data?1:-1);

    if(!movsEntMes.length){

function renderAlmConfig(){

    const items=lista||[];
    return '<div class="card" style="margin-bottom:12px;border-left:4px solid '+cor+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
      +'<div style="font-size:13px;font-weight:700;color:'+cor+'">'+titulo+'</div>'
      +'<span style="font-size:11px;color:#64748b">'+items.length+' itens</span>'
      +'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'
      +items.map((item,i)=>'<span style="display:inline-flex;align-items:center;gap:4px;background:'+cor+'18;color:'+cor+';padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600">'
        +item
        +'<button onclick="window._removeAlmLista(\''+chave+'\','+i+')" style="background:none;border:none;cursor:pointer;color:'+cor+';font-size:14px;padding:0;line-height:1;margin-left:2px">×</button>'
        +'</span>').join('')
      +'</div>'
      +'<div style="display:flex;gap:6px">'
      +'<input type="text" id="alm-novo-'+chave+'" placeholder="Novo item..." '
      +'style="flex:1;font-size:12px;border:1.5px solid #e2e8f0;border-radius:8px;padding:5px 9px">'
      +'<button class="btn btn-sm btn-primary" onclick="window._addAlmLista(\''+chave+'\')">Adicionar</button>'
      +'</div>'
      +'</div>';
  }

  return '<div class="section-label">Gerenciar listas</div>'
    +renderLista('👤 Pessoas','pessoas',almConfig.pessoas,'#1e40af')
    +renderLista('🏭 Setores','setores',almConfig.setores,'#065f46')

    +renderLista('🏷️ Classificações','classificacoes',almConfig.classificacoes,'#4c1d95')
    +renderLista('⬇️ Tipos de entrada','tiposEntrada',almConfig.tiposEntrada,'#0369a1')
    +renderLista('⬆️ Tipos de saída','tiposSaida',almConfig.tiposSaida,'#dc2626')

  almConfig={...almConfig,pessoaSetor:ps};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
};

window._addAlmLista=async(chave)=>{
  const el=document.getElementById('alm-novo-'+chave);
  const val=(el?.value||'').trim();
  if(!val){showToast('Digite um valor.');return;}
  const lista=[...(almConfig[chave]||[])];
  if(lista.includes(val)){showToast('Já existe na lista.');return;}
  lista.push(val);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Adicionado!');
  el.value='';
};

window._removeAlmLista=async(chave,idx)=>{
  const lista=[...(almConfig[chave]||[])];
  lista.splice(idx,1);
  almConfig={...almConfig,[chave]:lista};
  await setDoc(doc(db,'alm_config','geral'),almConfig);
  showToast('Removido!');
};

// ── Sinalização de peças prontas ────────────────────────────────
window._abrirSinalizacao=fichaId=>{
  const f=getFicha(fichaId);
  if(!f)return;
  // Calcular quais tipos têm peças entregues na ficha (pendentes de recolhimento)
  const entreguesPorTipo={};
  (f.entregas||[]).forEach(e=>{
    Object.entries(e.tipos||{}).forEach(([k,v])=>{entreguesPorTipo[k]=(entreguesPorTipo[k]||0)+v;});
  });
  const recolhidosPorTipo={};
  (f.recolhimentos||[]).forEach(r=>{
    Object.entries(r.tipos||{}).forEach(([k,v])=>{recolhidosPorTipo[k]=(recolhidosPorTipo[k]||0)+v;});
  });
  // Só mostrar tipos com peças ainda em mão (enviadas - recolhidas > 0)
  const tiposComPecas=TIPOS.filter(t=>{
    const emMao=(entreguesPorTipo[t.id]||0)-(recolhidosPorTipo[t.id]||0);
    return emMao>0;
  });
  const tiposInputs=tiposComPecas.map(t=>{
    const prontos=(f.prontos||{})[t.id]||0;
    const emMao=(entreguesPorTipo[t.id]||0)-(recolhidosPorTipo[t.id]||0);
    return `<div class="num-group"><label>${t.label}${t.principal?' ★':''}<span style="font-size:9px;color:#64748b;display:block">${emMao} em mão</span></label><input type="number" id="sig-${t.id}" min="0" max="${emMao}" step="1" value="${prontos||''}" placeholder="0" onfocus="if(this.value==='0')this.value=''"></div>`;
  }).join('');
  if(!tiposComPecas.length){
    showToast('Nenhuma peça pendente nesta ficha.');return;
  }
  showModal('Sinalizar peças prontas',
    `<div class="info-box" style="margin-bottom:12px">Informe quantas peças já estão enroladas e prontas para recolhimento.</div>
    <div class="num-inputs">${tiposInputs}</div>`,
    `<button class="btn btn-ghost btn-sm" onclick="window._closeModal()">Cancelar</button>
     <button class="btn btn-primary btn-sm" onclick="window._salvarSinalizacao('${fichaId}')">Sinalizar</button>`);
};

window._removerSinalizacao=function(fichaId){
  window._pendingRemoverSinal=fichaId;
  showModal('Cancelar aviso',
    '<div style="font-size:13px;color:#444">Deseja cancelar o aviso de peças prontas? A fábrica não verá mais a sinalização.</div>',
    '<button class="btn btn-sm" onclick="window._closeModal()">Cancelar</button>'
    +'<button class="btn btn-sm btn-danger" onclick="window._confirmarRemoverSinal()">Confirmar</button>');
};
window._confirmarRemoverSinal=async function(){
  const fichaId=window._pendingRemoverSinal;
  if(!fichaId) return;
  closeModal();
  await updateDoc(doc(db,'fichas',fichaId),{prontos:{},prontoSinalizado:false,prontoAtualizadoEm:null});
  showToast('Aviso cancelado!');
};

window._salvarSinalizacao=async fichaId=>{
  const f=getFicha(fichaId);
  if(!f) return;
  // Calcular máximo disponível por tipo
  const entreguesPorTipo={};
  (f.entregas||[]).forEach(e=>{Object.entries(e.tipos||{}).forEach(([k,v])=>{entreguesPorTipo[k]=(entreguesPorTipo[k]||0)+v;});});
  const recolhidosPorTipo={};
  (f.recolhimentos||[]).forEach(r=>{Object.entries(r.tipos||{}).forEach(([k,v])=>{recolhidosPorTipo[k]=(recolhidosPorTipo[k]||0)+v;});});

  const prontos={};
  let erros=[];
  TIPOS.forEach(t=>{
    const emMao=(entreguesPorTipo[t.id]||0)-(recolhidosPorTipo[t.id]||0);
    const val=parseInt(document.getElementById('sig-'+t.id)?.value)||0;
    if(val>emMao){
      erros.push(t.label+': máximo é '+emMao);
    } else {
      prontos[t.id]=val;
    }
  });
  if(erros.length){
    showToast('Quantidade maior que o disponível: '+erros.join(', '));
    return;
  }
  const total=Object.values(prontos).reduce((a,v)=>a+v,0);
  await updateDoc(doc(db,'fichas',fichaId),{prontos,prontoSinalizado:total>0,prontoAtualizadoEm:new Date().toISOString()});
  closeModal();
  showToast(total>0?'Peças sinalizadas!':'Sinalização removida.');
};

function renderBadgeProntos(f){
  if(!f.prontoSinalizado)return'';
  const prontos=f.prontos||{};
  const total=Object.values(prontos).reduce((a,v)=>a+v,0);
  if(total===0)return'';
  const itens=TIPOS.filter(t=>prontos[t.id]>0).map(t=>`${t.label}: ${prontos[t.id]}`).join(' · ');
  return `<div style="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">🔔</span>
    <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#92400e">Peças prontas para recolher!</div>
    <div style="font-size:11px;color:#b45309;margin-top:2px">${itens}</div></div>
    <div style="font-size:18px;font-weight:800;color:#d97706">${total}</div>
  </div>`;
}

  const pecasPend=TIPOS.filter(t=>pendentes_tipo(f,t.id)>0);
  const pecasRetiradas={};
  let totalRetirado=0;
  pecasPend.forEach(t=>{
    const v=parseInt(document.getElementById('ret-'+t.id)?.value)||0;
    if(v>0){pecasRetiradas[t.id]=v;totalRetirado+=v;}
  });
  const fitaRet=parseInt(document.getElementById('ret-fita')?.value)||0;
  const fioRet=parseInt(document.getElementById('ret-fio')?.value)||0;

  // Adicionar recolhimento administrativo
  const recolhimentos=[...(f.recolhimentos||[]),{
    data:today(),
    entregador:currentUserData?.nome||'Admin',
    tipos:pecasRetiradas,
    fitaSobrando:fitaRet,
    fioSobrando:fioRet,
    administrativo:true,

  closeModal();

    recolhimentos,
    status:'cancelada',
    dataCancelamento:today(),
    canceladoPor:currentUserData?.nome||'',
    justificativaCancelamento:justificativa,

  });

  unsubFichas=onSnapshot(collection(db,'fichas'),snap=>{
    fichas=snap.docs.map(d=>({id:d.id,...d.data()}));

      // Se estiver na aba entrega ou recolhimento, atualiza apenas os selects de ficha

document.getElementById('root').innerHTML=`<div class="loading"><div class="spinner"></div><div>Carregando...</div></div>`;

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    // Busca perfil do usuário no Firestore
    const snap=await getDocs(collection(db,'usuarios'));
    const uDoc=snap.docs.find(d=>d.data().uid===user.uid||d.data().email===user.email);
    if(uDoc){
      currentUserData={id:uDoc.id,...uDoc.data()};
    }else{
      // Primeiro acesso do admin: cria registro automaticamente
      currentUserData={id:'admin-temp',nome:user.email,perfil:'admin',email:user.email,uid:user.uid};
    }
    // Tela inicial por perfil
    const perfInicial=currentUserData?.perfil;
    if(perfInicial==='financeiro'){
      currentTab='relatorio';
    }else if(can('verPainel')){
      currentTab='painel';
    }else{
      currentTab='fichas';
    }
    // Tentar restaurar fábrica/setor da sessão anterior
    const sessaoFabrica=sessionStorage.getItem('jm_fabrica');
    const sessaoSetor=sessionStorage.getItem('jm_setor');
    // Se sessão tem almoxarifado, respeitar isso antes do setor automático
    if(sessaoFabrica==='caminhoes'){
    currentFabrica='caminhoes';
    currentSetor='caminhoes';
    currentTab='cam_rotas';
  } else if(sessaoFabrica==='almoxarifado'){
      currentFabrica='almoxarifado';
      currentSetor='almoxarifado';
      currentTab='alm_painel';
    } else {
      const autoOk=aplicarSetorAutomatico();
      if(!autoOk && sessaoFabrica){
        currentFabrica=sessaoFabrica;
        if(sessaoSetor) currentSetor=sessaoSetor;
      }
    }
    // Reaplicar tab inicial por perfil após restaurar sessão
    if(currentSetor){
      const pf=currentUserData?.perfil;
      if(pf==='financeiro') currentTab='relatorio';
      else if(can('verPainel')) currentTab='painel';
      else currentTab='fichas';
    }
    iniciarListeners();
    render();
  }else{
    currentUser=null;currentUserData=null;
    pararListeners();
    enroladores=[];fichas=[];usuarios=[];
    render();
  }
});


</script>
</body>
</html>
